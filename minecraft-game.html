<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxelCraft - Minecraft-like Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            background: #87CEEB;
        }
        
        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-size: 10px;
            z-index: 100;
            line-height: 1.8;
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 50;
        }
        
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }
        
        #crosshair::before {
            width: 2px;
            height: 20px;
            left: 9px;
            top: 0;
        }
        
        #crosshair::after {
            width: 20px;
            height: 2px;
            top: 9px;
            left: 0;
        }
        
        #inventory {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            z-index: 100;
        }
        
        .inventory-slot {
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.7);
            border: 3px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        
        .inventory-slot:hover {
            border-color: #aaa;
        }
        
        .inventory-slot.active {
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        .inventory-slot .block-preview {
            width: 40px;
            height: 40px;
        }
        
        .inventory-slot .label {
            position: absolute;
            bottom: -20px;
            font-size: 8px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            font-size: 12px;
            line-height: 2;
            z-index: 200;
        }
        
        #instructions h2 {
            font-size: 16px;
            margin-bottom: 20px;
            color: #4CAF50;
        }
        
        #instructions button {
            margin-top: 20px;
            padding: 15px 30px;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        
        #instructions button:hover {
            background: #45a049;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="info-panel">
            <div>WASD: Move</div>
            <div>SPACE: Jump</div>
            <div>SHIFT: Sprint</div>
            <div>Mouse: Look</div>
            <div>Left Click: Break</div>
            <div>Right Click: Place</div>
            <div>1-5: Select Block</div>
            <div>ESC: Menu</div>
            <div id="position"></div>
        </div>
        
        <div id="crosshair"></div>
        
        <div id="inventory">
            <div class="inventory-slot active" data-block="grass">
                <div class="block-preview" style="background: linear-gradient(135deg, #7CFC00 0%, #228B22 100%);"></div>
                <div class="label">GRASS</div>
            </div>
            <div class="inventory-slot" data-block="dirt">
                <div class="block-preview" style="background: linear-gradient(135deg, #8B4513 0%, #654321 100%);"></div>
                <div class="label">DIRT</div>
            </div>
            <div class="inventory-slot" data-block="stone">
                <div class="block-preview" style="background: linear-gradient(135deg, #888 0%, #555 100%);"></div>
                <div class="label">STONE</div>
            </div>
            <div class="inventory-slot" data-block="wood">
                <div class="block-preview" style="background: linear-gradient(135deg, #DEB887 0%, #8B4513 100%);"></div>
                <div class="label">WOOD</div>
            </div>
            <div class="inventory-slot" data-block="sand">
                <div class="block-preview" style="background: linear-gradient(135deg, #F4A460 0%, #DAA520 100%);"></div>
                <div class="label">SAND</div>
            </div>
        </div>
        
        <div id="instructions">
            <h2>Welcome to VoxelCraft!</h2>
            <div>Build and explore your voxel world</div>
            <div>Left click to break blocks</div>
            <div>Right click to place blocks</div>
            <div>Use WASD to move around</div>
            <button id="start-btn">Click to Start</button>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game State
        const game = {
            scene: null,
            camera: null,
            renderer: null,
            controls: {
                moveForward: false,
                moveBackward: false,
                moveLeft: false,
                moveRight: false,
                jump: false,
                sprint: false
            },
            velocity: new THREE.Vector3(),
            direction: new THREE.Vector3(),
            raycaster: new THREE.Raycaster(),
            mouse: new THREE.Vector2(0, 0),
            blocks: new Map(),
            selectedBlock: 'grass',
            isPointerLocked: false,
            playerHeight: 1.7,
            gravity: -9.8,
            jumpForce: 5,
            moveSpeed: 5,
            sprintMultiplier: 1.5
        };
        
        // Block Materials
        const blockMaterials = {
            grass: new THREE.MeshLambertMaterial({ 
                color: 0x7CFC00,
                flatShading: true 
            }),
            dirt: new THREE.MeshLambertMaterial({ 
                color: 0x8B4513,
                flatShading: true 
            }),
            stone: new THREE.MeshLambertMaterial({ 
                color: 0x808080,
                flatShading: true 
            }),
            wood: new THREE.MeshLambertMaterial({ 
                color: 0xDEB887,
                flatShading: true 
            }),
            sand: new THREE.MeshLambertMaterial({ 
                color: 0xF4A460,
                flatShading: true 
            })
        };
        
        // Initialize Three.js Scene
        function initScene() {
            game.scene = new THREE.Scene();
            game.scene.background = new THREE.Color(0x87CEEB);
            game.scene.fog = new THREE.Fog(0x87CEEB, 0, 200);
            
            // Camera
            game.camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            game.camera.position.set(0, game.playerHeight + 10, 0);
            
            // Renderer
            game.renderer = new THREE.WebGLRenderer({ antialias: true });
            game.renderer.setSize(window.innerWidth, window.innerHeight);
            game.renderer.shadowMap.enabled = true;
            game.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('game-container').appendChild(game.renderer.domElement);
            
            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            game.scene.add(ambientLight);
            
            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(50, 100, 50);
            sunLight.castShadow = true;
            sunLight.shadow.camera.left = -100;
            sunLight.shadow.camera.right = 100;
            sunLight.shadow.camera.top = 100;
            sunLight.shadow.camera.bottom = -100;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            game.scene.add(sunLight);
            
            // Generate terrain
            generateTerrain();
        }
        
        // Simple noise function for terrain
        function noise(x, z) {
            const sin = Math.sin(x * 0.1) * Math.cos(z * 0.1);
            const cos = Math.cos(x * 0.15) * Math.sin(z * 0.15);
            return (sin + cos) * 3;
        }
        
        // Generate terrain
        function generateTerrain() {
            const size = 30;
            const halfSize = size / 2;
            
            for (let x = -halfSize; x < halfSize; x++) {
                for (let z = -halfSize; z < halfSize; z++) {
                    const height = Math.floor(noise(x, z)) + 5;
                    
                    // Place blocks from bottom to height
                    for (let y = 0; y < height; y++) {
                        let blockType;
                        if (y === height - 1) {
                            blockType = 'grass';
                        } else if (y > height - 4) {
                            blockType = 'dirt';
                        } else {
                            blockType = 'stone';
                        }
                        
                        placeBlock(x, y, z, blockType, false);
                    }
                    
                    // Randomly add trees
                    if (Math.random() > 0.98 && height > 5) {
                        const treeHeight = 4 + Math.floor(Math.random() * 2);
                        for (let y = 0; y < treeHeight; y++) {
                            placeBlock(x, height + y, z, 'wood', false);
                        }
                        // Add leaves
                        for (let lx = -1; lx <= 1; lx++) {
                            for (let lz = -1; lz <= 1; lz++) {
                                for (let ly = 0; ly < 2; ly++) {
                                    if (Math.random() > 0.3) {
                                        placeBlock(
                                            x + lx, 
                                            height + treeHeight + ly, 
                                            z + lz, 
                                            'grass', 
                                            false
                                        );
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
        
        // Place block
        function placeBlock(x, y, z, type, checkCollision = true) {
            const key = `${x},${y},${z}`;
            
            if (game.blocks.has(key)) return;
            
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = blockMaterials[type];
            const block = new THREE.Mesh(geometry, material);
            
            block.position.set(x, y, z);
            block.castShadow = true;
            block.receiveShadow = true;
            block.userData.blockType = type;
            
            game.scene.add(block);
            game.blocks.set(key, block);
        }
        
        // Remove block
        function removeBlock(block) {
            if (!block) return;
            
            const pos = block.position;
            const key = `${pos.x},${pos.y},${pos.z}`;
            
            game.scene.remove(block);
            game.blocks.delete(key);
        }
        
        // Get block at position
        function getBlockAt(x, y, z) {
            const key = `${Math.round(x)},${Math.round(y)},${Math.round(z)}`;
            return game.blocks.get(key);
        }
        
        // Check collision
        function checkCollision(position) {
            const margin = 0.3;
            const checkPositions = [
                [position.x, position.y, position.z],
                [position.x + margin, position.y, position.z],
                [position.x - margin, position.y, position.z],
                [position.x, position.y, position.z + margin],
                [position.x, position.y, position.z - margin],
                [position.x, position.y + game.playerHeight, position.z]
            ];
            
            for (const [x, y, z] of checkPositions) {
                if (getBlockAt(x, y, z)) {
                    return true;
                }
            }
            return false;
        }
        
        // Raycast to find block
        function raycastBlock() {
            game.raycaster.setFromCamera(game.mouse, game.camera);
            const intersects = game.raycaster.intersectObjects(
                Array.from(game.blocks.values())
            );
            
            if (intersects.length > 0) {
                return {
                    block: intersects[0].object,
                    face: intersects[0].face,
                    point: intersects[0].point
                };
            }
            return null;
        }
        
        // Handle mouse click
        function handleClick(event) {
            if (!game.isPointerLocked) return;
            
            const result = raycastBlock();
            if (!result) return;
            
            if (event.button === 0) {
                // Left click - break block
                removeBlock(result.block);
            } else if (event.button === 2) {
                // Right click - place block
                const normal = result.face.normal;
                const pos = result.block.position;
                const newPos = {
                    x: Math.round(pos.x + normal.x),
                    y: Math.round(pos.y + normal.y),
                    z: Math.round(pos.z + normal.z)
                };
                
                // Don't place where player is
                const playerPos = game.camera.position;
                const distance = Math.sqrt(
                    Math.pow(newPos.x - playerPos.x, 2) +
                    Math.pow(newPos.y - playerPos.y, 2) +
                    Math.pow(newPos.z - playerPos.z, 2)
                );
                
                if (distance > 1) {
                    placeBlock(newPos.x, newPos.y, newPos.z, game.selectedBlock);
                }
            }
        }
        
        // Event Listeners
        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'KeyW': game.controls.moveForward = true; break;
                case 'KeyS': game.controls.moveBackward = true; break;
                case 'KeyA': game.controls.moveLeft = true; break;
                case 'KeyD': game.controls.moveRight = true; break;
                case 'Space': game.controls.jump = true; break;
                case 'ShiftLeft': game.controls.sprint = true; break;
                case 'Digit1': selectBlock('grass'); break;
                case 'Digit2': selectBlock('dirt'); break;
                case 'Digit3': selectBlock('stone'); break;
                case 'Digit4': selectBlock('wood'); break;
                case 'Digit5': selectBlock('sand'); break;
                case 'Escape':
                    if (game.isPointerLocked) {
                        document.exitPointerLock();
                    }
                    break;
            }
        });
        
        document.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': game.controls.moveForward = false; break;
                case 'KeyS': game.controls.moveBackward = false; break;
                case 'KeyA': game.controls.moveLeft = false; break;
                case 'KeyD': game.controls.moveRight = false; break;
                case 'Space': game.controls.jump = false; break;
                case 'ShiftLeft': game.controls.sprint = false; break;
            }
        });
        
        document.addEventListener('mousedown', handleClick);
        
        document.addEventListener('mousemove', (e) => {
            if (!game.isPointerLocked) return;
            
            const movementX = e.movementX || 0;
            const movementY = e.movementY || 0;
            
            game.camera.rotation.y -= movementX * 0.002;
            game.camera.rotation.x -= movementY * 0.002;
            game.camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, game.camera.rotation.x));
        });
        
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        
        document.addEventListener('pointerlockchange', () => {
            game.isPointerLocked = document.pointerLockElement === game.renderer.domElement;
        });
        
        window.addEventListener('resize', () => {
            game.camera.aspect = window.innerWidth / window.innerHeight;
            game.camera.updateProjectionMatrix();
            game.renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Inventory selection
        function selectBlock(blockType) {
            game.selectedBlock = blockType;
            document.querySelectorAll('.inventory-slot').forEach(slot => {
                slot.classList.remove('active');
                if (slot.dataset.block === blockType) {
                    slot.classList.add('active');
                }
            });
        }
        
        document.querySelectorAll('.inventory-slot').forEach(slot => {
            slot.addEventListener('click', () => {
                selectBlock(slot.dataset.block);
            });
        });
        
        // Start game
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('instructions').classList.add('hidden');
            game.renderer.domElement.requestPointerLock();
        });
        
        // Game loop
        let lastTime = performance.now();
        
        function animate() {
            requestAnimationFrame(animate);
            
            const time = performance.now();
            const delta = (time - lastTime) / 1000;
            lastTime = time;
            
            if (game.isPointerLocked) {
                // Update velocity
                game.velocity.x -= game.velocity.x * 10 * delta;
                game.velocity.z -= game.velocity.z * 10 * delta;
                game.velocity.y += game.gravity * delta;
                
                game.direction.z = Number(game.controls.moveForward) - Number(game.controls.moveBackward);
                game.direction.x = Number(game.controls.moveRight) - Number(game.controls.moveLeft);
                game.direction.normalize();
                
                const speed = game.moveSpeed * (game.controls.sprint ? game.sprintMultiplier : 1);
                
                if (game.controls.moveForward || game.controls.moveBackward) {
                    game.velocity.z -= game.direction.z * speed * delta;
                }
                if (game.controls.moveLeft || game.controls.moveRight) {
                    game.velocity.x -= game.direction.x * speed * delta;
                }
                
                // Check ground collision
                const groundBlock = getBlockAt(
                    game.camera.position.x,
                    game.camera.position.y - game.playerHeight - 0.1,
                    game.camera.position.z
                );
                
                if (groundBlock) {
                    if (game.velocity.y < 0) {
                        game.velocity.y = 0;
                        if (game.controls.jump) {
                            game.velocity.y = game.jumpForce;
                        }
                    }
                } else {
                    game.controls.jump = false;
                }
                
                // Move player
                const newPosition = game.camera.position.clone();
                newPosition.x += game.velocity.x * delta;
                newPosition.z += game.velocity.z * delta;
                
                if (!checkCollision(newPosition)) {
                    game.camera.position.x = newPosition.x;
                    game.camera.position.z = newPosition.z;
                }
                
                newPosition.y = game.camera.position.y + game.velocity.y * delta;
                if (!checkCollision(newPosition)) {
                    game.camera.position.y = newPosition.y;
                }
                
                // Update position display
                document.getElementById('position').textContent = 
                    `X: ${Math.round(game.camera.position.x)} Y: ${Math.round(game.camera.position.y)} Z: ${Math.round(game.camera.position.z)}`;
            }
            
            game.renderer.render(game.scene, game.camera);
        }
        
        // Initialize
        initScene();
        animate();
    </script>
</body>
</html>
