<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Word Search Puzzle</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #2c3e5a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 10px;
  }

  .game-container {
    background: #ffffff;
    border-radius: 20px;
    padding: 25px;
    max-width: 900px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .title {
    font-size: 24px;
    font-weight: 700;
    color: #2c3e5a;
  }

  .timer-bar-container {
    flex: 1;
    max-width: 400px;
    margin: 0 20px;
    height: 18px;
    background: #e8ecf1;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
  }

  .timer-bar {
    height: 100%;
    background: linear-gradient(90deg, #27ae60, #2ecc71);
    border-radius: 10px;
    transition: width 1s linear;
    width: 100%;
  }

  .timer-text {
    font-size: 16px;
    font-weight: 600;
    color: #2c3e5a;
    min-width: 60px;
    text-align: right;
  }

  .main-content {
    display: flex;
    gap: 25px;
  }

  .grid-section {
    flex: 1;
    position: relative;
  }

  .grid-wrapper {
    position: relative;
    display: inline-block;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 3px;
  }

  .cell {
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: #2c3e5a;
    background: #f0f3f7;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
    position: relative;
    z-index: 2;
  }

  .cell:hover {
    background: #d5e8f7;
  }

  .cell.selecting {
    background: #85c1e9;
    color: #fff;
  }

  .cell.found {
    background: #27ae60;
    color: #fff;
  }

  .cell.found-alt {
    background: #2ecc71;
    color: #fff;
  }

  .cell.found-alt2 {
    background: #1abc9c;
    color: #fff;
  }

  .cell.found-alt3 {
    background: #3498db;
    color: #fff;
  }

  .cell.found-alt4 {
    background: #2980b9;
    color: #fff;
  }

  .cell.found-alt5 {
    background: #16a085;
    color: #fff;
  }

  .highlight-line {
    position: absolute;
    pointer-events: none;
    z-index: 1;
    border-radius: 20px;
    opacity: 0.35;
  }

  .sidebar {
    min-width: 200px;
    display: flex;
    flex-direction: column;
  }

  .found-header {
    font-size: 16px;
    font-weight: 700;
    color: #2c3e5a;
    margin-bottom: 12px;
    letter-spacing: 1px;
  }

  .progress-text {
    font-size: 14px;
    color: #7f8c8d;
    margin-bottom: 15px;
  }

  .word-list {
    list-style: none;
    flex: 1;
  }

  .word-list li {
    font-size: 18px;
    font-weight: 600;
    color: #2c3e5a;
    padding: 8px 12px;
    margin-bottom: 4px;
    border-radius: 8px;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .word-list li.found {
    color: #27ae60;
    text-decoration: line-through;
    background: #e8f8f0;
  }

  .word-list li .check {
    display: none;
    color: #27ae60;
    font-weight: bold;
  }

  .word-list li.found .check {
    display: inline;
  }

  .buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  .btn {
    padding: 12px 24px;
    border: none;
    border-radius: 25px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.5px;
  }

  .btn-hint {
    background: #27ae60;
    color: #fff;
  }

  .btn-hint:hover {
    background: #219a52;
    transform: translateY(-1px);
  }

  .btn-reset {
    background: #2c3e5a;
    color: #fff;
  }

  .btn-reset:hover {
    background: #1a2536;
    transform: translateY(-1px);
  }

  .selection-line {
    position: absolute;
    pointer-events: none;
    z-index: 3;
    height: 36px;
    border-radius: 18px;
    background: rgba(52, 152, 219, 0.35);
    transform-origin: left center;
  }

  .win-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(44, 62, 90, 0.85);
    z-index: 100;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }

  .win-overlay.show {
    display: flex;
  }

  .win-box {
    background: #fff;
    border-radius: 20px;
    padding: 40px 50px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  .win-box h2 {
    font-size: 32px;
    color: #27ae60;
    margin-bottom: 10px;
  }

  .win-box p {
    font-size: 18px;
    color: #2c3e5a;
    margin-bottom: 25px;
  }

  .win-box .btn {
    font-size: 16px;
    padding: 14px 32px;
  }

  @media (max-width: 700px) {
    .main-content {
      flex-direction: column;
      align-items: center;
    }

    .cell {
      width: 30px;
      height: 30px;
      font-size: 13px;
    }

    .sidebar {
      min-width: unset;
      width: 100%;
    }

    .word-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .word-list li {
      font-size: 14px;
      padding: 5px 10px;
    }

    .title {
      font-size: 18px;
    }

    .game-container {
      padding: 15px;
    }

    .selection-line {
      height: 26px;
      border-radius: 13px;
    }
  }
</style>
</head>
<body>

<div class="game-container">
  <div class="header">
    <div class="title">🔍 WORD SEARCH</div>
    <div class="timer-bar-container">
      <div class="timer-bar" id="timerBar"></div>
    </div>
    <div class="timer-text" id="timerText">5:00</div>
  </div>

  <div class="main-content">
    <div class="grid-section">
      <div class="grid-wrapper" id="gridWrapper">
        <div class="grid" id="grid"></div>
        <div class="selection-line" id="selectionLine" style="display:none;"></div>
      </div>
    </div>

    <div class="sidebar">
      <div class="found-header">FOUND WORDS</div>
      <div class="progress-text" id="progressText">0 / 0 words found</div>
      <ul class="word-list" id="wordList"></ul>
      <div class="buttons">
        <button class="btn btn-hint" id="hintBtn">💡 HINT</button>
        <button class="btn btn-reset" id="resetBtn">🔄 RESET</button>
      </div>
    </div>
  </div>
</div>

<div class="win-overlay" id="winOverlay">
  <div class="win-box">
    <h2>🎉 Congratulations!</h2>
    <p id="winText">You found all the words!</p>
    <button class="btn btn-hint" onclick="resetGame()">Play Again</button>
  </div>
</div>
