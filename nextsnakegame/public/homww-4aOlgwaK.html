<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Crash Bandicoot - Jungle Rush</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  background: #000; 
  overflow: hidden; 
  display: flex; 
  justify-content: center; 
  align-items: center; 
  height: 100vh; 
  font-family: Arial, Helvetica, sans-serif;
  touch-action: none;
}
canvas { 
  display: block; 
  image-rendering: pixelated;
}
#touchControls {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 160px;
  display: none;
  pointer-events: none;
  z-index: 10;
}
.touch-btn {
  position: absolute;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  border: 3px solid rgba(255,255,255,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  color: rgba(255,255,255,0.8);
  pointer-events: all;
  user-select: none;
  -webkit-user-select: none;
}
.touch-btn:active { background: rgba(255,255,255,0.5); }
#btnLeft { bottom: 20px; left: 20px; }
#btnRight { bottom: 20px; left: 100px; }
#btnJump { bottom: 80px; right: 20px; }
#btnSpin { bottom: 10px; right: 100px; }
@media (pointer: coarse) {
  #touchControls { display: block; }
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="touchControls">
  <div class="touch-btn" id="btnLeft">◀</div>
  <div class="touch-btn" id="btnRight">▶</div>
  <div class="touch-btn" id="btnJump">▲</div>
  <div class="touch-btn" id="btnSpin">✦</div>
</div>
