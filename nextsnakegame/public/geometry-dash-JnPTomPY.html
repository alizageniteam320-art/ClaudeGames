<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Geometry Dash</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Russo+One&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#140c3a;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:absolute;left:0;top:0;display:block}
#ui{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;font-family:'Russo One','Trebuchet MS',sans-serif;color:#fff}
.panel{position:absolute;display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1.6vmin,14px);padding:clamp(12px,3.5vmin,30px) clamp(16px,5vmin,44px);border-radius:clamp(10px,2.5vmin,22px);background:linear-gradient(180deg,rgba(30,20,90,.82),rgba(10,8,40,.88));border:3px solid #7fe7ff;box-shadow:0 0 30px rgba(0,229,255,.35),inset 0 0 20px rgba(127,231,255,.15);text-align:center;opacity:0;transform:scale(.8) translateY(20px);transition:opacity .35s cubic-bezier(.2,.9,.3,1.3),transform .35s cubic-bezier(.2,.9,.3,1.3);pointer-events:none;max-width:88vw;max-height:88vh;box-sizing:border-box}
.panel.show{opacity:1;transform:scale(1) translateY(0);pointer-events:auto}
h1{margin:0;font-family:'Bungee','Impact',sans-serif;font-weight:400;font-size:clamp(26px,8vmin,72px);line-height:.95;letter-spacing:1px;color:#d4ff4a;text-shadow:0 4px 0 #2b7a12,0 0 18px rgba(180,255,60,.6),3px 3px 0 #0a1430}
h1 span{color:#ffd400;text-shadow:0 4px 0 #a06a00,0 0 18px rgba(255,212,0,.6),3px 3px 0 #0a1430}
h2{margin:0;font-family:'Bungee','Impact',sans-serif;font-weight:400;font-size:clamp(20px,6vmin,52px);color:#ff4f7b;text-shadow:0 3px 0 #6b0f2a,0 0 14px rgba(255,79,123,.6)}
h2.win{color:#d4ff4a;text-shadow:0 3px 0 #2b7a12,0 0 14px rgba(180,255,60,.6)}
.big{font-family:'Bungee','Impact',sans-serif;font-size:clamp(28px,9vmin,80px);color:#fff;text-shadow:0 0 16px #00e5ff,3px 3px 0 #0a1430;line-height:1}
.hint{margin:0;font-size:clamp(11px,2.6vmin,18px);color:#bfefff;line-height:1.45;text-shadow:2px 2px 0 #0a1430}
.hint b{color:#ffd400}
.best{margin:0;font-size:clamp(12px,2.8vmin,20px);color:#ffd400;text-shadow:2px 2px 0 #0a1430}
.row{display:flex;gap:clamp(6px,2vmin,16px);flex-wrap:wrap;justify-content:center}
button.b{font-family:'Bungee','Impact',sans-serif;font-size:clamp(14px,3.8vmin,28px);padding:clamp(6px,1.6vmin,14px) clamp(16px,4vmin,36px);border:3px solid #0a1430;border-radius:clamp(8px,1.8vmin,14px);background:linear-gradient(180deg,#e9ff7a,#5fd12a);color:#0a1430;cursor:pointer;box-shadow:0 5px 0 #2b7a12,0 0 18px rgba(180,255,60,.5);transition:transform .1s}
button.b:active{transform:translateY(3px);box-shadow:0 2px 0 #2b7a12}
button.b.alt{background:linear-gradient(180deg,#9fefff,#2bb7e0);box-shadow:0 5px 0 #136a8a,0 0 18px rgba(0,229,255,.4)}
#mute{position:absolute;top:clamp(6px,1.5vmin,14px);right:clamp(6px,1.5vmin,14px);width:clamp(34px,7vmin,52px);height:clamp(34px,7vmin,52px);border-radius:50%;border:3px solid #7fe7ff;background:rgba(10,8,40,.7);color:#fff;font-size:clamp(16px,3.6vmin,26px);cursor:pointer;pointer-events:auto;z-index:5;display:flex;align-items:center;justify-content:center;padding:0}
.nb{color:#d4ff4a;font-size:clamp(12px,2.8vmin,20px);margin:0;text-shadow:0 0 10px #b6ff3b}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="title" class="panel show">
    <h1>GEOMETRY<br><span>DASH</span></h1>
    <p class="hint">Tap · Click · Space to jump<br>Hold to keep jumping<br>Tap mid-air on <b>yellow orbs</b> · <b>Pads</b> launch you</p>
    <button class="b" id="playBtn">▶ PLAY</button>
    <p class="best">Best: <span id="bestTitle">0</span>%</p>
  </div>
  <div id="dead" class="panel">
    <h2>CRASHED!</h2>
    <div class="big" id="deadPct">0%</div>
    <p class="nb" id="newBest" style="display:none">★ NEW BEST ★</p>
    <p class="best">Best: <span id="bestDead">0</span>% · Attempt <span id="attDead">1</span></p>
    <div class="row"><button class="b" id="retryBtn">↻ RETRY</button><button class="b alt" id="menuBtn">MENU</button></div>
  </div>
  <div id="win" class="panel">
    <h2 class="win">LEVEL COMPLETE!</h2>
    <div class="big">100%</div>
    <p class="best">Attempts: <span id="attWin">1</span> · Best: 100%</p>
    <div class="row"><button class="b" id="againBtn">↻ PLAY AGAIN</button><button class="b alt" id="menuBtn2">MENU</button></div>
  </div>
</div>
<button id="mute" title="Mute">🔊</button>
