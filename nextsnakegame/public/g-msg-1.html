<!DOCTYPE html>
<html lang="en">
<head>
<script>
// Polyfill for localStorage and sessionStorage to prevent SecurityError in data: iframes
(function() {
    try {
        window.localStorage;
        window.sessionStorage;
    } catch (e) {
        // Storage access is blocked, implement in-memory polyfill
        const createStorage = () => {
            let store = {};
            return {
                getItem: (key) => store[key] || null,
                setItem: (key, value) => { store[key] = String(value); },
                removeItem: (key) => { delete store[key]; },
                clear: () => { store = {}; },
                key: (index) => Object.keys(store)[index] || null,
                get length() { return Object.keys(store).length; }
            };
        };
        
        try {
            Object.defineProperty(window, 'localStorage', { value: createStorage() });
            Object.defineProperty(window, 'sessionStorage', { value: createStorage() });
        } catch (defineError) {
             console.warn('Unable to define global storage properties:', defineError);
        }
    }
})();
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
        }

        /* Animated background particles */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(circle at 20% 50%, rgba(120, 40, 200, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 200, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 60% 80%, rgba(255, 100, 150, 0.1) 0%, transparent 50%);
            pointer-events: none;
            animation: bgPulse 6s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 8px 48px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2.8em;
            text-shadow: 0 0 20px rgba(78, 204, 163, 0.8), 2px 2px 4px rgba(0, 0, 0, 0.5);
            letter-spacing: 2px;
            animation: titleGlow 2s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            0% { text-shadow: 0 0 10px rgba(78, 204, 163, 0.6), 2px 2px 4px rgba(0,0,0,0.5); }
            100% { text-shadow: 0 0 30px rgba(78, 204, 163, 1), 0 0 60px rgba(78, 204, 163, 0.4), 2px 2px 4px rgba(0,0,0,0.5); }
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 1.2em;
            font-weight: bold;
            gap: 16px;
        }

        .score-item {
            background: rgba(255, 255, 255, 0.08);
            padding: 10px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.12);
            transition: background 0.3s;
            position: relative;
            overflow: hidden;
        }

        .score-item::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        .score-item span {
            color: #4ecca3;
            text-shadow: 0 0 8px rgba(78, 204, 163, 0.8);
        }

        canvas {
            border: 2px solid rgba(78, 204, 163, 0.4);
            border-radius: 12px;
            background-color: #0d0d1a;
            box-shadow:
                0 0 0 1px rgba(78, 204, 163, 0.1),
                0 0 30px rgba(78, 204, 163, 0.15),
                0 8px 32px rgba(0, 0, 0, 0.6);
            display: block;
        }

        .controls {
            margin-top: 18px;
            font-size: 0.85em;
            opacity: 0.6;
            letter-spacing: 0.5px;
        }

        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 8, 30, 0.97);
            padding: 50px 60px;
            border-radius: 20px;
            text-align: center;
            z-index: 100;
            border: 1px solid rgba(255, 107, 107, 0.3);
            box-shadow: 0 0 60px rgba(255, 107, 107, 0.2), 0 20px 60px rgba(0,0,0,0.8);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .game-over h2 {
            font-size: 2.8em;
            margin-bottom: 16px;
            color: #ff6b6b;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.8);
            letter-spacing: 2px;
        }

        .game-over p {
            font-size: 1.3em;
            margin-bottom: 30px;
            color: rgba(255,255,255,0.8);
        }

        .game-over p span {
            color: #4ecca3;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(78, 204, 163, 0.8);
        }

        button {
            background: linear-gradient(135deg, #4ecca3 0%, #38b2ac 100%);
            color: #0d0d1a;
            border: none;
            padding: 15px 45px;
            font-size: 1.1em;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(78, 204, 163, 0.4);
        }

        button:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 30px rgba(78, 204, 163, 0.6);
        }

        button:active {
            transform: translateY(0) scale(0.98);
        }

        /* Pause overlay */
        #pauseOverlay {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            border-radius: 12px;
            justify-content: center;
            align-items: center;
            font-size: 2em;
            font-weight: bold;
            letter-spacing: 4px;
            color: #4ecca3;
            text-shadow: 0 0 20px rgba(78, 204, 163, 0.8);
            pointer-events: none;
        }

        .canvas-wrapper {
            position: relative;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 Snake Game</h1>
        <div class="score-board">
            <div class="score-item">Score: <span id="score">0</span></div>
            <div class="score-item">High Score: <span id="highScore">0</span></div>
        </div>
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div id="pauseOverlay">⏸ PAUSED</div>
        </div>
        <div class="controls">
            Arrow Keys or WASD to move &nbsp;|&nbsp; Space to Pause
        </div>
    </div>

    <div class="game-over" id="gameOver">
        <h2>💀 Game Over!</h2>
        <p>Your Score: <span id="finalScore">0</span></p>
        <button onclick="restartGame()">▶ Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');
        const pauseOverlay = document.getElementById('pauseOverlay');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let velocity = { x: 0, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoop;
        let isPaused = false;
        let gameSpeed = 100;

        // Particle system for food eaten effects
        let particles = [];
        // Food pulse animation
        let foodPulse = 0;
        let foodPulseDir = 1;
        // Snake trail effect
        let trail = [];
        // Score pop animation
        let scorePop = 0;
        // Death flash
        let deathFlash = 0;

        highScoreElement.textContent = highScore;

        // Particle class
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
                const speed = 1.5 + Math.random() * 3;
                particles.push({
                    x: x * gridSize + gridSize / 2,
                    y: y * gridSize + gridSize / 2,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    decay: 0.04 + Math.random() * 0.04,
                    size: 2 + Math.random() * 4,
                    color: color
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1; // gravity
                p.life -= p.decay;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 6;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        // HSL color for snake gradient
        function snakeSegmentColor(index, total) {
            const t = index / Math.max(total - 1, 1);
            // Head: bright cyan-green, tail: deep teal-blue
            const h = 160 + t * 40;
            const s = 70 - t * 20;
            const l = 55 - t * 20;
            return `hsl(${h}, ${s}%, ${l}%)`;
        }

        function drawRoundedRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function drawGame() {
            if (isPaused) return;

            // Animate food pulse
            foodPulse += 0.08 * foodPulseDir;
            if (foodPulse > 1) { foodPulse = 1; foodPulseDir = -1; }
            if (foodPulse < 0) { foodPulse = 0; foodPulseDir = 1; }

            // Score pop decay
            if (scorePop > 0) scorePop -= 0.05;

            // Only move snake if velocity is set
            if (velocity.x !== 0 || velocity.y !== 0) {
                const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

                // Check wall collision
                if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                    endGame();
                    return;
                }

                // Check self collision
                for (let i = 1; i < snake.length; i++) {
                    if (head.x === snake[i].x && head.y === snake[i].y) {
                        endGame();
                        return;
                    }
                }

                snake.unshift(head);

                // Check food collision
                if (head.x === food.x && head.y === food.y) {
                    score++;
                    scoreElement.textContent = score;
                    scorePop = 1;
                    // Burst particles
                    createParticles(food.x, food.y, '#ff6b6b', 16);
                    createParticles(food.x, food.y, '#ffd93d', 8);
                    placeFood();

                    if (score % 5 === 0 && gameSpeed > 50) {
                        gameSpeed -= 5;
                        clearInterval(gameLoop);
                        gameLoop = setInterval(drawGame, gameSpeed);
                    }
                } else {
                    snake.pop();
                }
            }

            updateParticles();

            // ---- DRAW ----

            // Clear canvas with deep dark background
            ctx.fillStyle = '#0d0d1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw subtle grid
            ctx.strokeStyle = 'rgba(255,255,255,0.025)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Draw snake trail glow (behind snake)
            if (snake.length > 1 && (velocity.x !== 0 || velocity.y !== 0)) {
                for (let i = snake.length - 1; i >= 1; i--) {
                    const seg = snake[i];
                    const alpha = (1 - i / snake.length) * 0.08;
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = '#4ecca3';
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#4ecca3';
                    ctx.fillRect(seg.x * gridSize, seg.y * gridSize, gridSize, gridSize);
                    ctx.restore();
                }
            }

            // Draw snake body (back to front)
            for (let index = snake.length - 1; index >= 0; index--) {
                const segment = snake[index];
                const px = segment.x * gridSize;
                const py = segment.y * gridSize;
                const pad = index === 0 ? 1 : 2;
                const size = gridSize - pad * 2;
                const radius = index === 0 ? 6 : 4;

                const color = snakeSegmentColor(index, snake.length);

                // Glow
                ctx.save();
                ctx.shadowBlur = index === 0 ? 18 : 8;
                ctx.shadowColor = index === 0 ? '#4ecca3' : '#2a9d8f';
                ctx.fillStyle = color;
                drawRoundedRect(px + pad, py + pad, size, size, radius);
                ctx.fill();
                ctx.restore();

                // Inner highlight
                if (index === 0) {
                    // Eyes
                    const eyeOffsetX = velocity.x !== 0 ? velocity.x * 5 : 0;
                    const eyeOffsetY = velocity.y !== 0 ? velocity.y * 5 : 0;
                    const cx = px + gridSize / 2;
                    const cy = py + gridSize / 2;

                    // Eye positions based on direction
                    let eye1, eye2;
                    if (velocity.x === 1) {
                        eye1 = { x: cx + 4, y: cy - 4 };
                        eye2 = { x: cx + 4, y: cy + 4 };
                    } else if (velocity.x === -1) {
                        eye1 = { x: cx - 4, y: cy - 4 };
                        eye2 = { x: cx - 4, y: cy + 4 };
                    } else if (velocity.y === -1) {
                        eye1 = { x: cx - 4, y: cy - 4 };
                        eye2 = { x: cx + 4, y: cy - 4 };
                    } else if (velocity.y === 1) {
                        eye1 = { x: cx - 4, y: cy + 4 };
                        eye2 = { x: cx + 4, y: cy + 4 };
                    } else {
                        eye1 = { x: cx - 4, y: cy - 3 };
                        eye2 = { x: cx + 4, y: cy - 3 };
                    }

                    // White of eye
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(eye1.x, eye1.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(eye2.x, eye2.y, 3, 0, Math.PI * 2);
                    ctx.fill();

                    // Pupil
                    ctx.fillStyle = '#0d0d1a';
                    ctx.beginPath();
                    ctx.arc(eye1.x + (velocity.x * 0.8), eye1.y + (velocity.y * 0.8), 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(eye2.x + (velocity.x * 0.8), eye2.y + (velocity.y * 0.8), 1.5, 0, Math.PI * 2);
                    ctx.fill();

                    // Shine on head
                    ctx.save();
                    ctx.globalAlpha = 0.3;
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.ellipse(px + pad + size * 0.3, py + pad + size * 0.25, size * 0.2, size * 0.12, -0.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else {
                    // Body segment shine
                    ctx.save();
                    ctx.globalAlpha = 0.15;
                    ctx.fillStyle = 'white';
                    drawRoundedRect(px + pad + 1, py + pad + 1, size * 0.5, size * 0.4, 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // Draw food
            const foodX = food.x * gridSize + gridSize / 2;
            const foodY = food.y * gridSize + gridSize / 2;
            const pulseRadius = (gridSize / 2 - 2) + foodPulse * 2.5;

            // Outer glow ring
            ctx.save();
            ctx.globalAlpha = 0.2 + foodPulse * 0.2;
            ctx.strokeStyle = '#ff6b6b';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff6b6b';
            ctx.beginPath();
            ctx.arc(foodX, foodY, pulseRadius + 4, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            // Food body
            ctx.save();
            ctx.shadowBlur = 20 + foodPulse * 10;
            ctx.shadowColor = '#ff6b6b';

            const foodGrad = ctx.createRadialGradient(
                foodX - 2, foodY - 2, 1,
                foodX, foodY, pulseRadius
            );
            foodGrad.addColorStop(0, '#ffb3b3');
            foodGrad.addColorStop(0.5, '#ff6b6b');
            foodGrad.addColorStop(1, '#c0392b');

            ctx.fillStyle = foodGrad;
            ctx.beginPath();
            ctx.arc(foodX, foodY, pulseRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Food shine
            ctx.save();
            ctx.globalAlpha = 0.5;
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.ellipse(foodX - 2, foodY - 3, 3, 2, -0.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Draw particles
            drawParticles();

            // Score pop effect on canvas
            if (scorePop > 0) {
                ctx.save();
                ctx.globalAlpha = scorePop;
                ctx.fillStyle = '#ffd93d';
                ctx.font = `bold ${14 + scorePop * 10}px Arial`;
                ctx.textAlign = 'center';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ffd93d';
                ctx.fillText(`+1`, food.x * gridSize + gridSize / 2, food.y * gridSize - 5 - (1 - scorePop) * 20);
                ctx.restore();
            }

            // Draw "waiting to start" message
            if (velocity.x === 0 && velocity.y === 0) {
                ctx.save();
                ctx.globalAlpha = 0.7 + Math.sin(Date.now() / 400) * 0.3;
                ctx.fillStyle = '#4ecca3';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#4ecca3';
                ctx.fillText('Press any arrow key to start!', canvas.width / 2, canvas.height / 2);
                ctx.restore();
            }

            ctx.shadowBlur = 0;
        }

        function placeFood() {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));
            food = newFood;
        }

        function endGame() {
            // Death flash particles
            snake.forEach(seg => {
                createParticles(seg.x, seg.y, '#ff6b6b', 4);
            });

            clearInterval(gameLoop);
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreElement.textContent = highScore;
            }
            finalScoreElement.textContent = score;

            // Short delay for death effect
            setTimeout(() => {
                gameOverElement.style.display = 'block';
            }, 400);
        }

        function restartGame() {
            snake = [{ x: 10, y: 10 }];
            velocity = { x: 0, y: 0 };
            score = 0;
            gameSpeed = 100;
            particles = [];
            scorePop = 0;
            scoreElement.textContent = score;
            placeFood();
            gameOverElement.style.display = 'none';
            isPaused = false;
            pauseOverlay.style.display = 'none';
            clearInterval(gameLoop);
            gameLoop = setInterval(drawGame, gameSpeed);
        }

        document.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }

            if (e.key === ' ') {
                isPaused = !isPaused;
                pauseOverlay.style.display = isPaused ? 'flex' : 'none';
                return;
            }

            if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && velocity.y === 0) {
                velocity = { x: 0, y: -1 };
            } else if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') && velocity.y === 0) {
                velocity = { x: 0, y: 1 };
            } else if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && velocity.x === 0) {
                velocity = { x: -1, y: 0 };
            } else if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && velocity.x === 0) {
                velocity = { x: 1, y: 0 };
            }
        });

        // Start the game
        gameLoop = setInterval(drawGame, gameSpeed);
    </script>
</body>
