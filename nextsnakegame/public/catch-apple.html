<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catch the Apples</title>
    <style>
        :root {
            --header-bg: #1f4e79;
            --header-border: #153859;
            --text-color: #ffffff;
            --btn-bg: #e74c3c;
            --btn-hover: #c0392b;
            --sky-top: #3498db;
            --sky-bottom: #85c1e9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #111;
            font-family: 'Arial Black', 'Arial', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 100%;
            max-height: 1200px;
            background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #ui-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: var(--header-bg);
            border-bottom: 6px solid var(--header-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
        }

        .ui-text {
            color: var(--text-color);
            font-size: 24px;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            letter-spacing: 1px;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Mobile Controls */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
            pointer-events: none;
        }

        .control-btn {
            width: 70px;
            height: 70px;
            background-color: rgba(255, 255, 255, 0.3);
            border: 4px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: white;
            pointer-events: auto;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: background-color 0.1s;
        }

        .control-btn:active {
            background-color: rgba(255, 255, 255, 0.6);
        }

        /* Overlays */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h1 {
            color: #fff;
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0 #000;
            color: #f1c40f;
        }

        .overlay p {
            color: #fff;
            font-size: 18px;
            margin-bottom: 30px;
            line-height: 1.5;
            max-width: 400px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 24px;
            font-family: inherit;
            background-color: var(--btn-bg);
            color: white;
            border: 4px solid #fff;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            box-shadow: 0 5px 0 #8e1c10, 0 10px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #8e1c10, 0 5px 5px rgba(0,0,0,0.3);
        }

        #flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: red;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.2s;
        }

        @media (min-width: 801px) {
            #mobile-controls {
                display: none;
            }
            .overlay p:after {
                content: " Use Left/Right Arrow Keys to move.";
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-header">
        <div id="score-display" class="ui-text">SCORE: 0</div>
        <div id="miss-display" class="ui-text">MISSES: 0/5</div>
    </div>

    <div id="flash-overlay"></div>
    <canvas id="canvas"></canvas>

    <div id="mobile-controls">
        <div class="control-btn" id="btn-left">◀</div>
        <div class="control-btn" id="btn-right">▶</div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay">
        <h1>Catch Apples</h1>
        <p>Move the basket to catch apples (+1).<br>Avoid bombs (-10).<br>Miss 5 apples = Game Over.<br>Reach 100 points to WIN!</p>
        <button class="btn" id="start-btn">Start Game</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="overlay hidden">
        <h1 style="color: #e74c3c;">GAME OVER</h1>
        <p id="gameover-stats">You missed too many apples!</p>
        <button class="btn" id="restart-btn">Try Again</button>
    </div>

    <!-- Win Screen -->
    <div id="win-screen" class="overlay hidden">
        <h1 style="color: #2ecc71;">YOU WIN!</h1>
        <p>Incredible! You reached 100 points!</p>
        <button class="btn" id="playagain-btn">Play Again</button>
    </div>
</div>
