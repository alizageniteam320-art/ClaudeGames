<script>
// Polyfill for localStorage and sessionStorage to prevent SecurityError in data: iframes
(function() {
    try {
        window.localStorage;
        window.sessionStorage;
    } catch (e) {
        // Storage access is blocked, implement in-memory polyfill
        const createStorage = () => {
            let store = {};
            return {
                getItem: (key) => store[key] || null,
                setItem: (key, value) => { store[key] = String(value); },
                removeItem: (key) => { delete store[key]; },
                clear: () => { store = {}; },
                key: (index) => Object.keys(store)[index] || null,
                get length() { return Object.keys(store).length; }
            };
        };
        
        try {
            Object.defineProperty(window, 'localStorage', { value: createStorage() });
            Object.defineProperty(window, 'sessionStorage', { value: createStorage() });
        } catch (defineError) {
             console.warn('Unable to define global storage properties:', defineError);
        }
    }
})();
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(102, 126, 234, 0.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 20%, rgba(118, 75, 162, 0.12) 0%, transparent 50%),
                        radial-gradient(ellipse at 20% 80%, rgba(0, 212, 255, 0.08) 0%, transparent 50%);
            animation: bgPulse 8s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes bgPulse {
            from { transform: scale(1) rotate(0deg); opacity: 0.7; }
            to { transform: scale(1.1) rotate(5deg); opacity: 1; }
        }

        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 8px 48px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.08), inset 0 1px 0 rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            position: relative;
            z-index: 1;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2.8em;
            text-shadow: 0 0 20px rgba(102, 126, 234, 0.8), 2px 2px 4px rgba(0, 0, 0, 0.5);
            background: linear-gradient(135deg, #a8edea, #fed6e3, #a8edea);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmerTitle 3s linear infinite;
            letter-spacing: 2px;
        }

        @keyframes shimmerTitle {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 1.2em;
            font-weight: bold;
            gap: 16px;
        }

        .score-item {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(118, 75, 162, 0.3));
            padding: 10px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2), inset 0 1px 0 rgba(255,255,255,0.1);
            text-shadow: 0 0 10px rgba(168, 237, 234, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .score-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .score-item span {
            color: #a8edea;
            font-size: 1.1em;
        }

        canvas {
            border: 2px solid rgba(168, 237, 234, 0.4);
            border-radius: 14px;
            background-color: #0d0d1a;
            box-shadow: 0 0 40px rgba(102, 126, 234, 0.3), 0 0 80px rgba(102, 126, 234, 0.1), inset 0 0 30px rgba(0,0,0,0.5);
            display: block;
            animation: canvasGlow 3s ease-in-out infinite alternate;
        }

        @keyframes canvasGlow {
            from { box-shadow: 0 0 30px rgba(102, 126, 234, 0.2), 0 0 60px rgba(102, 126, 234, 0.08); }
            to { box-shadow: 0 0 50px rgba(168, 237, 234, 0.35), 0 0 100px rgba(102, 126, 234, 0.15); }
        }

        .controls {
            margin-top: 20px;
            font-size: 0.9em;
            opacity: 0.7;
            letter-spacing: 1px;
        }

        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 30, 0.97);
            padding: 50px 60px;
            border-radius: 20px;
            text-align: center;
            z-index: 100;
            border: 1px solid rgba(168, 237, 234, 0.3);
            box-shadow: 0 0 60px rgba(102, 126, 234, 0.4), 0 20px 60px rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            animation: gameOverAppear 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes gameOverAppear {
            from { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .game-over h2 {
            font-size: 3em;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            animation: gameOverPulse 1s ease-in-out infinite alternate;
        }

        @keyframes gameOverPulse {
            from { filter: brightness(1); }
            to { filter: brightness(1.3); }
        }

        .game-over p {
            font-size: 1.4em;
            margin-bottom: 30px;
            color: #a8edea;
            text-shadow: 0 0 10px rgba(168, 237, 234, 0.5);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 45px;
            font-size: 1.1em;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.5);
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.4s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.7);
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(0);
        }

        .powerup-legend {
            margin-top: 14px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 0.82em;
        }

        .powerup-legend-item {
            background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            padding: 5px 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: transform 0.2s, background 0.2s;
        }

        .powerup-legend-item:hover {
            transform: translateY(-2px);
            background: rgba(255,255,255,0.12);
        }

        .active-powerup-bar {
            margin-top: 12px;
            min-height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .active-powerup-badge {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.4), rgba(118, 75, 162, 0.4));
            border-radius: 20px;
            padding: 5px 16px;
            font-size: 0.95em;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(168, 237, 234, 0.4);
            animation: pulse-badge 1s infinite alternate;
            box-shadow: 0 0 12px rgba(102, 126, 234, 0.3);
        }

        @keyframes pulse-badge {
            from { box-shadow: 0 0 6px rgba(102, 126, 234, 0.3); border-color: rgba(168, 237, 234, 0.3); }
            to { box-shadow: 0 0 18px rgba(168, 237, 234, 0.7); border-color: rgba(168, 237, 234, 0.8); }
        }

        /* Floating particles */
        .particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatParticle linear infinite;
            opacity: 0;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- Floating particles -->

    <div class="game-container">
        <h1>🐍 Snake Game</h1>
        <div class="score-board">
            <div class="score-item">Score: <span id="score">0</span></div>

    <div class="game-over" id="gameOver">

        <button onclick="restartGame()">Play Again</button>
    </div>

    <script>
        // ── Floating particles background ──────────────────────────────────────
        (function createParticles() {
            const container = document.getElementById('particles');
            const colors = ['#667eea', '#a8edea', '#764ba2', '#fed6e3', '#feca57', '#ff6b6b'];
            for (let i = 0; i < 25; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 6 + 2;
                p.style.cssText = `
                    width: ${size}px;
                    height: ${size}px;
                    background: ${colors[Math.floor(Math.random() * colors.length)]};
                    left: ${Math.random() * 100}vw;
                    animation-duration: ${Math.random() * 15 + 10}s;
                    animation-delay: ${Math.random() * 15}s;
                    box-shadow: 0 0 ${size * 2}px currentColor;
                `;
                container.appendChild(p);
            }
        })();
    </script>

        // Wait for the external script to initialize, then patch the canvas rendering
        // to use enhanced visuals (gradient snake, glowing food, grid overlay).
        (function patchRendering() {
            const canvas = document.getElementById('gameCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            // Store original fillRect and fillStyle setter to intercept drawing
            const originalDrawImage = ctx.drawImage.bind(ctx);

            // We'll overlay a grid on the canvas after each frame
            let lastImageData = null;

            // Patch: after external script draws each frame, enhance it
            const originalFill = ctx.fill.bind(ctx);
            const originalFillRect = ctx.fillRect.bind(ctx);
            const originalStrokeRect = ctx.strokeRect.bind(ctx);
            const originalClearRect = ctx.clearRect.bind(ctx);

            // Track when a full clear happens (new frame) and draw grid overlay
            ctx.clearRect = function(x, y, w, h) {
                originalClearRect.call(ctx, x, y, w, h);
                // Draw subtle grid after clearing
                requestAnimationFrame(() => drawGridOverlay());
            };

            function drawGridOverlay() {
                const gridSize = 20;
                ctx.save();
                ctx.strokeStyle = 'rgba(168, 237, 234, 0.04)';
                ctx.lineWidth = 0.5;
                for (let x = 0; x <= canvas.width; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                for (let y = 0; y <= canvas.height; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
                ctx.restore();
            }

            // Draw initial grid
            drawGridOverlay();
        })();

        // ── Score pop animation ────────────────────────────────────────────────
        (function scorePopAnimation() {
            const scoreEl = document.getElementById('score');
            if (!scoreEl) return;
            let lastScore = 0;
            const observer = new MutationObserver(() => {
                const newScore = parseInt(scoreEl.textContent) || 0;
                if (newScore > lastScore) {
                    scoreEl.style.transition = 'none';
                    scoreEl.style.transform = 'scale(1.5)';
                    scoreEl.style.color = '#feca57';
                    setTimeout(() => {
                        scoreEl.style.transition = 'transform 0.3s ease, color 0.3s ease';
                        scoreEl.style.transform = 'scale(1)';
                        scoreEl.style.color = '#a8edea';
                    }, 150);
                    lastScore = newScore;
                }
            });
            observer.observe(scoreEl, { childList: true, subtree: true, characterData: true });
        })();
    </script>
