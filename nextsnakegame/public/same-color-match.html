<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Color Match</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --red: #ff3366;
            --blue: #00ccff;
            --green: #33ff33;
            --yellow: #ffcc00;
            --gray: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            touch-action: none; /* Prevent scroll on touch */
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #aaaaaa;
            text-align: center;
            max-width: 80%;
        }

        button {
            background: linear-gradient(45deg, var(--blue), var(--green));
            border: none;
            border-radius: 30px;
            padding: 15px 40px;
            font-size: 1.5rem;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 204, 255, 0.4);
            transition: transform 0.1s, box-shadow 0.2s;
            margin-top: 20px;
            text-transform: uppercase;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Game UI Layout */
        #game-ui {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            z-index: 5;
            padding: 20px;
        }

        /* Top Bar */
        #top-bar {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .title-small {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .timer-text {
            font-size: 0.9rem;
            color: #aaaaaa;
        }

        #timer-container {
            width: 80%;
            max-width: 400px;
            height: 12px;
            background-color: var(--gray);
            border-radius: 10px;
            border: 2px solid #444;
            overflow: hidden;
            position: relative;
        }

        #timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--red), var(--yellow));
            border-radius: 10px;
            transform-origin: left;
        }

        /* Middle Area */
        #play-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
            position: relative;
        }

        #round-indicator {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid var(--green);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(51, 255, 51, 0.3);
            background-color: rgba(0,0,0,0.5);
            z-index: 2;
        }

        #round-indicator span:first-child {
            font-size: 0.8rem;
            color: #aaa;
        }

        #round-indicator span:last-child {
            font-size: 1.2rem;
            font-weight: bold;
        }

        #circles-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        .circle {
            width: 35vw;
            height: 35vw;
            max-width: 180px;
            max-height: 180px;
            border-radius: 50%;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        /* Bottom Bar */
        #bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            padding: 10px 20px;
            margin-bottom: 10px;
        }

        .hud-group {
            display: flex;
            flex-direction: column;
        }

        .hud-group.right {
            align-items: flex-end;
        }

        .hud-label {
            font-size: 1rem;
            color: #aaaaaa;
            margin-bottom: 5px;
        }

        .hud-value {
            font-size: 2rem;
            font-weight: bold;
        }

        #lives-container {
            display: flex;
            gap: 5px;
            font-size: 1.5rem;
        }

        /* Interactive Area Overlay */
        #interaction-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            cursor: pointer;
        }

        /* Effects */
        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-5px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-10px, 0, 0); }
            40%, 60% { transform: translate3d(10px, 0, 0); }
        }

        .flash-red {
            animation: flashRed 0.3s ease-out;
        }
        
        .flash-green {
            animation: flashGreen 0.3s ease-out;
        }

        @keyframes flashRed {
            0% { background-color: rgba(255, 51, 102, 0.3); }
            100% { background-color: transparent; }
        }

        @keyframes flashGreen {
            0% { background-color: rgba(51, 255, 51, 0.2); }
            100% { background-color: transparent; }
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 15;
        }
        
        .pulse {
            animation: pulse 0.5s ease-out;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Mobile Adjustments */
        @media (max-height: 600px) {
            #play-area { gap: 10px; }
            .circle { width: 30vw; height: 30vw; }
            #round-indicator { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>

<div id="game-container">
    
    <!-- Visual Feedback Layer -->
    <div id="feedback-layer" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1;"></div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen">
        <h1>Color Match</h1>
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <div style="width:30px; height:30px; border-radius:50%; background-color:var(--red); box-shadow:0 0 10px var(--red);"></div>
            <div style="width:30px; height:30px; border-radius:50%; background-color:var(--blue); box-shadow:0 0 10px var(--blue);"></div>
            <div style="width:30px; height:30px; border-radius:50%; background-color:var(--green); box-shadow:0 0 10px var(--green);"></div>
            <div style="width:30px; height:30px; border-radius:50%; background-color:var(--yellow); box-shadow:0 0 10px var(--yellow);"></div>
        </div>
        <p>If colors <b>MATCH</b> 👉 TAP the screen!</p>
        <p>If colors <b>DIFFER</b> 👉 DO NOTHING!</p>
        <p>Match 25+ to Win. 3 Seconds per round.</p>
        <button id="start-btn">Play Now</button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen hidden">
        <div id="game-ui">
            <div id="top-bar">
                <div class="title-small">Color Match</div>
                <div class="timer-text">Time: 3 seconds</div>
                <div id="timer-container">
                    <div id="timer-bar"></div>
                </div>
            </div>

            <div id="play-area">
                <div id="round-indicator">
                    <span>Round</span>
                    <span id="round-text">1/30</span>
                </div>
                <div id="circles-container">
                    <div id="circle1" class="circle"></div>
                    <div id="circle2" class="circle"></div>
                </div>
            </div>

            <div id="bottom-bar">
                <div class="hud-group">
                    <div class="hud-label">Lives</div>
                    <div id="lives-container">
                        <span id="life1">❤️</span>
                        <span id="life2">❤️</span>
                        <span id="life3">❤️</span>
                    </div>
                </div>
                <div class="hud-group right">
                    <div class="hud-label">Score</div>
                    <div id="score-display" class="hud-value">0</div>
                </div>
            </div>
        </div>
        <!-- Invisible layer to catch taps -->
        <div id="interaction-layer"></div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="screen hidden">
        <h1 id="end-title">Game Over</h1>
        <p id="end-score-text" style="font-size: 2rem; color: white; margin-bottom: 5px;">Score: 0 / 30</p>
        <p id="end-message">You ran out of lives!</p>
        <button id="restart-btn">Play Again</button>
    </div>

</div>
