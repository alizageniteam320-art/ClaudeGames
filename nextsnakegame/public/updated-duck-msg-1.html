<script>
// Polyfill for localStorage and sessionStorage to prevent SecurityError in data: iframes
(function() {
    try {
        window.localStorage;
        window.sessionStorage;
    } catch (e) {
        // Storage access is blocked, implement in-memory polyfill
        const createStorage = () => {
            let store = {};
            return {
                getItem: (key) => store[key] || null,
                setItem: (key, value) => { store[key] = String(value); },
                removeItem: (key) => { delete store[key]; },
                clear: () => { store = {}; },
                key: (index) => Object.keys(store)[index] || null,
                get length() { return Object.keys(store).length; }
            };
        };
        
        try {
            Object.defineProperty(window, 'localStorage', { value: createStorage() });
            Object.defineProperty(window, 'sessionStorage', { value: createStorage() });
        } catch (defineError) {
             console.warn('Unable to define global storage properties:', defineError);
        }
    }
})();
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck Hunt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            cursor: none;
        }
        
        #gameContainer {
            position: relative;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            box-shadow: 0 0 40px rgba(92, 148, 252, 0.4), 0 0 80px rgba(92, 148, 252, 0.2);
        }
        
        canvas {
            display: block;
            border: 4px solid #5c94fc;
            image-rendering: pixelated;
        }
        
        #crosshair {
            position: absolute;
            width: 40px;
            height: 40px;
            pointer-events: none;
            z-index: 100;
        }
        
        #hud {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(to right, #0d0d1a, #1a1a3e, #0d0d1a);
            color: #fff;
            padding: 10px 20px;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid #5c94fc;
        }

        #hud > div:first-child div:first-child {
            color: #ffd700;
            font-weight: bold;
            text-shadow: 0 0 8px #ffd700;
        }

        #hud > div:first-child div:last-child {
            color: #5c94fc;
            text-shadow: 0 0 8px #5c94fc;
        }

        #hud > div:last-child div:first-child {
            color: #00ff88;
            text-shadow: 0 0 8px #00ff88;
        }

        #hud > div:last-child div:last-child {
            color: #ff4444;
            text-shadow: 0 0 8px #ff4444;
        }
        
        .bullets {
            display: flex;
            gap: 10px;
        }
        
        .bullet {
            width: 28px;
            height: 28px;
            background: radial-gradient(circle at 35% 35%, #ffdd44, #ff8800);
            border-radius: 50%;
            border: 2px solid #ffaa00;
            box-shadow: 0 0 8px rgba(255, 180, 0, 0.7);
            transition: all 0.2s;
        }
        
        .bullet.used {
            background: radial-gradient(circle at 35% 35%, #444, #222);
            border-color: #555;
            box-shadow: none;
        }
        
        #roundInfo {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(0,0,0,0.9), rgba(20,20,60,0.95));
            color: #ffd700;
            padding: 20px 40px;
            font-size: 28px;
            border-radius: 12px;
            display: none;
            z-index: 50;
            text-align: center;
            border: 2px solid #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            text-shadow: 0 0 10px #ffd700;
            letter-spacing: 2px;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(0,0,0,0.97), rgba(20,0,40,0.97));
            color: #fff;
            padding: 40px 60px;
            font-size: 24px;
            border-radius: 15px;
            display: none;
            z-index: 50;
            text-align: center;
            border: 3px solid #ff4444;
            box-shadow: 0 0 30px rgba(255, 68, 68, 0.6), 0 0 60px rgba(255, 68, 68, 0.2);
        }
        
        #gameOver h2 {
            font-size: 52px;
            margin-bottom: 20px;
            color: #ff4444;
            text-shadow: 0 0 20px #ff4444;
            letter-spacing: 4px;
        }

        #gameOver p {
            color: #aaa;
            line-height: 1.8;
        }
        
        #gameOver button {
            margin-top: 25px;
            padding: 15px 45px;
            font-size: 20px;
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(255, 68, 68, 0.5);
            transition: all 0.2s;
        }
        
        #gameOver button:hover {
            background: linear-gradient(135deg, #ff6666, #ff2222);
            box-shadow: 0 6px 20px rgba(255, 68, 68, 0.8);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="crosshair"></div>
        <div id="hud">
            <div>
                <div>SCORE: <span id="score">0</span></div>
                <div>ROUND: <span id="round">1</span></div>
            </div>
            <div class="bullets" id="bulletsDisplay"></div>
            <div>
                <div>HIT: <span id="hit">0</span></div>
                <div>MISS: <span id="miss">0</span></div>
            </div>
        </div>
        <div id="roundInfo"></div>
        <div id="gameOver">
            <h2>GAME OVER</h2>
            <p id="finalScore"></p>
            <button onclick="restartGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const crosshair = document.getElementById('crosshair');
        
        canvas.width = 800;
        canvas.height = 600;
        
        // Game state
        let gameState = 'playing';
        let score = 0;
        let round = 1;
        let hits = 0;
        let misses = 0;
        let bullets = 3;
        const maxBullets = 3;
        const ducksPerRound = 10;
        let ducksShot = 0;
        let currentDucks = [];
        let dog = null;
        let showDog = false;
        let dogTimer = 0;
        let particles = [];
        let cloudOffset = 0;
        let frameCount = 0;

        // Score popups
        let scorePopups = [];

        // Colors
        const colors = {
            skyTop: '#1a6fc4',
            skyBottom: '#5cb8ff',
            ground: '#8B4513',
            groundTop: '#a0522d',
            grass: '#2d8a2d',
            grassLight: '#3daa3d',
            tree: '#1a5c1a',
            treeLight: '#2d8a2d',
            cloud: '#f0f8ff'
        };

        // Particle class
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6 - 2;
                this.life = 1.0;
                this.decay = 0.03 + Math.random() * 0.03;
                this.size = 4 + Math.random() * 6;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.15;
                this.life -= this.decay;
                this.size *= 0.97;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 6;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Score popup class
        class ScorePopup {
            constructor(x, y, text) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.life = 1.0;
                this.vy = -1.5;
            }

            update() {
                this.y += this.vy;
                this.life -= 0.02;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = '#ffd700';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ffd700';
                ctx.font = 'bold 22px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }
        
        // Duck class
        class Duck {
            constructor() {
                this.x = Math.random() < 0.5 ? -50 : canvas.width + 50;
                this.y = 80 + Math.random() * 280;
                this.size = 50;
                this.speed = 2 + Math.random() * 2 + (round * 0.3);
                this.direction = this.x < 0 ? 1 : -1;
                this.angle = 0;
                this.alive = true;
                this.falling = false;
                this.fallSpeed = 0;
                this.flapSpeed = 0.18 + Math.random() * 0.1;
                this.flapAngle = Math.random() * Math.PI * 2;
                this.bobOffset = Math.random() * Math.PI * 2;

                // Richer duck color palette
                const duckTypes = [
                    { body: '#4a7c2f', head: '#2d5a1b', accent: '#7ab648' },
                    { body: '#8B4513', head: '#5c2d0a', accent: '#c4692a' },
                    { body: '#1a3a6b', head: '#0d2040', accent: '#2d5ca8' },
                    { body: '#6b1a1a', head: '#400d0d', accent: '#a82d2d' },
                ];
                const type = duckTypes[Math.floor(Math.random() * duckTypes.length)];
                this.bodyColor = type.body;
                this.headColor = type.head;
                this.accentColor = type.accent;
                this.wingColor = type.accent;
            }
            
            update() {
                if (this.falling) {
                    this.y += this.fallSpeed;
                    this.fallSpeed += 0.5;
                    this.angle += 6;
                } else {
                    this.x += this.speed * this.direction;
                    this.y += Math.sin(Date.now() * 0.003 + this.bobOffset) * 0.6;
                    this.flapAngle += this.flapSpeed;
                }
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                if (this.falling) {
                    ctx.rotate(this.angle * Math.PI / 180);
                }

                const d = this.direction;
                const s = this.size;

                if (!this.falling) {
                    // Shadow
                    ctx.save();
                    ctx.globalAlpha = 0.15;
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.ellipse(0, s * 0.5, s * 0.5, s * 0.12, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // Wings (behind body)
                if (!this.falling) {
                    const wingFlap = Math.sin(this.flapAngle) * 20;

                    // Upper wing
                    ctx.save();
                    ctx.translate(-s * 0.1 * d, -s * 0.05);
                    ctx.rotate((-25 + wingFlap) * Math.PI / 180);
                    const wingGrad = ctx.createLinearGradient(-s * 0.45, 0, s * 0.45, 0);
                    wingGrad.addColorStop(0, this.wingColor);
                    wingGrad.addColorStop(1, this.bodyColor);
                    ctx.fillStyle = wingGrad;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, s * 0.45, s * 0.13, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    // Lower wing
                    ctx.save();
                    ctx.translate(-s * 0.1 * d, s * 0.05);
                    ctx.rotate((25 - wingFlap) * Math.PI / 180);
                    ctx.fillStyle = this.bodyColor;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, s * 0.4, s * 0.12, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // Body
                const bodyGrad = ctx.createRadialGradient(-s * 0.1, -s * 0.05, s * 0.05, 0, 0, s * 0.65);
                bodyGrad.addColorStop(0, this.accentColor);
                bodyGrad.addColorStop(1, this.bodyColor);
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.ellipse(0, 0, s * 0.6, s * 0.38, 0, 0, Math.PI * 2);
                ctx.fill();

                // Tail feathers
                ctx.fillStyle = this.bodyColor;
                ctx.save();
                ctx.translate(-s * 0.55 * d, s * 0.05);
                ctx.rotate(-15 * d * Math.PI / 180);
                ctx.beginPath();
                ctx.ellipse(0, 0, s * 0.22, s * 0.1, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Neck
                ctx.fillStyle = this.headColor;
                ctx.beginPath();
                ctx.ellipse(s * 0.3 * d, -s * 0.1, s * 0.18, s * 0.22, 0.3 * d, 0, Math.PI * 2);
                ctx.fill();

                // Head
                const headGrad = ctx.createRadialGradient(s * 0.38 * d, -s * 0.28, s * 0.05, s * 0.38 * d, -s * 0.28, s * 0.3);
                headGrad.addColorStop(0, this.accentColor);
                headGrad.addColorStop(1, this.headColor);
                ctx.fillStyle = headGrad;
                ctx.beginPath();
                ctx.ellipse(s * 0.38 * d, -s * 0.28, s * 0.28, s * 0.28, 0, 0, Math.PI * 2);
                ctx.fill();

                // Beak
                ctx.fillStyle = '#FFA500';
                ctx.strokeStyle = '#cc7700';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(s * 0.6 * d, -s * 0.28);
                ctx.lineTo(s * 0.82 * d, -s * 0.22);
                ctx.lineTo(s * 0.6 * d, -s * 0.16);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Nostril
                ctx.fillStyle = '#cc7700';
                ctx.beginPath();
                ctx.arc(s * 0.67 * d, -s * 0.24, 1.5, 0, Math.PI * 2);
                ctx.fill();

                // Eye white
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(s * 0.44 * d, -s * 0.32, 5, 0, Math.PI * 2);
                ctx.fill();

                // Eye iris
                ctx.fillStyle = '#3a1a00';
                ctx.beginPath();
                ctx.arc(s * 0.45 * d, -s * 0.32, 3, 0, Math.PI * 2);
                ctx.fill();

                // Eye shine
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(s * 0.46 * d, -s * 0.335, 1.2, 0, Math.PI * 2);
                ctx.fill();

                // Feet (when falling)
                if (this.falling) {
                    ctx.fillStyle = '#FFA500';
                    ctx.beginPath();
                    ctx.moveTo(-s * 0.1, s * 0.35);
                    ctx.lineTo(-s * 0.25, s * 0.5);
                    ctx.lineTo(s * 0.05, s * 0.5);
                    ctx.closePath();
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(s * 0.1, s * 0.35);
                    ctx.lineTo(-s * 0.05, s * 0.5);
                    ctx.lineTo(s * 0.25, s * 0.5);
                    ctx.closePath();
                    ctx.fill();
                }
                
                ctx.restore();
            }
            
            shoot() {
                if (this.alive && !this.falling) {
                    this.alive = false;
                    this.falling = true;
                    // Spawn particles
                    const colors = ['#ffd700', '#ff8800', '#ff4444', '#ffffff', this.bodyColor, this.accentColor];
                    for (let i = 0; i < 18; i++) {
                        particles.push(new Particle(this.x, this.y, colors[Math.floor(Math.random() * colors.length)]));
                    }
                    scorePopups.push(new ScorePopup(this.x, this.y - 30, '+500'));
                    return true;
                }
                return false;
            }
            
            isOffScreen() {
                return this.y > canvas.height || 
                       this.x < -100 || 
                       this.x > canvas.width + 100;
            }
            
            containsPoint(x, y) {
                const dx = x - this.x;
                const dy = y - this.y;
                return Math.sqrt(dx * dx + dy * dy) < this.size;
            }
        }
        
        // Dog class
        class Dog {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height - 150;
                this.size = 60;
                this.state = 'sniff';
                this.jumpY = 0;
                this.duckCount = 0;
                this.tailAngle = 0;
            }
            
            show(state, duckCount = 0) {
                this.state = state;
                this.duckCount = duckCount;
                this.jumpY = 0;
                showDog = true;
                dogTimer = 120;
            }
            
            update() {
                if (this.state === 'jump') {
                    this.jumpY = Math.sin(Date.now() * 0.01) * 20 - 20;
                }
                this.tailAngle = Math.sin(Date.now() * 0.008) * 25;
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y + this.jumpY);
                
                const s = this.size;

                // Tail
                ctx.save();
                ctx.translate(s * 0.35, -s * 0.1);
                ctx.rotate(this.tailAngle * Math.PI / 180);
                ctx.fillStyle = '#a0522d';
                ctx.beginPath();
                ctx.ellipse(0, -s * 0.3, s * 0.08, s * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Body
                const bodyGrad = ctx.createLinearGradient(-s * 0.4, 0, s * 0.4, s * 0.6);
                bodyGrad.addColorStop(0, '#c4692a');
                bodyGrad.addColorStop(1, '#8B4513');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.roundRect(-s * 0.4, 0, s * 0.8, s * 0.6, 10);
                ctx.fill();

                // Belly
                ctx.fillStyle = '#d4956a';
                ctx.beginPath();
                ctx.ellipse(0, s * 0.35, s * 0.22, s * 0.18, 0, 0, Math.PI * 2);
                ctx.fill();

                // Legs
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(-s * 0.32, s * 0.5, s * 0.18, s * 0.3);
                ctx.fillRect(s * 0.14, s * 0.5, s * 0.18, s * 0.3);
                // Paws
                ctx.fillStyle = '#c4692a';
                ctx.beginPath();
                ctx.ellipse(-s * 0.23, s * 0.8, s * 0.12, s * 0.07, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(s * 0.23, s * 0.8, s * 0.12, s * 0.07, 0, 0, Math.PI * 2);
                ctx.fill();

                // Head
                const headGrad = ctx.createRadialGradient(-s * 0.05, -s * 0.35, s * 0.05, 0, -s * 0.3, s * 0.42);
                headGrad.addColorStop(0, '#d4752e');
                headGrad.addColorStop(1, '#8B4513');
                ctx.fillStyle = headGrad;
                ctx.beginPath();
                ctx.roundRect(-s * 0.35, -s * 0.55, s * 0.7, s * 0.55, 12);
                ctx.fill();

                // Snout
                ctx.fillStyle = '#d4956a';
                ctx.beginPath();
                ctx.ellipse(0, -s * 0.2, s * 0.22, s * 0.16, 0, 0, Math.PI * 2);
                ctx.fill();

                // Ears
                ctx.fillStyle = '#6b3010';
                ctx.beginPath();
                ctx.ellipse(-s * 0.42, -s * 0.45, s * 0.1, s * 0.22, -0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(s * 0.42, -s * 0.45, s * 0.1, s * 0.22, 0.3, 0, Math.PI * 2);
                ctx.fill();
                
                // Nose
                ctx.fillStyle = '#1a0a00';
                ctx.beginPath();
                ctx.ellipse(0, -s * 0.28, s * 0.1, s * 0.07, 0, 0, Math.PI * 2);
                ctx.fill();
                // Nose shine
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.beginPath();
                ctx.ellipse(-s * 0.03, -s * 0.3, s * 0.04, s * 0.025, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Eyes
                if (this.state === 'laugh') {
                    ctx.strokeStyle = '#1a0a00';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.arc(-s * 0.15, -s * 0.4, 5, 0, Math.PI);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(s * 0.15, -s * 0.4, 5, 0, Math.PI);
                    ctx.stroke();
                    // Laugh mouth
                    ctx.beginPath();
                    ctx.arc(0, -s * 0.18, s * 0.12, 0.2, Math.PI - 0.2);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = '#1a0a00';
                    ctx.beginPath();
                    ctx.arc(-s * 0.15, -s * 0.4, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(s * 0.15, -s * 0.4, 5, 0, Math.PI * 2);
                    ctx.fill();
                    // Eye shine
                    ctx.fillStyle = 'rgba(255,255,255,0.6)';
                    ctx.beginPath();
                    ctx.arc(-s * 0.13, -s * 0.42, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(s * 0.17, -s * 0.42, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // Show ducks if jumping
                if (this.state === 'jump' && this.duckCount > 0) {
                    for (let i = 0; i < this.duckCount; i++) {
                        ctx.save();
                        ctx.translate((i - this.duckCount / 2) * 32 + 16, -s * 0.9);
                        ctx.fillStyle = '#4a7c2f';
                        ctx.beginPath();
                        ctx.ellipse(0, 0, 14, 9, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#2d5a1b';
                        ctx.beginPath();
                        ctx.ellipse(10, -6, 9, 9, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#FFA500';
                        ctx.beginPath();
                        ctx.moveTo(17, -6);
                        ctx.lineTo(22, -4);
                        ctx.lineTo(17, -2);
                        ctx.closePath();
                        ctx.fill();
                        ctx.restore();
                    }
                }
                
                ctx.restore();
            }
        }
        
        // Draw background
        function drawBackground() {
            // Sky gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.7);
            skyGrad.addColorStop(0, '#1a6fc4');
            skyGrad.addColorStop(0.5, '#4a9fe0');
            skyGrad.addColorStop(1, '#87ceeb');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height * 0.7);

            // Sun
            const sunX = 680;
            const sunY = 60;
            const sunGrad = ctx.createRadialGradient(sunX, sunY, 5, sunX, sunY, 45);
            sunGrad.addColorStop(0, '#fffde0');
            sunGrad.addColorStop(0.4, '#ffe066');
            sunGrad.addColorStop(1, 'rgba(255,200,0,0)');
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(sunX, sunY, 45, 0, Math.PI * 2);
            ctx.fill();

            // Sun rays
            ctx.strokeStyle = 'rgba(255, 220, 50, 0.3)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2 + frameCount * 0.005;
                ctx.beginPath();
                ctx.moveTo(sunX + Math.cos(angle) * 30, sunY + Math.sin(angle) * 30);
                ctx.lineTo(sunX + Math.cos(angle) * 60, sunY + Math.sin(angle) * 60);
                ctx.stroke();
            }
            
            // Animated clouds
            ctx.fillStyle = colors.cloud;
            const cloudPositions = [
                { x: 100, y: 55, scale: 1.0 },
                { x: 320, y: 35, scale: 1.3 },
                { x: 560, y: 65, scale: 0.85 },
            ];
            cloudPositions.forEach((c, i) => {
                const cx = ((c.x + cloudOffset * (0.3 + i * 0.1)) % (canvas.width + 200)) - 100;
                drawCloud(cx, c.y, c.scale);
            });
            
            // Ground gradient
            const groundGrad = ctx.createLinearGradient(0, canvas.height * 0.7, 0, canvas.height);
            groundGrad.addColorStop(0, '#6b3010');
            groundGrad.addColorStop(1, '#3d1a08');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, canvas.height * 0.7, canvas.width, canvas.height * 0.3);

            // Dirt texture lines
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 8; i++) {
                const y = canvas.height * 0.72 + i * 18;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // Grass strip
            const grassGrad = ctx.createLinearGradient(0, canvas.height * 0.7, 0, canvas.height * 0.7 + 45);
            grassGrad.addColorStop(0, '#3daa3d');
            grassGrad.addColorStop(1, '#1a6b1a');
            ctx.fillStyle = grassGrad;
            ctx.fillRect(0, canvas.height * 0.7, canvas.width, 45);

            // Grass blades
            ctx.strokeStyle = '#4dc44d';
            ctx.lineWidth = 2;
            for (let i = 0; i < 80; i++) {
                const gx = (i * 11 + 3) % canvas.width;
                const gy = canvas.height * 0.7 + 2;
                const sway = Math.sin(frameCount * 0.04 + i * 0.5) * 3;
                ctx.beginPath();
                ctx.moveTo(gx, gy + 12);
                ctx.quadraticCurveTo(gx + sway, gy + 6, gx + sway * 1.5, gy);
                ctx.stroke();
            }
            
            // Trees
            for (let i = 0; i < 5; i++) {
                const tx = 80 + i * 170;
                const ty = canvas.height * 0.7;
                drawTree(tx, ty);
            }
        }

        function drawCloud(x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.shadowBlur = 15;
            ctx.shadowColor = 'rgba(255,255,255,0.5)';
            ctx.fillStyle = 'rgba(255,255,255,0.92)';
            ctx.beginPath();
            ctx.arc(0, 0, 28, 0, Math.PI * 2);
            ctx.arc(28, -5, 34, 0, Math.PI * 2);
            ctx.arc(60, 0, 26, 0, Math.PI * 2);
            ctx.arc(30, 8, 22, 0, Math.PI * 2);
            ctx.fill();
            // Cloud highlight
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.beginPath();
            ctx.arc(20, -12, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawTree(x, y) {
            // Trunk
            const trunkGrad = ctx.createLinearGradient(x - 12, 0, x + 12, 0);
            trunkGrad.addColorStop(0, '#3d1a08');
            trunkGrad.addColorStop(0.5, '#6b3010');
            trunkGrad.addColorStop(1, '#3d1a08');
            ctx.fillStyle = trunkGrad;
            ctx.beginPath();
            ctx.roundRect(x - 11, y - 70, 22, 72, 4);
            ctx.fill();

            // Tree shadow
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.beginPath();
            ctx.ellipse(x + 8, y - 2, 30, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // Foliage layers
            const layers = [
                { y: -120, r: 38 },
                { y: -95, r: 44 },
                { y: -70, r: 40 },
            ];
            layers.forEach((l, idx) => {
                const leafGrad = ctx.createRadialGradient(x - 8, y + l.y - 5, 5, x, y + l.y, l.r);
                leafGrad.addColorStop(0, '#4dc44d');
                leafGrad.addColorStop(0.6, '#2d8a2d');
                leafGrad.addColorStop(1, '#1a5c1a');
                ctx.fillStyle = leafGrad;
                ctx.beginPath();
                ctx.arc(x, y + l.y, l.r, 0, Math.PI * 2);
                ctx.fill();
            });

            // Leaf highlights
            ctx.fillStyle = 'rgba(100, 220, 100, 0.25)';
            ctx.beginPath();
            ctx.arc(x - 12, y - 125, 18, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Spawn ducks
        function spawnDucks() {
            const numDucks = Math.min(2, round);
            for (let i = 0; i < numDucks; i++) {
                currentDucks.push(new Duck());
            }
        }
        
        // Update bullets display
        function updateBulletsDisplay() {
            const display = document.getElementById('bulletsDisplay');
            display.innerHTML = '';
            for (let i = 0; i < maxBullets; i++) {
                const bullet = document.createElement('div');
                bullet.className = 'bullet' + (i >= bullets ? ' used' : '');
                display.appendChild(bullet);
            }
        }
        
        // Update HUD
        function updateHUD() {
            document.getElementById('score').textContent = score;
            document.getElementById('round').textContent = round;
            document.getElementById('hit').textContent = hits;
            document.getElementById('miss').textContent = misses;
            updateBulletsDisplay();
        }
        
        // Draw crosshair
        function drawCrosshair(x, y) {
            // Outer glow
            ctx.save();
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ff4444';
            ctx.strokeStyle = 'rgba(255, 68, 68, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x, y, 24, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            // Main circle
            ctx.strokeStyle = '#ff2222';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(x, y, 18, 0, Math.PI * 2);
            ctx.stroke();

            // Inner dot
            ctx.fillStyle = 'rgba(255, 50, 50, 0.7)';
            ctx.beginPath();
            ctx.arc(x, y, 3, 0, Math.PI * 2);
            ctx.fill();

            // Cross lines
            ctx.strokeStyle = '#ff2222';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x, y - 28);
            ctx.lineTo(x, y - 20);
            ctx.moveTo(x, y + 28);
            ctx.lineTo(x, y + 20);
            ctx.moveTo(x - 28, y);
            ctx.lineTo(x - 20, y);
            ctx.moveTo(x + 28, y);
            ctx.lineTo(x + 20, y);
            ctx.stroke();

            // Diagonal ticks
            ctx.strokeStyle = 'rgba(255, 68, 68, 0.5)';
            ctx.lineWidth = 1.5;
            const diags = [45, 135, 225, 315];
            diags.forEach(angle => {
                const rad = angle * Math.PI / 180;
                ctx.beginPath();
                ctx.moveTo(x + Math.cos(rad) * 22, y + Math.sin(rad) * 22);
                ctx.lineTo(x + Math.cos(rad) * 28, y + Math.sin(rad) * 28);
                ctx.stroke();
            });
        }
        
        // Mouse tracking
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;
        
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });
        
        // Muzzle flash
        let muzzleFlash = 0;

        // Shooting
        canvas.addEventListener('click', (e) => {
            if (gameState !== 'playing' || bullets <= 0) return;
            
            bullets--;
            muzzleFlash = 8;
            updateBulletsDisplay();
            
            // Check if hit a duck
            let hit = false;
            for (let duck of currentDucks) {
                if (duck.containsPoint(mouseX, mouseY) && duck.shoot()) {
                    score += 500;
                    hits++;
                    ducksShot++;
                    hit = true;
                    
                    setTimeout(() => {
                        if (dog) {
                            dog.show('jump', 1);
                        }
                    }, 500);
                    break;
                }
            }
            
            if (!hit && bullets === 0 && currentDucks.some(d => d.alive && !d.falling)) {
                misses++;
                setTimeout(() => {
                    if (dog) {
                        dog.show('laugh');
                    }
                }, 500);
            }
            
            updateHUD();
        });
        
        // Show round info
        function showRoundInfo(message) {
            const roundInfo = document.getElementById('roundInfo');
            roundInfo.textContent = message;
            roundInfo.style.display = 'block';
            setTimeout(() => {
                roundInfo.style.display = 'none';
            }, 2000);
        }
        
        // End round
        function endRound() {
            if (ducksShot >= ducksPerRound * 0.6) {
                showRoundInfo(`ROUND ${round} COMPLETE!`);
                round++;
                ducksShot = 0;
                setTimeout(() => {
                    gameState = 'playing';
                    spawnDucks();
                }, 2500);
            } else {
                gameOver();
            }
        }
        
        // Game over
        function gameOver() {
            gameState = 'gameOver';
            document.getElementById('finalScore').innerHTML = 
                `Final Score: ${score}<br>Rounds Completed: ${round - 1}`;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        // Restart game
        function restartGame() {
            gameState = 'playing';
            score = 0;
            round = 1;
            hits = 0;
            misses = 0;
            bullets = maxBullets;
            ducksShot = 0;
            currentDucks = [];
            particles = [];
            scorePopups = [];
            document.getElementById('gameOver').style.display = 'none';
            updateHUD();
            spawnDucks();
        }
        
        // Game loop
        function gameLoop() {
            frameCount++;
            cloudOffset += 0.4;

            // Draw background
            drawBackground();

            // Muzzle flash overlay
            if (muzzleFlash > 0) {
                ctx.save();
                ctx.globalAlpha = muzzleFlash / 8 * 0.18;
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
                muzzleFlash--;
            }
            
            // Update and draw ducks
            for (let i = currentDucks.length - 1; i >= 0; i--) {
                const duck = currentDucks[i];
                duck.update();
                duck.draw();
                
                if (duck.isOffScreen()) {
                    currentDucks.splice(i, 1);
                }
            }

            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Update and draw score popups
            for (let i = scorePopups.length - 1; i >= 0; i--) {
                scorePopups[i].update();
                scorePopups[i].draw();
                if (scorePopups[i].life <= 0) {
                    scorePopups.splice(i, 1);
                }
            }
            
            // Update and draw dog
            if (dog && showDog) {
                dog.update();
                dog.draw();
                dogTimer--;
                if (dogTimer <= 0) {
                    showDog = false;
                }
            }
            
            // Draw crosshair
            drawCrosshair(mouseX, mouseY);
            
            // Check if all ducks are gone and bullets used
            if (gameState === 'playing' && currentDucks.length === 0) {
                bullets = maxBullets;
                updateBulletsDisplay();
                
                if (ducksShot >= ducksPerRound) {
                    gameState = 'roundEnd';
                    endRound();
                } else {
                    spawnDucks();
                }
            }
            
            // Check if bullets depleted with alive ducks
            if (gameState === 'playing' && bullets === 0 && currentDucks.some(d => d.alive && !d.falling)) {
                setTimeout(() => {
                    currentDucks = currentDucks.filter(d => d.falling);
                }, 1000);
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // Initialize
        dog = new Dog();
        updateHUD();
        spawnDucks();
        
        setTimeout(() => {
            dog.show('sniff');
        }, 500);
        
        gameLoop();
    </script>
</body>
</html>
