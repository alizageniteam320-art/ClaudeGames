// ===== COLLISION =====
function getTile(px, py) {
    let tx = Math.floor(px / TILE);
    let ty = Math.floor(py / TILE);
    if (tx < 0 || tx >= LEVEL_WIDTH || ty < 0 || ty >= LEVEL_HEIGHT) return 0;
    return levelData[ty][tx];
}

function isSolid(tile) {
    return tile === 1 || tile === 2 || tile === 3 || tile === 4 || tile === 5 || tile === 6 || tile === 7 || tile === 8 || tile === 9;
}

function rectCollide(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function drawMountain(x, baseY, height) {
    ctx.beginPath();
    ctx.moveTo(x, baseY);
    ctx.lineTo(x + height * 0.6, baseY - height);
    ctx.lineTo(x + height * 1.2, baseY);
    ctx.closePath();
    ctx.fill();
    
    // Snow cap
    ctx.fillStyle = '#FFF';
    ctx.beginPath();
    ctx.moveTo(x + height * 0.45, baseY - height * 0.7);
    ctx.lineTo(x + height * 0.6, baseY - height);
    ctx.lineTo(x + height * 0.75, baseY - height * 0.7);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#5B8C5A';
}

function drawHill(x, baseY, size) {
    ctx.beginPath();
    ctx.arc(x + size / 2, baseY, size / 2, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
}

function drawCloud(x, y) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.arc(x, y, 15, 0, Math.PI * 2);
    ctx.arc(x + 15, y - 5, 18, 0, Math.PI * 2);
    ctx.arc(x + 35, y, 15, 0, Math.PI * 2);
    ctx.arc(x + 18, y + 5, 12, 0, Math.PI * 2);
    ctx.fill();
}

function drawBush(x, y) {
    ctx.fillStyle = '#3CB371';
    ctx.beginPath();
    ctx.arc(x, y, 12, Math.PI, 0);
    ctx.arc(x + 16, y - 4, 14, Math.PI, 0);
    ctx.arc(x + 32, y, 12, Math.PI, 0);
    ctx.fill();
}

function drawFlagPole() {
    if (!flagPole) return;
    let fx = flagPole.x - cameraX;
    let fy = flagPole.y;
    
    // Pole
    ctx.fillStyle = '#666';
    ctx.fillRect(fx + 14, fy, 4, flagPole.height);
    
    // Ball on top
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(fx + 16, fy, 6, 0, Math.PI * 2);
    ctx.fill();
    
    // Flag
    ctx.fillStyle = '#FF0000';
    let flagWave = Math.sin(time * 0.05) * 3;
    ctx.beginPath();
    ctx.moveTo(fx + 18, fy + 8);
    ctx.lineTo(fx + 50 + flagWave, fy + 20);
    ctx.lineTo(fx + 18, fy + 32);
    ctx.closePath();
    ctx.fill();
    
    // Flag triangle pattern
    ctx.fillStyle = '#CC0000';
    ctx.beginPath();
    ctx.moveTo(fx + 18, fy + 14);
    ctx.lineTo(fx + 38 + flagWave * 0.5, fy + 20);
    ctx.lineTo(fx + 18, fy + 26);
    ctx.closePath();
    ctx.fill();
}

function drawCastle() {
    if (!castle) return;
    let cx = castle.x - cameraX;
    let cy = castle.y;
    
    // Main body
    ctx.fillStyle = '#888';
    ctx.fillRect(cx, cy, castle.w, castle.h);
    
    // Stones pattern
    ctx.fillStyle = '#999';
    for (let sy = 0; sy < castle.h; sy += 16) {
        for (let sx = (sy % 32 === 0 ? 0 : 8); sx < castle.w; sx += 16) {
            ctx.fillRect(cx + sx + 1, cy + sy + 1, 14, 14);
        }
    }
    
    // Battlements
    ctx.fillStyle = '#888';
    for (let bx = 0; bx < castle.w; bx += 20) {
        ctx.fillRect(cx + bx, cy - 20, 12, 20);
    }
    
    // Door
    ctx.fillStyle = '#333';
    ctx.fillRect(cx + castle.w / 2 - 16, cy + castle.h - 48, 32, 48);
    ctx.beginPath();
    ctx.arc(cx + castle.w / 2, cy + castle.h - 48, 16, Math.PI, 0);
    ctx.fill();
    
    // Window
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(cx + castle.w / 2 - 6, cy + 20, 12, 16);
}

// ===== PARTICLES =====
function addParticle(x, y, type) {
    for (let i = 0; i < 6; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: -Math.random() * 6 - 2,
            life: 30 + Math.random() * 20,
            color: type === 'coin' ? '#FFD700' : type === 'brick' ? '#C84C09' : '#FF0000',
            size: type === 'brick' ? 6 : 3
        });
    }
}

function addFloatingText(x, y, text, color) {
    floatingTexts.push({ x, y, text, color: color || '#FFF', life: 40, vy: -2 });
}

// ===== UPDATE =====
function update() {
    time++;
    
    if (gameState === 'dead') {
        deathTimer--;
        player.vy += GRAVITY;
        player.y += player.vy;
        if (deathTimer <= 0) {
            lives--;
            if (lives <= 0) {
                gameState = 'gameover';
            } else {
                gameState = 'playing';
                resetPlayer();
            }
        }
        return;
    }
    
    if (gameState === 'levelcomplete') {
        levelCompleteTimer--;
        if (levelCompleteTimer <= 0) {
            currentLevel++;
            if (currentLevel > 3) {
                gameState = 'win';
            } else {
                createLevel(currentLevel);
                resetPlayer();
                gameState = 'playing';
            }
        }
        return;
    }
    
    if (gameState === 'gameover' || gameState === 'win') return;
    
    // Input
    let moveLeft = keys['ArrowLeft'] || keys['KeyA'] || touchLeft;
    let moveRight = keys['ArrowRight'] || keys['KeyD'] || touchRight;
    let jumpKey = keys['ArrowUp'] || keys['KeyW'] || keys['Space'] || touchJump;
    let runKey = keys['ShiftLeft'] || keys['ShiftRight'] || keys['KeyZ'];
    
    let speed = runKey ? 5 : 3.5;
    let accel = 0.4;
    let decel = 0.3;
    
    // Horizontal movement
    if (moveLeft) {
        player.vx = Math.max(player.vx - accel, -speed);
        player.facing = -1;
    } else if (moveRight) {
        player.vx = Math.min(player.vx + accel, speed);
        player.facing = 1;
    } else {
        if (player.vx > 0) player.vx = Math.max(0, player.vx - decel);
        else if (player.vx < 0) player.vx = Math.min(0, player.vx + decel);
    }
    
    // Jump
    if (jumpKey && player.onGround && !player.jumping) {
        player.vy = -11;
        player.onGround = false;
        player.jumping = true;
    }
    
    if (!jumpKey) {
        player.jumping = false;
        if (player.vy < -3) player.vy = -3; // Variable jump height
    }
    
    // Gravity
    player.vy += GRAVITY;
    if (player.vy > MAX_FALL) player.vy = MAX_FALL;
    
    // Animation
    if (Math.abs(player.vx) > 0.5) {
        player.frameTimer++;
        if (player.frameTimer > 5) {
            player.frame++;
            player.frameTimer = 0;
        }
    }
    
    // Horizontal collision
    player.x += player.vx;
    
    let pLeft = player.x;
    let pRight = player.x + player.w;
    let pTop = player.y;
    let pBottom = player.y + player.h;
    
    // Check horizontal tiles
    for (let ty = Math.floor(pTop / TILE); ty <= Math.floor((pBottom - 1) / TILE); ty++) {
        for (let tx = Math.floor(pLeft / TILE); tx <= Math.floor((pRight - 1) / TILE); tx++) {
            let tile = getTile(tx * TILE, ty * TILE);
            if (isSolid(tile)) {
                if (player.vx > 0) {
                    player.x = tx * TILE - player.w;
                    player.vx = 0;
                } else if (player.vx < 0) {
                    player.x = (tx + 1) * TILE;
                    player.vx = 0;
                }
            }
        }
    }
    
    // Vertical collision
    player.y += player.vy;
    player.onGround = false;
    
    pLeft = player.x;
    pRight = player.x + player.w;
    pTop = player.y;
    pBottom = player.y + player.h;
    
    for (let ty = Math.floor(pTop / TILE); ty <= Math.floor((pBottom - 1) / TILE); ty++) {
        for (let tx = Math.floor(pLeft / TILE); tx <= Math.floor((pRight - 1) / TILE); tx++) {
            let tile = getTile(tx * TILE, ty * TILE);
            if (isSolid(tile)) {
                if (player.vy > 0) {
                    player.y = ty * TILE - player.h;
                    player.vy = 0;
                    player.onGround = true;
                } else if (player.vy < 0) {
                    player.y = (ty + 1) * TILE;
                    player.vy = 0;
                    
                    // Hit block from below
                    hitBlock(tx, ty, tile);
                }
            }
        }
    }
    
    // Prevent going left of screen
    if (player.x < cameraX) player.x = cameraX;
    
    // Fall into pit
    if (player.y > LEVEL_HEIGHT * TILE + 50) {
        playerDie();
        return;
    }
    
    // Invincibility timer
    if (invincibleTimer > 0) invincibleTimer--;
    if (starTimer > 0) starTimer--;
    
    // Camera
    let targetCam = player.x - canvas.width / 3;
    if (targetCam > cameraX) cameraX += (targetCam - cameraX) * 0.1;
    if (cameraX < 0) cameraX = 0;
    let maxCam = LEVEL_WIDTH * TILE - canvas.width;
    if (cameraX > maxCam) cameraX = maxCam;
    
    // Coins
    for (let coin of coins) {
        if (coin.collected) continue;
        coin.frame++;
        if (rectCollide(player, { x: coin.x, y: coin.y, w: coin.w, h: coin.h })) {
            coin.collected = true;
            score += 100;
            addParticle(coin.x + 8, coin.y + 8, 'coin');
            addFloatingText(coin.x, coin.y, '+100', '#FFD700');
        }
    }
    
    // Mushrooms
    for (let i = mushrooms.length - 1; i >= 0; i--) {
        let m = mushrooms[i];
        m.vy += GRAVITY;
        m.x += m.vx;
        m.y += m.vy;
        
        // Ground collision for mushroom
        let mBottom = m.y + 24;
        let mTile = getTile(m.x + 12, mBottom);
        if (isSolid(mTile)) {
            m.y = Math.floor(mBottom / TILE) * TILE - 24;
            m.vy = 0;
        }
        
        // Wall collision
        let mSide = getTile(m.vx > 0 ? m.x + 24 : m.x, m.y + 12);
        if (isSolid(mSide)) m.vx *= -1;
        
        // Player collision
        if (rectCollide(player, { x: m.x, y: m.y, w: 24, h: 24 })) {
            mushrooms.splice(i, 1);
            score += 1000;
            addFloatingText(m.x, m.y, '+1000', '#FF0000');
            invincibleTimer = 120;
        }
    }
    
    // Question blocks bounce
    for (let q of questionBlocks) {
        if (q.bounceTimer > 0) q.bounceTimer--;
    }
    
    // Enemies
    for (let enemy of enemies) {
        if (enemy.dead) {
            enemy.deadTimer--;
            if (enemy.type !== 'goomba') {
                enemy.vy += GRAVITY;
                enemy.y += enemy.vy;
            }
            continue;
        }
        
        enemy.frameTimer++;
        if (enemy.frameTimer > 8) {
            enemy.frame++;
            enemy.frameTimer = 0;
        }
        
        if (enemy.type === 'flying') {
            enemy.flyTimer += 0.03;
            enemy.y = enemy.baseY + Math.sin(enemy.flyTimer) * 40;
            enemy.x += enemy.vx;
        } else {
            enemy.vy += GRAVITY;
            enemy.x += enemy.vx;
            enemy.y += enemy.vy;
            
            // Ground collision
            let eBottom = enemy.y + enemy.h;
            let eTileBelow = getTile(enemy.x + enemy.w / 2, eBottom);
            if (isSolid(eTileBelow)) {
                enemy.y = Math.floor(eBottom / TILE) * TILE - enemy.h;
                enemy.vy = 0;
                enemy.onGround = true;
            } else {
                enemy.onGround = false;
            }
            
            // Wall collision
            let eSideTile = getTile(enemy.vx > 0 ? enemy.x + enemy.w : enemy.x, enemy.y + enemy.h / 2);
            if (isSolid(eSideTile)) {
                enemy.vx *= -1;
            }
            
            // Edge detection - turn around at edges
            if (enemy.onGround) {
                let aheadX = enemy.vx > 0 ? enemy.x + enemy.w + 4 : enemy.x - 4;
                let belowTile = getTile(aheadX, enemy.y + enemy.h + 4);
                if (!isSolid(belowTile)) {
                    enemy.vx *= -1;
                }
            }
        }
        
        // Player collision with enemy
        if (invincibleTimer <= 0 || starTimer > 0) {
            let playerRect = { x: player.x, y: player.y, w: player.w, h: player.h };
            let enemyRect = { x: enemy.x, y: enemy.y, w: enemy.w, h: enemy.h };
            
            if (rectCollide(playerRect, enemyRect)) {
                if (starTimer > 0) {
                    // Kill enemy with star power
                    enemy.dead = true;
                    enemy.deadTimer = 30;
                    enemy.vy = -5;
                    score += 200;
                    addFloatingText(enemy.x, enemy.y, '+200', '#FFD700');
                    addParticle(enemy.x + 14, enemy.y + 14, 'enemy');
                } else if (player.vy > 0 && player.y + player.h - 8 < enemy.y + enemy.h / 2) {
                    // Stomp enemy
                    enemy.dead = true;
                    enemy.deadTimer = 30;
                    player.vy = -8;
                    score += 200;
                    addFloatingText(enemy.x, enemy.y, '+200', '#FFD700');
                    addParticle(enemy.x + 14, enemy.y + 14, 'enemy');
                } else if (invincibleTimer <= 0) {
                    playerDie();
                    return;
                }
            }
        }
    }
    
    // Remove dead enemies
    enemies = enemies.filter(e => !e.dead || e.deadTimer > 0 || e.y < LEVEL_HEIGHT * TILE + 100);
    
    // Flag pole collision
    if (flagPole) {
        if (player.x + player.w > flagPole.x && player.x < flagPole.x + 32) {
            gameState = 'levelcomplete';
            levelCompleteTimer = 120;
            score += 2000;
            addFloatingText(flagPole.x, flagPole.y, '+2000', '#FFD700');
        }
    }
    
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    // Floating texts
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.life--;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    }
}

function hitBlock(tx, ty, tile) {
    if (tile === 3) {
        // Question block
        let qb = questionBlocks.find(q => q.x === tx && q.y === ty && !q.used);
        if (qb) {
            qb.used = true;
            qb.bounceTimer = 8;
            levelData[ty][tx] = 8;
            
            if (qb.hasMushroom) {
                mushrooms.push({
                    x: tx * TILE, y: ty * TILE - TILE,
                    vx: 1.5, vy: 0
                });
            } else {
                score += 100;
                addParticle(tx * TILE + 16, ty * TILE, 'coin');
                addFloatingText(tx * TILE, ty * TILE - 20, '+100', '#FFD700');
            }
        }
    } else if (tile === 2) {
        // Break brick
        levelData[ty][tx] = 0;
        score += 50;
        addParticle(tx * TILE + 16, ty * TILE + 16, 'brick');
        addFloatingText(tx * TILE, ty * TILE, '+50', '#FFA500');
    }
}

function playerDie() {
    if (invincibleTimer > 0) return;
    gameState = 'dead';
    player.vy = -10;
    player.dead = true;
    deathTimer = 60;
}

// ===== DRAW =====
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    drawBackground();
    
    ctx.save();
    ctx.translate(-cameraX, 0);
    
    // Draw tiles
    let startTile = Math.floor(cameraX / TILE);
    let endTile = Math.ceil((cameraX + canvas.width) / TILE) + 1;
    
    for (let y = 0; y < LEVEL_HEIGHT; y++) {
        for (let x = startTile; x < endTile && x < LEVEL_WIDTH; x++) {
            let tile = levelData[y][x];
            let dx = x * TILE;
            let dy = y * TILE;
            
            if (tile === 1) {
                drawGround(dx, dy);
            } else if (tile === 2) {
                drawBrick(dx, dy);
            } else if (tile === 3 || tile === 8) {
                let qb = questionBlocks.find(q => q.x === x && q.y === y);
                let bounce = qb && qb.bounceTimer > 0 ? -Math.sin(qb.bounceTimer / 8 * Math.PI) * 8 : 0;
                drawQuestionBlock(dx, dy, tile === 8, bounce);
            } else if (tile >= 4 && tile <= 7) {
                drawPipe(dx, dy, tile);
            }
        }
    }
    
    // Draw bushes on ground
    for (let bx = startTile; bx < endTile; bx += 7) {
        if (bx < LEVEL_WIDTH && levelData[12][bx] === 1) {
            drawBush(bx * TILE + 16, 12 * TILE);
        }
    }
    
    // Draw coins
    for (let coin of coins) {
        if (!coin.collected) {
            if (coin.x > cameraX - 32 && coin.x < cameraX + canvas.width + 32) {
                drawCoin(coin.x, coin.y, coin.frame);
            }
        }
    }
    
    // Draw mushrooms
    for (let m of mushrooms) {
        drawMushroom(m.x, m.y);
    }
    
    // Draw enemies
    for (let enemy of enemies) {
        if (enemy.dead && enemy.deadTimer <= 0) continue;
        if (enemy.x > cameraX - 64 && enemy.x < cameraX + canvas.width + 64) {
            if (enemy.type === 'goomba') {
                drawGoomba(enemy.x, enemy.y, enemy.frame, enemy.dead);
            } else if (enemy.type === 'koopa') {
                drawKoopa(enemy.x, enemy.y, enemy.frame, enemy.vx > 0 ? 1 : -1);
            } else if (enemy.type === 'flying') {
                drawFlyingEnemy(enemy.x, enemy.y, enemy.frame);
            }
        }
    }
    
    // Draw flag & castle
    drawFlagPole();
    drawCastle();
    
    // Draw player
    if (gameState !== 'gameover' && gameState !== 'win') {
        drawPixelMario(player.x, player.y, player.facing, player.frame, player.big, invincibleTimer > 0);
    }
    
    // Particles
    for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / 50;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    
    // Floating texts
    for (let ft of floatingTexts) {
        ctx.fillStyle = ft.color;
        ctx.font = 'bold 14px Courier';
        ctx.textAlign = 'center';
        ctx.globalAlpha = ft.life / 40;
        ctx.fillText(ft.text, ft.x, ft.y);
    }
    ctx.globalAlpha = 1;
    
    ctx.restore();
    
    // ===== UI =====
    // Coin icon
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(24, 22, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FFA500';
    ctx.beginPath();
    ctx.arc(24, 22, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 8px Courier';
    ctx.textAlign = 'center';
    ctx.fillText('$', 24, 25);
    
    // Score text
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 18px Courier';
    ctx.textAlign = 'left';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 2;
    ctx.fillText('SCORE', 40, 18);
    ctx.fillText(score.toString().padStart(6, '0'), 40, 36);
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
    
    // Lives
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 18px Courier';
    ctx.textAlign = 'center';
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 2;
    ctx.fillText('LIVES', canvas.width / 2, 18);
    ctx.fillText('❤️'.repeat(Math.max(0, lives)), canvas.width / 2, 38);
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
    
    // Level
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 18px Courier';
    ctx.textAlign = 'right';
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 2;
    ctx.fillText('LEVEL', canvas.width - 20, 18);
    ctx.fillText('0' + currentLevel, canvas.width - 20, 36);
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
    
    // Mobile controls overlay
    drawMobileControls();
    
    // Game state overlays
    if (gameState === 'gameover') {
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#FF0000';
        ctx.font = 'bold 48px Courier';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 30);
        ctx.fillStyle = '#FFF';
        ctx.font = 'bold 20px Courier';
        ctx.fillText('Score: ' + score, canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillStyle = '#4CAF50';
        ctx.fillRect(canvas.width / 2 - 80, canvas.height / 2 + 30, 160, 40);
        ctx.fillStyle = '#FFF';
        ctx.font = 'bold 16px Courier';
        ctx.fillText('PLAY AGAIN', canvas.width / 2, canvas.height / 2 + 55);
    }
    
    if (gameState === 'win') {
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 48px Courier';
        ctx.textAlign = 'center';
        ctx.fillText('YOU WIN!', canvas.width / 2, canvas.height / 2 - 30);
        ctx.fillStyle = '#FFF';
        ctx.font = 'bold 20px Courier';
        ctx.fillText('Final Score: ' + score, canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillStyle = '#4CAF50';
        ctx.fillRect(canvas.width / 2 - 80, canvas.height / 2 + 30, 160, 40);
        ctx.fillStyle = '#FFF';
        ctx.font = 'bold 16px Courier';
        ctx.fillText('PLAY AGAIN', canvas.width / 2, canvas.height / 2 + 55);
    }
    
    if (gameState === 'levelcomplete') {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 36px Courier';
        ctx.textAlign = 'center';
        ctx.fillText('LEVEL ' + currentLevel + ' COMPLETE!', canvas.width / 2, canvas.height / 2);
    }
}

function drawMobileControls() {
    // Only show on touch devices
    if (!('ontouchstart' in window
