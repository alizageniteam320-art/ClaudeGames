<script>
// Polyfill for localStorage and sessionStorage to prevent SecurityError in data: iframes
(function() {
    try {
        window.localStorage;
        window.sessionStorage;
    } catch (e) {
        // Storage access is blocked, implement in-memory polyfill
        const createStorage = () => {
            let store = {};
            return {
                getItem: (key) => store[key] || null,
                setItem: (key, value) => { store[key] = String(value); },
                removeItem: (key) => { delete store[key]; },
                clear: () => { store = {}; },
                key: (index) => Object.keys(store)[index] || null,
                get length() { return Object.keys(store).length; }
            };
        };
        
        try {
            Object.defineProperty(window, 'localStorage', { value: createStorage() });
            Object.defineProperty(window, 'sessionStorage', { value: createStorage() });
        } catch (defineError) {
             console.warn('Unable to define global storage properties:', defineError);
        }
    }
})();
</script>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = 800;
        canvas.height = 600;

        // Polyfill for roundRect
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }
        
        // Game state
        let gameState = 'playing';
        let score = 0;
        let round = 1;
        let hits = 0;
        let misses = 0;
        let bullets = 3;
        const maxBullets = 3;
        const ducksPerRound = 10;
        let ducksShot = 0;
        let ducksSpawnedThisRound = 0;
        let currentDucks = [];
        let obstacles = [];
        let dog = null;
        let showDog = false;
        let dogTimer = 0;
        let particles = [];
        let cloudOffset = 0;
        let frameCount = 0;
        let scorePopups = [];
        let bestCombo = 0;

        // Combo system
        let combo = 0;
        let comboTimer = 0;
        const comboTimeout = 180;

        // Per-wave timer
        let waveTimer = 0;
        let waveTimerMax = 600;
        let timerActive = false;

        // Dodge mechanic
        let lastShotX = -999;
        let lastShotY = -999;

        // Wave management
        let waveInProgress = false;
        let endingRound = false;

        // Colors
        const colors = {
            skyTop: '#1a6fc4',
            skyBottom: '#5cb8f5',
            ground: '#8B3A0F',
            groundDark: '#6B2A00',
            grass: '#2ecc40',
            grassDark: '#1a8a28',
            tree: '#1a6b1a',
            treeDark: '#0d4d0d',
            cloud: '#f0f8ff'
        };

        // Particle class
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6 - 2;
                this.life = 1.0;
                this.decay = 0.03 + Math.random() * 0.03;
                this.size = 4 + Math.random() * 6;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.15;
                this.life -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0.1, this.size * this.life), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Score popup class
        class ScorePopup {
            constructor(x, y, text, color) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color || '#ffd700';
                this.life = 1.0;
                this.decay = 0.02;
                this.vy = -1.5;
            }
            update() {
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.font = 'bold 22px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        // Obstacle class
        class Obstacle {
            constructor() {
                this.type = Math.random() < 0.5 ? 'log' : 'rock';
                this.x = Math.random() < 0.5 ? -80 : canvas.width + 80;
                this.y = 120 + Math.random() * 220;
                this.width = this.type === 'log' ? 90 : 60;
                this.height = this.type === 'log' ? 28 : 40;
                this.speed = (1.5 + Math.random() * 1.5 + round * 0.2) * (this.x < 0 ? 1 : -1);
                this.alpha = 0.85;
                this.bobOffset = Math.random() * Math.PI * 2;
            }
            update() {
                this.x += this.speed;
                this.y += Math.sin(Date.now() * 0.002 + this.bobOffset) * 0.4;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                if (this.type === 'log') {
                    const logGrad = ctx.createLinearGradient(this.x - this.width/2, this.y - this.height/2, this.x - this.width/2, this.y + this.height/2);
                    logGrad.addColorStop(0, '#8B5E3C');
                    logGrad.addColorStop(0.5, '#C4843A');
                    logGrad.addColorStop(1, '#6B3A10');
                    ctx.fillStyle = logGrad;
                    ctx.beginPath();
                    ctx.roundRect(this.x - this.width/2, this.y - this.height/2, this.width, this.height, 10);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
                    ctx.lineWidth = 1;
                    for (let i = 1; i < 4; i++) {
                        ctx.beginPath();
                        ctx.moveTo(this.x - this.width/2 + 8, this.y - this.height/2 + i * (this.height/4));
                        ctx.lineTo(this.x + this.width/2 - 8, this.y - this.height/2 + i * (this.height/4));
                        ctx.stroke();
                    }
                    ctx.fillStyle = '#5a2800';
                    ctx.beginPath();
                    ctx.ellipse(this.x - this.width/2 + 6, this.y, 6, this.height/2 - 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(this.x + this.width/2 - 6, this.y, 6, this.height/2 - 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    const rockGrad = ctx.createRadialGradient(this.x - 8, this.y - 8, 4, this.x, this.y, this.width/2);
                    rockGrad.addColorStop(0, '#aaaaaa');
                    rockGrad.addColorStop(0.5, '#777777');
                    rockGrad.addColorStop(1, '#444444');
                    ctx.fillStyle = rockGrad;
                    ctx.beginPath();
                    ctx.moveTo(this.x - this.width/2 + 10, this.y + this.height/2);
                    ctx.lineTo(this.x - this.width/2, this.y);
                    ctx.lineTo(this.x - this.width/2 + 8, this.y - this.height/2 + 5);
                    ctx.lineTo(this.x, this.y - this.height/2);
                    ctx.lineTo(this.x + this.width/2 - 8, this.y - this.height/2 + 5);
                    ctx.lineTo(this.x + this.width/2, this.y);
                    ctx.lineTo(this.x + this.width/2 - 10, this.y + this.height/2);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.beginPath();
                    ctx.ellipse(this.x - 8, this.y - 8, this.width/4, this.height/5, -0.4, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
            isOffScreen() {
                return this.x < -200 || this.x > canvas.width + 200;
            }
            containsPoint(x, y) {
                return x > this.x - this.width/2 && x < this.x + this.width/2 &&
                       y > this.y - this.height/2 && y < this.y + this.height/2;
            }
        }

        // Duck class
        class Duck {
            constructor() {
                this.x = Math.random() < 0.5 ? -60 : canvas.width + 60;
                this.y = 80 + Math.random() * 280;
                this.size = 52;
                this.baseSpeed = 2.5 + Math.random() * 2 + (round * 0.5);
                this.speed = this.baseSpeed;
                this.direction = this.x < 0 ? 1 : -1;
                this.angle = 0;
                this.alive = true;
                this.falling = false;
                this.fallSpeed = 0;
                this.fallRotation = 0;
                this.fallRotationSpeed = (Math.random() - 0.5) * 12;
                this.colorVariant = Math.floor(Math.random() * 3);
                this.flapSpeed = 0.18 + Math.random() * 0.08;
                this.flapAngle = Math.random() * Math.PI * 2;
                this.bobOffset = Math.random() * Math.PI * 2;
                this.trailPoints = [];
                this.hitFlash = 0;
                this.escaped = false;

                this.canDodge = round >= 3 && Math.random() < Math.min(0.15 + round * 0.08, 0.75);
                this.dodgeCooldown = 0;
                this.isDodging = false;
                this.dodgeVY = 0;

                this.zigzag = round >= 2 && Math.random() < Math.min(0.2 + round * 0.1, 0.8);
                this.zigzagTimer = 40 + Math.floor(Math.random() * 60);
                this.zigzagVY = 0;
                this.zigzagDir = Math.random() < 0.5 ? 1 : -1;

                this.stealth = round >= 5 && Math.random() < Math.min((round - 4) * 0.12, 0.5);
                this.stealthAlpha = this.stealth ? (0.35 + Math.random() * 0.25) : 1.0;

                this.burstTimer = 80 + Math.floor(Math.random() * 120);
                this.bursting = false;

                const variants = [
                    { body: '#7B3F00', head: '#2d6a2d', accent: '#ffa500' },
                    { body: '#1a1a2e', head: '#16213e', accent: '#e94560' },
                    { body: '#5c4033', head: '#8B6914', accent: '#ffd700' }
                ];
                this.colors = variants[this.colorVariant];
            }
            
            update() {
                if (this.falling) {
                    this.y += this.fallSpeed;
                    this.fallSpeed += 0.55;
                    this.fallRotation += this.fallRotationSpeed;
                    this.hitFlash = Math.max(0, this.hitFlash - 0.05);
                    return;
                }

                this.burstTimer--;
                if (this.burstTimer <= 0) {
                    this.bursting = !this.bursting;
                    this.burstTimer = this.bursting ? (20 + Math.floor(Math.random() * 30)) : (80 + Math.floor(Math.random() * 120));
                    this.speed = this.bursting ? this.baseSpeed * 2.2 : this.baseSpeed;
                }

                if (this.zigzag) {
                    this.zigzagTimer--;
                    if (this.zigzagTimer <= 0) {
                        this.zigzagDir *= -1;
                        this.zigzagTimer = 30 + Math.floor(Math.random() * 50);
                    }
                    this.zigzagVY = this.zigzagDir * (1.5 + round * 0.15);
                }

                if (this.canDodge && this.dodgeCooldown <= 0) {
                    const dx = this.x - lastShotX;
                    const dy = this.y - lastShotY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120) {
                        this.isDodging = true;
                        this.dodgeVY = (dy > 0 ? 1 : -1) * (4 + round * 0.3);
                        this.dodgeCooldown = 60;
                    }
                }
                if (this.dodgeCooldown > 0) this.dodgeCooldown--;
                if (this.isDodging) {
                    this.y += this.dodgeVY;
                    this.dodgeVY *= 0.88;
                    if (Math.abs(this.dodgeVY) < 0.3) {
                        this.isDodging = false;
                        this.dodgeVY = 0;
                    }
                }

                this.x += this.speed * this.direction;
                this.y += Math.sin(Date.now() * 0.0025 + this.bobOffset) * 0.7;
                if (this.zigzag) this.y += this.zigzagVY * 0.3;

                this.y = Math.max(40, Math.min(canvas.height * 0.65, this.y));

                this.flapAngle += this.flapSpeed + (this.bursting ? 0.15 : 0);

                this.trailPoints.push({ x: this.x, y: this.y, life: 1.0 });
                if (this.trailPoints.length > 8) this.trailPoints.shift();
                this.trailPoints.forEach(p => p.life -= 0.12);
                this.trailPoints = this.trailPoints.filter(p => p.life > 0);
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.stealthAlpha;

                if (!this.falling) {
                    this.trailPoints.forEach((p) => {
                        ctx.save();
                        ctx.globalAlpha = p.life * 0.15 * this.stealthAlpha;
                        ctx.fillStyle = this.colors.body;
                        ctx.beginPath();
                        ctx.ellipse(p.x, p.y, this.size * 0.5 * p.life, this.size * 0.3 * p.life, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    });
                }

                ctx.save();
                ctx.translate(this.x, this.y);
                if (this.falling) {
                    ctx.rotate(this.fallRotation * Math.PI / 180);
                }

                if (this.bursting && !this.falling) {
                    ctx.save();
                    ctx.globalAlpha = 0.35;
                    ctx.shadowColor = '#ff6600';
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = '#ff6600';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size * 0.7, this.size * 0.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                if (this.isDodging) {
                    ctx.save();
                    ctx.globalAlpha = 0.3;
                    ctx.fillStyle = '#00ffff';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size * 0.7, this.size * 0.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                if (!this.falling) {
                    ctx.save();
                    ctx.globalAlpha = 0.15;
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.ellipse(0, this.size * 0.5, this.size * 0.5, this.size * 0.12, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                const d = this.direction;
                const s = this.size;

                if (!this.falling) {
                    const wingFlap = Math.sin(this.flapAngle) * 18;
                    ctx.save();
                    ctx.translate(-s * 0.15 * d, -s * 0.05);
                    ctx.rotate((-25 + wingFlap) * Math.PI / 180 * d);
                    const wingGrad = ctx.createLinearGradient(-s * 0.45, 0, s * 0.45, 0);
                    wingGrad.addColorStop(0, this.colors.body);
                    wingGrad.addColorStop(1, this.colors.accent + '88');
                    ctx.fillStyle = wingGrad;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, s * 0.45, s * 0.14, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                const bodyGrad = ctx.createRadialGradient(-s * 0.1, -s * 0.1, s * 0.05, 0, 0, s * 0.65);
                bodyGrad.addColorStop(0, this.hitFlash > 0 ? '#ffffff' : lightenColor(this.colors.body, 40));
                bodyGrad.addColorStop(1, this.hitFlash > 0 ? '#ffaaaa' : this.colors.body);
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.ellipse(0, 0, s * 0.62, s * 0.42, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.fillStyle = this.colors.body;
                ctx.beginPath();
                ctx.moveTo(-s * 0.55 * d, -s * 0.05);
                ctx.lineTo(-s * 0.8 * d, -s * 0.2);
                ctx.lineTo(-s * 0.75 * d, s * 0.1);
                ctx.lineTo(-s * 0.55 * d, s * 0.1);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = this.colors.head;
                ctx.beginPath();
                ctx.ellipse(s * 0.3 * d, -s * 0.15, s * 0.2, s * 0.28, 0.3 * d, 0, Math.PI * 2);
                ctx.fill();

                const headGrad = ctx.createRadialGradient(s * 0.38 * d, -s * 0.28, s * 0.05, s * 0.38 * d, -s * 0.28, s * 0.32);
                headGrad.addColorStop(0, lightenColor(this.colors.head, 50));
                headGrad.addColorStop(1, this.colors.head);
                ctx.fillStyle = headGrad;
                ctx.beginPath();
                ctx.ellipse(s * 0.38 * d, -s * 0.28, s * 0.28, s * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.25)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.strokeStyle = this.colors.accent;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.ellipse(s * 0.3 * d, -s * 0.1, s * 0.18, s * 0.12, 0.3 * d, 0, Math.PI * 2);
                ctx.stroke();

                const beakGrad = ctx.createLinearGradient(s * 0.6 * d, -s * 0.28, s * 0.85 * d, -s * 0.2);
                beakGrad.addColorStop(0, '#ffcc00');
                beakGrad.addColorStop(1, '#ff8800');
                ctx.fillStyle = beakGrad;
                ctx.beginPath();
                ctx.moveTo(s * 0.6 * d, -s * 0.3);
                ctx.lineTo(s * 0.88 * d, -s * 0.24);
                ctx.lineTo(s * 0.6 * d, -s * 0.18);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(s * 0.46 * d, -s * 0.32, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#1a6b1a';
                ctx.beginPath();
                ctx.arc(s * 0.46 * d, -s * 0.32, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(s * 0.47 * d, -s * 0.32, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(s * 0.48 * d, -s * 0.34, 1, 0, Math.PI * 2);
                ctx.fill();

                if (!this.falling) {
                    const wingFlap2 = Math.sin(this.flapAngle + 0.3) * 18;
                    ctx.save();
                    ctx.translate(-s * 0.1 * d, -s * 0.08);
                    ctx.rotate((25 - wingFlap2) * Math.PI / 180 * d);
                    const wingGrad2 = ctx.createLinearGradient(-s * 0.42, 0, s * 0.42, 0);
                    wingGrad2.addColorStop(0, lightenColor(this.colors.body, 20));
                    wingGrad2.addColorStop(1, this.colors.body);
                    ctx.fillStyle = wingGrad2;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, s * 0.42, s * 0.13, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    ctx.restore();
                }

                if (this.stealth && !this.falling) {
                    ctx.save();
                    ctx.globalAlpha = 0.18 + Math.sin(frameCount * 0.12) * 0.08;
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, s * 0.68, s * 0.48, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                ctx.restore();
                ctx.restore();
            }
            
            shoot() {
                if (this.alive && !this.falling) {
                    this.alive = false;
                    this.falling = true;
                    this.hitFlash = 1.0;
                    for (let i = 0; i < 18; i++) {
                        const pColors = ['#ffd700', '#ff6600', '#ff4444', '#ffffff', this.colors.body];
                        particles.push(new Particle(this.x, this.y, pColors[Math.floor(Math.random() * pColors.length)]));
                    }
                    return true;
                }
                return false;
            }
            
            isOffScreen() {
                return this.y > canvas.height + 50 || 
                       this.x < -150 || 
                       this.x > canvas.width + 150;
            }
            
            containsPoint(x, y) {
                const dx = x - this.x;
                const dy = y - this.y;
                return Math.sqrt(dx * dx + dy * dy) < this.size;
            }
        }

        function lightenColor(hex, amount) {
            const num = parseInt(hex.replace('#', ''), 16);
            const r = Math.min(255, (num >> 16) + amount);
            const g = Math.min(255, ((num >> 8) & 0xff) + amount);
            const b = Math.min(255, (num & 0xff) + amount);
            return `rgb(${r},${g},${b})`;
        }
        
        // Dog class
        class Dog {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height - 145;
                this.size = 65;
                this.state = 'sniff';
                this.jumpY = 0;
                this.duckCount = 0;
                this.animFrame = 0;
                this.tailWag = 0;
            }
            
            show(state, duckCount) {
                if (gameState === 'gameOver') return;
                duckCount = duckCount || 0;
                this.state = state;
                this.duckCount = duckCount;
                this.jumpY = 0;
                this.animFrame = 0;
                showDog = true;
                dogTimer = 130;
            }
            
            update() {
                this.animFrame++;
                this.tailWag = Math.sin(this.animFrame * 0.15) * 20;
                if (this.state === 'jump') {
                    this.jumpY = Math.sin(this.animFrame * 0.1) * 25 - 25;
                }
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y + this.jumpY);
                
                const s = this.size;

                ctx.save();
                ctx.globalAlpha = 0.2;
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.ellipse(0, s * 0.65, s * 0.6, s * 0.12, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                ctx.save();
                ctx.translate(s * 0.42, s * 0.1);
                ctx.rotate(this.tailWag * Math.PI / 180);
                ctx.fillStyle = '#a0522d';
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(s * 0.4, -s * 0.3, s * 0.5, -s * 0.5);
                ctx.quadraticCurveTo(s * 0.55, -s * 0.55, s * 0.45, -s * 0.45);
                ctx.quadraticCurveTo(s * 0.3, -s * 0.2, s * 0.05, s * 0.05);
                ctx.closePath();
                ctx.fill();
                ctx.restore();

                const bodyGrad = ctx.createRadialGradient(-s * 0.1, 0, s * 0.1, 0, s * 0.2, s * 0.6);
                bodyGrad.addColorStop(0, '#c4763a');
                bodyGrad.addColorStop(1, '#7B3A10');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.ellipse(0, s * 0.25, s * 0.45, s * 0.35, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#7B3A10';
                const legBob = Math.sin(this.animFrame * 0.12) * 3;
                ctx.fillRect(-s * 0.35, s * 0.5, s * 0.18, s * 0.22 + legBob);
                ctx.fillRect(s * 0.17, s * 0.5, s * 0.18, s * 0.22 - legBob);

                ctx.fillStyle = '#c4763a';
                ctx.beginPath();
                ctx.ellipse(-s * 0.26, s * 0.73 + legBob, s * 0.13, s * 0.08, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(s * 0.26, s * 0.73 - legBob, s * 0.13, s * 0.08, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#a0522d';
                ctx.beginPath();
                ctx.ellipse(0, -s * 0.05, s * 0.22, s * 0.2, 0, 0, Math.PI * 2);
                ctx.fill();

                const headGrad = ctx.createRadialGradient(-s * 0.05, -s * 0.35, s * 0.05, 0, -s * 0.3, s * 0.42);
                headGrad.addColorStop(0, '#d4864a');
                headGrad.addColorStop(1, '#8B4513');
                ctx.fillStyle = headGrad;
                ctx.beginPath();
                ctx.arc(0, -s * 0.3, s * 0.38, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#6B3010';
                ctx.beginPath();
                ctx.ellipse(-s * 0.32, -s * 0.52, s * 0.12, s * 0.22, -0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(s * 0.32, -s * 0.52, s * 0.12, s * 0.22, 0.3, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#c4763a';
                ctx.beginPath();
                ctx.ellipse(0, -s * 0.18, s * 0.22, s * 0.15, 0, 0, Math.PI * 2);
                ctx.fill();

                const noseGrad = ctx.createRadialGradient(-s * 0.03, -s * 0.14, 1, 0, -s * 0.12, 9);
                noseGrad.addColorStop(0, '#555');
                noseGrad.addColorStop(1, '#000');
                ctx.fillStyle = noseGrad;
                ctx.beginPath();
                ctx.ellipse(0, -s * 0.12, 9, 7, 0, 0, Math.PI * 2);
                ctx.fill();

                if (this.state === 'laugh') {
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.arc(-s * 0.15, -s * 0.35, 5, Math.PI, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(s * 0.15, -s * 0.35, 5, Math.PI, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(0, -s * 0.15, s * 0.12, 0.2, Math.PI - 0.2);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(-s * 0.15, -s * 0.35, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(s * 0.15, -s * 0.35, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#3a2a00';
                    ctx.beginPath();
                    ctx.arc(-s * 0.15, -s * 0.35, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(s * 0.15, -s * 0.35, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(-s * 0.13, -s * 0.37, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(s * 0.17, -s * 0.37, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (this.state === 'jump' && this.duckCount > 0) {
                    for (let i = 0; i < this.duckCount; i++) {
                        ctx.save();
                        ctx.translate((i - this.duckCount / 2) * 35 + 17, -s * 0.9);
                        ctx.fillStyle = '#7B3F00';
                        ctx.beginPath();
                        ctx.ellipse(0, 0, 16, 10, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#2d6a2d';
                        ctx.beginPath();
                        ctx.arc(12, -6, 9, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#ff8800';
                        ctx.beginPath();
                        ctx.moveTo(19, -6);
                        ctx.lineTo(24, -4);
                        ctx.lineTo(19, -2);
                        ctx.closePath();
                        ctx.fill();
                        ctx.restore();
                    }
                }
                
                ctx.restore();
            }
        }
        
        // Draw background
        function drawBackground() {
            const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.7);
            skyGrad.addColorStop(0, '#1a6fc4');
            skyGrad.addColorStop(0.5, '#4a9fd4');
            skyGrad.addColorStop(1, '#7ec8e3');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height * 0.7);

            const sunX = 680;
            const sunY = 60;
            const sunGrad = ctx.createRadialGradient(sunX, sunY, 5, sunX, sunY, 50);
            sunGrad.addColorStop(0, '#fffacd');
            sunGrad.addColorStop(0.4, '#ffd700');
            sunGrad.addColorStop(1, 'rgba(255,200,0,0)');
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(sunX, sunY, 50, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255, 220, 50, 0.3)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2 + frameCount * 0.005;
                ctx.beginPath();
                ctx.moveTo(sunX + Math.cos(angle) * 28, sunY + Math.sin(angle) * 28);
                ctx.lineTo(sunX + Math.cos(angle) * 55, sunY + Math.sin(angle) * 55);
                ctx.stroke();
            }
            
            cloudOffset = (cloudOffset + 0.15) % (canvas.width + 200);
            const cloudPositions = [
                { x: 100, y: 55, scale: 1.0 },
                { x: 350, y: 35, scale: 1.3 },
                { x: 600, y: 65, scale: 0.8 }
            ];
            cloudPositions.forEach(cp => {
                const cx = ((cp.x + cloudOffset) % (canvas.width + 200)) - 100;
                drawCloud(cx, cp.y, cp.scale);
            });
            
            const groundGrad = ctx.createLinearGradient(0, canvas.height * 0.7, 0, canvas.height);
            groundGrad.addColorStop(0, '#a0450f');
            groundGrad.addColorStop(1, '#5a2000');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, canvas.height * 0.7, canvas.width, canvas.height * 0.3);

            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 6; i++) {
                const gy = canvas.height * 0.72 + i * 18;
                ctx.beginPath();
                ctx.moveTo(0, gy);
                ctx.lineTo(canvas.width, gy);
                ctx.stroke();
            }
            
            const grassGrad = ctx.createLinearGradient(0, canvas.height * 0.7, 0, canvas.height * 0.7 + 45);
            grassGrad.addColorStop(0, '#3edb50');
            grassGrad.addColorStop(1, '#1a8a28');
            ctx.fillStyle = grassGrad;
            ctx.fillRect(0, canvas.height * 0.7, canvas.width, 45);

            ctx.strokeStyle = '#2ecc40';
            ctx.lineWidth = 2;
            for (let gx = 0; gx < canvas.width; gx += 12) {
                const h = 8 + Math.sin(gx * 0.3 + frameCount * 0.04) * 4;
                ctx.beginPath();
                ctx.moveTo(gx, canvas.height * 0.7 + 2);
                ctx.quadraticCurveTo(gx + 4, canvas.height * 0.7 - h, gx + 6, canvas.height * 0.7 - h * 1.5);
                ctx.stroke();
            }
            
            for (let i = 0; i < 5; i++) {
                const tx = 80 + i * 175;
                const ty = canvas.height * 0.7;
                drawTree(tx, ty);
            }
        }

        function drawCloud(x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            
            const cloudGrad = ctx.createRadialGradient(25, 0, 5, 25, 0, 55);
            cloudGrad.addColorStop(0, 'rgba(255,255,255,0.98)');
            cloudGrad.addColorStop(1, 'rgba(200,225,255,0.7)');
            ctx.fillStyle = cloudGrad;
            ctx.shadowColor = 'rgba(100,150,255,0.2)';
            ctx.shadowBlur = 10;
            
            ctx.beginPath();
            ctx.arc(0, 0, 28, 0, Math.PI * 2);
            ctx.arc(28, -8, 34, 0, Math.PI * 2);
            ctx.arc(58, 0, 28, 0, Math.PI * 2);
            ctx.arc(28, 8, 22, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawTree(x, y) {
            const trunkGrad = ctx.createLinearGradient(x - 12, 0, x + 12, 0);
            trunkGrad.addColorStop(0, '#4a2800');
            trunkGrad.addColorStop(0.5, '#7B4A1A');
            trunkGrad.addColorStop(1, '#4a2800');
            ctx.fillStyle = trunkGrad;
            ctx.beginPath();
            ctx.roundRect(x - 11, y - 65, 22, 65, 3);
            ctx.fill();

            ctx.save();
            ctx.globalAlpha = 0.15;
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.ellipse(x + 15, y - 5, 30, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            const leafColors = ['#0d4d0d', '#1a6b1a', '#2d8a2d', '#1a6b1a'];
            const leafSizes = [42, 36, 30, 24];
            const leafOffsets = [0, -22, -42, -58];
            
            for (let l = 0; l < 4; l++) {
                const leafGrad = ctx.createRadialGradient(x, y + leafOffsets[l] - leafSizes[l] * 0.3, 3, x, y + leafOffsets[l], leafSizes[l]);
                leafGrad.addColorStop(0, lightenColor(leafColors[l], 30));
                leafGrad.addColorStop(1, leafColors[l]);
                ctx.fillStyle = leafGrad;
                ctx.beginPath();
                ctx.arc(x, y + leafOffsets[l], leafSizes[l], 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Draw timer bar
        function drawTimerBar() {
            if (!timerActive) return;
            const pct = Math.max(0, waveTimer / waveTimerMax);
            const barEl = document.getElementById('timerBar');
            barEl.style.width = (pct * 100) + '%';
            if (pct > 0.5) {
                barEl.style.background = 'linear-gradient(to right, #00ff88, #ffd700)';
            } else if (pct > 0.25) {
                barEl.style.background = 'linear-gradient(to right, #ffd700, #ff8800)';
            } else {
                barEl.style.background = 'linear-gradient(to right, #ff4444, #ff0000)';
            }
        }

        // Draw combo display
        function drawComboDisplay() {
            const el = document.getElementById('comboDisplay');
            if (combo >= 2 && comboTimer > 0) {
                el.textContent = `🔥 x${combo} COMBO! (+${combo * 100})`;
                el.style.opacity = Math.min(1, comboTimer / 30);
            } else {
                el.textContent = '';
            }
        }

        // Spawn obstacles
        function spawnObstacle() {
            if (round >= 2) {
                obstacles.push(new Obstacle());
            }
        }
        
        // Spawn a wave of ducks
        function spawnDucks() {
            if (gameState !== 'playing') return;

            const numDucks = Math.min(1 + Math.floor(round / 2), 4);
            // Don't spawn more than needed for the round
            const remaining = ducksPerRound - ducksSpawnedThisRound;
            if (remaining <= 0) return;
            const toSpawn = Math.min(numDucks, remaining);

            for (let i = 0; i < toSpawn; i++) {
                currentDucks.push(new Duck());
            }
            ducksSpawnedThisRound += toSpawn;

            if (round >= 2 && Math.random() < 0.6) {
                spawnObstacle();
            }

            waveTimerMax = Math.max(200, 600 - round * 35);
            waveTimer = waveTimerMax;
            timerActive = true;
            waveInProgress = true;
        }
        
        // Update bullets display
        function updateBulletsDisplay() {
            const display = document.getElementById('bulletsDisplay');
            display.innerHTML = '';
            for (let i = 0; i < maxBullets; i++) {
                const bullet = document.createElement('div');
                bullet.className = 'bullet' + (i >= bullets ? ' used' : '');
                display.appendChild(bullet);
            }
        }
        
        // Update HUD
        function updateHUD() {
            document.getElementById('score').textContent = score;
            document.getElementById('round').textContent = round;
            document.getElementById('hit').textContent = hits;
            document.getElementById('miss').textContent = misses;
            updateBulletsDisplay();
        }
        
        // Draw crosshair
        function drawCrosshair(x, y) {
            const pulse = 1 + Math.sin(frameCount * 0.1) * 0.08;
            const r = 20 * pulse;

            ctx.save();
            ctx.globalAlpha = 0.3;
            ctx.strokeStyle = '#ff4444';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.arc(x, y, r + 4, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            ctx.strokeStyle = '#ff2222';
            ctx.lineWidth = 2.5;
            ctx.shadowColor = '#ff4444';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 50, 50, 0.6)';
            ctx.beginPath();
            ctx.arc(x, y, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#ff2222';
            ctx.lineWidth = 2;
            const gap = r + 5;
            const len = 12;
            ctx.beginPath();
            ctx.moveTo(x, y - gap - len);
            ctx.lineTo(x, y - gap);
            ctx.moveTo(x, y + gap);
            ctx.lineTo(x, y + gap + len);
            ctx.moveTo(x - gap - len, y);
            ctx.lineTo(x - gap, y);
            ctx.moveTo(x + gap, y);
            ctx.lineTo(x + gap + len, y);
            ctx.stroke();

            ctx.shadowBlur = 0;
        }
        
        // Mouse tracking
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;
        
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });
        
        // Muzzle flash
        let muzzleFlash = 0;

        // Shooting
        canvas.addEventListener('click', (e) => {
            if (gameState !== 'playing' || bullets <= 0) return;
            
            // Check if shot blocked by obstacle
            let blocked = false;
            for (let obs of obstacles) {
                if (obs.containsPoint(mouseX, mouseY)) {
                    blocked = true;
                    for (let i = 0; i < 8; i++) {
                        particles.push(new Particle(mouseX, mouseY, '#aaaaaa'));
                    }
                    scorePopups.push(new ScorePopup(mouseX, mouseY - 20, 'BLOCKED!', '#ff8800'));
                    break;
                }
            }

            bullets--;
            muzzleFlash = 8;
            lastShotX = mouseX;
            lastShotY = mouseY;
            updateBulletsDisplay();
            
            if (!blocked) {
                let hit = false;
                for (let duck of currentDucks) {
                    if (duck.containsPoint(mouseX, mouseY) && duck.shoot()) {
                        combo++;
                        comboTimer = comboTimeout;
                        if (combo > bestCombo) bestCombo = combo;
                        const comboBonus = combo >= 2 ? combo * 100 : 0;
                        const points = 500 + comboBonus;
                        score += points;
                        hits++;
                        ducksShot++;
                        hit = true;
                        const popupText = combo >= 2 ? `+${points} 🔥x${combo}` : '+500';
                        scorePopups.push(new ScorePopup(mouseX, mouseY - 20, popupText, combo >= 2 ? '#ff6600' : '#ffd700'));
                        
                        setTimeout(() => {
                            if (dog && gameState === 'playing') dog.show('jump', 1);
                        }, 500);
                        break;
                    }
                }
                
                if (!hit) {
                    // Don't reset combo on miss — only on blocked or timer expiry
                    // Check if out of bullets with alive ducks still present
                    if (bullets === 0 && currentDucks.some(d => d.alive && !d.falling)) {
                        misses++;
                        updateHUD();
                        setTimeout(() => {
                            if (dog && gameState === 'playing') dog.show('laugh');
                        }, 500);
                    }
                }
            } else {
                combo = 0;
                comboTimer = 0;
            }
            
            updateHUD();
        });
        
        // Show round info
        function showRoundInfo(message) {
            const roundInfo = document.getElementById('roundInfo');
            roundInfo.textContent = message;
            roundInfo.style.display = 'block';
            setTimeout(() => {
                roundInfo.style.display = 'none';
            }, 2000);
        }
        
        // End round — called once when all waves for a round are done
        function endRound() {
            if (endingRound) return;
            endingRound = true;
            timerActive = false;
            document.getElementById('timerBar').style.width = '0%';

            if (ducksShot >= ducksPerRound * 0.6) {
                showRoundInfo(`ROUND ${round} COMPLETE!`);
                round++;
                ducksShot = 0;
                ducksSpawnedThisRound = 0;
                obstacles = [];
                bullets = maxBullets;
                updateHUD();
                setTimeout(() => {
                    if (gameState !== 'gameOver') {
                        gameState = 'playing';
                        endingRound = false;
                        waveInProgress = false;
                        spawnDucks();
                    }
                }, 2500);
            } else {
                gameOver();
            }
        }
        
        // Game over
        function gameOver() {
            gameState = 'gameOver';
            timerActive = false;
            endingRound = false;
            document.getElementById('timerBar').style.width = '0%';
            document.getElementById('finalScore').innerHTML = 
                `Final Score: ${score}<br>Rounds Completed: ${round - 1}<br>Best Combo: x${bestCombo}`;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        // Restart game
        function restartGame() {
            gameState = 'playing';
            score = 0;
            round = 1;
            hits = 0;
            misses = 0;
            bullets = maxBullets;
            ducksShot = 0;
            ducksSpawnedThisRound = 0;
            currentDucks = [];
            obstacles = [];
            particles = [];
            scorePopups = [];
            combo = 0;
            comboTimer = 0;
            bestCombo = 0;
            timerActive = false;
            waveInProgress = false;
            endingRound = false;
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('timerBar').style.width = '100%';
            updateHUD();
            spawnDucks();
        }

        // Track if we've already scheduled a wave-end action to prevent double-firing
        let waveEndScheduled = false;
        
        // Game loop
        function gameLoop() {
            frameCount++;

            drawBackground();

            // Update and draw obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update();
                obstacles[i].draw();
                if (obstacles[i].isOffScreen()) {
                    obstacles.splice(i, 1);
                }
            }

            if (muzzleFlash > 0) {
                ctx.save();
                ctx.globalAlpha = muzzleFlash / 8 * 0.18;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
                muzzleFlash--;
            }
            
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            // Update and draw ducks; remove off-screen ones
            for (let i = currentDucks.length - 1; i >= 0; i--) {
                const duck = currentDucks[i];
                duck.update();
                duck.draw();
                if (duck.isOffScreen()) {
                    // If duck escaped (flew off screen without being shot), count as miss
                    if (!duck.falling && duck.alive) {
                        duck.escaped = true;
                        misses++;
                        updateHUD();
                    }
                    currentDucks.splice(i, 1);
                }
            }
            
            if (dog && showDog) {
                dog.update();
                dog.draw();
                dogTimer--;
                if (dogTimer <= 0) {
                    showDog = false;
                }
            }

            for (let i = scorePopups.length - 1; i >= 0; i--) {
                scorePopups[i].update();
                scorePopups[i].draw();
                if (scorePopups[i].life <= 0) scorePopups.splice(i, 1);
            }
            
            drawCrosshair(mouseX, mouseY);

            // Wave timer countdown
            if (gameState === 'playing' && timerActive) {
                waveTimer--;
                if (waveTimer <= 0 && timerActive) {
                    timerActive = false;
                    // Time's up — make alive ducks fall
                    const aliveDucks = currentDucks.filter(d => d.alive && !d.falling);
                    if (aliveDucks.length > 0) {
                        misses += aliveDucks.length;
                        aliveDucks.forEach(d => {
                            d.alive = false;
                            d.falling = true;
                            d.fallSpeed = 0;
                        });
                        combo = 0;
                        comboTimer = 0;
                        updateHUD();
                        setTimeout(() => {
                            if (dog && gameState === 'playing') dog.show('laugh');
                        }, 300);
                    }
                }
                drawTimerBar();
            }

            // Combo timer
            if (comboTimer > 0) {
                comboTimer--;
                if (comboTimer <= 0) {
                    combo = 0;
                }
            }
            drawComboDisplay();

            // Handle out-of-bullets with alive ducks: clear them after a delay
            if (gameState === 'playing' && bullets === 0 && !waveEndScheduled) {
                const aliveDucks = currentDucks.filter(d => d.alive && !d.falling);
                if (aliveDucks.length > 0) {
                    waveEndScheduled = true;
                    setTimeout(() => {
                        waveEndScheduled = false;
                        // Make remaining alive ducks fly away
                        currentDucks.forEach(d => {
                            if (d.alive && !d.falling) {
                                d.alive = false;
                                // Let them fly off screen naturally (don't force fall)
                                d.speed *= 2;
                            }
                        });
                    }, 1000);
                }
            }
            
            // Check if all ducks in current wave are gone
            if (gameState === 'playing' && !endingRound && currentDucks.length === 0 && waveInProgress) {
                waveInProgress = false;
                timerActive = false;

                // Check if we've spawned all ducks for this round
                if (ducksSpawnedThisRound >= ducksPerRound) {
                    // All waves done — end the round
                    endRound();
                } else {
                    // More ducks to spawn — start next wave
                    bullets = maxBullets;
                    updateBulletsDisplay();
                    spawnDucks();
                }
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // Initialize
        dog = new Dog();
        updateHUD();
        spawnDucks();
        
        setTimeout(() => {
            if (dog) dog.show('sniff');
        }, 500);
        
        gameLoop();
    </script>
</body>
</html>
