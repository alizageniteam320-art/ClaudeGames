<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Operation Duststorm – 3D FPS</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Russo+One&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a1612;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Russo One','Trebuchet MS',sans-serif;color:#fff}
canvas{display:block}
.sh{text-shadow:0 2px 0 #000,0 0 8px rgba(0,0,0,.7)}
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:4}
body.playing #hud{display:block}
#tl{position:absolute;left:2.5vmin;top:2vmin}
#tl .lbl{font-size:clamp(9px,2vmin,14px);color:#f2c14e;letter-spacing:2px}
#score{font-size:clamp(20px,5.5vmin,44px);line-height:1}
#tr{position:absolute;right:2.5vmin;top:2vmin;display:flex;align-items:center;gap:2vmin;font-size:clamp(10px,2.2vmin,16px)}
#tr b{color:#f2c14e}
#mute{pointer-events:auto;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;font-size:clamp(14px,3vmin,22px);width:clamp(32px,6vmin,46px);height:clamp(32px,6vmin,46px);cursor:pointer}
#cross{position:absolute;left:50%;top:50%;--g:10px}
#cross i{position:absolute;background:#fff;box-shadow:0 0 2px #000;transition:opacity .1s}
#cross .t,#cross .b{width:2px;height:9px;left:-1px}
#cross .l,#cross .r{height:2px;width:9px;top:-1px}
#cross .t{top:calc(-1*var(--g) - 9px)}#cross .b{top:var(--g)}
#cross .l{left:calc(-1*var(--g) - 9px)}#cross .r{left:var(--g)}
#cross .d{width:3px;height:3px;left:-1.5px;top:-1.5px;border-radius:50%;opacity:.8}
#hitm{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0}
#hitm i{position:absolute;width:2px;height:10px;background:#fff;box-shadow:0 0 3px #000}
#hitm i:nth-child(1){left:-9px;top:-17px;transform:rotate(-45deg)}
#hitm i:nth-child(2){left:7px;top:-17px;transform:rotate(45deg)}
#hitm i:nth-child(3){left:-9px;top:7px;transform:rotate(45deg)}
#hitm i:nth-child(4){left:7px;top:7px;transform:rotate(-45deg)}
#hitm.kill i{background:#ff3b2f}
#hpwrap{position:absolute;left:2.5vmin;bottom:2.5vmin;width:clamp(110px,28vmin,240px)}
#hpwrap .lbl{font-size:clamp(9px,1.8vmin,13px);color:#f2c14e;letter-spacing:2px;margin-bottom:3px}
#hp{height:clamp(8px,1.6vmin,14px);background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.6);border-radius:3px;overflow:hidden;transform:skewX(-15deg)}
#hpfill{height:100%;width:100%;background:linear-gradient(#9fe36b,#4f9a2f);transition:width .15s}
#ammo{position:absolute;right:3vmin;bottom:2.5vmin;text-align:right}
#mag{font-size:clamp(26px,7vmin,58px);line-height:1}
#ammo small{font-size:clamp(12px,3vmin,24px);color:#ddd;margin-left:4px}
#rl{font-size:clamp(9px,2vmin,14px);color:#f2c14e;letter-spacing:2px;opacity:0}
#rl.on{opacity:1;animation:blink .4s infinite alternate}
@keyframes blink{to{opacity:.3}}
body.touch #ammo{right:auto;left:50%;transform:translateX(-50%);top:1.5vmin;bottom:auto;text-align:center}
body.touch #mag{font-size:clamp(20px,5vmin,40px)}
#banner{position:absolute;left:0;right:0;top:22%;text-align:center;opacity:0}
#banner b{display:block;font-family:'Black Ops One','Impact',sans-serif;font-size:clamp(28px,8vmin,72px);color:#f2c14e;text-shadow:0 4px 0 #5a300c,0 0 24px rgba(242,140,40,.6);font-weight:normal}
#banner span{font-size:clamp(11px,2.6vmin,20px);letter-spacing:4px}
#banner.show{animation:ban 2.6s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.6)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
#popups{position:absolute;left:50%;top:56%;width:0}
.pop{position:absolute;left:0;transform:translateX(-50%);white-space:nowrap;font-size:clamp(14px,3.4vmin,26px);color:#fff;text-shadow:0 2px 0 #000;animation:pop 1s ease-out forwards}
.pop.hs{color:#ff5a3c}.pop.am{color:#9fe36b}.pop.gd{color:#f2c14e}
@keyframes pop{0%{opacity:0;transform:translate(-50%,0) scale(.5)}15%{opacity:1;transform:translate(-50%,-6px) scale(1.15)}30%{transform:translate(-50%,-10px) scale(1)}100%{opacity:0;transform:translate(-50%,-50px)}}
#dmgdir{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0}
#dmgdir div{position:absolute;left:-40px;top:-150px;width:80px;height:26px;border-radius:50% 50% 0 0;border-top:6px solid #ff2a1a;filter:drop-shadow(0 0 6px #f00)}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(150,0,0,.9) 100%);opacity:0;z-index:3}
#touch{position:fixed;inset:0;display:none;z-index:5}
body.touch.playing #touch{display:block}
.tb{position:absolute;border-radius:50%;background:rgba(20,20,20,.4);border:2px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-size:clamp(9px,2.4vmin,15px);color:#fff;text-shadow:0 1px 0 #000}
.tb.on{background:rgba(242,193,78,.45)}
#bFire{right:4vmin;bottom:16vmin;width:19vmin;height:19vmin;background:rgba(190,50,40,.45);font-size:clamp(11px,3vmin,18px)}
#bAds{right:25vmin;bottom:27vmin;width:12vmin;height:12vmin}
#bRel{right:25vmin;bottom:12vmin;width:12vmin;height:12vmin}
#bJump{right:8vmin;bottom:3vmin;width:11vmin;height:11vmin}
#joyB{position:absolute;width:22vmin;height:22vmin;margin:-11vmin 0 0 -11vmin;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(0,0,0,.25);display:none}
#joyK{position:absolute;left:50%;top:50%;width:9vmin;height:9vmin;margin:-4.5vmin 0 0 -4.5vmin;border-radius:50%;background:rgba(255,255,255,.55)}
#screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(50,35,20,.5),rgba(10,8,6,.93));text-align:center;z-index:20;padding:3vmin;box-sizing:border-box}
#screen.hide{display:none}
h1{font-family:'Black Ops One','Impact',sans-serif;font-weight:normal;font-size:clamp(28px,9vmin,92px);color:#f2c14e;margin:0;letter-spacing:2px;line-height:1;text-shadow:0 4px 0 #6b3d12,0 0 30px rgba(242,140,40,.5)}
h2{margin:1vmin 0 3vmin;font-size:clamp(11px,2.8vmin,22px);letter-spacing:6px;color:#e8d6b8}
.ctr{font-size:clamp(10px,2.2vmin,16px);color:#d8c8ac;line-height:1.7;margin-bottom:3vmin}
.ctr b{color:#f2c14e}
.stat{font-size:clamp(14px,3.4vmin,28px);margin:.6vmin 0}
.stat b{color:#f2c14e}
.btn{margin-top:2vmin;padding:clamp(10px,2vmin,16px) clamp(26px,6vmin,56px);font-family:'Black Ops One','Impact',sans-serif;font-size:clamp(18px,4.2vmin,34px);color:#1a1612;background:linear-gradient(#ffd56b,#e09a2a);border:3px solid #fff3d0;border-radius:6px;cursor:pointer;box-shadow:0 6px 0 #6b3d12,0 0 30px rgba(242,160,60,.45);transition:transform .1s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #6b3d12}
</style>
</head>
<body>
<div id="hud">
  <div id="tl" class="sh"><div class="lbl">SCORE</div><div id="score">0</div><div class="lbl">WAVE <span id="wave">1</span> · HOSTILES <span id="left">0</span></div></div>
  <div id="tr" class="sh"><span>BEST <b id="best">0</b></span><button id="mute">🔊</button></div>
  <div id="cross"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="d"></i></div>
  <div id="hitm"><i></i><i></i><i></i><i></i></div>
  <div id="dmgdir"><div></div></div>
  <div id="hpwrap" class="sh"><div class="lbl">HEALTH</div><div id="hp"><div id="hpfill"></div></div></div>
  <div id="ammo" class="sh"><span id="mag">30</span><small>/ <span id="res">120</span></small><div id="rl">RELOADING</div></div>
  <div id="banner" class="sh"></div>
  <div id="popups"></div>
</div>
<div id="vig"></div>
<div id="touch">
  <div id="joyB"><div id="joyK"></div></div>
  <div class="tb" id="bFire" data-btn="fire">FIRE</div>
  <div class="tb" id="bAds" data-btn="ads">AIM</div>
  <div class="tb" id="bRel" data-btn="rel">R</div>
  <div class="tb" id="bJump" data-btn="jump">JUMP</div>
</div>
<div id="screen"></div>
