<script>
// Polyfill for localStorage and sessionStorage to prevent SecurityError in data: iframes
(function() {
    try {
        window.localStorage;
        window.sessionStorage;
    } catch (e) {
        // Storage access is blocked, implement in-memory polyfill
        const createStorage = () => {
            let store = {};
            return {
                getItem: (key) => store[key] || null,
                setItem: (key, value) => { store[key] = String(value); },
                removeItem: (key) => { delete store[key]; },
                clear: () => { store = {}; },
                key: (index) => Object.keys(store)[index] || null,
                get length() { return Object.keys(store).length; }
            };
        };
        
        try {
            Object.defineProperty(window, 'localStorage', { value: createStorage() });
            Object.defineProperty(window, 'sessionStorage', { value: createStorage() });
        } catch (defineError) {
             console.warn('Unable to define global storage properties:', defineError);
        }
    }
})();
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Duck Hunt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to bottom, #0a0a2e 0%, #1a1a5e 40%, #2d5a27 100%);
            font-family: 'Courier New', monospace;
            cursor: none;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            display: block;
            margin: 0 auto;
            border: 4px solid #8B4513;
            box-shadow: 0 0 40px rgba(100, 200, 255, 0.4), 0 0 80px rgba(50, 100, 200, 0.2);
            border-radius: 4px;
        }

        .ui {
            position: absolute;
            top: 15px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(100, 220, 255, 0.9), 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .ui div {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(100, 220, 255, 0.5);
            border-radius: 8px;
            padding: 6px 16px;
            backdrop-filter: blur(4px);
            letter-spacing: 1px;
        }

        .ui span {
            color: #7df9ff;
        }

        .crosshair {
            position: fixed;
            width: 44px;
            height: 44px;
            pointer-events: none;
            z-index: 100;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 4px rgba(255, 80, 80, 0.8));
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(10,10,40,0.97) 0%, rgba(20,20,80,0.97) 100%);
            color: white;
            padding: 40px 50px;
            border-radius: 20px;
            text-align: center;
            font-size: 24px;
            display: none;
            z-index: 200;
            border: 2px solid rgba(100, 220, 255, 0.6);
            box-shadow: 0 0 40px rgba(100, 200, 255, 0.3), inset 0 0 40px rgba(0,0,50,0.5);
        }

        .game-over h2 {
            font-size: 42px;
            color: #ff4444;
            text-shadow: 0 0 20px rgba(255, 50, 50, 0.8);
            margin-bottom: 20px;
            letter-spacing: 4px;
            animation: pulse 1s infinite alternate;
        }

        .game-over p {
            margin: 10px 0;
            color: #aad4ff;
            font-size: 20px;
        }

        .game-over p span {
            color: #7df9ff;
            font-weight: bold;
        }

        @keyframes pulse {
            from { text-shadow: 0 0 10px rgba(255, 50, 50, 0.6); }
            to   { text-shadow: 0 0 30px rgba(255, 50, 50, 1), 0 0 60px rgba(255, 100, 100, 0.5); }
        }

        .restart-btn {
            background: linear-gradient(135deg, #1a7a2e, #2ecc71);
            color: white;
            border: 2px solid #2ecc71;
            padding: 14px 36px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 24px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 2px;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.4);
        }

        .restart-btn:hover {
            background: linear-gradient(135deg, #2ecc71, #1a7a2e);
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.8);
            transform: scale(1.05);
        }

        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle linear infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.4); }
        }
    </style>
</head>

        // Crosshair follow mouse - use fixed positioning

    <script>
    // ─── Core Game Logic (self-contained, no external JS dependency) ───────────
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const W = canvas.width;
        const H = canvas.height;

        // UI elements
        const scoreEl   = document.getElementById('score');
        const roundEl   = document.getElementById('round');
        const missesEl  = document.getElementById('misses');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');
        const finalRoundEl = document.getElementById('finalRound');

        // Game state
        let score = 0;
        let round = 1;
        let misses = 0;
        const MAX_MISSES = 10;
        let gameRunning = true;
        let animFrameId = null;

        // Duck settings
        const DUCK_SIZE = 48;
        const BASE_SPEED = 2.5;
        let ducks = [];
        let particles = [];
        let scorePopups = [];

        // Audio context for sound effects
        let audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
            }
            return audioCtx;
        }

        function playShot() {
            const ac = getAudioCtx();
            if (!ac) return;
            try {
                const buf = ac.createBuffer(1, ac.sampleRate * 0.15, ac.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < data.length; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ac.sampleRate * 0.04));
                }
                const src = ac.createBufferSource();
                src.buffer = buf;
                const gain = ac.createGain();
                gain.gain.setValueAtTime(0.4, ac.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.15);
                src.connect(gain);
                gain.connect(ac.destination);
                src.start();
            } catch(e) {}
        }

        function playHit() {
            const ac = getAudioCtx();
            if (!ac) return;
            try {
                const osc = ac.createOscillator();
                const gain = ac.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, ac.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, ac.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, ac.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ac.destination);
                osc.start();
                osc.stop(ac.currentTime + 0.3);
            } catch(e) {}
        }

        // Duck colors per round
        const DUCK_COLORS = [
            { body: '#4CAF50', wing: '#2E7D32', beak: '#FFC107', eye: '#fff' },
            { body: '#2196F3', wing: '#1565C0', beak: '#FF9800', eye: '#fff' },
            { body: '#9C27B0', wing: '#6A1B9A', beak: '#E91E63', eye: '#fff' },
            { body: '#FF5722', wing: '#BF360C', beak: '#FFEB3B', eye: '#fff' },
            { body: '#00BCD4', wing: '#006064', beak: '#FF5722', eye: '#fff' },
        ];

        function getDuckColor() {
            return DUCK_COLORS[(round - 1) % DUCK_COLORS.length];
        }

        function spawnDuck() {
            const speed = BASE_SPEED + (round - 1) * 0.6;
            const fromLeft = Math.random() < 0.5;
            const x = fromLeft ? -DUCK_SIZE : W + DUCK_SIZE;
            const y = Math.random() * (H * 0.65) + 60;
            const vx = fromLeft ? speed : -speed;
            const vy = (Math.random() - 0.5) * speed * 0.8;
            ducks.push({
                x, y, vx, vy,
                wingAngle: 0,
                wingDir: 1,
                alive: true,
                falling: false,
                fallVy: 0,
                color: getDuckColor(),
                wobble: Math.random() * Math.PI * 2,
                size: DUCK_SIZE
            });
        }

        function spawnParticles(x, y, color) {
            for (let i = 0; i < 18; i++) {
                const angle = (Math.PI * 2 / 18) * i + Math.random() * 0.3;
                const speed = Math.random() * 5 + 2;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    decay: Math.random() * 0.04 + 0.02,
                    size: Math.random() * 6 + 2,
                    color: color
                });
            }
        }

        function addScorePopup(x, y, text) {
            scorePopups.push({ x, y, text, life: 1.0, vy: -1.5 });
        }

        // ── Drawing helpers ──────────────────────────────────────────────────

        function drawBackground() {
            // Sky gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.72);
            skyGrad.addColorStop(0, '#0a0a2e');
            skyGrad.addColorStop(0.5, '#1a1a5e');
            skyGrad.addColorStop(1, '#1a3a6e');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, W, H * 0.72);

            // Moon
            ctx.save();
            ctx.shadowColor = 'rgba(200,220,255,0.8)';
            ctx.shadowBlur = 30;
            ctx.fillStyle = '#e8e8d0';
            ctx.beginPath();
            ctx.arc(W * 0.85, H * 0.12, 38, 0, Math.PI * 2);
            ctx.fill();
            // Moon craters
            ctx.fillStyle = 'rgba(0,0,0,0.08)';
            ctx.beginPath(); ctx.arc(W * 0.85 + 10, H * 0.12 + 8, 8, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(W * 0.85 - 12, H * 0.12 - 5, 5, 0, Math.PI * 2); ctx.fill();
            ctx.restore();

            // Ground
            const groundGrad = ctx.createLinearGradient(0, H * 0.72, 0, H);
            groundGrad.addColorStop(0, '#2d5a27');
            groundGrad.addColorStop(0.3, '#1e3d1a');
            groundGrad.addColorStop(1, '#0f1f0d');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, H * 0.72, W, H * 0.28);

            // Ground detail line
            ctx.strokeStyle = 'rgba(100,200,80,0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, H * 0.72);
            ctx.lineTo(W, H * 0.72);
            ctx.stroke();

            // Bushes
            drawBushes();

            // Clouds
            drawClouds();
        }

        function drawBushes() {
            const bushPositions = [80, 220, 420, 600, 780, 950, 1100];
            bushPositions.forEach((bx, i) => {
                const by = H * 0.72;
                const bh = 30 + (i % 3) * 15;
                const bw = 60 + (i % 4) * 20;
                ctx.save();
                ctx.fillStyle = `hsl(${120 + (i * 15) % 40}, 50%, ${20 + (i % 3) * 8}%)`;
                ctx.beginPath();
                ctx.ellipse(bx, by, bw / 2, bh / 2, 0, Math.PI, 0);
                ctx.fill();
                ctx.fillStyle = `hsl(${125 + (i * 15) % 40}, 55%, ${25 + (i % 3) * 8}%)`;
                ctx.beginPath();
                ctx.ellipse(bx - bw * 0.2, by, bw * 0.35, bh * 0.45, 0, Math.PI, 0);
                ctx.fill();
                ctx.restore();
            });
        }

        let cloudOffset = 0;
        function drawClouds() {
            cloudOffset += 0.15;
            const clouds = [
                { x: 150, y: 80, scale: 1.0 },
                { x: 400, y: 50, scale: 0.7 },
                { x: 700, y: 100, scale: 1.2 },
                { x: 1000, y: 60, scale: 0.9 },
            ];
            clouds.forEach((c, i) => {
                const cx = ((c.x + cloudOffset * (0.3 + i * 0.1)) % (W + 200)) - 100;
                ctx.save();
                ctx.globalAlpha = 0.25;
                ctx.fillStyle = '#aac8ff';
                const s = c.scale;
                ctx.beginPath();
                ctx.ellipse(cx, c.y, 60 * s, 25 * s, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(cx - 30 * s, c.y + 5 * s, 35 * s, 18 * s, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(cx + 30 * s, c.y + 5 * s, 35 * s, 18 * s, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function drawDuck(duck) {
            ctx.save();
            ctx.translate(duck.x, duck.y);

            const facingLeft = duck.vx < 0;
            if (facingLeft) ctx.scale(-1, 1);

            const wobble = Math.sin(duck.wobble) * 3;
            ctx.translate(0, wobble);

            const col = duck.color;
            const s = duck.size / 48;

            // Shadow
            ctx.save();
            ctx.globalAlpha = 0.18;
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.ellipse(0, 26 * s, 22 * s, 7 * s, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Wing (back)
            ctx.save();
            ctx.rotate(duck.wingAngle * 0.4);
            ctx.fillStyle = col.wing;
            ctx.beginPath();
            ctx.ellipse(-5 * s, 4 * s, 18 * s, 10 * s, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Body
            ctx.fillStyle = col.body;
            ctx.beginPath();
            ctx.ellipse(0, 5 * s, 20 * s, 14 * s, 0, 0, Math.PI * 2);
            ctx.fill();

            // Head
            ctx.fillStyle = col.body;
            ctx.beginPath();
            ctx.arc(14 * s, -8 * s, 11 * s, 0, Math.PI * 2);
            ctx.fill();

            // Eye
            ctx.fillStyle = '#222';
            ctx.beginPath();
            ctx.arc(18 * s, -10 * s, 3 * s, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = col.eye;
            ctx.beginPath();
            ctx.arc(19 * s, -11 * s, 1.2 * s, 0, Math.PI * 2);
            ctx.fill();

            // Beak
            ctx.fillStyle = col.beak;
            ctx.beginPath();
            ctx.moveTo(22 * s, -8 * s);
            ctx.lineTo(32 * s, -6 * s);
            ctx.lineTo(22 * s, -4 * s);
            ctx.closePath();
            ctx.fill();

            // Wing (front)
            ctx.save();
            ctx.rotate(-duck.wingAngle * 0.5);
            ctx.fillStyle = col.wing;
            ctx.globalAlpha = 0.85;
            ctx.beginPath();
            ctx.ellipse(2 * s, 2 * s, 14 * s, 8 * s, -0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Tail feathers
            ctx.fillStyle = col.wing;
            ctx.beginPath();
            ctx.moveTo(-18 * s, 2 * s);
            ctx.lineTo(-28 * s, -4 * s);
            ctx.lineTo(-26 * s, 8 * s);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color.body || p.color || '#ff4444';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function drawScorePopups() {
            scorePopups.forEach(sp => {
                ctx.save();
                ctx.globalAlpha = sp.life;
                ctx.font = `bold ${Math.floor(22 * sp.life + 10)}px 'Courier New'`;
                ctx.fillStyle = '#7df9ff';
                ctx.strokeStyle = 'rgba(0,0,50,0.8)';
                ctx.lineWidth = 3;
                ctx.strokeText(sp.text, sp.x, sp.y);
                ctx.fillText(sp.text, sp.x, sp.y);
                ctx.restore();
            });
        }

        function drawHUD() {
            // Round indicator
            ctx.save();
            ctx.font = 'bold 16px Courier New';
            ctx.fillStyle = 'rgba(100,220,255,0.6)';
            ctx.fillText(`DUCKS: ${ducks.length}`, 20, H - 20);
            ctx.restore();
        }

        // ── Update logic ─────────────────────────────────────────────────────

        let lastSpawn = 0;
        let spawnInterval = 2200;

        function getMaxDucks() {
            return Math.min(2 + Math.floor(round / 2), 6);
        }

        function update(timestamp) {
            // Spawn ducks
            if (timestamp - lastSpawn > spawnInterval && ducks.length < getMaxDucks()) {
                spawnDuck();
                lastSpawn = timestamp;
                spawnInterval = Math.max(800, 2200 - round * 120);
            }

            // Update ducks
            ducks.forEach(duck => {
                if (!duck.alive) return;

                if (duck.falling) {
                    duck.fallVy += 0.4;
                    duck.y += duck.fallVy;
                    duck.x += duck.vx * 0.3;
                    duck.wobble += 0.2;
                    if (duck.y > H + 60) {
                        duck.alive = false;
                    }
                    return;
                }

                duck.x += duck.vx;
                duck.y += duck.vy;
                duck.wobble += 0.08;

                // Wing flap
                duck.wingAngle += 0.18 * duck.wingDir;
                if (Math.abs(duck.wingAngle) > 0.6) duck.wingDir *= -1;

                // Bounce off top/bottom sky area
                if (duck.y < 40) { duck.vy = Math.abs(duck.vy); }
                if (duck.y > H * 0.68) { duck.vy = -Math.abs(duck.vy); }

                // Duck flew off screen — count as miss
                if (duck.x < -DUCK_SIZE * 2 || duck.x > W + DUCK_SIZE * 2) {
                    duck.alive = false;
                    misses++;
                    missesEl.textContent = misses;
                    if (misses >= MAX_MISSES) {
                        endGame();
                    }
                }
            });

            // Remove dead ducks
            ducks = ducks.filter(d => d.alive);

            // Update particles
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.15;
                p.life -= p.decay;
            });
            particles = particles.filter(p => p.life > 0);

            // Update score popups
            scorePopups.forEach(sp => {
                sp.y += sp.vy;
                sp.life -= 0.022;
            });
            scorePopups = scorePopups.filter(sp => sp.life > 0);

            // Round progression: every 10 kills advance round
            const newRound = 1 + Math.floor(score / 10);
            if (newRound > round) {
                round = newRound;
                roundEl.textContent = round;
            }
        }

        // ── Render ───────────────────────────────────────────────────────────

        function render() {
            ctx.clearRect(0, 0, W, H);
            drawBackground();
            ducks.forEach(duck => drawDuck(duck));
            drawParticles();
            drawScorePopups();
            drawHUD();
        }

        // ── Game loop ────────────────────────────────────────────────────────

        function gameLoop(timestamp) {
            if (!gameRunning) return;
            update(timestamp);
            render();
            animFrameId = requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameRunning = false;
            if (animFrameId) cancelAnimationFrame(animFrameId);
            finalScoreEl.textContent = score;
            finalRoundEl.textContent = round;
            gameOverEl.style.display = 'block';
        }

        // ── Input ────────────────────────────────────────────────────────────

        canvas.addEventListener('click', (e) => {
            if (!gameRunning) return;

            playShot();

            const rect = canvas.getBoundingClientRect();
            const scaleX = W / rect.width;
            const scaleY = H / rect.height;
            const mx = (e.clientX - rect.left) * scaleX;
            const my = (e.clientY - rect.top) * scaleY;

            let hit = false;
            for (let i = ducks.length - 1; i >= 0; i--) {
                const duck = ducks[i];
                if (!duck.alive || duck.falling) continue;
                const dx = mx - duck.x;
                const dy = my - duck.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < duck.size) {
                    // Hit!
                    hit = true;
                    duck.falling = true;
                    duck.fallVy = -3;
                    const pts = Math.max(1, Math.floor(10 + (round - 1) * 2 - dist * 0.1));
                    score += pts;
                    scoreEl.textContent = score;
                    spawnParticles(duck.x, duck.y, duck.color);
                    addScorePopup(duck.x - 20, duck.y - 20, `+${pts}`);
                    playHit();
                    break;
                }
            }

            // Miss shot (no duck hit)
            if (!hit) {
                // Visual miss flash
                ctx.save();
                ctx.fillStyle = 'rgba(255,255,255,0.08)';
                ctx.beginPath();
                ctx.arc(mx, my, 30, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        });

        // ── Restart ──────────────────────────────────────────────────────────

        window.restartGame = function() {
            score = 0;
            round = 1;
            misses = 0;
            ducks = [];
            particles = [];
            scorePopups = [];
            lastSpawn = 0;
            spawnInterval = 2200;
            gameRunning = true;
            scoreEl.textContent = '0';
            roundEl.textContent = '1';
            missesEl.textContent = '0';
            gameOverEl.style.display = 'none';
            requestAnimationFrame(gameLoop);
        };

        // ── Start ────────────────────────────────────────────────────────────
        requestAnimationFrame(gameLoop);

    })();
    </script>

    <script>
        // Post-load canvas enhancement: vignette + scanlines overlay
        window.addEventListener('load', () => {
            const canvas = document.getElementById('gameCanvas');
            if (!canvas) return;

            const overlay = document.createElement('canvas');
            overlay.width = canvas.width;
            overlay.height = canvas.height;
            overlay.style.cssText = `
                position: fixed;
                pointer-events: none;
                z-index: 4;
                border-radius: 4px;
            `;

            function positionOverlay() {
                const rect = canvas.getBoundingClientRect();
                overlay.style.left = rect.left + 'px';
                overlay.style.top = rect.top + 'px';
                overlay.style.width = rect.width + 'px';
                overlay.style.height = rect.height + 'px';
            }

            document.body.appendChild(overlay);
            positionOverlay();
            window.addEventListener('resize', positionOverlay);

            const octx = overlay.getContext('2d');

            // Pre-render static scanlines once
            const scanCanvas = document.createElement('canvas');
            scanCanvas.width = overlay.width;
            scanCanvas.height = overlay.height;
            const sctx = scanCanvas.getContext('2d');
            sctx.fillStyle = 'rgba(0,0,0,0.04)';
            for (let y = 0; y < overlay.height; y += 4) {
                sctx.fillRect(0, y, overlay.width, 2);
            }

            // Pre-render vignette once
            const vigCanvas = document.createElement('canvas');
            vigCanvas.width = overlay.width;
            vigCanvas.height = overlay.height;
            const vctx = vigCanvas.getContext('2d');
            const vignette = vctx.createRadialGradient(
                overlay.width / 2, overlay.height / 2, overlay.height * 0.3,
                overlay.width / 2, overlay.height / 2, overlay.height * 0.85
            );
            vignette.addColorStop(0, 'rgba(0,0,0,0)');
            vignette.addColorStop(1, 'rgba(0,0,20,0.55)');
            vctx.fillStyle = vignette;
            vctx.fillRect(0, 0, overlay.width, overlay.height);

            function drawOverlay() {
                octx.clearRect(0, 0, overlay.width, overlay.height);
                octx.drawImage(vigCanvas, 0, 0);
                octx.drawImage(scanCanvas, 0, 0);
                requestAnimationFrame(drawOverlay);
            }

            drawOverlay();
        });
    </script>
</body>
