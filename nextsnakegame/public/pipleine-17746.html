<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipe Connect</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f0f4f8;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #gameContainer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  #header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 700px;
    padding: 5px 10px;
  }
  #title {
    font-size: 28px;
    font-weight: bold;
    color: #2c3e50;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
  }
  #timerBox {
    background: #1a1a2e;
    color: #00ff88;
    font-family: 'Courier New', monospace;
    font-size: 28px;
    font-weight: bold;
    padding: 8px 18px;
    border-radius: 8px;
    border: 2px solid #333;
    letter-spacing: 2px;
  }
  #controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  .diffBtn {
    padding: 10px 22px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 3px 6px rgba(0,0,0,0.2);
  }
  .diffBtn:hover { transform: translateY(-2px); box-shadow: 0 5px 10px rgba(0,0,0,0.3); }
  .diffBtn:active { transform: translateY(0); }
  #btnEasy { background: #2ecc71; color: white; }
  #btnMedium { background: #f39c12; color: white; }
  #btnHard { background: #e74c3c; color: white; }
  #btnCheck {
    background: #3498db;
    color: white;
    padding: 10px 22px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 3px 6px rgba(0,0,0,0.2);
  }
  #btnCheck:hover { background: #2980b9; transform: translateY(-2px); }
  #info {
    font-size: 14px;
    color: #555;
    text-align: center;
  }
  #canvasWrap {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
  }
  canvas {
    display: block;
    background: #ffffff;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: none;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.6);
    z-index: 10;
    flex-direction: column;
    gap: 15px;
  }
  #overlay.show { display: flex; }
  #overlayText {
    font-size: 42px;
    font-weight: bold;
    color: white;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
  }
  #overlayBtn {
    padding: 12px 30px;
    font-size: 18px;
    font-weight: bold;
    background: #2ecc71;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  #overlayBtn:hover { background: #27ae60; }
  #rotations {
    font-size: 16px;
    color: #2c3e50;
    font-weight: bold;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <div id="header">
    <div id="title">🔧 Pipe Connect</div>
    <div id="timerBox">02:00</div>
  </div>
  <div id="controls">
    <button class="diffBtn" id="btnEasy" onclick="startGame(5)">EASY 5×5</button>
    <button class="diffBtn" id="btnMedium" onclick="startGame(7)">MEDIUM 7×7</button>
    <button class="diffBtn" id="btnHard" onclick="startGame(10)">HARD 10×10</button>
    <button id="btnCheck" onclick="checkFlow()">💧 Check Flow</button>
    <div id="rotations">Rotations: 0</div>
  </div>
  <div id="info">Click a pipe to rotate it 90°. Connect water from <b>🔵 Source</b> (top-left) to <b>🟡 Drain</b> (bottom-right)!</div>
  <div id="canvasWrap">
    <canvas id="gameCanvas"></canvas>
    <div id="overlay">
      <div id="overlayText"></div>
      <button id="overlayBtn" onclick="restartCurrent()">Play Again</button>
    </div>
  </div>
</div>
