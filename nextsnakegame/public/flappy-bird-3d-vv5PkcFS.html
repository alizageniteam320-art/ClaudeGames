<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #8fd3ff; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { font-family: 'Fredoka', 'Trebuchet MS', sans-serif; }
  canvas { display: block; }
  .t { font-family: 'Lilita One', 'Fredoka', 'Trebuchet MS', sans-serif; color: #fff;
       text-shadow: 0 3px 0 #1d3b57, 3px 0 0 #1d3b57, -3px 0 0 #1d3b57, 0 -3px 0 #1d3b57, 0 6px 10px rgba(0,0,0,.35); }
  #hud { position: fixed; top: max(10px, 2vh); left: 0; right: 0; text-align: center; pointer-events: none; z-index: 5; }
  #score { font-size: clamp(42px, 11vmin, 90px); line-height: 1; transition: transform .15s; }
  #score.bump { transform: scale(1.3); }
  #mute { position: fixed; top: 10px; right: 10px; z-index: 20; width: 44px; height: 44px; border-radius: 50%;
          border: 3px solid #1d3b57; background: #ffd23f; font-size: 20px; cursor: pointer; box-shadow: 0 4px 0 #1d3b57; }
  #mute:active { transform: translateY(3px); box-shadow: 0 1px 0 #1d3b57; }
  .panel { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           z-index: 10; gap: clamp(6px, 2vmin, 16px); transition: opacity .35s ease, transform .35s cubic-bezier(.2,1.4,.4,1); }
  .panel.hidden { opacity: 0; pointer-events: none; transform: scale(.85); }
  #title h1 { margin: 0; font-size: clamp(44px, 14vmin, 120px); letter-spacing: 2px; animation: bob 2s ease-in-out infinite; }
  #title h1 span { color: #ffd23f; }
  .hint { font-size: clamp(14px, 3.6vmin, 24px); color: #1d3b57; background: rgba(255,255,255,.75); padding: 6px 16px; border-radius: 20px; font-weight: 700; text-align: center; max-width: 90vw; }
  .start { font-size: clamp(20px, 6vmin, 40px); animation: pulse 1.1s ease-in-out infinite; }
  .card { background: linear-gradient(#fff6d8, #ffe39a); border: 4px solid #1d3b57; border-radius: 22px; padding: clamp(12px, 3vmin, 26px) clamp(20px, 6vmin, 50px);
          text-align: center; box-shadow: 0 8px 0 #1d3b57, 0 14px 30px rgba(0,0,0,.3); color: #1d3b57; min-width: min(70vw, 260px); }
  .card .lbl { font-size: clamp(13px, 3vmin, 18px); font-weight: 700; opacity: .75; }
  .card .val { font-family: 'Lilita One', 'Fredoka', sans-serif; font-size: clamp(30px, 9vmin, 60px); line-height: 1.05; }
  #newbest { display: inline-block; background: #ff5a5f; color: #fff; padding: 2px 10px; border-radius: 10px; font-weight: 700; font-size: clamp(12px, 2.8vmin, 16px); margin-top: 4px; }
  #medal { font-size: clamp(26px, 8vmin, 50px); line-height: 1.1; }
  .btn { font-family: 'Lilita One', 'Fredoka', sans-serif; font-size: clamp(20px, 5.5vmin, 34px); color: #fff; background: linear-gradient(#5fd96a, #2fa83c);
         border: 4px solid #1d3b57; border-radius: 18px; padding: 8px 30px; cursor: pointer; box-shadow: 0 6px 0 #1d3b57; text-shadow: 0 2px 0 #1d3b57; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1d3b57; }
  #over h2 { margin: 0; font-size: clamp(36px, 11vmin, 84px); color: #ffb03f; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 8; }
  .pop { position: fixed; z-index: 6; pointer-events: none; font-size: clamp(22px, 6vmin, 40px); color: #ffd23f; transform: translate(-50%, -50%); animation: popup .8s ease-out forwards; }
  @keyframes popup { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.5); } 20% { opacity: 1; transform: translate(-50%,-90%) scale(1.2); } 100% { opacity: 0; transform: translate(-50%,-220%) scale(1); } }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: .8; } }
</style>
</head>
<body>
<div id="hud"><div id="score" class="t">0</div></div>
<button id="mute" title="Mute">🔊</button>
<div id="flash"></div>
<div id="title" class="panel">
  <h1 class="t">FLAPPY <span>3D</span></h1>
  <div class="hint">Tap / Click / Space to flap • Fly through the gaps!</div>
  <div class="start t">Tap or Press to Start</div>
  <div class="hint" id="titleBest">Best: 0</div>
</div>
<div id="over" class="panel hidden">
  <h2 class="t">GAME OVER</h2>
  <div class="card">
    <div id="medal"></div>
    <div class="lbl">SCORE</div><div class="val" id="finalScore">0</div>
    <div class="lbl">BEST</div><div class="val" id="finalBest">0</div>
    <div id="newbest" style="display:none">NEW BEST!</div>
  </div>
  <button class="btn" id="again">PLAY AGAIN</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
