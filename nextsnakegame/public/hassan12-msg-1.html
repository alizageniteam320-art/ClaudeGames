<script>
// Polyfill for localStorage and sessionStorage to prevent SecurityError in data: iframes
(function() {
    try {
        window.localStorage;
        window.sessionStorage;
    } catch (e) {
        // Storage access is blocked, implement in-memory polyfill
        const createStorage = () => {
            let store = {};
            return {
                getItem: (key) => store[key] || null,
                setItem: (key, value) => { store[key] = String(value); },
                removeItem: (key) => { delete store[key]; },
                clear: () => { store = {}; },
                key: (index) => Object.keys(store)[index] || null,
                get length() { return Object.keys(store).length; }
            };
        };
        
        try {
            Object.defineProperty(window, 'localStorage', { value: createStorage() });
            Object.defineProperty(window, 'sessionStorage', { value: createStorage() });
        } catch (defineError) {
             console.warn('Unable to define global storage properties:', defineError);
        }
    }
})();
</script>

    <script>
        // ── Particle background ──────────────────────────────────────────────
        (function() {
            const pc = document.getElementById('particleCanvas');
            const px = pc.getContext('2d');
            let W, H, particles = [];

            function resize() {
                W = pc.width = window.innerWidth;
                H = pc.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    r: Math.random() * 1.8 + 0.3,
                    dx: (Math.random() - 0.5) * 0.3,
                    dy: (Math.random() - 0.5) * 0.3,
                    alpha: Math.random() * 0.5 + 0.1,
                    color: Math.random() > 0.5 ? '#a8edea' : '#667eea'
                });
            }

            function animParticles() {
                px.clearRect(0, 0, W, H);
                for (let p of particles) {
                    p.x += p.dx;
                    p.y += p.dy;
                    if (p.x < 0) p.x = W;
                    if (p.x > W) p.x = 0;
                    if (p.y < 0) p.y = H;
                    if (p.y > H) p.y = 0;
                    px.beginPath();
                    px.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    px.fillStyle = p.color;
                    px.globalAlpha = p.alpha;
                    px.fill();
                }
                px.globalAlpha = 1;
                requestAnimationFrame(animParticles);
            }
            animParticles();
        })();
    </script>

    <script>
        // ── Visual enhancement patch ─────────────────────────────────────────
        // Override the canvas rendering to inject enhanced visuals after the
        // external script sets up the game. We patch CanvasRenderingContext2D
        // fillRect and arc to add glow effects for snake and food rendering.

        (function() {
            const gameCanvas = document.getElementById('gameCanvas');
            if (!gameCanvas) return;
            const ctx = gameCanvas.getContext('2d');

            // Patch fillRect to add glow for bright greens (snake) and reds/yellows (food)
            const origFillRect = ctx.fillRect.bind(ctx);
            ctx.fillRect = function(x, y, w, h) {
                const color = ctx.fillStyle;
                if (typeof color === 'string') {
                    // Snake head / body — greens
                    if (/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.test(color)) {
                        const r = parseInt(color.slice(1,3),16);
                        const g = parseInt(color.slice(3,5),16);
                        const b = parseInt(color.slice(5,7),16);
                        if (g > 150 && g > r * 1.3) {
                            ctx.save();
                            ctx.shadowColor = `rgba(${r},${g},${b},0.9)`;
                            ctx.shadowBlur = 14;
                            origFillRect(x, y, w, h);
                            ctx.restore();
                            return;
                        }
                        // Food — reds/oranges/yellows
                        if (r > 180 && g < 180) {
                            ctx.save();
                            ctx.shadowColor = `rgba(${r},${g},${b},0.9)`;
                            ctx.shadowBlur = 18;
                            origFillRect(x, y, w, h);
                            ctx.restore();
                            return;
                        }
                        // Power-ups — blues/purples/cyans
                        if (b > 150 || (r > 100 && b > 100 && g > 100)) {
                            ctx.save();
                            ctx.shadowColor = `rgba(${r},${g},${b},0.85)`;
                            ctx.shadowBlur = 16;
                            origFillRect(x, y, w, h);
                            ctx.restore();
                            return;
                        }
                    }
                    // rgb() format
                    const rgbMatch = color.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
                    if (rgbMatch) {
                        const r = +rgbMatch[1], g = +rgbMatch[2], b = +rgbMatch[3];
                        if (g > 150 && g > r * 1.3) {
                            ctx.save();
                            ctx.shadowColor = color;
                            ctx.shadowBlur = 14;
                            origFillRect(x, y, w, h);
                            ctx.restore();
                            return;
                        }
                        if (r > 180 && g < 180) {
                            ctx.save();
                            ctx.shadowColor = color;
                            ctx.shadowBlur = 18;
                            origFillRect(x, y, w, h);
                            ctx.restore();
                            return;
                        }
                    }
                }
                origFillRect(x, y, w, h);
            };

            // Patch arc to add glow for circular food/powerup drawing
            const origArc = ctx.arc.bind(ctx);
            ctx.arc = function(x, y, radius, startAngle, endAngle, anticlockwise) {
                const color = ctx.fillStyle || ctx.strokeStyle;
                if (typeof color === 'string' && radius > 3) {
                    ctx.save();
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 20;
                    origArc(x, y, radius, startAngle, endAngle, anticlockwise);
                    ctx.restore();
                    return;
                }
                origArc(x, y, radius, startAngle, endAngle, anticlockwise);
            };

            // Draw a subtle grid on the game canvas background
            function drawGrid() {
                const size = 20;
                ctx.save();
                ctx.strokeStyle = 'rgba(255,255,255,0.03)';
                ctx.lineWidth = 0.5;
                for (let x = 0; x <= gameCanvas.width; x += size) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, gameCanvas.height);
                    ctx.stroke();
                }
                for (let y = 0; y <= gameCanvas.height; y += size) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(gameCanvas.width, y);
                    ctx.stroke();
                }
                ctx.restore();
            }

            // Patch clearRect to also redraw the grid after clearing
            const origClearRect = ctx.clearRect.bind(ctx);
            ctx.clearRect = function(x, y, w, h) {
                origClearRect(x, y, w, h);
                // Only draw grid if clearing the full canvas
                if (x === 0 && y === 0 && w >= gameCanvas.width && h >= gameCanvas.height) {
                    // Fill dark background
                    ctx.save();
                    ctx.fillStyle = '#0d0d1a';
                    origFillRect(0, 0, gameCanvas.width, gameCanvas.height);
                    ctx.restore();
                    drawGrid();
                }
            };

            // Also patch fillRect for full-canvas background fills
            const patchedFillRect = ctx.fillRect.bind(ctx);
            const origFillRect2 = CanvasRenderingContext2D.prototype.fillRect;

            // Score pop animation
            const scoreEl = document.getElementById('score');
            if (scoreEl) {
                const observer = new MutationObserver(() => {
                    scoreEl.style.transition = 'none';
                    scoreEl.style.transform = 'scale(1.5)';
                    scoreEl.style.color = '#fed6e3';
                    setTimeout(() => {
                        scoreEl.style.transition = 'transform 0.3s ease, color 0.3s ease';
                        scoreEl.style.transform = 'scale(1)';
                        scoreEl.style.color = '#a8edea';
                    }, 50);
                });
                observer.observe(scoreEl, { childList: true, characterData: true, subtree: true });
            }
        })();
