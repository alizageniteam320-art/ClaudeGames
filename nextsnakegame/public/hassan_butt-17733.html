<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Tic-Tac-Toe</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #1a1a2e;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: #fff;
    overflow: hidden;
  }

  .game-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    padding: 15px;
    max-width: 620px;
    width: 100%;
  }

  .header {
    text-align: center;
    width: 100%;
  }

  .title {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #4fc3f7, #e91e63);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }

  .info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 10px 20px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .timer {
    font-size: 26px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #4fc3f7;
  }

  .timer.warning {
    color: #ff9800;
    animation: pulse 1s infinite;
  }

  .timer.danger {
    color: #f44336;
    animation: pulse 0.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .turn-indicator {
    font-size: 16px;
    font-weight: 600;
    padding: 6px 16px;
    border-radius: 20px;
    transition: all 0.3s;
  }

  .turn-indicator.player-turn {
    background: rgba(79, 195, 247, 0.2);
    border: 2px solid #4fc3f7;
    color: #4fc3f7;
  }

  .turn-indicator.ai-turn {
    background: rgba(233, 30, 99, 0.2);
    border: 2px solid #e91e63;
    color: #e91e63;
  }

  .legend {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 600;
  }

  .legend-color {
    width: 16px;
    height: 16px;
    border-radius: 4px;
  }

  .legend-color.blue { background: #4fc3f7; }
  .legend-color.red { background: #e91e63; }

  .meta-board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 6px;
    padding: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 16px;
    border: 2px solid rgba(255,255,255,0.15);
    width: 100%;
    max-width: 570px;
    aspect-ratio: 1;
  }

  .small-board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 3px;
    padding: 5px;
    background: rgba(255,255,255,0.03);
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.08);
    transition: all 0.3s ease;
    position: relative;
    cursor: default;
  }

  .small-board.active-board {
    border-color: #4fc3f7;
    background: rgba(79, 195, 247, 0.08);
    box-shadow: 0 0 15px rgba(79, 195, 247, 0.2), inset 0 0 15px rgba(79, 195, 247, 0.05);
    animation: glowPulse 2s infinite;
  }

  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 15px rgba(79, 195, 247, 0.2); }
    50% { box-shadow: 0 0 25px rgba(79, 195, 247, 0.4); }
  }

  .small-board.won-x {
    background: rgba(79, 195, 247, 0.15);
    border-color: #4fc3f7;
  }

  .small-board.won-o {
    background: rgba(233, 30, 99, 0.15);
    border-color: #e91e63;
  }

  .small-board.drawn {
    background: rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.2);
  }

  .board-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 60px;
    font-weight: 900;
    border-radius: 10px;
    z-index: 2;
    animation: claimBoard 0.4s ease-out;
  }

  @keyframes claimBoard {
    0% { transform: scale(0); opacity: 0; }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
  }

  .board-overlay.x-overlay {
    background: rgba(79, 195, 247, 0.2);
    color: #4fc3f7;
    text-shadow: 0 0 20px rgba(79, 195, 247, 0.5);
  }

  .board-overlay.o-overlay {
    background: rgba(233, 30, 99, 0.2);
    color: #e91e63;
    text-shadow: 0 0 20px rgba(233, 30, 99, 0.5);
  }

  .board-overlay.draw-overlay {
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.4);
    font-size: 30px;
  }

  .cell {
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(255,255,255,0.04);
    border-radius: 5px;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s;
    aspect-ratio: 1;
    position: relative;
    user-select: none;
  }

  .cell:hover:not(.taken) {
    background: rgba(255,255,255,0.12);
    transform: scale(1.05);
  }

  .cell.taken {
    cursor: default;
  }

  .cell .x-mark {
    color: #4fc3f7;
    text-shadow: 0 0 8px rgba(79, 195, 247, 0.4);
    animation: placeMark 0.3s ease-out;
  }

  .cell .o-mark {
    color: #e91e63;
    text-shadow: 0 0 8px rgba(233, 30, 99, 0.4);
    animation: placeMark 0.3s ease-out;
  }

  @keyframes placeMark {
    0% { transform: scale(0) rotate(-180deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .status-message {
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    min-height: 24px;
    color: rgba(255,255,255,0.7);
  }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    z-index: 100;
    justify-content: center;
    align-items: center;
    animation: fadeIn 0.3s;
  }

  .modal-overlay.show {
    display: flex;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal {
    background: #1a1a2e;
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 40px;
    text-align: center;
    animation: slideUp 0.4s ease-out;
    max-width: 400px;
    width: 90%;
  }

  @keyframes slideUp {
    from { transform: translateY(50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal h2 {
    font-size: 32px;
    margin-bottom: 10px;
  }

  .modal p {
    font-size: 18px;
    color: rgba(255,255,255,0.7);
    margin-bottom: 25px;
  }

  .modal .win-text { color: #4fc3f7; }
  .modal .lose-text { color: #e91e63; }
  .modal .draw-text { color: #ff9800; }

  .btn {
    padding: 12px 32px;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
  }

  .btn-primary {
    background: linear-gradient(135deg, #4fc3f7, #2196f3);
    color: #fff;
  }

  .btn-restart {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 20px;
    font-size: 13px;
  }

  .score-bar {
    display: flex;
    gap: 30px;
    font-size: 14px;
    font-weight: 600;
  }

  .score-bar span {
    color: rgba(255,255,255,0.6);
  }

  .score-bar .player-score { color: #4fc3f7; }
  .score-bar .ai-score { color: #e91e63; }

  .thinking {
    display: none;
    align-items: center;
    gap: 8px;
    color: #e91e63;
    font-size: 14px;
    font-weight: 600;
  }

  .thinking.show { display: flex; }

  .thinking-dots span {
    display: inline-block;
    width: 6px;
    height: 6px;
    background: #e91e63;
    border-radius: 50%;
    animation: dotBounce 1.4s infinite ease-in-out;
  }

  .thinking-dots span:nth-child(1) { animation-delay: 0s; }
  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dotBounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  @media (max-width: 500px) {
    .game-container { padding: 8px; gap: 10px; }
    .title { font-size: 20px; }
    .timer { font-size: 20px; }
    .meta-board { gap: 4px; padding: 4px; }
    .small-board { padding: 3px; gap: 2px; }
    .cell { font-size: 14px; }
    .board-overlay { font-size: 40px; }
    .info-bar { padding: 8px 12px; }
  }
</style>
</head>
<body>

<div class="game-container">
  <div class="header">
    <div class="title">ULTIMATE TIC-TAC-TOE</div>
  </div>

  <div class="info-bar">
    <div class="legend">
      <div class="legend-item">
        <div class="legend-color blue"></div>
        <span>Player X</span>
      </div>
      <div class="legend-item">
        <div class="legend-color red"></div>
        <span>AI O</span>
      </div>
    </div>
    <div class="timer" id="timer">5:00</div>
    <div class="turn-indicator player-turn" id="turnIndicator">Your Turn</div>
  </div>

  <div class="score-bar">
    <span>Player: <span class="player-score" id="playerScore">0</span></span>
    <span>Draws: <span id="drawScore">0</span></span>
    <span>AI: <span class="ai-score" id="aiScore">0</span></span>
  </div>

  <div class="meta-board" id="metaBoard"></div>

  <div class="thinking" id="thinking">
    AI is thinking
    <div class="thinking-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <div class="status-message" id="statusMessage">Click any cell to start — you play X!</div>

  <button class="btn btn-restart" onclick="resetGame()">↻ Restart</button>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modalTitle"></h2>
    <p id="modalMessage"></p>
    <button class="btn btn-primary" onclick="resetGame()">Play Again</button>
  </div>
</div>
