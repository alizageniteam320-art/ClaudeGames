<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Guardian of Earth</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#05070f; overflow:hidden; font-family:Arial, Helvetica, sans-serif; }
  #game { width:100%; height:100%; }
  canvas { display:block; }
  #nameOverlay{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(3,6,16,0.88); z-index:50; padding:20px;
  }
  #nameCard{
    width:min(420px,92vw); background:linear-gradient(160deg,#102a4c,#0a1830);
    border:2px solid #39c6ff; border-radius:18px; padding:26px 24px;
    box-shadow:0 0 50px rgba(57,198,255,.35); text-align:center; color:#eaf6ff;
  }
  #nameCard h2{ font-size:20px; letter-spacing:2px; margin-bottom:8px; color:#7ee3ff; }
  #nameCard p{ font-size:13px; opacity:.8; margin-bottom:16px; line-height:1.5; }
  #nameInput{
    width:100%; padding:13px 14px; font-size:18px; font-family:Arial, Helvetica, sans-serif;
    border-radius:10px; border:2px solid #2f6f9e; background:#071426; color:#fff; outline:none; text-align:center;
  }
  #nameInput:focus{ border-color:#5fe08a; }
  #nameGo{
    margin-top:16px; width:100%; padding:13px; font-size:17px; font-weight:bold; letter-spacing:1px;
    border:none; border-radius:10px; cursor:pointer; color:#04210f;
    background:linear-gradient(180deg,#7bf0a8,#30b86b);
  }
  #nameGo:active{ transform:scale(.98); }
</style>
</head>
<body>
<div id="game"></div>

<div id="nameOverlay">
  <div id="nameCard">
    <h2>WHO ARE YOU?</h2>
    <p>Your name becomes the title of this world's story.<br>Type it below, Guardian.</p>
    <input id="nameInput" type="text" maxlength="16" placeholder="Your name" autocomplete="off">
    <button id="nameGo">BEGIN</button>
  </div>
</div>
