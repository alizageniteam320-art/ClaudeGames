<script>
// Polyfill for localStorage and sessionStorage to prevent SecurityError in data: iframes
(function() {
    try {
        window.localStorage;
        window.sessionStorage;
    } catch (e) {
        // Storage access is blocked, implement in-memory polyfill
        const createStorage = () => {
            let store = {};
            return {
                getItem: (key) => store[key] || null,
                setItem: (key, value) => { store[key] = String(value); },
                removeItem: (key) => { delete store[key]; },
                clear: () => { store = {}; },
                key: (index) => Object.keys(store)[index] || null,
                get length() { return Object.keys(store).length; }
            };
        };
        
        try {
            Object.defineProperty(window, 'localStorage', { value: createStorage() });
            Object.defineProperty(window, 'sessionStorage', { value: createStorage() });
        } catch (defineError) {
             console.warn('Unable to define global storage properties:', defineError);
        }
    }
})();
</script>

    <script>
        // Override duck drawing with cat emoji after the external script loads
        (function() {
            function waitForGame() {
                // Try to patch the duck rendering to use cat emoji
                const canvas = document.getElementById('gameCanvas');
                if (!canvas) {
                    setTimeout(waitForGame, 100);
                    return;
                }

                const ctx = canvas.getContext('2d');
                if (!ctx) {
                    setTimeout(waitForGame, 100);
                    return;
                }

                // Patch CanvasRenderingContext2D to intercept duck drawing
                // We'll override fillStyle and font to detect duck drawing and replace with cat emoji
                const originalDrawImage = ctx.drawImage.bind(ctx);
                const originalFillText = ctx.fillText.bind(ctx);

                // Override fillText to replace duck emoji with cat emoji
                ctx.fillText = function(text, x, y, maxWidth) {
                    // Replace duck-related emojis with cat emoji
                    if (typeof text === 'string') {
                        text = text.replace(/🦆/g, '🐱');
                        text = text.replace(/🐦/g, '🐱');
                    }
                    if (maxWidth !== undefined) {
                        return originalFillText(text, x, y, maxWidth);
                    }
                    return originalFillText(text, x, y);
                };
            }

            // Wait for DOM and external script to load
            window.addEventListener('load', function() {
                setTimeout(waitForGame, 200);
            });
        })();
    </script>
