<!DOCTYPE html>
<html lang="en">
<head>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Blast - Puzzle Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0d0d1a;
            --bg-secondary: #12122a;
            --accent-primary: #ff4d8d;
            --accent-secondary: #00e5ff;
            --accent-tertiary: #ffe066;
            --accent-purple: #b44dff;
            --accent-green: #00ffb3;
            --text-primary: #ffffff;
            --text-secondary: #8888bb;
            --grid-bg: #080814;
            --block-shadow: rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: radial-gradient(ellipse at 20% 20%, #1a0a2e 0%, #0d0d1a 40%, #0a1a2e 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Animated background stars */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
                radial-gradient(1px 1px at 55% 25%, rgba(255,255,255,0.4) 0%, transparent 100%),
                radial-gradient(1px 1px at 75% 80%, rgba(255,255,255,0.3) 0%, transparent 100%),
                radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(1px 1px at 45% 90%, rgba(255,255,255,0.2) 0%, transparent 100%),
                radial-gradient(2px 2px at 20% 50%, rgba(0,229,255,0.3) 0%, transparent 100%),
                radial-gradient(2px 2px at 80% 20%, rgba(180,77,255,0.3) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
            animation: twinkle 4s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .container {
            max-width: 620px;
            width: 100%;
            animation: fadeIn 0.7s ease-out;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        h1 {
            font-size: 3.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff4d8d 0%, #b44dff 40%, #00e5ff 80%, #ffe066 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
            letter-spacing: 3px;
            animation: titlePulse 3s ease-in-out infinite alternate;
            position: relative;
        }

        h1::after {
            content: 'BLOCK BLAST';
            position: absolute;
            left: 0; top: 0;
            width: 100%;
            background: linear-gradient(135deg, #ff4d8d 0%, #b44dff 40%, #00e5ff 80%, #ffe066 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: blur(12px);
            opacity: 0.5;
            z-index: -1;
            animation: titlePulse 3s ease-in-out infinite alternate;
        }

        @keyframes titlePulse {
            from { filter: drop-shadow(0 0 8px rgba(255, 77, 141, 0.6)) drop-shadow(0 0 20px rgba(180, 77, 255, 0.3)); }
            to { filter: drop-shadow(0 0 16px rgba(0, 229, 255, 0.7)) drop-shadow(0 0 30px rgba(180, 77, 255, 0.5)); }
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 22px;
        }

        .score-item {
            background: linear-gradient(135deg, rgba(18,18,42,0.95), rgba(12,12,30,0.95));
            padding: 14px 28px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(0, 229, 255, 0.25);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .score-item::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,229,255,0.5), transparent);
        }

        .score-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 229, 255, 0.25);
        }

        .score-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .score-value {
            font-size: 2.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00e5ff, #b44dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: 'Space Mono', monospace;
        }

        .score-value.bump {
            animation: scoreBump 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes scoreBump {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .game-container {
            background: linear-gradient(135deg, rgba(18,18,42,0.97), rgba(10,10,28,0.97));
            border-radius: 24px;
            padding: 22px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,229,255,0.1);
            margin-bottom: 22px;
            position: relative;
            overflow: hidden;
        }

        .game-container::before {
            content: '';
            position: absolute;
            top: -1px; left: 10%; right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,229,255,0.6), rgba(180,77,255,0.6), transparent);
        }

        .game-container::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 10%; right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,77,141,0.4), rgba(0,229,255,0.4), transparent);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 3px;
            background: var(--grid-bg);
            padding: 10px;
            border-radius: 16px;
            margin-bottom: 22px;
            box-shadow: inset 0 4px 20px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
            position: relative;
        }

        .cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 5px;
            transition: all 0.15s;
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
        }

        /* Color-coded filled cells */
        .cell.filled {
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -1px 0 rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.25);
            animation: blockPop 0.35s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .cell.filled.color-0 {
            background: linear-gradient(135deg, #ff4d8d, #ff8c69);
            box-shadow: 0 2px 10px rgba(255,77,141,0.4), inset 0 1px 0 rgba(255,255,255,0.35);
        }
        .cell.filled.color-1 {
            background: linear-gradient(135deg, #00e5ff, #00b4d8);
            box-shadow: 0 2px 10px rgba(0,229,255,0.4), inset 0 1px 0 rgba(255,255,255,0.35);
        }
        .cell.filled.color-2 {
            background: linear-gradient(135deg, #b44dff, #7b2fff);
            box-shadow: 0 2px 10px rgba(180,77,255,0.4), inset 0 1px 0 rgba(255,255,255,0.35);
        }
        .cell.filled.color-3 {
            background: linear-gradient(135deg, #ffe066, #ffb347);
            box-shadow: 0 2px 10px rgba(255,224,102,0.4), inset 0 1px 0 rgba(255,255,255,0.35);
        }
        .cell.filled.color-4 {
            background: linear-gradient(135deg, #00ffb3, #00c896);
            box-shadow: 0 2px 10px rgba(0,255,179,0.4), inset 0 1px 0 rgba(255,255,255,0.35);
        }

        @keyframes blockPop {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            60% { transform: scale(1.15) rotate(3deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .cell.clearing {
            animation: clearPulse 0.55s ease-in-out forwards;
        }

        @keyframes clearPulse {
            0% { opacity: 1; transform: scale(1); }
            30% { opacity: 1; transform: scale(1.25); filter: brightness(2) saturate(2); }
            60% { opacity: 0.6; transform: scale(0.9); filter: brightness(1.5); }
            100% { opacity: 0; transform: scale(0); filter: brightness(3); }
        }

        .cell.preview {
            background: rgba(0, 229, 255, 0.2);
            border: 2px solid rgba(0, 229, 255, 0.7);
            box-shadow: 0 0 8px rgba(0,229,255,0.4), inset 0 0 6px rgba(0,229,255,0.1);
            animation: previewPulse 0.8s ease-in-out infinite alternate;
        }

        @keyframes previewPulse {
            from { border-color: rgba(0,229,255,0.5); box-shadow: 0 0 6px rgba(0,229,255,0.3); }
            to { border-color: rgba(0,229,255,1); box-shadow: 0 0 14px rgba(0,229,255,0.7); }
        }

        .blocks-container {
            display: flex;
            justify-content: center;
            gap: 14px;
            min-height: 120px;
            flex-wrap: wrap;
            align-items: center;
        }

        .block-wrapper {
            background: linear-gradient(135deg, rgba(12,12,30,0.95), rgba(8,8,20,0.95));
            padding: 14px;
            border-radius: 14px;
            cursor: grab;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s;
            border: 1px solid rgba(0, 229, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }

        .block-wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,229,255,0.4), transparent);
        }

        .block-wrapper:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 12px 30px rgba(0, 229, 255, 0.3), 0 0 0 1px rgba(0,229,255,0.3);
        }

        .block-wrapper:active {
            cursor: grabbing;
        }

        .block-wrapper.used {
            opacity: 0.2;
            pointer-events: none;
            filter: grayscale(1);
        }

        .block {
            display: grid;
            gap: 3px;
        }

        /* Color-coded block cells */
        .block-cell {
            width: 25px;
            height: 25px;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -1px 0 rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .block-cell.color-0 { background: linear-gradient(135deg, #ff4d8d, #ff8c69); }
        .block-cell.color-1 { background: linear-gradient(135deg, #00e5ff, #00b4d8); }
        .block-cell.color-2 { background: linear-gradient(135deg, #b44dff, #7b2fff); }
        .block-cell.color-3 { background: linear-gradient(135deg, #ffe066, #ffb347); }
        .block-cell.color-4 { background: linear-gradient(135deg, #00ffb3, #00c896); }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            background: linear-gradient(135deg, #ff4d8d, #b44dff);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 4px 20px rgba(255, 77, 141, 0.4), inset 0 1px 0 rgba(255,255,255,0.2);
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        button::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.4s;
        }

        button:hover::after {
            left: 100%;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 77, 141, 0.6), 0 0 0 1px rgba(255,77,141,0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .game-over-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s;
        }

        .game-over-overlay.show {
            display: flex;
        }

        .game-over-content {
            background: linear-gradient(135deg, rgba(18,18,42,0.98), rgba(10,10,28,0.98));
            padding: 45px 50px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,229,255,0.2);
            border: 1px solid rgba(0, 229, 255, 0.15);
            animation: scaleIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .game-over-content::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, #ff4d8d, #b44dff, #00e5ff, #ffe066);
        }

        @keyframes scaleIn {
            from { transform: scale(0.7) rotate(-5deg); opacity: 0; }
            to { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .game-over-content h2 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff4d8d, #b44dff, #00e5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        .game-over-content .game-over-sub {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .game-over-content p {
            font-size: 1.4rem;
            margin-bottom: 30px;
            color: var(--text-secondary);
        }

        .game-over-content p span {
            background: linear-gradient(135deg, #ffe066, #ff4d8d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            font-size: 1.8rem;
            font-family: 'Space Mono', monospace;
        }

        /* Particle burst container */
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 998;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: particleFly 0.9s ease-out forwards;
        }

        @keyframes particleFly {
            0% { opacity: 1; transform: translate(0,0) scale(1); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
        }

        .combo-notification {
            position: fixed;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #ffe066, #ff4d8d, #b44dff);
            color: white;
            padding: 18px 45px;
            border-radius: 18px;
            font-size: 2.2rem;
            font-weight: 700;
            pointer-events: none;
            opacity: 0;
            z-index: 999;
            box-shadow: 0 10px 40px rgba(255,77,141,0.6), 0 0 0 2px rgba(255,255,255,0.2);
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .combo-notification.show {
            animation: comboPopup 1.1s ease-out forwards;
        }

        @keyframes comboPopup {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4) rotate(-8deg); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.25) rotate(3deg); }
            40% { transform: translate(-50%, -50%) scale(0.95) rotate(-1deg); }
            60% { opacity: 1; transform: translate(-50%, -50%) scale(1.05) rotate(0deg); }
            85% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -60%) scale(0.9); }
        }

        /* Line clear flash overlay */
        .clear-flash {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 997;
            opacity: 0;
        }

        .clear-flash.flash {
            animation: screenFlash 0.4s ease-out;
        }

        @keyframes screenFlash {
            0% { opacity: 0; }
            20% { opacity: 0.12; background: radial-gradient(ellipse at center, rgba(0,229,255,0.4), transparent 70%); }
            100% { opacity: 0; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.6rem; }
            .score-board { gap: 12px; }
            .score-item { padding: 10px 16px; }
            .score-value { font-size: 1.5rem; }
            .game-container { padding: 14px; }
            .block-cell { width: 20px; height: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>BLOCK BLAST</h1>
            <div class="subtitle">Puzzle Challenge</div>
        </header>

        <div class="score-board">
            <div class="score-item">
                <div class="score-label">SCORE</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">BEST</div>
                <div class="score-value" id="bestScore">0</div>
            </div>
        </div>

        <div class="game-container">
            <div class="grid" id="grid"></div>
            <div class="blocks-container" id="blocksContainer"></div>
        </div>

        <div class="controls">
            <button id="restartBtn">✦ New Game</button>
        </div>
    </div>

    <div class="game-over-overlay" id="gameOverOverlay">
        <div class="game-over-content">
            <h2>Game Over!</h2>
            <div class="game-over-sub">NO MORE MOVES</div>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button id="playAgainBtn">✦ Play Again</button>
        </div>
    </div>

    <div class="combo-notification" id="comboNotification"></div>
    <div class="clear-flash" id="clearFlash"></div>
    <div class="particles" id="particles"></div>
