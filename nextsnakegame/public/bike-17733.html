<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASCAR Racing Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #2d5a27;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            max-height: 800px;
        }
        
        #gameCanvas {
            background: #4a7c59;
            border: 2px solid #333;
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-weight: bold;
            z-index: 100;
        }
        
        #speedometer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            text-align: center;
            min-width: 150px;
        }
        
        #minimap {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 150px;
            height: 100px;
            background: rgba(0,0,0,0.8);
            border: 2px solid white;
            border-radius: 10px;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            display: none;
            z-index: 200;
        }
        
        button {
            background: #ff6b35;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        
        button:hover {
            background: #e55a2b;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div style="background: rgba(255,107,53,0.9); padding: 10px; border-radius: 20px; margin-bottom: 10px;">
                🏁 NASCAR <span id="position">1</span>/8
            </div>
            <div style="background: rgba(255,165,0,0.9); padding: 10px; border-radius: 20px;">
                🏆 LAP <span id="currentLap">1</span>/3
            </div>
        </div>
        
        <div id="speedometer">
            <div style="font-size: 24px; color: #ff6b35;">
                <span id="speed">0</span> MPH
            </div>
            <div style="font-size: 14px; margin-top: 5px;">
                LAP <span id="lapDisplay">1</span>
            </div>
        </div>
        
        <canvas id="minimap"></canvas>
        
        <div id="controls">
            <div><strong>CONTROLS</strong></div>
            <div>↑↓ Accelerate/Brake</div>
            <div>←→ Steer</div>
            <div>Space: Boost</div>
        </div>
        
        <div id="gameOver">
            <h2 id="gameOverTitle">Race Complete!</h2>
            <p id="gameOverText">You finished in position 1!</p>
            <button onclick="restartGame()">Race Again</button>
        </div>
    </div>
