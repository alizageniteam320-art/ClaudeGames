<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Challenge</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #5C94FC 0%, #87CEEB 100%);
            font-family: 'Courier New', monospace;
            overflow: hidden;
            user-select: none;
        }
        
        #gameCanvas {
            display: block;
            margin: 0 auto;
            background: linear-gradient(180deg, #5C94FC 0%, #87CEEB 70%, #90EE90 100%);
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
        
        .ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            z-index: 100;
        }
        
        .lives {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            z-index: 100;
        }
        
        .level {
            position: absolute;
            top: 60px;
            right: 20px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            z-index: 100;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 100;
        }
        
        .control-btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            margin: 5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 0px #000;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
        }
        
        .control-btn:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
        }
        
        .dpad {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 100;
        }
        
        .dpad-btn {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.5);
            margin: 2px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
        }
        
        .dpad-btn:active {
            background: rgba(255, 255, 255, 0.5);
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            font-size: 24px;
            z-index: 200;
            display: none;
        }
        
        .restart-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        .restart-btn:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div class="ui">
        🪙 SCORE: <span id="score">0</span>
    </div>
    <div class="lives">
        ❤️ LIVES: <span id="lives">3</span>
    </div>
    <div class="level">
        LEVEL: <span id="level">1</span>
    </div>
    
    <canvas id="gameCanvas" width="1200" height="600"></canvas>
    
    <div class="dpad">
        <div style="text-align: center;">
            <div class="dpad-btn" id="upBtn">↑</div>
        </div>
        <div>
            <div class="dpad-btn" id="leftBtn">←</div>
            <div class="dpad-btn" id="rightBtn">→</div>
        </div>
    </div>
    
    <div class="controls">
        <div class="control-btn" id="jumpBtn">A</div>
        <div class="control-btn" id="runBtn">B</div>
    </div>
    
    <div class="game-over" id="gameOver">
        <h2>Game Over!</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button class="restart-btn" onclick="restartGame()">Play Again</button>
    </div>
