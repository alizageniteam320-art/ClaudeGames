<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Makeup Memory</title>
    <style>
        :root {
            --primary: #ff69b4;
            --primary-dark: #d84b92;
            --bg: #ffe4e1;
            --text: #333;
            --white: #fff;
            --success: #32cd32;
            --danger: #ff4500;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            width: 100%;
            max-width: 500px;
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 850px;
        }

        /* Top HUD */
        #hud {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background: var(--primary);
            color: var(--white);
            font-weight: bold;
            font-size: 1.1rem;
            z-index: 10;
        }

        /* Canvas Area */
        #canvas-container {
            position: relative;
            width: 100%;
            background: #fdf5f6;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 0;
        }

        canvas {
            background: transparent;
            width: 250px;
            height: 250px;
        }

        #status-overlay {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.2rem;
            z-index: 5;
            text-align: center;
        }

        /* Controls Area */
        #controls {
            flex: 1;
            padding: 10px 20px;
            overflow-y: auto;
            background: var(--white);
            display: none; /* Hidden during memorize */
        }

        .category {
            margin-bottom: 12px;
        }

        .category h3 {
            margin: 0 0 8px 0;
            font-size: 1rem;
            color: var(--primary-dark);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .option-btn {
            flex: 1;
            padding: 10px 5px;
            border: 2px solid #ddd;
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s;
            text-align: center;
            min-width: 60px;
        }

        .option-btn.selected {
            border-color: var(--primary);
            background: var(--bg);
            color: var(--primary-dark);
        }

        #submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(255, 105, 180, 0.3);
            margin-bottom: 20px;
        }

        #submit-btn:active {
            transform: translateY(2px);
        }

        /* Screens (Start, Result, End) */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--white);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
        }

        .screen h1 {
            color: var(--primary-dark);
            margin-bottom: 10px;
            font-size: 2.2rem;
        }

        .screen p {
            font-size: 1.1rem;
            line-height: 1.5;
            color: #555;
            margin-bottom: 25px;
        }

        .main-btn {
            padding: 15px 40px;
            font-size: 1.3rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255,105,180,0.4);
            transition: transform 0.2s;
        }

        .main-btn:hover {
            transform: scale(1.05);
        }

        .hidden {
            display: none !important;
        }

        /* Animation for timer */
        .pulse {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.1); color: var(--primary); }
            100% { transform: translateX(-50%) scale(1); }
        }
        
        .score-display {
            font-size: 3rem;
            font-weight: bold;
            margin: 20px 0;
            color: var(--primary);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="hud">
        <span id="level-display">Face: 1/10</span>
        <span id="avg-display">Avg: 0%</span>
    </div>

    <div id="canvas-container">
        <div id="status-overlay">Get Ready!</div>
        <canvas id="faceCanvas" width="300" height="300"></canvas>
    </div>

    <div id="controls">
        <div id="options-container"></div>
        <button id="submit-btn">Apply Makeup</button>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen">
        <h1>Quick Makeup<br>Memory</h1>
        <p>Memorize the makeup look for 10 seconds.<br><br>Then, recreate it from memory using 5 products.<br><br>Score 80%+ across 10 faces to win!</p>
        <button class="main-btn" onclick="startGame()">Start Game</button>
    </div>

    <!-- Interstitial / Level Result Screen -->
    <div id="result-screen" class="screen hidden">
        <h2 id="result-title">Time's Up!</h2>
        <div class="score-display" id="result-score">100%</div>
        <p id="result-desc">Accuracy on this look.</p>
        <button class="main-btn" id="next-level-btn" onclick="nextLevel()">Next Face</button>
    </div>

    <!-- End Game Screen -->
    <div id="end-screen" class="screen hidden">
        <h1 id="end-title">Game Over</h1>
        <div class="score-display" id="final-score">0%</div>
        <p id="end-desc">You needed 80% to win.</p>
        <button class="main-btn" onclick="resetGame()">Play Again</button>
    </div>
</div>
