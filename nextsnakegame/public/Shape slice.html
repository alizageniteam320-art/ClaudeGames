<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shape Slicer Puzzle</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .hud-item {
            display: flex;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #37474F;
        }

        .icon {
            margin-right: 8px;
            width: 28px;
            height: 28px;
            border: 3px solid #37474F;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
        }

        .progress-container {
            width: 180px;
            height: 20px;
            background: #E0E0E0;
            border-radius: 10px;
            border: 3px solid #37474F;
            overflow: hidden;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 24px;
        }

        .progress-fill {
            height: 100%;
            background: #FFC107;
            width: 0%;
            transition: width 0.3s ease-in-out;
        }

        .instruction {
            position: absolute;
            top: 60px;
            width: 100%;
            text-align: center;
            color: #607D8B;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .bottom-bar {
            padding-bottom: 40px;
            display: flex;
            justify-content: center;
            pointer-events: auto;
        }

        .cut-btn {
            background-color: #2196F3;
            color: #ffffff;
            border: none;
            padding: 16px 60px;
            font-size: 28px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 6px 0 #1565C0;
            transition: transform 0.1s, box-shadow 0.1s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .cut-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #1565C0;
        }

        .cut-btn:disabled {
            background-color: #B0BEC5;
            box-shadow: 0 6px 0 #78909C;
            cursor: not-allowed;
            transform: none;
        }

        .message-overlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: 900;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            text-shadow: 
                3px 3px 0 #fff, -1px -1px 0 #fff,  
                1px -1px 0 #fff, -1px 1px 0 #fff,
                1px 1px 0 #fff;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        .title {
            font-size: 42px;
            color: #37474F;
            margin-bottom: 20px;
            text-align: center;
        }

        .subtitle {
            font-size: 20px;
            color: #607D8B;
            margin-bottom: 40px;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer" id="gameUI">
        <div class="top-bar">
            <div class="hud-item">
                <div class="icon">⏱</div>
                <span id="timeDisplay">60</span>
            </div>
            <div class="hud-item">
                <span id="scoreDisplay">0</span>/5
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div class="instruction">Draw a line to cut the shape in half</div>

        <div class="message-overlay" id="messageBox">PERFECT!</div>

        <div class="bottom-bar">
            <button class="cut-btn" id="cutBtn" disabled>Cut</button>
        </div>
    </div>

    <div class="screen" id="startScreen">
        <div class="title">SHAPE SLICER</div>
        <div class="subtitle">Cut the shapes exactly in half!</div>
        <button class="cut-btn" id="startBtn">PLAY</button>
    </div>

    <div class="screen hidden" id="gameOverScreen">
        <div class="title" id="gameOverTitle">GAME OVER</div>
        <div class="subtitle" id="gameOverSubtitle">Time's Up!</div>
        <button class="cut-btn" id="restartBtn">PLAY AGAIN</button>
    </div>
