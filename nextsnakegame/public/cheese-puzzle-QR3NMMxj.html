<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Puzzle Rush</title>
<style>
    :root {
        --bg-color: #0b132b;
        --panel-bg: #1c2541;
        --light-sq: #eeeed2;
        --dark-sq: #769656;
        --accent-red: #e71d36;
        --accent-green: #2ec4b6;
        --accent-yellow: #ff9f1c;
        --text-color: #ffffff;
    }

    body {
        margin: 0;
        font-family: 'Helvetica', 'Arial', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
    }

    .screen {
        display: none;
        width: 100%;
        max-width: 450px;
        background: var(--panel-bg);
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        box-sizing: border-box;
        text-align: center;
    }

    .active { display: block; }

    h1 { margin-top: 0; color: var(--accent-green); }
    h2 { color: var(--accent-yellow); }
    
    .stats-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1.2rem;
        font-weight: bold;
        margin-bottom: 15px;
    }

    .timer {
        color: var(--accent-red);
        font-size: 1.5rem;
        background: rgba(231, 29, 54, 0.1);
        padding: 5px 15px;
        border-radius: 8px;
        border: 2px solid var(--accent-red);
    }

    .board-container {
        border: 4px solid #3a506b;
        border-radius: 6px;
        transition: border-color 0.3s;
    }

    .board {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        width: 100%;
        aspect-ratio: 1;
    }

    .square {
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 2.2rem;
        cursor: pointer;
        user-select: none;
        position: relative;
    }

    @media (max-width: 400px) {
        .square { font-size: 1.8rem; }
    }

    .light { background-color: var(--light-sq); }
    .dark { background-color: var(--dark-sq); }

    .piece-w { color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
    .piece-b { color: #000000; text-shadow: 0 2px 4px rgba(255,255,255,0.4); }

    .selected { background-color: rgba(255, 255, 0, 0.6) !important; }
    .hinted { box-shadow: inset 0 0 15px 5px var(--accent-yellow) !important; }

    .controls {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
        gap: 10px;
    }

    button {
        flex: 1;
        padding: 12px;
        font-size: 1.1rem;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: opacity 0.2s;
    }

    button:hover { opacity: 0.8; }
    
    .btn-start { background: var(--accent-green); color: var(--bg-color); }
    .btn-hint { background: var(--accent-yellow); color: var(--bg-color); }
    .btn-skip { background: var(--accent-red); color: white; }
    .btn-practice { background: #3a506b; color: white; margin-top: 10px; width: 100%; }

    .score-display {
        font-size: 1rem;
        color: #8d99ae;
        margin-top: 5px;
    }
</style>
</head>
<body>

<!-- Start Screen -->
<div id="start-screen" class="screen active">
    <h1>Chess Puzzle Rush</h1>
    <p>Find the Checkmate-in-1 move!</p>
    <ul style="text-align: left; margin: 20px auto; max-width: 300px; line-height: 1.6;">
        <li>⏳ 10 seconds per puzzle</li>
        <li>🎯 50 puzzles total</li>
        <li>❌ Wrong moves skip & cost points</li>
        <li>🏆 Solve 45/50 to Win!</li>
    </ul>
    <button class="btn-start" onclick="startGame()">Start Rush</button>
</div>

<!-- Game Screen -->
<div id="game-screen" class="screen">
    <div class="stats-bar">
        <div id="puzzle-counter">1/50</div>
        <div id="timer" class="timer">10s</div>
        <div id="solved-counter">✅ 0</div>
    </div>
    <div class="board-container" id="board-container">
        <div id="board" class="board"></div>
    </div>
    <div class="score-display">Score: <span id="score">0</span></div>
    <div class="controls">
        <button class="btn-hint" onclick="useHint()">💡 Hint</button>
        <button class="btn-skip" onclick="handleWrongMove()">⏭️ Skip</button>
    </div>
</div>

<!-- Result Screen -->
<div id="result-screen" class="screen">
    <h1 id="result-title">Game Over</h1>
    <h2 id="result-stats">Solved: 0/50</h2>
    <p id="result-score">Final Score: 0</p>
    <p id="result-message"></p>
    
    <button class="btn-start" onclick="startGame()">Play Again</button>
    <button class="btn-practice" onclick="startPracticeMode()">Learn / Practice vs AI</button>
</div>
