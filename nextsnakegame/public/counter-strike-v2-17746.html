<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter-Strike HTML5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            overflow: hidden;
            cursor: none;
        }
        
        #gameCanvas {
            display: block;
            background: linear-gradient(180deg, #87CEEB 0%, #F5DEB3 100%);
        }
        
        .hud {
            position: absolute;
            color: #FFD700;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
        
        .health {
            bottom: 20px;
            left: 20px;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .health-icon {
            width: 30px;
            height: 30px;
            background: #ff4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }
        
        .ammo {
            bottom: 20px;
            right: 200px;
            font-size: 24px;
        }
        
        .weapon-display {
            bottom: 20px;
            right: 20px;
            font-size: 18px;
        }
        
        .buy-menu {
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            color: #ff4444;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .minimap {
            top: 20px;
            left: 20px;
            width: 150px;
            height: 150px;
            background: rgba(0,0,0,0.8);
            border: 2px solid #FFD700;
            border-radius: 10px;
        }
        
        .weapon-selector {
            top: 100px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #FFD700;
        }
        
        .weapon-item {
            display: block;
            color: #FFD700;
            margin: 5px 0;
            padding: 5px 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .weapon-item:hover, .weapon-item.selected {
            background: rgba(255,215,0,0.3);
            transform: scale(1.05);
        }
        
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            pointer-events: none;
            z-index: 100;
        }
        
        .crosshair::before, .crosshair::after {
            content: '';
            position: absolute;
            background: #ff4444;
            box-shadow: 0 0 10px rgba(255,68,68,0.8);
        }
        
        .crosshair::before {
            top: 50%;
            left: 12px;
            width: 6px;
            height: 2px;
            transform: translateY(-50%);
        }
        
        .crosshair::after {
            left: 50%;
            top: 12px;
            width: 2px;
            height: 6px;
            transform: translateX(-50%);
        }
        
        .muzzle-flash {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #ffff00, #ff6600, transparent);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: flash 0.1s ease-out;
        }
        
        @keyframes flash {
            0% { opacity: 1; transform: scale(0.5); }
            100% { opacity: 0; transform: scale(2); }
        }
        
        .damage-indicator {
            position: absolute;
            color: #ff4444;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            animation: damageFloat 1s ease-out forwards;
        }
        
        @keyframes damageFloat {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); }
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: #FFD700;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            font-size: 24px;
            border: 3px solid #ff4444;
            display: none;
        }
        
        .restart-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }
        
        .restart-btn:hover {
            background: #ff6666;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="1200" height="800"></canvas>
    
    <div class="crosshair"></div>
    
    <div class="hud health">
        <div class="health-icon">❤</div>
        <span id="healthValue">100</span>
    </div>
    
    <div class="hud ammo">
        <span id="ammoValue">30/90</span>
    </div>
    
    <div class="hud weapon-display">
        <span id="weaponName">AK-47</span>
    </div>
    
    <div class="hud buy-menu">
        BUY MENU
    </div>
    
    <div class="hud minimap">
        <canvas id="minimapCanvas" width="150" height="150"></canvas>
    </div>
    
    <div class="hud weapon-selector">
        <div class="weapon-item selected" data-weapon="ak47">AK-47</div>
        <div class="weapon-item" data-weapon="glock">GLOCK</div>
        <div class="weapon-item" data-weapon="usp">USP</div>
        <div class="weapon-item" data-weapon="grenade">GRENADE</div>
    </div>
    
    <div class="game-over" id="gameOver">
        <h2>MISSION COMPLETE</h2>
        <p>All terrorists eliminated!</p>
        <button class="restart-btn" onclick="restartGame()">PLAY AGAIN</button>
    </div>
