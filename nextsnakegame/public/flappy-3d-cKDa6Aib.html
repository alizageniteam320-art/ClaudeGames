<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flappy 3D — Design Your Bird</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a2508;--gold:#ffd23f;--orange:#ff8a00;--cream:#fff7e0;--green:#5cbf2a;--sky:#4fb3e8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9fd8f7;font-family:'Fredoka','Trebuchet MS',sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;pointer-events:none;z-index:10}
.screen.on{display:flex;animation:fadeIn .4s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.btn{font-family:'Lilita One','Fredoka','Trebuchet MS',sans-serif;font-size:clamp(16px,4.4vmin,30px);color:#fff;padding:.42em 1em;border-radius:.6em;border:3px solid var(--ink);background:linear-gradient(#ffc93c,#ff8a00);box-shadow:0 .22em 0 var(--ink),0 .4em .6em rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(74,37,8,.6);cursor:pointer;transition:transform .1s,box-shadow .1s;pointer-events:auto;letter-spacing:.5px;white-space:nowrap}
.btn.green{background:linear-gradient(#8ef06a,#3fa61c)}
.btn.blue{background:linear-gradient(#74c8ff,#2b8bd8)}
.btn.sm{font-size:clamp(14px,3.6vmin,22px)}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(.18em);box-shadow:0 .04em 0 var(--ink)}
.row{display:flex;gap:clamp(8px,2vmin,16px);justify-content:center;flex-wrap:wrap}
/* menu */
.menu{justify-content:space-between;padding:5vh 3vw 4vh;pointer-events:auto;cursor:pointer}
.titleWrap{display:flex;align-items:flex-end;gap:1vmin;animation:bob 2.6s ease-in-out infinite}
.title,.title3d,.overTitle{font-family:'Lilita One','Fredoka','Trebuchet MS',sans-serif;color:var(--gold);-webkit-text-stroke:clamp(2px,.8vmin,6px) var(--ink);paint-order:stroke fill;text-shadow:0 .7vmin 0 var(--ink),0 1.4vmin 2vmin rgba(0,0,0,.3);line-height:.9;letter-spacing:2px}
.title{font-size:clamp(44px,13vmin,124px)}
.title3d{font-size:clamp(32px,9vmin,90px);color:#ff6b6b;transform:rotate(8deg)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2vmin)}}
.menuBottom{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vmin,16px)}
.pilot,.hint{color:#fff;font-weight:700;text-shadow:0 2px 0 var(--ink),0 0 6px rgba(0,0,0,.4);text-align:center}
.pilot{font-size:clamp(14px,3.6vmin,24px)}
.hint{font-size:clamp(12px,2.8vmin,18px);opacity:.95;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
/* hud */
#hud{position:fixed;top:0;left:0;right:0;display:none;flex-direction:column;align-items:center;pointer-events:none;padding-top:2.5vh;z-index:5}
#score{font-family:'Lilita One','Fredoka',sans-serif;font-size:clamp(46px,13vmin,110px);color:#fff;-webkit-text-stroke:clamp(2px,.8vmin,6px) var(--ink);paint-order:stroke fill;text-shadow:0 .6vmin 0 var(--ink);line-height:1}
#score.bump{animation:bump .25s ease-out}
@keyframes bump{40%{transform:scale(1.25)}}
#hudSub{font-weight:700;color:#fff;font-size:clamp(12px,2.8vmin,18px);text-shadow:0 2px 0 var(--ink);margin-top:.5vh}
#readyHint{position:fixed;left:50%;bottom:16%;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;font-family:'Lilita One','Fredoka',sans-serif;color:#fff;font-size:clamp(16px,4vmin,28px);text-shadow:0 3px 0 var(--ink);pointer-events:none;z-index:5;white-space:nowrap}
#readyHint .tap{font-size:1.8em;animation:tap .8s ease-in-out infinite}
@keyframes tap{50%{transform:translateY(.25em) scale(.9)}}
#mute{position:fixed;top:10px;left:10px;width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:linear-gradient(#fff,#ffe9a8);font-size:22px;cursor:pointer;z-index:50;box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}
#flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.pop{position:fixed;transform:translate(-50%,-50%);font-family:'Lilita One','Fredoka',sans-serif;font-size:clamp(20px,5vmin,36px);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);pointer-events:none;z-index:7;animation:popUp .9s cubic-bezier(.2,.9,.3,1.2) forwards;white-space:nowrap}
.pop.gold{color:var(--gold);font-size:clamp(24px,6vmin,44px)}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-220%) scale(1)}}
/* designer */
#designer{pointer-events:none}
.dpanel{position:absolute;right:2vmin;top:2vmin;bottom:2vmin;width:min(440px,48vw);background:rgba(255,247,224,.96);border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 rgba(74,37,8,.6),0 12px 30px rgba(0,0,0,.3);display:flex;flex-direction:column;pointer-events:auto;overflow:hidden;animation:slideIn .45s cubic-bezier(.2,.9,.3,1.15)}
@keyframes slideIn{from{transform:translateX(110%)}to{transform:none}}
.dhead{font-family:'Lilita One','Fredoka',sans-serif;font-size:clamp(18px,4vmin,28px);color:var(--gold);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);text-align:center;padding:10px 8px 6px;background:linear-gradient(#ffe9a8,rgba(255,233,168,0));}
.dscroll{flex:1;overflow-y:auto;padding:4px 14px 10px;touch-action:pan-y}
.sec{margin:8px 0 10px}
.sec label,.nameRow label{display:block;font-weight:700;color:var(--ink);font-size:clamp(13px,2.8vmin,16px);margin-bottom:5px}
.sws{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:clamp(26px,6.5vmin,34px);height:clamp(26px,6.5vmin,34px);border-radius:50%;border:3px solid var(--ink);cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.35);transition:transform .12s}
.sw.sel{transform:scale(1.18);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--orange)}
.sw.custom{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);position:relative;overflow:hidden}
.sw.custom input{position:absolute;inset:-10px;opacity:0;cursor:pointer;width:200%;height:200%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(12px,2.8vmin,15px);padding:5px 11px;border-radius:999px;border:2.5px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;transition:transform .1s}
.chip.sel{background:linear-gradient(#ffc93c,#ff8a00);color:#fff;text-shadow:0 1px 0 var(--ink)}
.chip:active{transform:scale(.94)}
.nameRow{margin:4px 0 6px}
.nameRow input{width:100%;font-family:'Fredoka',sans-serif;font-weight:700;font-size:16px;padding:6px 10px;border-radius:12px;border:3px solid var(--ink);color:var(--ink);background:#fff;outline:none;user-select:text;-webkit-user-select:text}
.dfoot{display:flex;gap:10px;justify-content:center;padding:10px;border-top:3px dashed rgba(74,37,8,.25);background:rgba(255,233,168,.6)}
.dragHint{position:absolute;left:2vmin;bottom:2vmin;color:#fff;font-weight:700;text-shadow:0 2px 0 var(--ink);font-size:clamp(12px,2.6vmin,16px)}
@media (orientation:portrait){
  .dpanel{left:0;right:0;bottom:0;top:auto;height:56%;width:auto;border-radius:22px 22px 0 0;border-bottom:none;animation:slideUp .45s cubic-bezier(.2,.9,.3,1.15)}
  .dragHint{bottom:auto;top:calc(44% - 30px);left:50%;transform:translateX(-50%)}
}
@keyframes slideUp{from{transform:translateY(110%)}to{transform:none}}
/* game over */
#over{justify-content:center;gap:clamp(8px,2vh,18px);padding:2vh 2vw}
.overTitle{font-size:clamp(36px,10vmin,90px);color:#ff6b6b;animation:dropIn .6s cubic-bezier(.2,.9,.3,1.3)}
@keyframes dropIn{from{transform:translateY(-60vh)}to{transform:none}}
.card{pointer-events:auto;background:var(--cream);border:4px solid var(--ink);border-radius:22px;padding:clamp(12px,3vmin,24px);box-shadow:0 8px 0 rgba(74,37,8,.6),0 14px 30px rgba(0,0,0,.3);width:min(92vw,420px);max-height:78vh;overflow:auto;display:flex;flex-direction:column;gap:clamp(10px,2.4vmin,18px);animation:cardIn .55s .1s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes cardIn{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.medalRow{display:flex;align-items:center;justify-content:space-around;gap:12px}
.medal{width:clamp(64px,18vmin,110px);height:clamp(64px,18vmin,110px);border-radius:50%;border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:clamp(28px,8vmin,52px);color:rgba(255,255,255,.9);text-shadow:0 2px 0 rgba(0,0,0,.25);box-shadow:inset 0 -6px 0 rgba(0,0,0,.2),inset 0 5px 0 rgba(255,255,255,.4)}
.medal.none{background:#e6d9b8;color:rgba(74,37,8,.3)}
.medal.bronze{background:radial-gradient(circle at 35% 30%,#f3b27a,#b5652b)}
.medal.silver{background:radial-gradient(circle at 35% 30%,#ffffff,#a9b4c2)}
.medal.gold{background:radial-gradient(circle at 35% 30%,#fff2a8,#e9a800)}
.medal.plat{background:radial-gradient(circle at 35% 30%,#ffffff,#8fe3ff 60%,#b48cff)}
.stats{text-align:right;color:var(--ink);font-weight:700;font-size:clamp(12px,2.8vmin,16px)}
.stats .big{font-family:'Lilita One','Fredoka',sans-serif;font-size:clamp(26px,7vmin,44px);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);line-height:1.05}
#newBest{display:none;margin-top:4px;background:#ff6b6b;color:#fff;border-radius:8px;padding:2px 8px;border:2px solid var(--ink);animation:pulse 1s infinite;text-align:center}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}
</style>
</head>
<body>
<div id="game"></div>
<div id="flash"></div>
<div id="hud"><div id="score">0</div><div id="hudSub"><span id="hudName">Flappy</span> · BEST <span id="hudBest">0</span></div></div>
<div id="readyHint"><div class="tap">👆</div>TAP · CLICK · SPACE TO FLAP</div>
<button id="mute" title="Mute (M)">🔊</button>

<div id="menu" class="screen menu">
  <div class="titleWrap"><div class="title">FLAPPY</div><div class="title3d">3D</div></div>
  <div class="menuBottom">
    <div class="pilot">Pilot: <b id="menuName">Flappy</b> · Best <b id="menuBest">0</b></div>
    <div class="row"><button class="btn green" id="playBtn">▶ PLAY</button><button class="btn blue" id="designBtn">🎨 DESIGN BIRD</button></div>
    <div class="hint">Tap / Space to flap · dodge the pipes · fly through golden rings</div>
  </div>
</div>

<div id="designer" class="screen">
  <div class="dragHint">⟲ drag the bird to spin</div>
  <div class="dpanel">
    <div class="dhead">DESIGN YOUR BIRD</div>
    <div class="dscroll">
      <div class="nameRow"><label for="nameInput">Name</label><input id="nameInput" maxlength="12" autocomplete="off" spellcheck="false"></div>
      <div id="dsections"></div>
    </div>
    <div class="dfoot"><button class="btn sm" id="randBtn">🎲 Random</button><button class="btn green sm" id="doneBtn">✔ Done</button></div>
  </div>
</div>

<div id="over" class="screen">
  <div class="overTitle">GAME OVER</div>
  <div class="card">
    <div class="medalRow">
      <div id="medal" class="medal none">★</div>
      <div class="stats"><div>SCORE</div><div id="oScore" class="big">0</div><div>BEST</div><div id="oBest" class="big">0</div><div id="newBest">NEW BEST!</div></div>
    </div>
    <div class="col">
      <button class="btn green" id="againBtn">↻ PLAY AGAIN</button>
      <div class="row"><button class="btn blue sm" id="oDesign">🎨 Design</button><button class="btn sm" id="oMenu">⌂ Menu</button></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
