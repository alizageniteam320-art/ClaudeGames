<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Raining Cats & Dogs: Rumble Ride</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #111;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: none;
            color: white;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* UI Overlay */
        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .header {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
        }
        .p1-stats { color: #4fc3f7; }
        .p2-stats { color: #ff8a65; }
        .timer {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            color: #fff;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 10px;
            border: 3px solid #fff;
        }
        /* Controls */
        .controls {
            display: flex;
            width: 100%;
            justify-content: space-between;
            padding: 20px;
            pointer-events: auto;
        }
        .control-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 4px solid #fff;
            border-radius: 15px;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 0 #000;
            box-shadow: 0 5px 0 rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 0px 0 rgba(0,0,0,0.3);
        }
        .btn-ride {
            background: #ffeb3b;
            color: #000;
            border-color: #fbc02d;
            text-shadow: none;
            width: 80px;
        }
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
        }
        .win-text {
            font-size: 48px;
            color: #ffeb3b;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 #000;
            text-align: center;
        }
        .restart-btn {
            padding: 15px 30px;
            font-size: 24px;
            background: #4CAF50;
            border: 4px solid #fff;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 0 #2e7d32;
        }
        .restart-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0px 0 #2e7d32;
        }
        
        @media (min-width: 800px) {
            .btn { width: 80px; height: 80px; font-size: 32px; }
            .btn-ride { width: 120px; }
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    
    <div id="uiLayer">
        <div class="header">
            <div class="p1-stats">P1 SCORE: <span id="p1Score">0</span></div>
            <div class="timer" id="timer">60</div>
            <div class="p2-stats">P2 SCORE: <span id="p2Score">0</span></div>
        </div>
        
        <div class="controls">
            <!-- P1 Controls (Left) -->
            <div class="control-group">
                <div class="btn" id="btn-p1-left">◀</div>
                <div class="btn" id="btn-p1-right">▶</div>
                <div class="btn btn-ride" id="btn-p1-ride">RIDE</div>
            </div>
            
            <!-- P2 Controls (Right) -->
            <div class="control-group">
                <div class="btn btn-ride" id="btn-p2-ride">RIDE</div>
                <div class="btn" id="btn-p2-left">◀</div>
                <div class="btn" id="btn-p2-right">▶</div>
            </div>
        </div>
    </div>

    <div id="gameOverScreen">
        <div class="win-text" id="winnerText">PLAYER 1 WINS!</div>
        <div style="color:white; margin-bottom: 20px; font-size: 20px;" id="finalScores">P1: 0 | P2: 0</div>
        <button class="restart-btn" onclick="resetGame()">PLAY AGAIN</button>
    </div>
</div>
