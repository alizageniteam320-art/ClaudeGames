<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Co-op Coin Collectors</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Fredoka', 'Trebuchet MS', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 800px;
            max-width: 100vw;
            height: 600px;
            max-height: 75vw; /* maintain 4:3 aspect */
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
        }
        #controls-hint {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #a0a0b5;
        }
        .key-hint {
            display: inline-block;
            background: #333;
            padding: 4px 8px;
            border-radius: 4px;
            margin: 0 4px;
            color: #fff;
            border: 1px solid #555;
            box-shadow: 0 2px 0 #000;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>
<div id="controls-hint">
    P1 (Red): <span class="key-hint">Arrows</span> to Move/Jump &nbsp;&nbsp;|&nbsp;&nbsp; 
    P2 (Green): <span class="key-hint">WASD</span> to Move/Jump &nbsp;&nbsp;|&nbsp;&nbsp;
    <span class="key-hint">M</span> to Mute
</div>
