<script>
// Polyfill for localStorage and sessionStorage to prevent SecurityError in data: iframes
(function() {
    try {
        window.localStorage;
        window.sessionStorage;
    } catch (e) {
        // Storage access is blocked, implement in-memory polyfill
        const createStorage = () => {
            let store = {};
            return {
                getItem: (key) => store[key] || null,
                setItem: (key, value) => { store[key] = String(value); },
                removeItem: (key) => { delete store[key]; },
                clear: () => { store = {}; },
                key: (index) => Object.keys(store)[index] || null,
                get length() { return Object.keys(store).length; }
            };
        };
        
        try {
            Object.defineProperty(window, 'localStorage', { value: createStorage() });
            Object.defineProperty(window, 'sessionStorage', { value: createStorage() });
        } catch (defineError) {
             console.warn('Unable to define global storage properties:', defineError);
        }
    }
})();
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Duck Hunt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to bottom, #0a0a2e 0%, #1a1a5e 40%, #2d5a27 100%);
            font-family: 'Courier New', monospace;
            cursor: none;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            display: block;
            margin: 0 auto;
            border: 4px solid #8B4513;
            box-shadow: 0 0 40px rgba(100, 200, 255, 0.4), 0 0 80px rgba(50, 100, 200, 0.2);
            border-radius: 4px;
        }

        .ui {
            position: absolute;
            top: 15px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(100, 220, 255, 0.9), 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .ui div {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(100, 220, 255, 0.5);
            border-radius: 8px;
            padding: 6px 16px;
            backdrop-filter: blur(4px);
            letter-spacing: 1px;
        }

        .ui span {
            color: #7df9ff;
        }

        .crosshair {
            position: fixed;
            width: 44px;
            height: 44px;
            pointer-events: none;
            z-index: 100;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 4px rgba(255, 80, 80, 0.8));
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(10,10,40,0.97) 0%, rgba(20,20,80,0.97) 100%);
            color: white;
            padding: 40px 50px;
            border-radius: 20px;
            text-align: center;
            font-size: 24px;
            display: none;
            z-index: 200;
            border: 2px solid rgba(100, 220, 255, 0.6);
            box-shadow: 0 0 40px rgba(100, 200, 255, 0.3), inset 0 0 40px rgba(0,0,50,0.5);
        }

        .game-over h2 {
            font-size: 42px;
            color: #ff4444;
            text-shadow: 0 0 20px rgba(255, 50, 50, 0.8);
            margin-bottom: 20px;
            letter-spacing: 4px;
            animation: pulse 1s infinite alternate;
        }

        .game-over p {
            margin: 10px 0;
            color: #aad4ff;
            font-size: 20px;
        }

        .game-over p span {
            color: #7df9ff;
            font-weight: bold;
        }

        @keyframes pulse {
            from { text-shadow: 0 0 10px rgba(255, 50, 50, 0.6); }
            to   { text-shadow: 0 0 30px rgba(255, 50, 50, 1), 0 0 60px rgba(255, 100, 100, 0.5); }
        }

        .restart-btn {
            background: linear-gradient(135deg, #1a7a2e, #2ecc71);
            color: white;
            border: 2px solid #2ecc71;
            padding: 14px 36px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 24px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 2px;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.4);
        }

        .restart-btn:hover {
            background: linear-gradient(135deg, #2ecc71, #1a7a2e);
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.8);
            transform: scale(1.05);
        }

        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle linear infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.4); }
        }
    </style>
</head>

    <script>
    // ─── GAME ENGINE ────────────────────────────────────────────────────────────
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const W = canvas.width;
        const H = canvas.height;

        // ── Audio ──────────────────────────────────────────────────────────────
        let audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }

        function playShot() {
            try {
                const ac = getAudioCtx();
                const buf = ac.createBuffer(1, ac.sampleRate * 0.15, ac.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < data.length; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
                }
                const src = ac.createBufferSource();
                src.buffer = buf;
                const gain = ac.createGain();
                gain.gain.setValueAtTime(0.4, ac.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.15);
                src.connect(gain);
                gain.connect(ac.destination);
                src.start();
            } catch(e) {}
        }

        function playHit() {
            try {
                const ac = getAudioCtx();
                const osc = ac.createOscillator();
                const gain = ac.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, ac.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, ac.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, ac.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ac.destination);
                osc.start();
                osc.stop(ac.currentTime + 0.3);
            } catch(e) {}
        }

        function playMiss() {
            try {
                const ac = getAudioCtx();
                const osc = ac.createOscillator();
                const gain = ac.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, ac.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, ac.currentTime + 0.4);
                gain.gain.setValueAtTime(0.2, ac.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(ac.destination);
                osc.start();
                osc.stop(ac.currentTime + 0.4);
            } catch(e) {}
        }

        // ── State ──────────────────────────────────────────────────────────────
        let score = 0;
        let misses = 0;
        let round = 1;
        let gameRunning = true;
        let animFrameId = null;

        const MAX_MISSES = 10;
        const DUCK_HIT_RADIUS = 30;

        // ── Particles ──────────────────────────────────────────────────────────
        let particles = [];

        function spawnParticles(x, y, color) {
            for (let i = 0; i < 18; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    decay: Math.random() * 0.03 + 0.02,
                    size: Math.random() * 6 + 2,
                    color
                });
            }
        }

        function updateParticles() {
            particles = particles.filter(p => p.life > 0);
            for (const p of particles) {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.15; // gravity
                p.life -= p.decay;
                p.size *= 0.97;
            }
        }

        function drawParticles() {
            for (const p of particles) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(p.x, p.y, Math.max(0.1, p.size), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // ── Shot flashes ───────────────────────────────────────────────────────
        let shotFlashes = [];

        function spawnFlash(x, y, hit) {
            shotFlashes.push({ x, y, life: 1, hit });
        }

        function updateFlashes() {
            shotFlashes = shotFlashes.filter(f => f.life > 0);
            for (const f of shotFlashes) f.life -= 0.08;
        }

        function drawFlashes() {
            for (const f of shotFlashes) {
                ctx.save();
                ctx.globalAlpha = f.life * 0.7;
                const r = f.hit ? 40 : 25;
                const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
                grad.addColorStop(0, f.hit ? 'rgba(255,220,50,0.9)' : 'rgba(255,100,100,0.7)');
                grad.addColorStop(1, 'rgba(255,100,0,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(f.x, f.y, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // ── Floating score texts ───────────────────────────────────────────────
        let floatingTexts = [];

        function spawnFloatingText(x, y, text, color) {
            floatingTexts.push({ x, y, text, color, life: 1, vy: -1.5 });
        }

        function updateFloatingTexts() {
            floatingTexts = floatingTexts.filter(t => t.life > 0);
            for (const t of floatingTexts) {
                t.y += t.vy;
                t.life -= 0.018;
            }
        }

        function drawFloatingTexts() {
            for (const t of floatingTexts) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, t.life);
                ctx.font = 'bold 22px Courier New';
                ctx.fillStyle = t.color;
                ctx.shadowColor = t.color;
                ctx.shadowBlur = 10;
                ctx.textAlign = 'center';
                ctx.fillText(t.text, t.x, t.y);
                ctx.restore();
            }
        }

        // ── Ducks ──────────────────────────────────────────────────────────────
        const DUCK_COLORS = [
            { body: '#4fc3f7', wing: '#0288d1', beak: '#ff8f00', eye: '#1a237e' },
            { body: '#a5d6a7', wing: '#388e3c', beak: '#ff6f00', eye: '#1b5e20' },
            { body: '#ef9a9a', wing: '#c62828', beak: '#f9a825', eye: '#4a148c' },
            { body: '#fff176', wing: '#f9a825', beak: '#e65100', eye: '#212121' },
            { body: '#ce93d8', wing: '#7b1fa2', beak: '#ff8f00', eye: '#1a237e' },
        ];

        let ducks = [];
        let duckIdCounter = 0;

        function getDuckSpeed() {
            return 1.5 + round * 0.4 + Math.random() * 1.5;
        }

        function getDuckCount() {
            return Math.min(2 + Math.floor(round / 2), 7);
        }

        function spawnDuck() {
            const fromLeft = Math.random() < 0.5;
            const colorSet = DUCK_COLORS[Math.floor(Math.random() * DUCK_COLORS.length)];
            const speed = getDuckSpeed();
            const y = Math.random() * (H * 0.65) + 60;
            const wobbleAmp = Math.random() * 30 + 10;
            const wobbleFreq = Math.random() * 0.03 + 0.02;
            ducks.push({
                id: duckIdCounter++,
                x: fromLeft ? -50 : W + 50,
                y,
                baseY: y,
                vx: fromLeft ? speed : -speed,
                vy: 0,
                wobbleAmp,
                wobbleFreq,
                wobbleOffset: Math.random() * Math.PI * 2,
                colorSet,
                hit: false,
                hitTimer: 0,
                wingAngle: 0,
                wingDir: 1,
                size: 1.0 + Math.random() * 0.3,
                points: Math.round(10 * (1 + round * 0.3)),
                t: 0,
            });
        }

        function spawnRoundDucks() {
            ducks = [];
            const count = getDuckCount();
            for (let i = 0; i < count; i++) {
                setTimeout(() => spawnDuck(), i * 600);
            }
        }

        function updateDucks(dt) {
            for (let i = ducks.length - 1; i >= 0; i--) {
                const d = ducks[i];
                d.t += dt;

                if (d.hit) {
                    d.hitTimer += dt;
                    d.vy += 0.5; // fall
                    d.y += d.vy;
                    d.x += d.vx * 0.3;
                    if (d.y > H + 60) {
                        ducks.splice(i, 1);
                    }
                    continue;
                }

                // Wobble
                d.y = d.baseY + Math.sin(d.t * d.wobbleFreq * 60 + d.wobbleOffset) * d.wobbleAmp;
                d.x += d.vx;

                // Wing flap
                d.wingAngle += d.wingDir * 0.18;
                if (Math.abs(d.wingAngle) > 0.6) d.wingDir *= -1;

                // Off screen → miss
                if ((d.vx > 0 && d.x > W + 80) || (d.vx < 0 && d.x < -80)) {
                    ducks.splice(i, 1);
                    misses++;
                    updateUI();
                    playMiss();
                    if (misses >= MAX_MISSES) {
                        endGame();
                        return;
                    }
                }
            }
        }

        function drawDuck(d) {
            ctx.save();
            ctx.translate(d.x, d.y);
            const flip = d.vx < 0 ? -1 : 1;
            ctx.scale(flip * d.size, d.size);

            if (d.hit) {
                ctx.rotate(d.hitTimer * 0.15);
                ctx.globalAlpha = Math.max(0.2, 1 - d.hitTimer * 0.04);
            }

            const c = d.colorSet;

            // Shadow
            ctx.save();
            ctx.globalAlpha *= 0.15;
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.ellipse(0, 28, 22, 7, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Wing (back)
            ctx.save();
            ctx.rotate(-d.wingAngle * 0.5);
            ctx.fillStyle = c.wing;
            ctx.beginPath();
            ctx.ellipse(-5, 2, 18, 9, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Body
            ctx.fillStyle = c.body;
            ctx.beginPath();
            ctx.ellipse(0, 0, 22, 15, 0, 0, Math.PI * 2);
            ctx.fill();

            // Wing (front)
            ctx.save();
            ctx.rotate(d.wingAngle);
            ctx.fillStyle = c.wing;
            ctx.beginPath();
            ctx.ellipse(4, -2, 16, 8, 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Head
            ctx.fillStyle = c.body;
            ctx.beginPath();
            ctx.arc(20, -10, 11, 0, Math.PI * 2);
            ctx.fill();

            // Eye
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(23, -12, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = c.eye;
            ctx.beginPath();
            ctx.arc(24, -12, 2.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(24.8, -12.8, 0.8, 0, Math.PI * 2);
            ctx.fill();

            // Beak
            ctx.fillStyle = c.beak;
            ctx.beginPath();
            ctx.moveTo(29, -10);
            ctx.lineTo(38, -8);
            ctx.lineTo(29, -6);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function drawDucks() {
            for (const d of ducks) drawDuck(d);
        }

        // ── Background ─────────────────────────────────────────────────────────
        function drawBackground() {
            // Sky gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.72);
            skyGrad.addColorStop(0, '#0a0a2e');
            skyGrad.addColorStop(0.5, '#1a1a6e');
            skyGrad.addColorStop(1, '#1a3a6e');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, W, H * 0.72);

            // Moon
            ctx.save();
            ctx.fillStyle = '#fffde7';
            ctx.shadowColor = '#fff9c4';
            ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.arc(W * 0.82, 80, 38, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1a1a5e';
            ctx.beginPath();
            ctx.arc(W * 0.82 + 14, 72, 32, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Distant hills
            ctx.fillStyle = '#0d2b0d';
            ctx.beginPath();
            ctx.moveTo(0, H * 0.72);
            for (let x = 0; x <= W; x += 60) {
                const hillH = 60 + Math.sin(x * 0.015) * 40 + Math.cos(x * 0.008) * 30;
                ctx.lineTo(x, H * 0.72 - hillH);
            }
            ctx.lineTo(W, H * 0.72);
            ctx.closePath();
            ctx.fill();

            // Ground
            const groundGrad = ctx.createLinearGradient(0, H * 0.72, 0, H);
            groundGrad.addColorStop(0, '#2d5a27');
            groundGrad.addColorStop(0.3, '#1e3d1a');
            groundGrad.addColorStop(1, '#0f1f0d');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, H * 0.72, W, H * 0.28);

            // Grass tufts
            ctx.strokeStyle = '#3a7a30';
            ctx.lineWidth = 2;
            for (let x = 20; x < W; x += 35) {
                const gx = x + Math.sin(x) * 5;
                const gy = H * 0.72 + 2;
                ctx.beginPath();
                ctx.moveTo(gx, gy);
                ctx.lineTo(gx - 5, gy - 12);
                ctx.moveTo(gx, gy);
                ctx.lineTo(gx, gy - 15);
                ctx.moveTo(gx, gy);
                ctx.lineTo(gx + 5, gy - 12);
                ctx.stroke();
            }

            // Trees
            drawTree(120, H * 0.72);
            drawTree(300, H * 0.72);
            drawTree(W - 150, H * 0.72);
            drawTree(W - 320, H * 0.72);
            drawTree(W * 0.5, H * 0.72);
        }

        function drawTree(x, y) {
            ctx.save();
            // Trunk
            ctx.fillStyle = '#3e2723';
            ctx.fillRect(x - 7, y - 55, 14, 55);
            // Foliage layers
            const layers = [
                { yOff: -55, r: 38 },
                { yOff: -80, r: 32 },
                { yOff: -102, r: 24 },
            ];
            for (const l of layers) {
                ctx.fillStyle = '#1b5e20';
                ctx.beginPath();
                ctx.arc(x, y + l.yOff, l.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#2e7d32';
                ctx.beginPath();
                ctx.arc(x - 6, y + l.yOff - 6, l.r * 0.6, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        // ── HUD ────────────────────────────────────────────────────────────────
        function drawHUD() {
            // Miss indicators
            const barX = 20;
            const barY = H - 38;
            ctx.save();
            ctx.font = 'bold 14px Courier New';
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.fillText('LIVES:', barX, barY + 14);
            for (let i = 0; i < MAX_MISSES; i++) {
                ctx.fillStyle = i < misses ? '#ff4444' : '#44ff88';
                ctx.shadowColor = i < misses ? '#ff0000' : '#00ff44';
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(barX + 65 + i * 22, barY + 8, 7, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            // Round banner (brief)
            if (roundBannerTimer > 0) {
                ctx.save();
                ctx.globalAlpha = Math.min(1, roundBannerTimer / 40);
                ctx.font = 'bold 48px Courier New';
                ctx.fillStyle = '#7df9ff';
                ctx.shadowColor = '#00cfff';
                ctx.shadowBlur = 20;
                ctx.textAlign = 'center';
                ctx.fillText(`ROUND ${round}`, W / 2, H / 2 - 20);
                ctx.font = '24px Courier New';
                ctx.fillStyle = '#fff';
                ctx.fillText(`${getDuckCount()} ducks incoming!`, W / 2, H / 2 + 20);
                ctx.restore();
                roundBannerTimer--;
            }
        }

        let roundBannerTimer = 80;

        // ── UI update ──────────────────────────────────────────────────────────
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('misses').textContent = misses;
            document.getElementById('round').textContent = round;
        }

        // ── Round management ───────────────────────────────────────────────────
        let roundCheckTimer = 0;

        function checkRoundComplete() {
            roundCheckTimer++;
            // Wait a bit after all ducks are gone before advancing
            if (ducks.length === 0 && roundCheckTimer > 120) {
                roundCheckTimer = 0;
                round++;
                updateUI();
                roundBannerTimer = 120;
                spawnRoundDucks();
            }
        }

        // ── Shooting ───────────────────────────────────────────────────────────
        function getCanvasMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = W / rect.width;
            const scaleY = H / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        canvas.addEventListener('click', (e) => {
            if (!gameRunning) return;
            const pos = getCanvasMousePos(e);
            playShot();
            spawnFlash(pos.x, pos.y, false);

            let hit = false;
            for (let i = ducks.length - 1; i >= 0; i--) {
                const d = ducks[i];
                if (d.hit) continue;
                const dx = pos.x - d.x;
                const dy = pos.y - d.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < DUCK_HIT_RADIUS * d.size) {
                    d.hit = true;
                    d.vy = -4;
                    score += d.points;
                    updateUI();
                    playHit();
                    spawnParticles(d.x, d.y, d.colorSet.body);
                    spawnFlash(d.x, d.y, true);
                    spawnFloatingText(d.x, d.y - 20, `+${d.points}`, '#ffe066');
                    hit = true;
                    break;
                }
            }

            if (!hit) {
                misses++;
                updateUI();
                if (misses >= MAX_MISSES) {
                    endGame();
                }
            }
        });

        // ── Game over / restart ────────────────────────────────────────────────
        function endGame() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalRound').textContent = round;
            document.getElementById('gameOver').style.display = 'block';
            if (animFrameId) {
                cancelAnimationFrame(animFrameId);
                animFrameId = null;
            }
        }

        window.restartGame = function() {
            score = 0;
            misses = 0;
            round = 1;
            gameRunning = true;
            ducks = [];
            particles = [];
            shotFlashes = [];
            floatingTexts = [];
            roundBannerTimer = 80;
            roundCheckTimer = 0;
            updateUI();
            document.getElementById('gameOver').style.display = 'none';
            spawnRoundDucks();
            if (animFrameId) cancelAnimationFrame(animFrameId);
            gameLoop();
        };

        // ── Main loop ──────────────────────────────────────────────────────────
        let lastTime = 0;

        function gameLoop(timestamp) {
            if (!gameRunning) return;
            animFrameId = requestAnimationFrame(gameLoop);

            const dt = Math.min((timestamp - lastTime) / 16.67, 3);
            lastTime = timestamp;

            ctx.clearRect(0, 0, W, H);

            drawBackground();
            updateDucks(dt);
            drawDucks();
            updateParticles();
            drawParticles();
            updateFlashes();
            drawFlashes();
            updateFloatingTexts();
            drawFloatingTexts();
            drawHUD();

            if (gameRunning) checkRoundComplete();
        }

        // ── Init ───────────────────────────────────────────────────────────────
        updateUI();
        spawnRoundDucks();
        requestAnimationFrame(gameLoop);

    })();
    </script>

    <script>
        // Post-load canvas enhancement: vignette + scanlines overlay
        window.addEventListener('load', () => {
            const canvas = document.getElementById('gameCanvas');
            if (!canvas) return;

            const overlay = document.createElement('canvas');
            overlay.width = canvas.width;
            overlay.height = canvas.height;
            overlay.style.cssText = `
                position: fixed;
                pointer-events: none;
                z-index: 4;
                border-radius: 4px;
            `;

            function positionOverlay() {
                const rect = canvas.getBoundingClientRect();
                overlay.style.left = rect.left + 'px';
                overlay.style.top = rect.top + 'px';
                overlay.style.width = rect.width + 'px';
                overlay.style.height = rect.height + 'px';
            }

            document.body.appendChild(overlay);
            positionOverlay();
            window.addEventListener('resize', positionOverlay);

            const octx = overlay.getContext('2d');

            // Pre-render static scanlines once
            const scanCanvas = document.createElement('canvas');
            scanCanvas.width = overlay.width;
            scanCanvas.height = overlay.height;
            const sctx = scanCanvas.getContext('2d');
            sctx.fillStyle = 'rgba(0,0,0,0.04)';
            for (let y = 0; y < overlay.height; y += 4) {
                sctx.fillRect(0, y, overlay.width, 2);
            }

            // Pre-render vignette once
            const vigCanvas = document.createElement('canvas');
            vigCanvas.width = overlay.width;
            vigCanvas.height = overlay.height;
            const vctx = vigCanvas.getContext('2d');
            const vignette = vctx.createRadialGradient(
                overlay.width / 2, overlay.height / 2, overlay.height * 0.3,
                overlay.width / 2, overlay.height / 2, overlay.height * 0.85
            );
            vignette.addColorStop(0, 'rgba(0,0,0,0)');
            vignette.addColorStop(1, 'rgba(0,0,20,0.55)');
            vctx.fillStyle = vignette;
            vctx.fillRect(0, 0, overlay.width, overlay.height);

            function drawOverlay() {
                octx.clearRect(0, 0, overlay.width, overlay.height);
                octx.drawImage(vigCanvas, 0, 0);
                octx.drawImage(scanCanvas, 0, 0);
                requestAnimationFrame(drawOverlay);
            }

            drawOverlay();
        });
    </script>
