<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade Table Tennis</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1e272e;
            overflow: hidden;
            touch-action: none; /* Prevents pull-to-refresh and scrolling */
        }
        
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background: #1e272e;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            cursor: none; /* Hide default cursor during gameplay */
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(30, 39, 46, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: white;
            font-family: 'Courier New', Courier, monospace;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 4px 4px 0px #000;
            text-align: center;
        }

        h2 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #f1c40f;
            text-shadow: 2px 2px 0px #000;
            text-align: center;
        }

        .btn {
            padding: 15px 40px;
            font-size: 2rem;
            background-color: #27ae60;
            color: white;
            border: 4px solid white;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 6px 6px 0px #000;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:active {
            transform: translate(6px, 6px);
            box-shadow: 0px 0px 0px #000;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            h2 { font-size: 1.8rem; }
            .btn { font-size: 1.5rem; padding: 12px 30px; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="1000" height="800"></canvas>
        
        <div id="ui-layer">
            <h1 id="title-text">Table Tennis</h1>
            <h2 id="winner-text" class="hidden"></h2>
            <button class="btn" id="start-btn">Play Game</button>
        </div>
    </div>
