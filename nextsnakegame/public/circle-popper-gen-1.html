<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Circle Popper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

        body {
            overflow: hidden;
            font-family: 'Fredoka One', 'Arial Black', sans-serif;
            background: #0a0e27;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        #gameCanvas {
            z-index: 1;
        }

        #uiOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .ui-element {
            pointer-events: auto;
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 15px 20px;
            z-index: 10;
        }

        .hud-box {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 8px 18px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-align: center;
            min-width: 100px;
        }

        .hud-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 2px;
        }

        .hud-value {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        #missesValue {
            color: #ff6b6b;
        }

        #scoreValue {
            color: #ffd93d;
        }

        #timeValue {
            color: #6bcb77;
        }

        #comboDisplay {
            position: absolute;
            top: 85px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 22px;
            color: #ff9f43;
            text-shadow: 0 0 20px rgba(255, 159, 67, 0.8);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 10;
        }

        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background: radial-gradient(ellipse at center, rgba(10, 14, 39, 0.85) 0%, rgba(10, 14, 39, 0.98) 100%);
            pointer-events: auto;
        }

        #gameOverScreen {
            display: none;
        }

        .screen-title {
            font-size: 52px;
            color: #fff;
            text-shadow: 0 0 30px rgba(255, 215, 61, 0.8), 0 0 60px rgba(255, 215, 61, 0.4);
            margin-bottom: 10px;
            animation: titlePulse 2s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .screen-subtitle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
            text-align: center;
            line-height: 1.6;
        }

        .game-btn {
            font-family: 'Fredoka One', 'Arial Black', sans-serif;
            font-size: 24px;
            padding: 15px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            pointer-events: auto;
        }

        .btn-play {
            background: linear-gradient(135deg, #6bcb77, #4ecca3);
            color: #fff;
            box-shadow: 0 8px 25px rgba(107, 203, 119, 0.4), inset 0 -3px 0 rgba(0,0,0,0.2);
        }

        .btn-play:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(107, 203, 119, 0.6), inset 0 -3px 0 rgba(0,0,0,0.2);
        }

        .btn-play:active {
            transform: translateY(0px);
            box-shadow: 0 4px 15px rgba(107, 203, 119, 0.4), inset 0 -1px 0 rgba(0,0,0,0.2);
        }

        .btn-restart {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: #fff;
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4), inset 0 -3px 0 rgba(0,0,0,0.2);
        }

        .btn-restart:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(255, 107, 107, 0.6), inset 0 -3px 0 rgba(0,0,0,0.2);
        }

        .final-score {
            font-size: 64px;
            color: #ffd93d;
            text-shadow: 0 0 30px rgba(255, 217, 61, 0.8);
            margin: 15px 0;
        }

        .stats-row {
            display: flex;
            gap: 30px;
            margin: 20px 0 30px 0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 28px;
            color: #fff;
        }

        .difficulty-select {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        .diff-btn {
            font-family: 'Fredoka One', 'Arial Black', sans-serif;
            font-size: 14px;
            padding: 8px 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            background: transparent;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            transition: all 0.3s;
            pointer-events: auto;
        }

        .diff-btn.active {
            border-color: #ffd93d;
            color: #ffd93d;
            background: rgba(255, 217, 61, 0.15);
            box-shadow: 0 0 15px rgba(255, 217, 61, 0.3);
        }

        .diff-btn:hover {
            border-color: rgba(255,255,255,0.6);
            color: rgba(255,255,255,0.9);
        }

        /* Floating decorative circles on start screen */
        .deco-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            animation: floatAround 8s ease-in-out infinite;
        }

        @keyframes floatAround {
            0%, 100% { transform: translateY(0px) scale(1); }
            33% { transform: translateY(-20px) scale(1.1); }
            66% { transform: translateY(10px) scale(0.95); }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="hud" style="display:none;">
        <div class="hud-box">
            <div class="hud-label">Misses</div>
            <div class="hud-value" id="missesValue">0/5</div>
        </div>
        <div class="hud-box">
            <div class="hud-label">Score</div>
            <div class="hud-value" id="scoreValue">0</div>
        </div>
        <div class="hud-box">
            <div class="hud-label">Time</div>
            <div class="hud-value" id="timeValue">30s</div>
        </div>
    </div>

    <div id="comboDisplay">🔥 Combo x1</div>

    <div id="startScreen">
        <div class="deco-circle" style="width:120px;height:120px;background:#ff6b6b;top:10%;left:10%;animation-delay:0s;"></div>
        <div class="deco-circle" style="width:80px;height:80px;background:#ffd93d;top:20%;right:15%;animation-delay:1s;"></div>
        <div class="deco-circle" style="width:100px;height:100px;background:#6bcb77;bottom:15%;left:20%;animation-delay:2s;"></div>
        <div class="deco-circle" style="width:60px;height:60px;background:#74b9ff;bottom:25%;right:10%;animation-delay:3s;"></div>
        <div class="deco-circle" style="width:90px;height:90px;background:#a29bfe;top:50%;left:5%;animation-delay:1.5s;"></div>

        <div class="screen-title">🎯 Circle Popper</div>
        <div class="screen-subtitle">
            Pop the circles before they vanish!<br>
            Smaller circles = more points. Don't miss too many!
        </div>
        <div class="difficulty-select">
            <button class="diff-btn active" data-diff="easy" onclick="setDifficulty('easy', this)">Easy</button>
            <button class="diff-btn" data-diff="medium" onclick="setDifficulty('medium', this)">Medium</button>
            <button class="diff-btn" data-diff="hard" onclick="setDifficulty('hard', this)">Hard</button>
        </div>
        <button class="game-btn btn-play ui-element" id="playBtn">▶ Play</button>
    </div>

    <div id="gameOverScreen">
        <div class="screen-title">Game Over!</div>
        <div class="screen-subtitle">Your Score</div>
        <div class="final-score" id="finalScore">0</div>
        <div class="stats-row">
            <div class="stat-item">
                <div class="stat-value" id="statPopped">0</div>
                <div class="stat-label">Popped</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statMaxCombo">0</div>
                <div class="stat-label">Max Combo</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statAccuracy">0%</div>
                <div class="stat-label">Accuracy</div>
            </div>
        </div>
        <button class="game-btn btn-restart ui-element" id="restartBtn">🔄 Play Again</button>
    </div>

</body>
</html>
