<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Apex: Enhanced Racing</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff007f;
            --neon-yellow: #ffea00;
            --neon-green: #00ff66;
            --ui-bg: rgba(10, 10, 15, 0.85);
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: var(--font-main);
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #050508;
            overflow: hidden;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 600px;
            background: #000;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.2);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI HUD */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 15px;
            width: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
        }

        .hud-box {
            background: var(--ui-bg);
            border: 2px solid var(--neon-blue);
            border-radius: 4px;
            padding: 8px 12px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
            color: white;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
            text-align: center;
            backdrop-filter: blur(5px);
            transform: skewX(-10deg);
        }

        .hud-box > div {
            transform: skewX(10deg);
        }

        .hud-value {
            font-size: 22px;
            color: var(--neon-blue);
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px var(--neon-blue);
            margin-top: 2px;
            font-weight: bold;
            transition: color 0.2s, text-shadow 0.2s;
        }

        .center-hud {
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
        }

        .center-hud .hud-value {
            color: var(--neon-pink);
            text-shadow: 0 0 5px var(--neon-pink);
            font-size: 26px;
        }

        /* Nitro Bar */
        .nitro-container {
            width: 120px;
            height: 12px;
            background: #111;
            border: 1px solid var(--neon-yellow);
            margin-top: 8px;
            position: relative;
            transform: skewX(-10deg);
        }

        #nitro-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff9d00, #ffea00);
            box-shadow: 0 0 10px #ffea00;
            transition: width 0.1s linear;
        }

        #env-indicator {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-weight: bold;
            letter-spacing: 3px;
            font-size: 14px;
            text-shadow: 0 0 5px #fff;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        /* Screens */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 8, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .hidden { display: none !important; }

        h1 {
            color: var(--neon-blue);
            font-size: 48px;
            text-shadow: 0 0 20px var(--neon-blue), 0 0 5px #fff;
            margin-bottom: 5px;
            text-align: center;
            font-style: italic;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        p {
            color: #ccc;
            font-size: 16px;
            margin-bottom: 20px;
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
        }

        .powerups-info {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        
        .pu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            color: #aaa;
            font-weight: bold;
            text-transform: uppercase;
        }

        .pu-icon {
            width: 30px; height: 30px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; color: #000;
            margin-bottom: 5px;
            font-size: 16px;
        }

        .btn {
            background: rgba(0, 243, 255, 0.1);
            border: 2px solid var(--neon-blue);
            color: #fff;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3), inset 0 0 10px rgba(0, 243, 255, 0.2);
            transition: all 0.2s ease;
            letter-spacing: 2px;
            transform: skewX(-10deg);
        }

        .btn span { display: block; transform: skewX(10deg); }
        .btn:hover, .btn:active {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.8);
        }

        /* Mobile Controls */
        #mobile-controls {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 20px;
            pointer-events: auto;
            width: 100%;
        }

        .control-group { display: flex; gap: 15px; }

        .ctrl-btn {
            width: 60px;
            height: 60px;
            background: rgba(10, 10, 15, 0.6);
            border: 2px solid var(--neon-blue);
            border-radius: 50%;
            color: var(--neon-blue);
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
            cursor: pointer;
            transition: all 0.1s;
        }

        .ctrl-btn:active, .ctrl-btn.active {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.8);
            transform: scale(0.9);
        }

        .ctrl-btn.nitro-btn {
            border-color: var(--neon-yellow);
            color: var(--neon-yellow);
            box-shadow: 0 0 10px rgba(255, 234, 0, 0.2);
        }
        .ctrl-btn.nitro-btn:active, .ctrl-btn.nitro-btn.active {
            background: var(--neon-yellow);
            box-shadow: 0 0 20px rgba(255, 234, 0, 0.8);
        }
        .ctrl-btn.brake-btn {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }
        .ctrl-btn.brake-btn:active, .ctrl-btn.brake-btn.active {
            background: var(--neon-pink);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.8);
        }

        @media (min-width: 768px) {
            #mobile-controls { display: none; }
            .hud-box { padding: 12px 20px; }
            .hud-value { font-size: 28px; }
            .nitro-container { width: 150px; height: 15px; }
            h1 { font-size: 64px; }
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="top-hud">
            <div class="hud-box">
                <div>Score<div class="hud-value" id="score-value">0</div></div>
            </div>
            <div class="hud-box center-hud">
                <div>
                    Speed
                    <div class="hud-value" id="speed-value">0</div>
                    <div class="nitro-container">
                        <div id="nitro-fill"></div>
                    </div>
                </div>
            </div>
            <div class="hud-box">
                <div>Armor<div class="hud-value" id="health-value">100%</div></div>
            </div>
        </div>
        
        <div id="env-indicator">NEON CITY</div>

        <div id="mobile-controls">
            <div class="control-group">
                <div class="ctrl-btn" id="btn-left">◀</div>
                <div class="ctrl-btn" id="btn-right">▶</div>
            </div>
            <div class="control-group">
                <div class="ctrl-btn brake-btn" id="btn-brake">B</div>
                <div class="ctrl-btn nitro-btn" id="btn-nitro">N</div>
            </div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen">
        <h1>NEON APEX</h1>
        <p>Drive fast. Collect Power-ups. Survive.</p>
        
        <div class="powerups-info">
            <div class="pu-item">
                <div class="pu-icon" style="background: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue);">S</div>
                Shield
            </div>
            <div class="pu-item">
                <div class="pu-icon" style="background: var(--neon-green); box-shadow: 0 0 10px var(--neon-green);">+</div>
                Repair
            </div>
            <div class="pu-item">
                <div class="pu-icon" style="background: var(--neon-yellow); box-shadow: 0 0 10px var(--neon-yellow);">N</div>
                Nitro
            </div>
        </div>

        <div style="display: flex; gap: 15px; margin-bottom: 30px; color: #aaa; font-family: monospace; font-size: 14px;">
            <div>[ARROWS/AD] Drive</div>
            <div>[S/DOWN] Brake</div>
            <div>[SPACE] Nitro</div>
        </div>
        <button class="btn" id="start-btn"><span>Start Engine</span></button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="screen hidden">
        <h1 style="color: var(--neon-pink); text-shadow: 0 0 20px var(--neon-pink);">WRECKED</h1>
        <p>Your supercar took too much damage.</p>
        <p style="font-size: 24px; color: var(--neon-blue); font-weight: bold; margin-bottom: 40px;">Final Score: <span id="final-score">0</span></p>
        <button class="btn" id="restart-btn" style="border-color: var(--neon-pink);"><span>Race Again</span></button>
    </div>
</div>
