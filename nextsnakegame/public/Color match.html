<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Match</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(180deg, #f0f0f0 0%, #e0e0e0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Nunito', sans-serif;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 700px;
            min-height: 100vh;
            background: linear-gradient(180deg, #f8f8f8 0%, #ececec 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
        }

        /* Top Bar */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .menu-btn, .power-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            background: #333;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .menu-btn:hover, .power-btn:hover {
            transform: scale(1.1);
        }

        /* Timer Section */
        .timer-section {
            width: 80%;
            margin-top: 10px;
            text-align: center;
        }

        .timer-bar-bg {
            width: 100%;
            height: 28px;
            background: #d0d0d0;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
        }

        .timer-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff3333, #ff6666);
            border-radius: 14px;
            transition: width 0.1s linear;
            box-shadow: 0 2px 8px rgba(255,50,50,0.4);
        }

        .timer-text {
            font-family: 'Fredoka One', cursive;
            font-size: 18px;
            color: #333;
            margin-top: 6px;
            letter-spacing: 2px;
        }

        /* Color Word */
        .color-word {
            font-family: 'Fredoka One', cursive;
            font-size: 100px;
            margin-top: 40px;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.1);
            transition: all 0.3s;
            letter-spacing: 4px;
        }

        /* Instruction */
        .instruction {
            font-size: 16px;
            color: #888;
            margin-top: 10px;
            font-weight: 700;
        }

        /* Color Buttons */
        .color-buttons {
            display: flex;
            gap: 20px;
            margin-top: 50px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 20px;
        }

        .color-btn {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2), 0 8px 20px rgba(0,0,0,0.15);
        }

        .color-btn::after {
            content: '';
            position: absolute;
            top: 12px;
            left: 20px;
            width: 35px;
            height: 20px;
            background: rgba(255,255,255,0.35);
            border-radius: 50%;
            transform: rotate(-30deg);
        }

        .color-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 0 rgba(0,0,0,0.2), 0 12px 25px rgba(0,0,0,0.2);
        }

        .color-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.2), 0 4px 10px rgba(0,0,0,0.1);
        }

        .color-btn.red { background: radial-gradient(circle at 35% 35%, #ff5555, #cc0000); }
        .color-btn.blue { background: radial-gradient(circle at 35% 35%, #5588ff, #0044cc); }
        .color-btn.green { background: radial-gradient(circle at 35% 35%, #55dd55, #00aa00); }
        .color-btn.yellow { background: radial-gradient(circle at 35% 35%, #ffdd55, #ddaa00); }
        .color-btn.purple { background: radial-gradient(circle at 35% 35%, #bb66ff, #8800cc); }
        .color-btn.orange { background: radial-gradient(circle at 35% 35%, #ffaa44, #dd7700); }

        /* Bottom Bar */
        .bottom-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            position: absolute;
            bottom: 0;
        }

        .score-text {
            font-family: 'Fredoka One', cursive;
            font-size: 26px;
            color: #333;
        }

        .round-text {
            font-family: 'Fredoka One', cursive;
            font-size: 26px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .round-icon {
            width: 28px;
            height: 28px;
            border: 4px solid #888;
            border-radius: 50%;
        }

        /* Feedback Overlay */
        .feedback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-family: 'Fredoka One', cursive;
            font-size: 60px;
            z-index: 10;
            pointer-events: none;
            transition: all 0.3s;
        }

        .feedback.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .feedback.correct {
            color: #00cc44;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
        }

        .feedback.wrong {
            color: #cc0000;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
        }

        .feedback.timeout {
            color: #ff8800;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
        }

        /* Start Screen */
        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #2c3e50 0%, #1a252f 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            transition: opacity 0.5s;
        }

        .screen-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .screen-overlay h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 56px;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }

        .screen-overlay h1 .c1 { color: #ff4444; }
        .screen-overlay h1 .c2 { color: #4488ff; }
        .screen-overlay h1 .c3 { color: #44dd44; }
        .screen-overlay h1 .c4 { color: #ffcc00; }
        .screen-overlay h1 .c5 { color: #ff4444; }
        .screen-overlay h1 .c6 { color: #4488ff; }
        .screen-overlay h1 .c7 { color: #44dd44; }
        .screen-overlay h1 .c8 { color: #ffcc00; }
        .screen-overlay h1 .c9 { color: #bb66ff; }
        .screen-overlay h1 .c10 { color: #ff8844; }

        .screen-overlay .subtitle {
            color: #aaa;
            font-size: 18px;
            margin-bottom: 40px;
            text-align: center;
            padding: 0 30px;
            line-height: 1.6;
        }

        .start-btn {
            font-family: 'Fredoka One', cursive;
            font-size: 28px;
            padding: 16px 60px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(180deg, #ff5555, #cc2222);
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0 #991111, 0 8px 20px rgba(0,0,0,0.3);
            transition: all 0.15s;
            letter-spacing: 2px;
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 0 #991111, 0 12px 25px rgba(0,0,0,0.35);
        }

        .start-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #991111, 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Results */
        .results-content {
            text-align: center;
        }

        .results-content h2 {
            font-family: 'Fredoka One', cursive;
            color: white;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .results-content .final-score {
            font-family: 'Fredoka One', cursive;
            font-size: 80px;
            color: #ffcc00;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }

        .results-content .final-label {
            font-family: 'Fredoka One', cursive;
            font-size: 22px;
            color: #aaa;
            margin-bottom: 10px;
        }

        .results-content .grade {
            font-family: 'Fredoka One', cursive;
            font-size: 28px;
            margin: 15px 0 30px;
        }

        .stars {
            font-size: 50px;
            margin-bottom: 20px;
        }

        /* Character */
        .character {
            position: absolute;
            right: 10px;
            bottom: 80px;
            width: 100px;
            height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .char-head {
            width: 50px;
            height: 50px;
            background: #ffcc88;
            border-radius: 50%;
            position: relative;
        }

        .char-hair {
            position: absolute;
            top: -8px;
            left: 5px;
            width: 45px;
            height: 25px;
            background: #6b3a1f;
            border-radius: 50% 50% 0 0;
        }

        .char-eyes {
            position: absolute;
            top: 18px;
            left: 12px;
            width: 8px;
            height: 8px;
            background: #333;
            border-radius: 50%;
            box-shadow: 18px 0 0 #333;
        }

        .char-mouth {
            position: absolute;
            bottom: 8px;
            left: 15px;
            width: 20px;
            height: 10px;
            background: #cc4444;
            border-radius: 0 0 10px 10px;
        }

        .char-body {
            width: 45px;
            height: 45px;
            background: #ffcc00;
            border-radius: 8px;
            margin-top: -2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .char-star {
            color: #ff8800;
            font-size: 22px;
        }

        .char-legs {
            display: flex;
            gap: 8px;
            margin-top: 2px;
        }

        .char-leg {
            width: 16px;
            height: 35px;
            background: #3366aa;
            border-radius: 0 0 6px 6px;
        }

        /* Shake animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }

        .shake {
            animation: shake 0.4s ease;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .pulse {
            animation: pulse 0.3s ease;
        }

        /* Responsive */
        @media (max-width: 500px) {
            .color-word { font-size: 65px; }
            .color-btn { width: 80px; height: 80px; }
            .color-buttons { gap: 14px; margin-top: 35px; }
            .score-text, .round-text { font-size: 20px; }
            .screen-overlay h1 { font-size: 40px; }
            .character { display: none; }
        }

        @media (max-height: 650px) {
            .color-word { font-size: 55px; margin-top: 15px; }
            .color-btn { width: 75px; height: 75px; }
            .color-buttons { gap: 12px; margin-top: 20px; }
            .timer-section { margin-top: 5px; }
        }

        /* Disabled state */
        .color-btn.disabled {
            pointer-events: none;
            opacity: 0.5;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Start Screen -->
    <div class="screen-overlay" id="start-screen">
        <h1>
            <span class="c1">C</span><span class="c2">O</span><span class="c3">L</span><span class="c4">O</span><span class="c5">R</span>
            &nbsp;
            <span class="c6">M</span><span class="c7">A</span><span class="c8">T</span><span class="c9">C</span><span class="c10">H</span>
        </h1>
        <p class="subtitle">
            Click the button that matches the <strong>WORD'S MEANING</strong>, not the color it's displayed in!<br><br>
            ⏱️ 5 seconds per round &nbsp;|&nbsp; 🎯 10 rounds
        </p>
        <button class="start-btn" onclick="startGame()">PLAY</button>
    </div>

    <!-- Results Screen -->
    <div class="screen-overlay hidden" id="results-screen">
        <div class="results-content">
            <h2>GAME OVER!</h2>
            <div class="stars" id="stars"></div>
            <div class="final-label">YOUR SCORE</div>
            <div class="final-score" id="final-score">0/10</div>
            <div class="grade" id="grade"></div>
            <button class="start-btn" onclick="startGame()">PLAY AGAIN</button>
        </div>
    </div>

    <!-- Feedback -->
    <div class="feedback" id="feedback"></div>

    <!-- Top Bar -->
    <div class="top-bar">
        <button class="menu-btn" onclick="resetGame()">☰</button>
        <button class="power-btn" onclick="resetGame()">⏻</button>
    </div>

    <!-- Timer -->
    <div class="timer-section">
        <div class="timer-bar-bg">
            <div class="timer-bar-fill" id="timer-bar" style="width: 100%"></div>
        </div>
        <div class="timer-text" id="timer-text">5.00s COUNTDOWN</div>
    </div>

    <!-- Color Word -->
    <div class="color-word" id="color-word">RED</div>
    <div class="instruction">👆 Match the WORD, not the color!</div>

    <!-- Color Buttons -->
    <div class="color-buttons" id="color-buttons">
        <button class="color-btn red" data-color="red" onclick="handleClick('red')"></button>
        <button class="color-btn blue" data-color="blue" onclick="handleClick('blue')"></button>
        <button class="color-btn green" data-color="green" onclick="handleClick('green')"></button>
        <button class="color-btn yellow" data-color="yellow" onclick="handleClick('yellow')"></button>
    </div>

    <!-- Character -->
    <div class="character" id="character">
        <div class="char-head">
            <div class="char-hair"></div>
            <div class="char-eyes"></div>
            <div class="char-mouth" id="char-mouth"></div>
        </div>
        <div class="char-body">
            <span class="char-star">★</span>
        </div>
        <div class="char-legs">
            <div class="char-leg"></div>
            <div class="char-leg"></div>
        </div>
    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
        <div class="score-text" id="score-text">SCORE: 0/10</div>
        <div class="round-text">
            <div class="round-icon"></div>
            <span id="round-text">ROUND 1/10</span>
        </div>
    </div>
</div>
