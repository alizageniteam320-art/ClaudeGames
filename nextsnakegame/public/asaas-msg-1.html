<script>
// Polyfill for localStorage and sessionStorage to prevent SecurityError in data: iframes
(function() {
    try {
        window.localStorage;
        window.sessionStorage;
    } catch (e) {
        // Storage access is blocked, implement in-memory polyfill
        const createStorage = () => {
            let store = {};
            return {
                getItem: (key) => store[key] || null,
                setItem: (key, value) => { store[key] = String(value); },
                removeItem: (key) => { delete store[key]; },
                clear: () => { store = {}; },
                key: (index) => Object.keys(store)[index] || null,
                get length() { return Object.keys(store).length; }
            };
        };
        
        try {
            Object.defineProperty(window, 'localStorage', { value: createStorage() });
            Object.defineProperty(window, 'sessionStorage', { value: createStorage() });
        } catch (defineError) {
             console.warn('Unable to define global storage properties:', defineError);
        }
    }
})();
</script>

    <script>
        // ── Floating particles background ──────────────────────────────────────
        (function createParticles() {
            const container = document.getElementById('particles');
            const colors = ['#00ffc8', '#00b4ff', '#a855f7', '#ff4d6d', '#ffd93d', '#0080ff'];

                p.className = 'particle';
                const size = Math.random() * 5 + 1.5;
                const isSquare = Math.random() < 0.25;
                p.style.cssText = `

    <script>
    // ── Complete Snake Game Implementation ────────────────────────────────────
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GRID_SIZE = 20;
        const COLS = canvas.width / GRID_SIZE;
        const ROWS = canvas.height / GRID_SIZE;

        // Game state
        let snake, direction, nextDirection, food, score, highScore, gameLoop, paused, gameRunning;
        let powerups, activePowerups;
        let frameCount = 0;
        let animFrame = 0; // for canvas animations

        // Particle effects array
        let particles = [];

        // Power-up types
        const POWERUP_TYPES = [
            { type: 'speed',  emoji: '⚡', color: '#ffd93d', duration: 5000, label: 'Speed Boost'   },
            { type: 'ghost',  emoji: '🛡️', color: '#00ffc8', duration: 7000, label: 'Ghost Mode'    },
            { type: 'shrink', emoji: '✂️', color: '#ff4d6d', duration: 0,    label: 'Shrink'        },
            { type: 'double', emoji: '💎', color: '#a855f7', duration: 8000, label: 'Double Points' },
            { type: 'freeze', emoji: '❄️', color: '#74b9ff', duration: 4000, label: 'Freeze'        }
        ];

        // Load high score
        try {
            highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
        } catch(e) {
            highScore = 0;
        }
        document.getElementById('highScore').textContent = highScore;

        // ── Canvas particle system ─────────────────────────────────────────────
        function spawnCanvasParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
                const speed = Math.random() * 3 + 1.5;
                particles.push({
                    x: x * GRID_SIZE + GRID_SIZE / 2,
                    y: y * GRID_SIZE + GRID_SIZE / 2,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    decay: Math.random() * 0.04 + 0.025,
                    size: Math.random() * 4 + 2,
                    color: color,
                    shape: Math.random() < 0.4 ? 'square' : 'circle'
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.08; // gravity
                p.vx *= 0.97;
                p.life -= p.decay;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 8;
                ctx.fillStyle = p.color;
                if (p.shape === 'square') {
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.life * 5);
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                } else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            });
        }

        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9,  y: 10 },
                { x: 8,  y: 10 }
            ];
            direction      = { x: 1, y: 0 };
            nextDirection  = { x: 1, y: 0 };
            score          = 0;
            paused         = false;
            gameRunning    = true;
            powerups       = [];
            activePowerups = {};
            frameCount     = 0;
            particles      = [];

            document.getElementById('score').textContent = '0';
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('activePowerupBar').innerHTML = '';

            spawnFood();
        }

        function spawnFood() {
            let pos;
            do {
                pos = {
                    x: Math.floor(Math.random() * COLS),
                    y: Math.floor(Math.random() * ROWS)
                };
            } while (
                snake.some(s => s.x === pos.x && s.y === pos.y) ||
                powerups.some(p => p.x === pos.x && p.y === pos.y)
            );
            food = pos;
        }

        function spawnPowerup() {
            if (powerups.length >= 2) return;
            const type = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
            let pos;
            let attempts = 0;
            do {
                pos = {
                    x: Math.floor(Math.random() * COLS),
                    y: Math.floor(Math.random() * ROWS)
                };
                attempts++;
                if (attempts > 100) return;
            } while (
                snake.some(s => s.x === pos.x && s.y === pos.y) ||
                (food && food.x === pos.x && food.y === pos.y) ||
                powerups.some(p => p.x === pos.x && p.y === pos.y)
            );
            powerups.push({ x: pos.x, y: pos.y, ...type, spawnTime: Date.now() });
        }

        function getGameSpeed() {
            let base = 150;
            if (activePowerups['speed'])  base = 80;
            if (activePowerups['freeze']) base = 999999;
            base = Math.max(base - Math.floor(score / 50) * 5, 60);
            return base;
        }

        function update() {
            if (!gameRunning || paused) return;

            direction = { ...nextDirection };
            animFrame++;

            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            // Wall collision
            if (!activePowerups['ghost']) {
                if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                    endGame();
                    return;
                }
            } else {
                head.x = (head.x + COLS) % COLS;
                head.y = (head.y + ROWS) % ROWS;
            }

            // Self collision
            if (!activePowerups['ghost']) {
                for (let i = 1; i < snake.length; i++) {
                    if (snake[i].x === head.x && snake[i].y === head.y) {
                        endGame();
                        return;
                    }
                }
            }

            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                const points = activePowerups['double'] ? 20 : 10;
                score += points;
                document.getElementById('score').textContent = score;
                if (score > highScore) {
                    highScore = score;
                    document.getElementById('highScore').textContent = highScore;
                    try { localStorage.setItem('snakeHighScore', highScore); } catch(e) {}
                }
                // Spawn eat particles
                spawnCanvasParticles(food.x, food.y, '#ff4d6d', 14);
                spawnFood();
                if (Math.random() < 0.3) spawnPowerup();
            } else {
                snake.pop();
            }

            // Check powerup collision
            for (let i = powerups.length - 1; i >= 0; i--) {
                const pu = powerups[i];
                if (head.x === pu.x && head.y === pu.y) {
                    spawnCanvasParticles(pu.x, pu.y, pu.color, 18);
                    activatePowerup(pu);
                    powerups.splice(i, 1);
                }
            }

            // Remove expired field powerups
            const now = Date.now();
            powerups = powerups.filter(p => now - p.spawnTime < 10000);

            updateParticles();
            draw();
            scheduleNext();
        }

        let gameLoopTimeout = null;

        function scheduleNext() {
            if (gameLoopTimeout) clearTimeout(gameLoopTimeout);
            if (!gameRunning || paused) return;
            gameLoopTimeout = setTimeout(update, getGameSpeed());
        }

        function activatePowerup(pu) {
            if (pu.type === 'shrink') {
                const newLen = Math.max(3, Math.floor(snake.length / 2));
                snake = snake.slice(0, newLen);
                showTempBadge(pu);
                return;
            }
            if (activePowerups[pu.type] && activePowerups[pu.type].timer) {
                clearTimeout(activePowerups[pu.type].timer);
            }
            activePowerups[pu.type] = {
                label: pu.label,
                emoji: pu.emoji,
                color: pu.color,
                timer: setTimeout(() => {
                    delete activePowerups[pu.type];
                    updatePowerupBar();
                }, pu.duration)
            };
            updatePowerupBar();
        }

        function showTempBadge(pu) {
            const bar = document.getElementById('activePowerupBar');
            const badge = document.createElement('div');
            badge.className = 'active-powerup-badge';
            badge.innerHTML = `${pu.emoji} ${pu.label}`;
            bar.appendChild(badge);
            setTimeout(() => {
                if (badge.parentNode) badge.parentNode.removeChild(badge);
            }, 1500);
        }

        function updatePowerupBar() {
            const bar = document.getElementById('activePowerupBar');
            bar.innerHTML = '';
            for (const key in activePowerups) {
                const ap = activePowerups[key];
                const badge = document.createElement('div');
                badge.className = 'active-powerup-badge';
                badge.innerHTML = `${ap.emoji} ${ap.label}`;
                bar.appendChild(badge);
            }
        }

        // ── Draw helpers ───────────────────────────────────────────────────────

        function drawRoundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1,3),16);
            const g = parseInt(hex.slice(3,5),16);
            const b = parseInt(hex.slice(5,7),16);
            return {r,g,b};
        }

        // Snake color palette — vibrant neon gradient along body
        const SNAKE_COLORS = [
            { r: 0,   g: 255, b: 180 }, // head: neon teal
            { r: 0,   g: 200, b: 255 }, // neck: cyan
            { r: 80,  g: 140, b: 255 }, // mid: blue
            { r: 160, g: 80,  b: 255 }, // tail: purple
        ];

        function getSnakeColor(ratio) {
            const t = ratio * (SNAKE_COLORS.length - 1);
            const i = Math.min(Math.floor(t), SNAKE_COLORS.length - 2);
            const f = t - i;
            const a = SNAKE_COLORS[i];
            const b = SNAKE_COLORS[i + 1];
            return {
                r: Math.round(a.r + (b.r - a.r) * f),
                g: Math.round(a.g + (b.g - a.g) * f),
                b: Math.round(a.b + (b.b - a.b) * f)
            };
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ── Background grid with subtle neon lines ──────────────────────
            ctx.save();
            ctx.strokeStyle = 'rgba(0, 255, 200, 0.035)';
            ctx.lineWidth = 0.5;
            for (let x = 0; x <= canvas.width; x += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            ctx.restore();

            // ── Subtle vignette ─────────────────────────────────────────────
            const vignette = ctx.createRadialGradient(
                canvas.width/2, canvas.height/2, canvas.width * 0.25,
                canvas.width/2, canvas.height/2, canvas.width * 0.75
            );
            vignette.addColorStop(0, 'rgba(0,0,0,0)');
            vignette.addColorStop(1, 'rgba(0,0,0,0.45)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // ── Food ────────────────────────────────────────────────────────
            const t = Date.now() / 1000;
            const pulse = Math.sin(t * 4) * 0.15 + 1;
            const foodX = food.x * GRID_SIZE + GRID_SIZE / 2;
            const foodY = food.y * GRID_SIZE + GRID_SIZE / 2;
            const foodR = (GRID_SIZE / 2 - 2) * pulse;

            ctx.save();
            // Outer glow ring
            ctx.shadowColor = '#ff4d6d';
            ctx.shadowBlur = 20;
            const foodGrad = ctx.createRadialGradient(foodX - 2, foodY - 3, 1, foodX, foodY, foodR);
            foodGrad.addColorStop(0, '#fff0f3');
            foodGrad.addColorStop(0.4, '#ff9ff3');
            foodGrad.addColorStop(1, '#ff4d6d');
            ctx.fillStyle = foodGrad;
            ctx.beginPath();
            ctx.arc(foodX, foodY, foodR, 0, Math.PI * 2);
            ctx.fill();

            // Shine highlight
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.55)';
            ctx.beginPath();
            ctx.arc(foodX - foodR * 0.28, foodY - foodR * 0.3, foodR * 0.28, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // ── Field powerups ───────────────────────────────────────────────
            const now = Date.now();
            powerups.forEach(pu => {
                const px = pu.x * GRID_SIZE + GRID_SIZE / 2;
                const py = pu.y * GRID_SIZE + GRID_SIZE / 2;
                const age = (now - pu.spawnTime) / 1000;
                const bob = Math.sin(age * 3) * 2;
                const spin = age * 1.5;
                const lifeRatio = 1 - (now - pu.spawnTime) / 10000;

                ctx.save();
                ctx.globalAlpha = Math.min(1, lifeRatio * 2);
                ctx.translate(px, py + bob);

                // Glow ring
                ctx.shadowColor = pu.color;
                ctx.shadowBlur = 16;
                ctx.strokeStyle = pu.color;
                ctx.lineWidth = 1.5;
                ctx.globalAlpha *= 0.5;
                ctx.beginPath();
                ctx.arc(0, 0, GRID_SIZE / 2 - 1, 0, Math.PI * 2);
                ctx.stroke();
                ctx.globalAlpha = Math.min(1, lifeRatio * 2);

                ctx.rotate(spin);
                ctx.shadowBlur = 12;
                ctx.font = `${GRID_SIZE - 4}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(pu.emoji, 0, 0);
                ctx.restore();
            });

            // ── Snake ────────────────────────────────────────────────────────
            const ghostMode = !!activePowerups['ghost'];

            snake.forEach((seg, i) => {
                const ratio = i / Math.max(snake.length - 1, 1);
                const col = getSnakeColor(ratio);
                const sx = seg.x * GRID_SIZE;
                const sy = seg.y * GRID_SIZE;
                const margin = 1.5;
                const segW = GRID_SIZE - margin * 2;
                const segH = GRID_SIZE - margin * 2;
                const radius = i === 0 ? 7 : 5;

                ctx.save();
                if (ghostMode) ctx.globalAlpha = 0.45;

                if (i === 0) {
                    // Head glow
                    ctx.shadowColor = `rgb(${col.r},${col.g},${col.b})`;
                    ctx.shadowBlur = 18;
                } else {
                    ctx.shadowColor = `rgba(${col.r},${col.g},${col.b},0.5)`;
                    ctx.shadowBlur = 8;
                }

                // Body segment gradient
                const segGrad = ctx.createLinearGradient(sx + margin, sy + margin, sx + margin + segW, sy + margin + segH);
                const alpha = ghostMode ? 0.6 : 1;
                segGrad.addColorStop(0, `rgba(${Math.min(255,col.r+60)},${Math.min(255,col.g+60)},${Math.min(255,col.b+60)},${alpha})`);
                segGrad.addColorStop(1, `rgba(${col.r},${col.g},${col.b},${alpha})`);
                ctx.fillStyle = segGrad;

                drawRoundRect(sx + margin, sy + margin, segW, segH, radius);
                ctx.fill();

                // Inner highlight stripe
                if (!ghostMode) {
                    ctx.globalAlpha = 0.25;
                    ctx.fillStyle = 'rgba(255,255,255,0.9)';
                    drawRoundRect(sx + margin + 2, sy + margin + 2, segW * 0.55, segH * 0.35, 3);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }

                // Scale pattern on body
                if (i > 0 && i % 2 === 0) {
                    ctx.globalAlpha = ghostMode ? 0.15 : 0.18;
                    ctx.strokeStyle = `rgba(${col.r},${col.g},${col.b},0.8)`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(sx + GRID_SIZE / 2, sy + GRID_SIZE / 2, GRID_SIZE / 2 - 4, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.globalAlpha = ghostMode ? 0.45 : 1;
                }

                // Eyes on head
                if (i === 0) {
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = ghostMode ? 0.45 : 1;

                    // Eye whites
                    ctx.fillStyle = 'rgba(255,255,255,0.95)';
                    let eye1, eye2;
                    if      (direction.x === 1)  { eye1 = {x: sx+14, y: sy+5};  eye2 = {x: sx+14, y: sy+13}; }
                    else if (direction.x === -1) { eye1 = {x: sx+4,  y: sy+5};  eye2 = {x: sx+4,  y: sy+13}; }
                    else if (direction.y === -1) { eye1 = {x: sx+5,  y: sy+4};  eye2 = {x: sx+13, y: sy+4};  }
                    else                          { eye1 = {x: sx+5,  y: sy+14}; eye2 = {x: sx+13, y: sy+14}; }

                    ctx.beginPath(); ctx.arc(eye1.x, eye1.y, 3, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(eye2.x, eye2.y, 3, 0, Math.PI * 2); ctx.fill();

                    // Pupils
                    ctx.fillStyle = '#020c18';
                    ctx.beginPath(); ctx.arc(eye1.x + direction.x * 0.8, eye1.y + direction.y * 0.8, 1.6, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(eye2.x + direction.x * 0.8, eye2.y + direction.y * 0.8, 1.6, 0, Math.PI * 2); ctx.fill();

                    // Eye glow
                    ctx.shadowColor = '#00ffc8';
                    ctx.shadowBlur = 6;
                    ctx.fillStyle = 'rgba(0,255,200,0.7)';
                    ctx.beginPath(); ctx.arc(eye1.x + direction.x * 0.8, eye1.y + direction.y * 0.8, 0.7, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(eye2.x + direction.x * 0.8, eye2.y + direction.y * 0.8, 0.7, 0, Math.PI * 2); ctx.fill();
                }

                ctx.restore();
            });

            // ── Canvas particles ─────────────────────────────────────────────
            drawParticles();

            // ── Paused overlay ───────────────────────────────────────────────
            if (paused) {
                ctx.save();
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Glowing PAUSED text
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = 'bold 38px Arial';
                ctx.shadowColor = '#00ffc8';
                ctx.shadowBlur = 30;
                ctx.fillStyle = '#00ffc8';
                ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);

                ctx.font = '16px Arial';
                ctx.shadowBlur = 10;
                ctx.fillStyle = 'rgba(0,255,200,0.6)';
                ctx.fillText('Press Space to Resume', canvas.width / 2, canvas.height / 2 + 40);
                ctx.restore();
            }
        }

        function endGame() {
            gameRunning = false;
            if (gameLoopTimeout) {
                clearTimeout(gameLoopTimeout);
                gameLoopTimeout = null;
            }
            for (const key in activePowerups) {
                if (activePowerups[key].timer) clearTimeout(activePowerups[key].timer);
            }
            activePowerups = {};
            updatePowerupBar();

            // Death explosion
            if (snake.length > 0) {
                spawnCanvasParticles(snake[0].x, snake[0].y, '#ff4d6d', 24);
                spawnCanvasParticles(snake[0].x, snake[0].y, '#ffd93d', 16);
            }
            // Animate particles for a moment before showing game over
            let deathFrames = 0;
            function deathAnim() {
                if (deathFrames < 40) {
                    updateParticles();
                    draw();
                    deathFrames++;
                    requestAnimationFrame(deathAnim);
                } else {
                    document.getElementById('finalScore').textContent = score;
                    document.getElementById('gameOver').style.display = 'block';
                }
            }
            deathAnim();
        }

        function restartGame() {
            if (gameLoopTimeout) {
                clearTimeout(gameLoopTimeout);
                gameLoopTimeout = null;
            }
            for (const key in activePowerups) {
                if (activePowerups[key] && activePowerups[key].timer) {
                    clearTimeout(activePowerups[key].timer);
                }
            }
            initGame();
            scheduleNext();
        }

        window.restartGame = restartGame;

        // ── Keyboard controls ─────────────────────────────────────────────────
        document.addEventListener('keydown', function(e) {
            switch(e.key) {
                case 'ArrowUp':    case 'w': case 'W':
                    e.preventDefault();
                    if (direction.y !== 1)  nextDirection = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':  case 's': case 'S':
                    e.preventDefault();
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':  case 'a': case 'A':
                    e.preventDefault();
                    if (direction.x !== 1)  nextDirection = { x: -1, y: 0 };
                    break;
                case 'ArrowRight': case 'd': case 'D':
                    e.preventDefault();
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    break;
                case ' ':
                    e.preventDefault();
                    if (!gameRunning) return;
                    paused = !paused;
                    if (!paused) {
                        scheduleNext();
                    } else {
                        if (gameLoopTimeout) {
                            clearTimeout(gameLoopTimeout);
                            gameLoopTimeout = null;
                        }
                        draw();
                    }
                    break;
            }
        });

        // ── Start game ────────────────────────────────────────────────────────
        initGame();
        draw();
        scheduleNext();

    })();

    // ── Score pop animation ────────────────────────────────────────────────
    (function scorePopAnimation() {
        const scoreEl = document.getElementById('score');
        if (!scoreEl) return;
        let lastScore = 0;
        const observer = new MutationObserver(() => {
            const newScore = parseInt(scoreEl.textContent) || 0;
            if (newScore > lastScore) {
                scoreEl.style.transition = 'none';
                scoreEl.style.transform = 'scale(1.6)';
                scoreEl.style.color = '#ffd93d';
                scoreEl.style.textShadow = '0 0 20px rgba(255,217,61,0.9)';
                setTimeout(() => {
                    scoreEl.style.transition = 'transform 0.35s cubic-bezier(0.175,0.885,0.32,1.275), color 0.35s ease, text-shadow 0.35s ease';
                    scoreEl.style.transform = 'scale(1)';
                    scoreEl.style.color = '#00ffc8';
                    scoreEl.style.textShadow = '0 0 14px rgba(0,255,200,0.8)';
                }, 160);
                lastScore = newScore;
            }
        });
        observer.observe(scoreEl, { childList: true, subtree: true, characterData: true });
    })();
    </script>
</body>
