<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pac-Man Maze Runner</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
  touch-action: none;
}
#gameContainer {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}
#hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  max-width: 700px;
  padding: 8px 16px;
  color: #fff;
  font-size: 16px;
  font-weight: bold;
}
#hud .score { color: #FFD700; text-align: left; flex: 1; }
#hud .level { color: #fff; text-align: center; flex: 1; }
#hud .lives { color: #fff; text-align: right; flex: 1; }
canvas {
  border: 3px solid #2121DE;
  border-radius: 4px;
  display: block;
  image-rendering: pixelated;
}
#overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.82);
  z-index: 10;
  pointer-events: auto;
}
#overlay.hidden { display: none; pointer-events: none; }
#overlay h1 {
  color: #FFD700;
  font-size: 42px;
  margin-bottom: 10px;
  text-shadow: 2px 2px 8px #FF0, 0 0 20px #FF0;
  letter-spacing: 3px;
}
#overlay h2 {
  color: #fff;
  font-size: 22px;
  margin-bottom: 20px;
}
#overlay p {
  color: #aaa;
  font-size: 15px;
  margin-bottom: 8px;
  text-align: center;
  max-width: 380px;
  line-height: 1.5;
}
#overlay button {
  margin-top: 18px;
  padding: 14px 48px;
  font-size: 20px;
  font-weight: bold;
  color: #000;
  background: #FFD700;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 1px;
}
#overlay button:hover { background: #FFF176; transform: scale(1.06); }
#mobileControls {
  display: none;
  margin-top: 10px;
  width: 180px;
  height: 180px;
  position: relative;
}
.dpad-btn {
  position: absolute;
  width: 56px;
  height: 56px;
  background: rgba(33,33,222,0.55);
  border: 2px solid #4444ff;
  border-radius: 12px;
  color: #fff;
  font-size: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  transition: background 0.1s;
}
.dpad-btn:active { background: rgba(33,33,222,0.9); }
#btnUp { top: 0; left: 62px; }
#btnDown { bottom: 0; left: 62px; }
#btnLeft { top: 62px; left: 0; }
#btnRight { top: 62px; right: 0; }
@media (pointer: coarse) {
  #mobileControls { display: block; }
}
@media (max-width: 720px) {
  #hud { font-size: 13px; padding: 4px 8px; }
  #overlay h1 { font-size: 28px; }
  #overlay h2 { font-size: 16px; }
  #overlay p { font-size: 13px; }
  #overlay button { font-size: 16px; padding: 10px 32px; }
}
</style>
</head>
<body>
<div id="gameContainer">
  <div id="hud">
    <div class="score">SCORE <span id="scoreVal">0</span></div>
    <div class="level">LEVEL <span id="levelVal">1</span></div>
    <div class="lives" id="livesDisplay">❤❤❤</div>
  </div>
  <canvas id="gameCanvas"></canvas>
  <div id="overlay">
    <h1>PAC-MAN</h1>
    <h2>MAZE RUNNER</h2>
    <p>Navigate the maze, collect all dots, avoid ghosts!<br>Power pellets make ghosts edible for 10s.<br>Clear all 5 mazes to win!</p>
    <p>🎮 Arrow Keys / WASD / Swipe / D-Pad</p>
    <button id="startBtn">START GAME</button>
  </div>
  <div id="mobileControls">
    <div class="dpad-btn" id="btnUp">▲</div>
    <div class="dpad-btn" id="btnDown">▼</div>
    <div class="dpad-btn" id="btnLeft">◀</div>
    <div class="dpad-btn" id="btnRight">▶</div>
  </div>
</div>
