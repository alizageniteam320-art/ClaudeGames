<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dungeon Escape</title>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --ui-bg: rgba(35, 30, 40, 0.85);
            --ui-border: #8b6d3b;
            --text-color: #f1ebd9;
            --accent-color: #ffaa00;
            --danger-color: #ff3333;
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; }
        
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16/9;
            background: #000;
            border: 4px solid var(--ui-border);
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8), 0 0 10px var(--ui-border);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .ui-panel {
            position: absolute;
            background: var(--ui-bg);
            border: 2px solid var(--ui-border);
            border-radius: 6px;
            padding: 10px;
            text-shadow: 2px 2px 0px #000;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            z-index: 10;
        }

        #top-hud {
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hud-section { display: flex; align-items: center; gap: 15px; }
        
        .stat-box {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        #hearts { color: var(--danger-color); letter-spacing: 2px; }
        #keys-display { color: #ffd700; }
        #timer { color: var(--accent-color); font-size: 1.4rem; }

        #minimap-container {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 150px;
            height: 150px;
            background: rgba(10, 10, 15, 0.9);
            border: 2px solid var(--ui-border);
            border-radius: 4px;
            z-index: 10;
        }

        #minimap { width: 100%; height: 100%; }

        #hint-overlay {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem;
            color: #fff;
            text-shadow: 2px 2px 0 #000, 0 0 10px var(--accent-color);
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid var(--ui-border);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 20;
            text-align: center;
        }

        #message-screen {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        #message-screen h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: var(--accent-color);
            text-shadow: 0 4px 0 #5c3a21;
        }

        #message-screen p { font-size: 1.2rem; margin-bottom: 30px; text-align: center; max-width: 80%; }

        button {
            background: linear-gradient(to bottom, #8b6d3b, #5c3a21);
            border: 2px solid #ffd700;
            color: #fff;
            font-family: inherit;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 12px 30px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 0 #2c1a0e;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #2c1a0e;
        }

        /* Mobile Controls */
        #mobile-controls {
            display: none;
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            justify-content: space-between;
            z-index: 30;
            pointer-events: none;
        }

        .dpad {
            position: relative;
            width: 150px;
            height: 150px;
            pointer-events: auto;
        }

        .d-btn {
            position: absolute;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            color: white;
            font-weight: bold;
        }
        .d-btn:active { background: rgba(255,255,255,0.4); }

        .btn-up { top: 0; left: 50px; width: 50px; height: 50px; }
        .btn-down { bottom: 0; left: 50px; width: 50px; height: 50px; }
        .btn-left { top: 50px; left: 0; width: 50px; height: 50px; }
        .btn-right { top: 50px; right: 0; width: 50px; height: 50px; }

        @media (max-width: 768px) {
            #mobile-controls { display: flex; }
            #minimap-container { display: none; }
            #game-wrapper { border: none; border-radius: 0; aspect-ratio: auto; height: 100vh; }
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <div id="top-hud" class="ui-panel">
        <div class="hud-section">
            <div class="stat-box">HP <span id="hearts">♥♥♥</span></div>
            <div class="stat-box">KEYS <span id="keys-display">0</span></div>
        </div>
        <div class="hud-section">
            <div class="stat-box">ESCAPE: <span id="timer">02:00</span></div>
        </div>
    </div>

    <div id="minimap-container">
        <canvas id="minimap" width="150" height="150"></canvas>
    </div>

    <div id="hint-overlay">Hint Text</div>

    <div id="mobile-controls">
        <div class="dpad">
            <div class="d-btn btn-up" id="btn-up">↑</div>
            <div class="d-btn btn-down" id="btn-down">↓</div>
            <div class="d-btn btn-left" id="btn-left">←</div>
            <div class="d-btn btn-right" id="btn-right">→</div>
        </div>
    </div>

    <div id="message-screen">
        <h1 id="msg-title">DUNGEON ESCAPE</h1>
        <p id="msg-desc">Find keys, dodge traps, solve puzzles, and escape before the torch dies out!</p>
        <p>Controls: WASD or Arrow Keys to move.<br>Run into objects to interact.</p>
        <button id="start-btn">START ADVENTURE</button>
    </div>
</div>
