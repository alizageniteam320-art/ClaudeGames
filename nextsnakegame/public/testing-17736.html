<script>
// Polyfill for localStorage and sessionStorage to prevent SecurityError in data: iframes
(function() {
    try {
        window.localStorage;
        window.sessionStorage;
    } catch (e) {
        // Storage access is blocked, implement in-memory polyfill
        const createStorage = () => {
            let store = {};
            return {
                getItem: (key) => store[key] || null,
                setItem: (key, value) => { store[key] = String(value); },
                removeItem: (key) => { delete store[key]; },
                clear: () => { store = {}; },
                key: (index) => Object.keys(store)[index] || null,
                get length() { return Object.keys(store).length; }
            };
        };
        
        try {
            Object.defineProperty(window, 'localStorage', { value: createStorage() });
            Object.defineProperty(window, 'sessionStorage', { value: createStorage() });
        } catch (defineError) {
             console.warn('Unable to define global storage properties:', defineError);
        }
    }
})();
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Duck Hunt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to bottom, #0a0a2e 0%, #1a1a5e 40%, #2d5a27 100%);
            font-family: 'Courier New', monospace;
            cursor: none;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            display: block;
            margin: 0 auto;
            border: 4px solid #8B4513;
            box-shadow: 0 0 40px rgba(100, 200, 255, 0.4), 0 0 80px rgba(50, 100, 200, 0.2);
            border-radius: 4px;
        }

        .ui {
            position: absolute;
            top: 15px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(100, 220, 255, 0.9), 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .ui div {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(100, 220, 255, 0.5);
            border-radius: 8px;
            padding: 6px 16px;
            backdrop-filter: blur(4px);
            letter-spacing: 1px;
        }

        .ui span {
            color: #7df9ff;
        }

        .crosshair {
            position: fixed;
            width: 44px;
            height: 44px;
            pointer-events: none;
            z-index: 100;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 4px rgba(255, 80, 80, 0.8));
            transition: transform 0.05s ease;
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(10,10,40,0.97) 0%, rgba(20,20,80,0.97) 100%);
            color: white;
            padding: 40px 50px;
            border-radius: 20px;
            text-align: center;
            font-size: 24px;
            display: none;
            z-index: 200;
            border: 2px solid rgba(100, 220, 255, 0.6);
            box-shadow: 0 0 40px rgba(100, 200, 255, 0.3), inset 0 0 40px rgba(0,0,50,0.5);
        }

        .game-over h2 {
            font-size: 42px;
            color: #ff4444;
            text-shadow: 0 0 20px rgba(255, 50, 50, 0.8);
            margin-bottom: 20px;
            letter-spacing: 4px;
            animation: pulse 1s infinite alternate;
        }

        .game-over p {
            margin: 10px 0;
            color: #aad4ff;
            font-size: 20px;
        }

        .game-over p span {
            color: #7df9ff;
            font-weight: bold;
        }

        @keyframes pulse {
            from { text-shadow: 0 0 10px rgba(255, 50, 50, 0.6); }
            to   { text-shadow: 0 0 30px rgba(255, 50, 50, 1), 0 0 60px rgba(255, 100, 100, 0.5); }
        }

        .restart-btn {
            background: linear-gradient(135deg, #1a7a2e, #2ecc71);
            color: white;
            border: 2px solid #2ecc71;
            padding: 14px 36px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 24px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 2px;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.4);
        }

        .restart-btn:hover {
            background: linear-gradient(135deg, #2ecc71, #1a7a2e);
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.8);
            transform: scale(1.05);
        }

        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle linear infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.4); }
        }
    </style>
</head>

    <script>
    // ─── SELF-CONTAINED DUCK HUNT GAME ───────────────────────────────────────────
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const W = canvas.width;
        const H = canvas.height;

        // ── UI elements ──────────────────────────────────────────────────────────
        const scoreEl   = document.getElementById('score');
        const roundEl   = document.getElementById('round');
        const missesEl  = document.getElementById('misses');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');
        const finalRoundEl = document.getElementById('finalRound');

        // ── Game state ───────────────────────────────────────────────────────────
        let score       = 0;
        let misses      = 0;
        let round       = 1;
        let gameRunning = true;
        let animFrameId = null;

        const MAX_MISSES    = 10;
        const DUCKS_PER_ROUND = 5;
        let ducksThisRound  = 0;
        let ducksKilled     = 0;

        // ── Duck pool ────────────────────────────────────────────────────────────
        let ducks = [];

        // ── Particles ────────────────────────────────────────────────────────────
        let particles = [];

        // ── Score popups ─────────────────────────────────────────────────────────
        let popups = [];

        // ── Audio context ────────────────────────────────────────────────────────
        let audioCtx = null;
        function getAudio() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
            }
            return audioCtx;
        }

        function playShoot() {
            const ac = getAudio(); if (!ac) return;
            const buf = ac.createBuffer(1, ac.sampleRate * 0.12, ac.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < data.length; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
            }
            const src = ac.createBufferSource();
            src.buffer = buf;
            const gain = ac.createGain();
            gain.gain.setValueAtTime(0.4, ac.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.12);
            src.connect(gain); gain.connect(ac.destination);
            src.start();
        }

        function playHit() {
            const ac = getAudio(); if (!ac) return;
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(400, ac.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, ac.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, ac.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.3);
            osc.connect(gain); gain.connect(ac.destination);
            osc.start(); osc.stop(ac.currentTime + 0.3);
        }

        function playMiss() {
            const ac = getAudio(); if (!ac) return;
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(200, ac.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, ac.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, ac.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.2);
            osc.connect(gain); gain.connect(ac.destination);
            osc.start(); osc.stop(ac.currentTime + 0.2);
        }

        // ── Duck factory ─────────────────────────────────────────────────────────
        const DUCK_COLORS = [
            { body: '#4CAF50', head: '#81C784', bill: '#FFA726', wing: '#388E3C' },
            { body: '#FF7043', head: '#FFAB91', bill: '#FFD54F', wing: '#E64A19' },
            { body: '#42A5F5', head: '#90CAF9', bill: '#FFCA28', wing: '#1565C0' },
            { body: '#AB47BC', head: '#CE93D8', bill: '#FFA726', wing: '#7B1FA2' },
            { body: '#FFD700', head: '#FFF176', bill: '#FF8F00', wing: '#F9A825' },
        ];

        function spawnDuck() {
            const fromLeft = Math.random() < 0.5;
            const color = DUCK_COLORS[Math.floor(Math.random() * DUCK_COLORS.length)];
            const speedBase = 2.5 + round * 0.4;
            const speed = speedBase + Math.random() * 2;
            const duck = {
                x: fromLeft ? -60 : W + 60,
                y: 80 + Math.random() * (H * 0.55),
                vx: fromLeft ? speed : -speed,
                vy: (Math.random() - 0.5) * 2.5,
                width: 56,
                height: 40,
                color: color,
                alive: true,
                dying: false,
                dyingTimer: 0,
                dyingDuration: 60,
                wingAngle: 0,
                wingDir: 1,
                id: Math.random(),
            };
            ducks.push(duck);
            ducksThisRound++;
        }

        function spawnParticles(x, y, color) {
            for (let i = 0; i < 18; i++) {
                const angle = (Math.PI * 2 * i) / 18 + Math.random() * 0.3;
                const speed = 2 + Math.random() * 5;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    decay: 0.025 + Math.random() * 0.02,
                    size: 3 + Math.random() * 5,
                    color: color,
                });
            }
        }

        // ── Drawing helpers ───────────────────────────────────────────────────────
        function drawBackground() {
            // Sky gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.72);
            skyGrad.addColorStop(0, '#0a0a2e');
            skyGrad.addColorStop(0.5, '#1a2a6e');
            skyGrad.addColorStop(1, '#1a6ea0');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, W, H * 0.72);

            // Ground
            const groundGrad = ctx.createLinearGradient(0, H * 0.72, 0, H);
            groundGrad.addColorStop(0, '#2d6a1f');
            groundGrad.addColorStop(0.3, '#3a8a28');
            groundGrad.addColorStop(1, '#1a4a10');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, H * 0.72, W, H * 0.28);

            // Ground line
            ctx.strokeStyle = '#5cb85c';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, H * 0.72);
            ctx.lineTo(W, H * 0.72);
            ctx.stroke();

            // Moon
            ctx.save();
            ctx.shadowBlur = 30;
            ctx.shadowColor = 'rgba(200,220,255,0.8)';
            ctx.fillStyle = '#e8f0ff';
            ctx.beginPath();
            ctx.arc(W * 0.85, H * 0.12, 38, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1a2a6e';
            ctx.beginPath();
            ctx.arc(W * 0.85 + 14, H * 0.12 - 8, 32, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Some bushes
            drawBush(80, H * 0.72, 60, 30);
            drawBush(300, H * 0.72, 80, 40);
            drawBush(700, H * 0.72, 70, 35);
            drawBush(1050, H * 0.72, 90, 45);
        }

        function drawBush(x, y, w, h) {
            ctx.fillStyle = '#2d6a1f';
            ctx.beginPath();
            ctx.ellipse(x, y, w / 2, h / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#3a8a28';
            ctx.beginPath();
            ctx.ellipse(x - w * 0.2, y - h * 0.1, w * 0.4, h * 0.45, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x + w * 0.2, y - h * 0.1, w * 0.4, h * 0.45, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawDuck(duck) {
            ctx.save();
            ctx.translate(duck.x, duck.y);
            if (duck.vx < 0) ctx.scale(-1, 1);

            const c = duck.color;
            const alpha = duck.dying ? Math.max(0, 1 - duck.dyingTimer / duck.dyingDuration) : 1;
            ctx.globalAlpha = alpha;

            // Wing flap
            const wingY = -8 + Math.sin(duck.wingAngle) * 8;

            // Wing (back)
            ctx.fillStyle = c.wing;
            ctx.beginPath();
            ctx.ellipse(-4, wingY, 22, 10, -0.3, 0, Math.PI * 2);
            ctx.fill();

            // Body
            ctx.fillStyle = c.body;
            ctx.beginPath();
            ctx.ellipse(0, 0, 26, 16, 0, 0, Math.PI * 2);
            ctx.fill();

            // Head
            ctx.fillStyle = c.head;
            ctx.beginPath();
            ctx.arc(22, -12, 13, 0, Math.PI * 2);
            ctx.fill();

            // Eye
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.arc(27, -15, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(28, -16, 1.2, 0, Math.PI * 2);
            ctx.fill();

            // Bill
            ctx.fillStyle = c.bill;
            ctx.beginPath();
            ctx.ellipse(36, -10, 10, 5, 0.2, 0, Math.PI * 2);
            ctx.fill();

            // Tail
            ctx.fillStyle = c.wing;
            ctx.beginPath();
            ctx.moveTo(-22, -4);
            ctx.lineTo(-38, -14);
            ctx.lineTo(-34, 4);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function drawPopups() {
            popups.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.font = `bold ${p.size}px 'Courier New', monospace`;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = p.color;
                ctx.textAlign = 'center';
                ctx.fillText(p.text, p.x, p.y);
                ctx.restore();
            });
        }

        function drawHUD() {
            // Ammo / miss bar
            const barW = 200;
            const barH = 18;
            const bx = W / 2 - barW / 2;
            const by = H - 36;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath();
            ctx.roundRect(bx - 4, by - 4, barW + 8, barH + 8, 6);
            ctx.fill();
            const ratio = Math.max(0, 1 - misses / MAX_MISSES);
            const barColor = ratio > 0.5 ? '#2ecc71' : ratio > 0.25 ? '#f39c12' : '#e74c3c';
            ctx.fillStyle = barColor;
            ctx.beginPath();
            ctx.roundRect(bx, by, barW * ratio, barH, 4);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(bx, by, barW, barH, 4);
            ctx.stroke();
            ctx.fillStyle = 'white';
            ctx.font = 'bold 13px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('LIVES', W / 2, by - 6);
        }

        // ── Update logic ──────────────────────────────────────────────────────────
        let spawnTimer = 0;
        let spawnInterval = 90; // frames between spawns

        function update() {
            spawnTimer++;

            // Spawn ducks
            if (spawnTimer >= spawnInterval && ducks.filter(d => d.alive && !d.dying).length < 3) {
                spawnTimer = 0;
                spawnInterval = Math.max(40, 90 - round * 5);
                spawnDuck();
            }

            // Update ducks
            ducks.forEach(duck => {
                if (duck.dying) {
                    duck.dyingTimer++;
                    duck.vy += 0.5; // fall
                    duck.y += duck.vy;
                    if (duck.dyingTimer >= duck.dyingDuration) {
                        duck.alive = false;
                    }
                    return;
                }

                duck.x += duck.vx;
                duck.y += duck.vy;
                duck.wingAngle += 0.18;

                // Bounce off top/bottom (sky area)
                if (duck.y < 50) { duck.y = 50; duck.vy = Math.abs(duck.vy); }
                if (duck.y > H * 0.68) { duck.y = H * 0.68; duck.vy = -Math.abs(duck.vy); }

                // Duck escaped off screen
                if (duck.x < -120 || duck.x > W + 120) {
                    duck.alive = false;
                    misses++;
                    missesEl.textContent = misses;
                    playMiss();
                    popups.push({
                        x: duck.x < 0 ? 80 : W - 80,
                        y: duck.y,
                        text: 'ESCAPED!',
                        color: '#ff6666',
                        life: 1,
                        size: 22,
                    });
                    if (misses >= MAX_MISSES) endGame();
                }
            });

            // Remove dead ducks
            ducks = ducks.filter(d => d.alive);

            // Round progression
            if (ducksThisRound >= DUCKS_PER_ROUND && ducks.length === 0) {
                round++;
                ducksThisRound = 0;
                ducksKilled = 0;
                roundEl.textContent = round;
                spawnInterval = Math.max(40, 90 - round * 5);
                // Flash round message
                popups.push({
                    x: W / 2,
                    y: H / 2,
                    text: `ROUND ${round}!`,
                    color: '#7df9ff',
                    life: 1,
                    size: 48,
                });
            }

            // Update particles
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.12;
                p.life -= p.decay;
            });
            particles = particles.filter(p => p.life > 0);

            // Update popups
            popups.forEach(p => {
                p.y -= 0.8;
                p.life -= 0.012;
            });
            popups = popups.filter(p => p.life > 0);
        }

        // ── Render ────────────────────────────────────────────────────────────────
        function render() {
            ctx.clearRect(0, 0, W, H);
            drawBackground();
            ducks.forEach(duck => drawDuck(duck));
            drawParticles();
            drawPopups();
            drawHUD();
        }

        // ── Main loop ─────────────────────────────────────────────────────────────
        function loop() {
            if (!gameRunning) return;
            update();
            render();
            animFrameId = requestAnimationFrame(loop);
        }

        // ── Click / shoot ─────────────────────────────────────────────────────────
        function handleShoot(clientX, clientY) {
            if (!gameRunning) return;
            playShoot();

            const rect = canvas.getBoundingClientRect();
            const scaleX = W / rect.width;
            const scaleY = H / rect.height;
            const cx = (clientX - rect.left) * scaleX;
            const cy = (clientY - rect.top) * scaleY;

            let hit = false;
            for (let i = ducks.length - 1; i >= 0; i--) {
                const duck = ducks[i];
                if (duck.dying || !duck.alive) continue;
                const dx = cx - duck.x;
                const dy = cy - duck.y;
                if (Math.abs(dx) < 40 && Math.abs(dy) < 32) {
                    duck.dying = true;
                    duck.vy = -3;
                    hit = true;
                    ducksKilled++;

                    const pts = 10 * round;
                    score += pts;
                    scoreEl.textContent = score;
                    playHit();
                    spawnParticles(duck.x, duck.y, duck.color.body);
                    popups.push({
                        x: duck.x,
                        y: duck.y - 30,
                        text: `+${pts}`,
                        color: '#FFD700',
                        life: 1,
                        size: 28,
                    });
                    break;
                }
            }

            if (!hit) {
                misses++;
                missesEl.textContent = misses;
                popups.push({
                    x: cx,
                    y: cy,
                    text: 'MISS',
                    color: '#ff4444',
                    life: 1,
                    size: 20,
                });
                if (misses >= MAX_MISSES) endGame();
            }
        }

        canvas.addEventListener('click', (e) => handleShoot(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const t = e.touches[0];
            handleShoot(t.clientX, t.clientY);
        }, { passive: false });

        // ── Game over / restart ───────────────────────────────────────────────────
        function endGame() {
            gameRunning = false;
            if (animFrameId) cancelAnimationFrame(animFrameId);
            finalScoreEl.textContent = score;
            finalRoundEl.textContent = round;
            gameOverEl.style.display = 'block';
        }

        window.restartGame = function() {
            score = 0;
            misses = 0;
            round = 1;
            ducksThisRound = 0;
            ducksKilled = 0;
            spawnTimer = 0;
            spawnInterval = 90;
            ducks = [];
            particles = [];
            popups = [];
            gameRunning = true;
            scoreEl.textContent = '0';
            missesEl.textContent = '0';
            roundEl.textContent = '1';
            gameOverEl.style.display = 'none';
            loop();
        };

        // ── Start ─────────────────────────────────────────────────────────────────
        loop();

    })();
    </script>

    <script>
        // Post-load canvas enhancement: vignette + scanline overlay
        window.addEventListener('load', () => {
            const canvas = document.getElementById('gameCanvas');
            if (!canvas) return;

            const overlay = document.createElement('canvas');
            overlay.width = canvas.width;
            overlay.height = canvas.height;
            overlay.style.cssText = `
                position: fixed;
                pointer-events: none;
                z-index: 4;
                border-radius: 4px;
            `;

            function positionOverlay() {
                const rect = canvas.getBoundingClientRect();
                overlay.style.left = rect.left + 'px';
                overlay.style.top = rect.top + 'px';
                overlay.style.width = rect.width + 'px';
                overlay.style.height = rect.height + 'px';
            }

            document.body.appendChild(overlay);
            positionOverlay();
            window.addEventListener('resize', positionOverlay);

            const octx = overlay.getContext('2d');

            // Pre-render static scanlines once
            const scanCanvas = document.createElement('canvas');
            scanCanvas.width = overlay.width;
            scanCanvas.height = overlay.height;
            const sctx = scanCanvas.getContext('2d');
            sctx.fillStyle = 'rgba(0,0,0,0.04)';
            for (let y = 0; y < overlay.height; y += 4) {
                sctx.fillRect(0, y, overlay.width, 2);
            }

            // Pre-render vignette once
            const vigCanvas = document.createElement('canvas');
            vigCanvas.width = overlay.width;
            vigCanvas.height = overlay.height;
            const vctx = vigCanvas.getContext('2d');
            const vignette = vctx.createRadialGradient(
                overlay.width / 2, overlay.height / 2, overlay.height * 0.3,
                overlay.width / 2, overlay.height / 2, overlay.height * 0.85
            );
            vignette.addColorStop(0, 'rgba(0,0,0,0)');
            vignette.addColorStop(1, 'rgba(0,0,20,0.55)');
            vctx.fillStyle = vignette;
            vctx.fillRect(0, 0, overlay.width, overlay.height);

            function drawOverlay() {
                octx.clearRect(0, 0, overlay.width, overlay.height);
                octx.drawImage(vigCanvas, 0, 0);
                octx.drawImage(scanCanvas, 0, 0);
                requestAnimationFrame(drawOverlay);
            }

            drawOverlay();
        });
    </script>
</body>
