<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chicago Life</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #111;
            color: #fff;
            overflow: hidden;
            font-family: 'Teko', 'Trebuchet MS', sans-serif;
            touch-action: none; /* Prevent scroll on mobile */
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
        }
        #title-screen, #game-over-screen {
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 10px;
            border: 2px solid #333;
            box-shadow: 0 0 20px #000;
            pointer-events: auto;
        }
        h1 {
            font-size: 60px;
            font-weight: 600;
            color: #ff3333;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0 #000, 0 0 15px rgba(255, 51, 51, 0.5);
        }
        p {
            font-size: 24px;
            color: #ccc;
            margin-bottom: 20px;
        }
        button {
            background: #ff3333;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 28px;
            font-family: 'Teko', sans-serif;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            box-shadow: 0 5px 0 #990000;
        }
        button:hover {
            background: #ff4d4d;
            transform: translateY(2px);
            box-shadow: 0 3px 0 #990000;
        }
        button:active {
            transform: translateY(5px);
            box-shadow: 0 0px 0 #990000;
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            width: calc(100% - 20px);
            display: none;
            justify-content: space-between;
            font-size: 32px;
            pointer-events: none;
            text-shadow: 2px 2px 4px #000;
        }
        .health-bar {
            width: 200px;
            height: 20px;
            background: rgba(0,0,0,0.5);
            border: 2px solid #fff;
            border-radius: 10px;
            overflow: hidden;
        }
        .health-fill {
            width: 100%;
            height: 100%;
            background: #00ff00;
            transition: width 0.2s, background-color 0.2s;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="title-screen">
            <h1>Welcome to Chicago Life</h1>
            <p>Drive. Survive. Eliminate Threats.</p>
            <p style="font-size: 18px; color: #888;">Controls: WASD/Arrows to Drive | SPACE or Click to Shoot<br>Mobile: Drag to steer | Tap to shoot</p>
            <button id="start-btn">Start Engine</button>
        </div>

        <div id="game-over-screen" class="hidden">
            <h1>Wasted</h1>
            <p id="final-score">Score: 0</p>
            <p id="best-score">Best: 0</p>
            <button id="restart-btn">Try Again</button>
        </div>
    </div>

    <div id="hud">
        <div>
            Score: <span id="score-display">0</span>
        </div>
        <div>
            <div class="health-bar">
                <div class="health-fill" id="health-fill"></div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
