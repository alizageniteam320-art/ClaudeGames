<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pixel Bike Racer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  background: #000; 
  overflow: hidden; 
  display: flex; 
  justify-content: center; 
  align-items: center; 
  height: 100vh; 
  font-family: Arial, Helvetica, sans-serif;
  touch-action: none;
}
canvas { 
  display: block; 
  image-rendering: auto;
}
#touchControls {
  position: fixed;
  bottom: 20px;
  left: 0;
  right: 0;
  display: none;
  justify-content: space-between;
  padding: 0 20px;
  pointer-events: none;
  z-index: 10;
}
.touchBtn {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  border: 3px solid rgba(255,255,255,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  color: #fff;
  pointer-events: all;
  user-select: none;
  -webkit-user-select: none;
}
.touchBtn:active { background: rgba(255,255,255,0.5); }
#leftGroup, #rightGroup {
  display: flex;
  gap: 15px;
}
@media (pointer: coarse) {
  #touchControls { display: flex !important; }
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="touchControls">
  <div id="leftGroup">
    <div class="touchBtn" id="btnLeft">◀</div>
    <div class="touchBtn" id="btnRight">▶</div>
  </div>
  <div id="rightGroup">
    <div class="touchBtn" id="btnUp">▲</div>
    <div class="touchBtn" id="btnDown">▼</div>
  </div>
</div>
