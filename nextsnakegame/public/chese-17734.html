<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chess Puzzle - Checkmate Challenge</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #5D3A1A, #8B5E3C, #6B4226);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  user-select: none;
}

#gameContainer {
  width: 100vmin;
  height: 100vmin;
  max-width: 700px;
  max-height: 700px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Top Bar */
#topBar {
  width: 95%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  z-index: 10;
}

#puzzleTitle {
  font-size: 1.6em;
  font-weight: 900;
  color: #fff;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
  letter-spacing: 2px;
}

#timerDisplay {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(0,0,0,0.4);
  padding: 4px 14px;
  border-radius: 20px;
  color: #fff;
  font-size: 1.2em;
  font-weight: 700;
}

#timerDisplay .clock-icon { font-size: 1.3em; }

/* Info Bar */
#infoBar {
  width: 95%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 0;
  margin-bottom: 4px;
}

#scoreDisplay {
  color: #FFD700;
  font-weight: 700;
  font-size: 1.1em;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
}

#movesDisplay {
  color: #fff;
  font-weight: 700;
  font-size: 1em;
  background: rgba(0,0,0,0.3);
  padding: 3px 12px;
  border-radius: 12px;
}

#statusMsg {
  color: #7FFF7F;
  font-weight: 700;
  font-size: 1em;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
}

/* Chess Board */
#boardWrapper {
  position: relative;
  border: 6px solid #3E2410;
  border-radius: 6px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,0,0,0.3);
  background: #3E2410;
}

#chessBoard {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
}

.square {
  width: calc((min(95vw, 660px)) / 8);
  height: calc((min(95vw, 660px)) / 8);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: calc((min(95vw, 660px)) / 12);
  cursor: pointer;
  position: relative;
  transition: background 0.15s;
}

.square.light { background: #F0D9B5; }
.square.dark { background: #B58863; }
.square.selected { background: #7FFF3F !important; }
.square.valid-move::after {
  content: '';
  position: absolute;
  width: 30%;
  height: 30%;
  background: rgba(0,0,0,0.25);
  border-radius: 50%;
}
.square.valid-capture { background: #FFAA33 !important; }
.square.hint-highlight { background: #FFD700 !important; animation: hintPulse 0.8s infinite alternate; }
.square.last-move { background: #CDD26A !important; }
.square.check { background: #FF4444 !important; }

@keyframes hintPulse {
  from { background: #FFD700; }
  to { background: #FFA500; }
}

.piece {
  font-size: 1em;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
  pointer-events: none;
  line-height: 1;
  filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.3));
}

/* Buttons */
#bottomBar {
  width: 95%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  gap: 8px;
}

.btn {
  padding: 10px 20px;
  border: none;
  border-radius: 12px;
  font-size: 1em;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.1s;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.btn:active { transform: scale(0.95); }

#hintBtn {
  background: linear-gradient(180deg, #FF4444, #CC0000);
  color: #fff;
  box-shadow: 0 4px 8px rgba(200,0,0,0.4);
}

#resetBtn {
  background: linear-gradient(180deg, #4488FF, #2255CC);
  color: #fff;
  box-shadow: 0 4px 8px rgba(0,50,200,0.4);
}

#skipBtn {
  background: linear-gradient(180deg, #888, #555);
  color: #fff;
  box-shadow: 0 4px 8px rgba(0,0,0,0.3);
}

#menuBtn {
  background: linear-gradient(180deg, #333, #111);
  color: #fff;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  font-size: 1.4em;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
}

/* Progress Bar */
#progressBar {
  width: 95%;
  height: 8px;
  background: rgba(0,0,0,0.3);
  border-radius: 4px;
  margin: 4px 0;
  overflow: hidden;
}

#progressFill {
  height: 100%;
  background: linear-gradient(90deg, #4CAF50, #8BC34A);
  border-radius: 4px;
  transition: width 0.5s ease;
}

/* Captured Pieces */
#capturedArea {
  width: 95%;
  min-height: 30px;
  display: flex;
  gap: 2px;
  flex-wrap: wrap;
  align-items: center;
  font-size: 1.2em;
  padding: 2px;
}

/* Modal Overlay */
.modal-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 100;
}

.modal-overlay.active { display: flex; }

.modal {
  background: linear-gradient(135deg, #2C1810, #4A2E1C);
  border: 3px solid #FFD700;
  border-radius: 20px;
  padding: 30px;
  text-align: center;
  color: #fff;
  max-width: 400px;
  width: 85%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

.modal h2 {
  font-size: 1.8em;
  margin-bottom: 10px;
  color: #FFD700;
}

.modal p {
  font-size: 1.1em;
  margin-bottom: 20px;
  line-height: 1.5;
}

.modal .btn {
  padding: 12px 30px;
  font-size: 1.1em;
  margin: 5px;
}

.modal .btn-gold {
  background: linear-gradient(180deg, #FFD700, #FFA500);
  color: #333;
  box-shadow: 0 4px 12px rgba(255,200,0,0.4);
}

/* Start Screen */
#startScreen {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: linear-gradient(135deg, #1a0a00, #3E2410, #5D3A1A);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 200;
  color: #fff;
}

#startScreen h1 {
  font-size: 2.5em;
  color: #FFD700;
  text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
  margin-bottom: 10px;
}

#startScreen .subtitle {
  font-size: 1.2em;
  color: #ccc;
  margin-bottom: 30px;
}

#startScreen .chess-deco {
  font-size: 4em;
  margin-bottom: 20px;
}

#startBtn {
  background: linear-gradient(180deg, #FFD700, #FFA500);
  color: #333;
  padding: 15px 50px;
  border: none;
  border-radius: 15px;
  font-size: 1.4em;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(255,200,0,0.4);
  transition: transform 0.1s;
  letter-spacing: 2px;
}

#startBtn:active { transform: scale(0.95); }

/* Difficulty Stars */
.stars {
  color: #FFD700;
  font-size: 1em;
  margin-left: 6px;
}

/* Animation */
@keyframes solvedFlash {
  0% { background: #4CAF50; }
  50% { background: #8BC34A; }
  100% { background: #4CAF50; }
}

.square.solved-flash {
  animation: solvedFlash 0.3s 3;
}

/* Responsive */
@media (max-width: 500px) {
  #puzzleTitle { font-size: 1.2em; }
  #timerDisplay { font-size: 1em; }
  .btn { padding: 8px 14px; font-size: 0.85em; }
  .square { font-size: calc((95vw) / 13); }
}
</style>
</head>
<body>

<!-- Start Screen -->
<div id="startScreen">
  <div class="chess-deco">♚♛♜♝♞</div>
  <h1>CHESS PUZZLES</h1>
  <p class="subtitle">Checkmate Challenge - 20 Puzzles</p>
  <button id="startBtn" onclick="startGame()">▶ PLAY</button>
</div>

<!-- Main Game -->
<div id="gameContainer">
  <div id="topBar">
    <button id="menuBtn" onclick="showMenu()">☰</button>
    <div id="puzzleTitle">PUZZLE 1</div>
    <div id="timerDisplay">
      <span class="clock-icon">⏱</span>
      <span id="timer">60</span>
    </div>
  </div>

  <div id="infoBar">
    <div id="scoreDisplay">⭐ Score: 0</div>
    <div id="movesDisplay">Moves: 0/1</div>
    <div id="statusMsg"></div>
  </div>

  <div id="progressBar"><div id="progressFill" style="width:0%"></div></div>

  <div id="boardWrapper">
    <div id="chessBoard"></div>
  </div>

  <div id="capturedArea"></div>

  <div id="bottomBar">
    <button class="btn" id="resetBtn" onclick="resetPuzzle()">↺ Reset</button>
    <button class="btn" id="hintBtn" onclick="useHint()">💡 Hint (-50)</button>
    <button class="btn" id="skipBtn" onclick="skipPuzzle()">⏭ Skip</button>
  </div>
</div>

<!-- Success Modal -->
<div class="modal-overlay" id="successModal">
  <div class="modal">
    <h2>✅ CHECKMATE!</h2>
    <p id="successText">Puzzle solved!</p>
    <button class="btn btn-gold" onclick="nextPuzzle()">NEXT PUZZLE →</button>
  </div>
</div>

<!-- Fail Modal -->
<div class="modal-overlay" id="failModal">
  <div class="modal">
    <h2>⏰ TIME'S UP!</h2>
    <p>You ran out of time.</p>
    <button class="btn btn-gold" onclick="retryPuzzle()">RETRY</button>
    <button class="btn" id="skipBtn2" style="background:#888;color:#fff" onclick="skipFromFail()">SKIP</button>
  </div>
</div>

<!-- Win Modal -->
<div class="modal-overlay" id="winModal">
  <div class="modal">
    <h2>🏆 CONGRATULATIONS!</h2>
    <p id="winText">You completed all 20 puzzles!</p>
    <button class="btn btn-gold" onclick="restartAll()">PLAY AGAIN</button>
  </div>
</div>

<!-- Menu Modal -->
<div class="modal-overlay" id="menuModal">
  <div class="modal">
    <h2>☰ MENU</h2>
    <p>Puzzle <span id="menuPuzzleNum">1</span>/20</p>
    <button class="btn btn-gold" onclick="closeMenu()">RESUME</button>
    <br><br>
    <button class="btn" style="background:#888;color:#fff" onclick="restartAll()">RESTART ALL</button>
  </div>
</div>
