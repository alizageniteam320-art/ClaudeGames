<script>
// Polyfill for localStorage and sessionStorage to prevent SecurityError in data: iframes
(function() {
    try {
        window.localStorage;
        window.sessionStorage;
    } catch (e) {
        // Storage access is blocked, implement in-memory polyfill
        const createStorage = () => {
            let store = {};
            return {
                getItem: (key) => store[key] || null,
                setItem: (key, value) => { store[key] = String(value); },
                removeItem: (key) => { delete store[key]; },
                clear: () => { store = {}; },
                key: (index) => Object.keys(store)[index] || null,
                get length() { return Object.keys(store).length; }
            };
        };
        
        try {
            Object.defineProperty(window, 'localStorage', { value: createStorage() });
            Object.defineProperty(window, 'sessionStorage', { value: createStorage() });
        } catch (defineError) {
             console.warn('Unable to define global storage properties:', defineError);
        }
    }
})();
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck Hunt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            cursor: none;
        }
        
        #gameContainer {
            position: relative;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
        
        canvas {
            display: block;
            border: 4px solid #333;
            image-rendering: pixelated;
        }
        
        #crosshair {
            position: absolute;
            width: 40px;
            height: 40px;
            pointer-events: none;
            z-index: 100;
        }
        
        #hud {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: #000;
            color: #fff;
            padding: 10px 20px;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .bullets {
            display: flex;
            gap: 10px;
        }
        
        .bullet {
            width: 30px;
            height: 30px;
            background: #ff0000;
            border-radius: 50%;
            border: 2px solid #fff;
        }
        
        .bullet.used {
            background: #333;
        }
        
        #roundInfo {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 20px 40px;
            font-size: 24px;
            border-radius: 10px;
            display: none;
            z-index: 50;
            text-align: center;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            color: #fff;
            padding: 40px 60px;
            font-size: 24px;
            border-radius: 15px;
            display: none;
            z-index: 50;
            text-align: center;
            border: 4px solid #ff0000;
        }
        
        #gameOver h2 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ff0000;
        }
        
        #gameOver button {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 20px;
            background: #ff0000;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        
        #gameOver button:hover {
            background: #cc0000;
        }

        #powerupHud {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 60;
        }

        .powerup-indicator {
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            border: 2px solid #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .powerup-indicator.rapid { border-color: #ff6600; color: #ff6600; }
        .powerup-indicator.wide { border-color: #00ccff; color: #00ccff; }
        .powerup-indicator.slow { border-color: #aa00ff; color: #aa00ff; }
        .powerup-indicator.extra { border-color: #00ff88; color: #00ff88; }
        .powerup-indicator.double { border-color: #ffdd00; color: #ffdd00; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="crosshair"></div>
        <div id="hud">
            <div>
                <div>SCORE: <span id="score">0</span></div>
                <div>ROUND: <span id="round">1</span></div>
            </div>
            <div class="bullets" id="bulletsDisplay"></div>
            <div>
                <div>HIT: <span id="hit">0</span></div>
                <div>MISS: <span id="miss">0</span></div>
            </div>
        </div>
        <div id="powerupHud"></div>
        <div id="roundInfo"></div>
        <div id="gameOver">
            <h2>GAME OVER</h2>
            <p id="finalScore"></p>
            <button onclick="restartGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const crosshair = document.getElementById('crosshair');
        
        canvas.width = 800;
        canvas.height = 600;
        
        // Game state
        let gameState = 'playing';
        let score = 0;
        let round = 1;
        let hits = 0;
        let misses = 0;
        let bullets = 3;
        const maxBullets = 3;
        const ducksPerRound = 10;
        let ducksShot = 0;
        let currentDucks = [];
        let cat = null;
        let showCat = false;
        let catTimer = 0;

        // Power-up state
        const POWERUP_TYPES = {
            RAPID_FIRE:   { key: 'rapid',  label: '🔥 Rapid Fire',   color: '#ff6600', duration: 8000  },
            WIDE_SHOT:    { key: 'wide',   label: '💥 Wide Shot',    color: '#00ccff', duration: 8000  },
            SLOW_MOTION:  { key: 'slow',   label: '🐢 Slow Motion',  color: '#aa00ff', duration: 7000  },
            EXTRA_BULLET: { key: 'extra',  label: '🔫 +3 Bullets',   color: '#00ff88', duration: 0     },
            DOUBLE_SCORE: { key: 'double', label: '⭐ Double Score',  color: '#ffdd00', duration: 10000 },
        };

        let activePowerups = {}; // key -> { endTime, timerID }
        let fallingPowerups = []; // PowerupDrop instances on screen

        // Colors
        const colors = {
            sky: '#5c94fc',
            ground: '#d84820',
            grass: '#00a800',
            tree: '#006400',
            cloud: '#fcfcfc'
        };

        // ---- PowerupDrop class ----
        class PowerupDrop {
            constructor() {
                const keys = Object.keys(POWERUP_TYPES);
                this.typeKey = keys[Math.floor(Math.random() * keys.length)];
                this.info = POWERUP_TYPES[this.typeKey];
                this.x = 60 + Math.random() * (canvas.width - 120);
                this.y = -40;
                this.size = 28;
                this.speed = 1.2 + Math.random() * 0.8;
                this.collected = false;
                this.bobOffset = Math.random() * Math.PI * 2;
                this.rotation = 0;
            }

            update() {
                this.y += this.speed;
                this.rotation += 0.04;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y + Math.sin(Date.now() * 0.003 + this.bobOffset) * 4);
                ctx.rotate(this.rotation);

                // Glow
                ctx.shadowColor = this.info.color;
                ctx.shadowBlur = 18;

                // Star shape background
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.beginPath();
                drawStar(ctx, 0, 0, 5, this.size, this.size * 0.5);
                ctx.fill();

                ctx.fillStyle = this.info.color;
                ctx.globalAlpha = 0.85;
                ctx.beginPath();
                drawStar(ctx, 0, 0, 5, this.size, this.size * 0.5);
                ctx.fill();
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;

                // Emoji label
                ctx.rotate(-this.rotation);
                ctx.font = `${this.size * 0.8}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.info.label.split(' ')[0], 0, 0);

                ctx.restore();
            }

            isOffScreen() {
                return this.y > canvas.height + 60;
            }

            containsPoint(x, y) {
                const dx = x - this.x;
                const dy = y - this.y;
                return Math.sqrt(dx * dx + dy * dy) < this.size * 1.4;
            }
        }

        function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
            let rot = (Math.PI / 2) * 3;
            const step = Math.PI / spikes;
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                ctx.lineTo(cx + Math.cos(rot) * outerRadius, cy + Math.sin(rot) * outerRadius);
                rot += step;
                ctx.lineTo(cx + Math.cos(rot) * innerRadius, cy + Math.sin(rot) * innerRadius);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
        }

        // Activate a power-up
        function activatePowerup(typeKey) {
            const info = POWERUP_TYPES[typeKey];

            if (typeKey === 'EXTRA_BULLET') {
                bullets = Math.min(bullets + 3, maxBullets + 3);
                updateBulletsDisplay();
                showFloatingText('+3 BULLETS!', '#00ff88');
                return;
            }

            // Clear existing timer for same type
            if (activePowerups[typeKey] && activePowerups[typeKey].timerID) {
                clearTimeout(activePowerups[typeKey].timerID);
            }

            const endTime = Date.now() + info.duration;
            const timerID = setTimeout(() => {
                delete activePowerups[typeKey];
                updatePowerupHUD();
            }, info.duration);

            activePowerups[typeKey] = { endTime, timerID };

            if (typeKey === 'SLOW_MOTION') {
                currentDucks.forEach(d => { if (!d.falling) d.speed *= 0.4; });
            }

            showFloatingText(info.label + '!', info.color);
            updatePowerupHUD();
        }

        function isPowerupActive(typeKey) {
            if (!activePowerups[typeKey]) return false;
            return Date.now() < activePowerups[typeKey].endTime;
        }

        // Floating text notifications
        let floatingTexts = [];
        function showFloatingText(text, color) {
            floatingTexts.push({ text, color, x: canvas.width / 2, y: canvas.height / 2 - 60, alpha: 1, vy: -1.5, life: 90 });
        }

        function updatePowerupHUD() {
            const hud = document.getElementById('powerupHud');
            hud.innerHTML = '';
            for (const typeKey of Object.keys(activePowerups)) {
                const info = POWERUP_TYPES[typeKey];
                const remaining = Math.max(0, Math.ceil((activePowerups[typeKey].endTime - Date.now()) / 1000));
                const div = document.createElement('div');
                div.className = `powerup-indicator ${info.key}`;
                div.textContent = `${info.label} ${remaining > 0 ? remaining + 's' : ''}`;
                hud.appendChild(div);
            }
        }

        // Spawn a power-up drop occasionally
        let powerupSpawnTimer = 0;
        const POWERUP_SPAWN_INTERVAL = 420; // frames

        function trySpawnPowerup() {
            powerupSpawnTimer++;
            if (powerupSpawnTimer >= POWERUP_SPAWN_INTERVAL) {
                powerupSpawnTimer = 0;
                fallingPowerups.push(new PowerupDrop());
            }
        }

        // Duck class
        class Duck {
            constructor() {
                this.x = Math.random() < 0.5 ? -50 : canvas.width + 50;
                this.y = 100 + Math.random() * 300;
                this.size = 50;
                this.baseSpeed = 2 + Math.random() * 2 + (round * 0.3);
                this.speed = isPowerupActive('SLOW_MOTION') ? this.baseSpeed * 0.4 : this.baseSpeed;
                this.direction = this.x < 0 ? 1 : -1;
                this.angle = 0;
                this.alive = true;
                this.falling = false;
                this.fallSpeed = 0;
                this.color = Math.random() > 0.5 ? '#8B4513' : '#000';
                this.flapSpeed = 0.2;
                this.flapAngle = 0;
            }
            
            update() {
                if (this.falling) {
                    this.y += this.fallSpeed;
                    this.fallSpeed += 0.5;
                    this.angle += 5;
                } else {
                    this.x += this.speed * this.direction;
                    this.y += Math.sin(Date.now() * 0.003) * 0.5;
                    this.flapAngle += this.flapSpeed;
                }
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                if (this.falling) {
                    ctx.rotate(this.angle * Math.PI / 180);
                }
                
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size * 0.6, this.size * 0.4, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.beginPath();
                ctx.ellipse(this.size * 0.4 * this.direction, -this.size * 0.2, this.size * 0.3, this.size * 0.35, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#FFA500';
                ctx.beginPath();
                ctx.moveTo((this.size * 0.6) * this.direction, -this.size * 0.2);
                ctx.lineTo((this.size * 0.8) * this.direction, -this.size * 0.15);
                ctx.lineTo((this.size * 0.6) * this.direction, -this.size * 0.1);
                ctx.closePath();
                ctx.fill();
                
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc((this.size * 0.45) * this.direction, -this.size * 0.25, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc((this.size * 0.47) * this.direction, -this.size * 0.25, 2, 0, Math.PI * 2);
                ctx.fill();
                
                if (!this.falling) {
                    const wingFlap = Math.sin(this.flapAngle) * 15;
                    
                    ctx.fillStyle = this.color;
                    ctx.save();
                    ctx.translate(-this.size * 0.3 * this.direction, 0);
                    ctx.rotate((-30 + wingFlap) * Math.PI / 180);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size * 0.4, this.size * 0.15, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                    
                    ctx.save();
                    ctx.translate(-this.size * 0.3 * this.direction, 0);
                    ctx.rotate((30 - wingFlap) * Math.PI / 180);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size * 0.4, this.size * 0.15, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
                
                ctx.restore();
            }
            
            shoot() {
                if (this.alive && !this.falling) {
                    this.alive = false;
                    this.falling = true;
                    return true;
                }
                return false;
            }
            
            isOffScreen() {
                return this.y > canvas.height || 
                       this.x < -100 || 
                       this.x > canvas.width + 100;
            }
            
            containsPoint(x, y) {
                const dx = x - this.x;
                const dy = y - this.y;
                return Math.sqrt(dx * dx + dy * dy) < this.size;
            }
        }
        
        // Cat class (replaces Dog)
        class Cat {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height - 150;
                this.size = 60;
                this.state = 'sniff';
                this.jumpY = 0;
                this.duckCount = 0;
                this.tailAngle = 0;
            }
            
            show(state, duckCount = 0) {
                this.state = state;
                this.duckCount = duckCount;
                this.jumpY = 0;
                showCat = true;
                catTimer = 120;
            }
            
            update() {
                if (this.state === 'jump') {
                    this.jumpY = Math.sin(Date.now() * 0.01) * 20 - 20;
                }
                this.tailAngle = Math.sin(Date.now() * 0.005) * 30;
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y + this.jumpY);

                const s = this.size;

                // --- Tail ---
                ctx.save();
                ctx.translate(s * 0.35, s * 0.2);
                ctx.rotate((this.tailAngle) * Math.PI / 180);
                ctx.strokeStyle = '#c07830';
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(s * 0.5, -s * 0.3, s * 0.4, -s * 0.65);
                ctx.stroke();
                ctx.restore();

                // --- Body ---
                ctx.fillStyle = '#e09040';
                ctx.beginPath();
                ctx.ellipse(0, s * 0.1, s * 0.38, s * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();

                // --- Head ---
                ctx.fillStyle = '#e09040';
                ctx.beginPath();
                ctx.arc(0, -s * 0.22, s * 0.28, 0, Math.PI * 2);
                ctx.fill();

                // --- Ears ---
                // Left ear
                ctx.fillStyle = '#e09040';
                ctx.beginPath();
                ctx.moveTo(-s * 0.22, -s * 0.42);
                ctx.lineTo(-s * 0.35, -s * 0.62);
                ctx.lineTo(-s * 0.08, -s * 0.48);
                ctx.closePath();
                ctx.fill();
                // Left inner ear
                ctx.fillStyle = '#f0a0a0';
                ctx.beginPath();
                ctx.moveTo(-s * 0.21, -s * 0.44);
                ctx.lineTo(-s * 0.31, -s * 0.58);
                ctx.lineTo(-s * 0.11, -s * 0.48);
                ctx.closePath();
                ctx.fill();

                // Right ear
                ctx.fillStyle = '#e09040';
                ctx.beginPath();
                ctx.moveTo(s * 0.22, -s * 0.42);
                ctx.lineTo(s * 0.35, -s * 0.62);
                ctx.lineTo(s * 0.08, -s * 0.48);
                ctx.closePath();
                ctx.fill();
                // Right inner ear
                ctx.fillStyle = '#f0a0a0';
                ctx.beginPath();
                ctx.moveTo(s * 0.21, -s * 0.44);
                ctx.lineTo(s * 0.31, -s * 0.58);
                ctx.lineTo(s * 0.11, -s * 0.48);
                ctx.closePath();
                ctx.fill();

                // --- Eyes ---
                if (this.state === 'laugh') {
                    // Laughing eyes (closed arcs)
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.arc(-s * 0.1, -s * 0.25, s * 0.07, Math.PI, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(s * 0.1, -s * 0.25, s * 0.07, Math.PI, Math.PI * 2);
                    ctx.stroke();
                } else {
                    // Normal eyes
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.ellipse(-s * 0.1, -s * 0.25, s * 0.08, s * 0.09, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(s * 0.1, -s * 0.25, s * 0.08, s * 0.09, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Pupils (vertical slit)
                    ctx.fillStyle = '#111';
                    ctx.beginPath();
                    ctx.ellipse(-s * 0.1, -s * 0.25, s * 0.03, s * 0.07, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(s * 0.1, -s * 0.25, s * 0.03, s * 0.07, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Eye shine
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(-s * 0.08, -s * 0.27, s * 0.02, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(s * 0.12, -s * 0.27, s * 0.02, 0, Math.PI * 2);
                    ctx.fill();
                }

                // --- Nose ---
                ctx.fillStyle = '#e06080';
                ctx.beginPath();
                ctx.moveTo(0, -s * 0.14);
                ctx.lineTo(-s * 0.04, -s * 0.10);
                ctx.lineTo(s * 0.04, -s * 0.10);
                ctx.closePath();
                ctx.fill();

                // --- Mouth ---
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(0, -s * 0.10);
                ctx.lineTo(-s * 0.07, -s * 0.05);
                ctx.moveTo(0, -s * 0.10);
                ctx.lineTo(s * 0.07, -s * 0.05);
                ctx.stroke();

                // --- Whiskers ---
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 1.2;
                // Left whiskers
                ctx.beginPath(); ctx.moveTo(-s * 0.04, -s * 0.12); ctx.lineTo(-s * 0.38, -s * 0.15); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-s * 0.04, -s * 0.10); ctx.lineTo(-s * 0.38, -s * 0.10); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-s * 0.04, -s * 0.08); ctx.lineTo(-s * 0.38, -s * 0.05); ctx.stroke();
                // Right whiskers
                ctx.beginPath(); ctx.moveTo(s * 0.04, -s * 0.12); ctx.lineTo(s * 0.38, -s * 0.15); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(s * 0.04, -s * 0.10); ctx.lineTo(s * 0.38, -s * 0.10); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(s * 0.04, -s * 0.08); ctx.lineTo(s * 0.38, -s * 0.05); ctx.stroke();

                // --- Legs ---
                ctx.fillStyle = '#c07030';
                // Front left leg
                ctx.fillRect(-s * 0.28, s * 0.32, s * 0.14, s * 0.22);
                // Front right leg
                ctx.fillRect(s * 0.14, s * 0.32, s * 0.14, s * 0.22);
                // Back left leg
                ctx.fillRect(-s * 0.38, s * 0.28, s * 0.12, s * 0.18);
                // Back right leg
                ctx.fillRect(s * 0.26, s * 0.28, s * 0.12, s * 0.18);

                // --- Held ducks when jumping ---
                if (this.state === 'jump' && this.duckCount > 0) {
                    for (let i = 0; i < this.duckCount; i++) {
                        ctx.save();
                        ctx.translate((i - this.duckCount / 2) * 30 + 15, -s * 0.8);
                        ctx.fillStyle = '#8B4513';
                        ctx.beginPath();
                        ctx.ellipse(0, 0, 15, 10, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                }

                ctx.restore();
            }
        }
        
        // Draw background
        function drawBackground() {
            ctx.fillStyle = colors.sky;
            ctx.fillRect(0, 0, canvas.width, canvas.height * 0.7);
            
            ctx.fillStyle = colors.cloud;
            for (let i = 0; i < 3; i++) {
                const x = 150 + i * 250;
                const y = 50 + i * 30;
                ctx.beginPath();
                ctx.arc(x, y, 30, 0, Math.PI * 2);
                ctx.arc(x + 25, y, 35, 0, Math.PI * 2);
                ctx.arc(x + 50, y, 30, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.fillStyle = colors.ground;
            ctx.fillRect(0, canvas.height * 0.7, canvas.width, canvas.height * 0.3);
            
            ctx.fillStyle = colors.grass;
            ctx.fillRect(0, canvas.height * 0.7, canvas.width, 40);
            
            for (let i = 0; i < 5; i++) {
                const x = 100 + i * 180;
                const y = canvas.height * 0.7;
                
                ctx.fillStyle = '#654321';
                ctx.fillRect(x - 10, y - 60, 20, 60);
                
                ctx.fillStyle = colors.tree;
                ctx.beginPath();
                ctx.arc(x, y - 70, 35, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x - 20, y - 55, 25, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + 20, y - 55, 25, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Draw wide-shot radius indicator
        function drawWideShotIndicator() {
            if (!isPowerupActive('WIDE_SHOT')) return;
            ctx.save();
            ctx.strokeStyle = 'rgba(0,204,255,0.35)';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, WIDE_SHOT_RADIUS, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();
        }
        
        // Spawn ducks
        function spawnDucks() {
            const numDucks = Math.min(2, round);
            for (let i = 0; i < numDucks; i++) {
                currentDucks.push(new Duck());
            }
        }
        
        // Update bullets display
        function updateBulletsDisplay() {
            const display = document.getElementById('bulletsDisplay');
            display.innerHTML = '';
            const displayMax = Math.max(maxBullets, bullets);
            for (let i = 0; i < displayMax; i++) {
                const bullet = document.createElement('div');
                bullet.className = 'bullet' + (i >= bullets ? ' used' : '');
                display.appendChild(bullet);
            }
        }
        
        // Update HUD
        function updateHUD() {
            document.getElementById('score').textContent = score;
            document.getElementById('round').textContent = round;
            document.getElementById('hit').textContent = hits;
            document.getElementById('miss').textContent = misses;
            updateBulletsDisplay();
        }
        
        // Draw crosshair
        function drawCrosshair(x, y) {
            const isRapid = isPowerupActive('RAPID_FIRE');
            const isWide = isPowerupActive('WIDE_SHOT');
            const isDouble = isPowerupActive('DOUBLE_SCORE');

            let crossColor = '#ff0000';
            if (isRapid) crossColor = '#ff6600';
            if (isWide) crossColor = '#00ccff';
            if (isDouble) crossColor = '#ffdd00';

            ctx.strokeStyle = crossColor;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(x, y, 20, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(x, y - 25);
            ctx.lineTo(x, y - 15);
            ctx.moveTo(x, y + 25);
            ctx.lineTo(x, y + 15);
            ctx.moveTo(x - 25, y);
            ctx.lineTo(x - 15, y);
            ctx.moveTo(x + 25, y);
            ctx.lineTo(x + 15, y);
            ctx.stroke();
        }

        // Draw floating texts
        function drawFloatingTexts() {
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 26px Courier New';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = ft.color;
                ctx.shadowBlur = 10;
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
                ft.y += ft.vy;
                ft.life--;
                ft.alpha = ft.life / 90;
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }
        }
        
        // Mouse tracking
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;
        
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        // Rapid fire: track last shot time
        let lastShotTime = 0;
        const RAPID_FIRE_COOLDOWN = 150; // ms
        const WIDE_SHOT_RADIUS = 80;

        // Shooting
        canvas.addEventListener('click', (e) => {
            if (gameState !== 'playing' || bullets <= 0) return;

            // Rapid fire cooldown
            if (isPowerupActive('RAPID_FIRE')) {
                const now = Date.now();
                if (now - lastShotTime < RAPID_FIRE_COOLDOWN) return;
                lastShotTime = now;
            }

            // Check if clicked a power-up drop first
            for (let i = fallingPowerups.length - 1; i >= 0; i--) {
                const pu = fallingPowerups[i];
                if (!pu.collected && pu.containsPoint(mouseX, mouseY)) {
                    pu.collected = true;
                    activatePowerup(pu.typeKey);
                    fallingPowerups.splice(i, 1);
                    return; // Don't use a bullet for power-up collection
                }
            }
            
            bullets--;
            updateBulletsDisplay();
            
            let hit = false;

            if (isPowerupActive('WIDE_SHOT')) {
                // Wide shot: hit all ducks within radius
                for (let duck of currentDucks) {
                    const dx = mouseX - duck.x;
                    const dy = mouseY - duck.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < WIDE_SHOT_RADIUS && duck.shoot()) {
                        const pts = isPowerupActive('DOUBLE_SCORE') ? 1000 : 500;
                        score += pts;
                        hits++;
                        ducksShot++;
                        hit = true;
                        setTimeout(() => { if (cat) cat.show('jump', 1); }, 500);
                    }
                }
            } else {
                // Normal shot
                for (let duck of currentDucks) {
                    if (duck.containsPoint(mouseX, mouseY) && duck.shoot()) {
                        const pts = isPowerupActive('DOUBLE_SCORE') ? 1000 : 500;
                        score += pts;
                        hits++;
                        ducksShot++;
                        hit = true;
                        setTimeout(() => { if (cat) cat.show('jump', 1); }, 500);
                        break;
                    }
                }
            }
            
            if (!hit && bullets === 0 && currentDucks.some(d => d.alive && !d.falling)) {
                misses++;
                setTimeout(() => { if (cat) cat.show('laugh'); }, 500);
            }
            
            updateHUD();
        });
        
        // Show round info
        function showRoundInfo(message) {
            const roundInfo = document.getElementById('roundInfo');
            roundInfo.textContent = message;
            roundInfo.style.display = 'block';
            setTimeout(() => {
                roundInfo.style.display = 'none';
            }, 2000);
        }
        
        // End round
        function endRound() {
            if (ducksShot >= ducksPerRound * 0.6) {
                showRoundInfo(`ROUND ${round} COMPLETE!`);
                round++;
                ducksShot = 0;
                setTimeout(() => {
                    gameState = 'playing';
                    spawnDucks();
                }, 2500);
            } else {
                gameOver();
            }
        }
        
        // Game over
        function gameOver() {
            gameState = 'gameOver';
            document.getElementById('finalScore').innerHTML = 
                `Final Score: ${score}<br>Rounds Completed: ${round - 1}`;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        // Restart game
        function restartGame() {
            gameState = 'playing';
            score = 0;
            round = 1;
            hits = 0;
            misses = 0;
            bullets = maxBullets;
            ducksShot = 0;
            currentDucks = [];
            fallingPowerups = [];
            activePowerups = {};
            floatingTexts = [];
            powerupSpawnTimer = 0;
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('powerupHud').innerHTML = '';
            updateHUD();
            spawnDucks();
        }
        
        // Game loop
        function gameLoop() {
            drawBackground();

            // Update and draw falling power-ups
            trySpawnPowerup();
            for (let i = fallingPowerups.length - 1; i >= 0; i--) {
                const pu = fallingPowerups[i];
                pu.update();
                pu.draw();
                if (pu.isOffScreen()) {
                    fallingPowerups.splice(i, 1);
                }
            }
            
            // Update and draw ducks
            for (let i = currentDucks.length - 1; i >= 0; i--) {
                const duck = currentDucks[i];
                duck.update();
                duck.draw();
                
                if (duck.isOffScreen()) {
                    currentDucks.splice(i, 1);
                }
            }
            
            // Update and draw cat
            if (cat && showCat) {
                cat.update();
                cat.draw();
                catTimer--;
                if (catTimer <= 0) {
                    showCat = false;
                }
            }

            // Wide shot indicator
            drawWideShotIndicator();
            
            // Draw crosshair
            drawCrosshair(mouseX, mouseY);

            // Floating texts
            drawFloatingTexts();

            // Update power-up HUD every ~30 frames
            if (Math.floor(Date.now() / 500) % 2 === 0) {
                updatePowerupHUD();
            }
            
            // Check if all ducks are gone
            if (gameState === 'playing' && currentDucks.length === 0) {
                bullets = maxBullets;
                updateBulletsDisplay();
                
                if (ducksShot >= ducksPerRound) {
                    gameState = 'roundEnd';
                    endRound();
                } else {
                    spawnDucks();
                }
            }
            
            // Check if bullets depleted with alive ducks
            if (gameState === 'playing' && bullets === 0 && currentDucks.some(d => d.alive && !d.falling)) {
                setTimeout(() => {
                    currentDucks = currentDucks.filter(d => d.falling);
                }, 1000);
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // Initialize
        cat = new Cat();
        updateHUD();
        spawnDucks();
        
        setTimeout(() => {
            cat.show('sniff');
        }, 500);
        
        gameLoop();
    </script>
</body>
</html>
