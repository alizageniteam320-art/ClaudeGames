<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter Strike Classic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1a1a1a;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            cursor: none;
        }
        
        #gameCanvas {
            display: block;
            background: linear-gradient(to bottom, #87CEEB 0%, #98D8E8 50%, #B0C4DE 100%);
        }
        
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .hud-element {
            position: absolute;
            color: #FFD700;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        
        #health {
            bottom: 20px;
            left: 20px;
            font-size: 24px;
        }
        
        #ammo {
            bottom: 20px;
            right: 20px;
            font-size: 24px;
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
        }
        
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: #00FF00;
            box-shadow: 0 0 5px #00FF00;
        }
        
        #crosshair::before {
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            transform: translateY(-50%);
        }
        
        #crosshair::after {
            left: 50%;
            top: 0;
            width: 2px;
            height: 100%;
            transform: translateX(-50%);
        }
        
        #buyMenu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            border: 2px solid #FFD700;
            padding: 20px;
            display: none;
            color: #FFD700;
        }
        
        .weapon-item {
            padding: 10px;
            margin: 5px 0;
            background: rgba(255,255,255,0.1);
            cursor: pointer;
            border: 1px solid #666;
        }
        
        .weapon-item:hover {
            background: rgba(255,215,0,0.3);
        }
        
        #minimap {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 150px;
            height: 150px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #FFD700;
        }
        
        #gameInfo {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #FFD700;
            font-size: 18px;
        }
        
        #weapon-display {
            position: absolute;
            bottom: 80px;
            right: 20px;
            font-size: 16px;
        }
        
        .muzzle-flash {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #FFD700 0%, #FF6600 50%, transparent 70%);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud">
        <div id="crosshair"></div>
        <div id="health" class="hud-element">❤️ 100</div>
        <div id="ammo" class="hud-element">30/90</div>
        <div id="weapon-display" class="hud-element">AK-47</div>
        <div id="gameInfo" class="hud-element">
            <div>Time: <span id="timer">2:00</span></div>
            <div>Score: <span id="score">0</span></div>
        </div>
        
        <div id="minimap">
            <canvas id="minimapCanvas" width="150" height="150"></canvas>
        </div>
        
        <div class="muzzle-flash" id="muzzleFlash"></div>
    </div>
    
    <div id="buyMenu">
        <h3>BUY MENU</h3>
        <div class="weapon-item" data-weapon="glock">Glock-18 - $400</div>
        <div class="weapon-item" data-weapon="usp">USP - $500</div>
        <div class="weapon-item" data-weapon="ak47">AK-47 - $2700</div>
        <div class="weapon-item" data-weapon="m4a1">M4A1 - $3100</div>
        <div class="weapon-item" data-weapon="awp">AWP - $4750</div>
        <div class="weapon-item" data-weapon="grenade">HE Grenade - $300</div>
        <div class="weapon-item" data-weapon="close">Close Menu</div>
    </div>
