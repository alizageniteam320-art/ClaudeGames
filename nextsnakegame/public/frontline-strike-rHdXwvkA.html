<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Frontline Strike</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Russo+One&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1b1f16;touch-action:none;-webkit-user-select:none;user-select:none;}
canvas{display:block;position:fixed;left:0;top:0;cursor:none;}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,24,16,.45),rgba(8,10,6,.92));z-index:5;transition:opacity .35s ease;}
#overlay.hidden{opacity:0;pointer-events:none;}
.panel{text-align:center;color:#e8e4d4;padding:clamp(10px,3vmin,32px);max-width:92vw;max-height:94vh;overflow:hidden;font-family:'Russo One','Trebuchet MS',sans-serif;}
.panel h1{font-family:'Black Ops One','Impact',sans-serif;font-size:clamp(30px,9.5vmin,90px);color:#ff9a2e;text-shadow:0 4px 0 #5a2c00,0 0 26px rgba(255,140,30,.45);margin:0;letter-spacing:2px;line-height:1;font-weight:400;}
.sub{font-size:clamp(11px,2.6vmin,20px);color:#c2a86b;letter-spacing:4px;margin:.5em 0 1em;}
#ovStats{font-size:clamp(13px,3vmin,22px);line-height:1.55;margin-bottom:1em;}
#ovStats b{color:#ffd23f;font-weight:400;}
#ovBtn{font-family:'Black Ops One','Impact',sans-serif;font-size:clamp(18px,4.6vmin,34px);padding:.45em 1.6em;background:linear-gradient(#ffb04a,#e07010);border:3px solid #3a1c00;border-radius:8px;color:#2a1400;cursor:pointer;box-shadow:0 5px 0 #6a3300,0 8px 20px rgba(0,0,0,.5);animation:pulse 1.4s ease-in-out infinite;}
#ovBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #6a3300;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.hint{font-size:clamp(10px,2.2vmin,15px);color:#a9a58f;margin-top:1.1em;line-height:1.6;}
#mute{position:fixed;top:8px;right:8px;z-index:10;width:clamp(32px,6.5vmin,46px);height:clamp(32px,6.5vmin,46px);border-radius:50%;border:2px solid #c2a86b;background:rgba(20,24,16,.75);color:#e8e4d4;font-size:clamp(14px,3vmin,22px);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="mute" aria-label="Mute">🔊</button>
<div id="overlay">
  <div class="panel">
    <h1 id="ovTitle">FRONTLINE<br>STRIKE</h1>
    <div class="sub" id="ovSub">SURVIVE 10 WAVES • ELIMINATE ALL HOSTILES</div>
    <div id="ovStats"></div>
    <button id="ovBtn">DEPLOY</button>
    <div class="hint" id="ovHint">🖥 WASD / Arrows move • Mouse aim • Click fire • R reload • Q / 1-3 swap<br>📱 Left thumb move • Right thumb aim &amp; fire</div>
  </div>
</div>

</html>
