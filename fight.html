<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Fighter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
        }

        .game-container {
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
            color: #ffd700;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
        }

        .player-info {
            flex: 1;
            text-align: center;
        }

        .player-name {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .player1-name {
            color: #ff4444;
        }

        .player2-name {
            color: #4444ff;
        }

        .health-bar-container {
            width: 300px;
            height: 30px;
            background: #333;
            border: 3px solid #fff;
            border-radius: 15px;
            overflow: hidden;
            margin: 0 auto;
        }

        .health-bar {
            height: 100%;
            transition: width 0.3s ease;
            box-shadow: inset 0 -5px 10px rgba(0, 0, 0, 0.3);
        }

        .health-bar.player1 {
            background: linear-gradient(to bottom, #ff6b6b, #ff4444);
        }

        .health-bar.player2 {
            background: linear-gradient(to bottom, #6b9eff, #4444ff);
        }

        .timer {
            font-size: 3em;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            min-width: 100px;
        }

        canvas {
            border: 4px solid #ffd700;
            border-radius: 10px;
            background: linear-gradient(to bottom, #87ceeb 0%, #e0f6ff 50%, #8b7355 50%, #654321 100%);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: space-around;
            font-size: 0.9em;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 10px;
        }

        .control-section {
            text-align: left;
        }

        .control-section h3 {
            margin-bottom: 8px;
            color: #ffd700;
        }

        .control-section p {
            margin: 3px 0;
            font-size: 0.85em;
        }

        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            z-index: 10;
            border: 4px solid #ffd700;
        }

        .game-over h2 {
            font-size: 3em;
            margin-bottom: 20px;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .game-over p {
            font-size: 1.5em;
            margin-bottom: 30px;
        }

        button {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #333;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>⚔️ 2D FIGHTER ⚔️</h1>
        <div class="hud">
            <div class="player-info">
                <div class="player-name player1-name">PLAYER 1</div>
                <div class="health-bar-container">
                    <div class="health-bar player1" id="health1"></div>
                </div>
            </div>
            <div class="timer" id="timer">99</div>
            <div class="player-info">
                <div class="player-name player2-name">PLAYER 2</div>
                <div class="health-bar-container">
                    <div class="health-bar player2" id="health2"></div>
                </div>
            </div>
        </div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div class="controls">
            <div class="control-section">
                <h3>Player 1 (Red)</h3>
                <p>W/S - Jump/Crouch</p>
                <p>A/D - Move Left/Right</p>
                <p>F - Punch</p>
                <p>G - Kick</p>
            </div>
            <div class="control-section">
                <h3>Player 2 (Blue)</h3>
                <p>↑/↓ - Jump/Crouch</p>
                <p>←/→ - Move Left/Right</p>
                <p>1 (Numpad) - Punch</p>
                <p>2 (Numpad) - Kick</p>
            </div>
        </div>
    </div>

    <div class="game-over" id="gameOver">
        <h2 id="winnerText">PLAYER 1 WINS!</h2>
        <p id="winMethod">By Knockout!</p>
        <button onclick="restartGame()">Fight Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const health1Element = document.getElementById('health1');
        const health2Element = document.getElementById('health2');
        const timerElement = document.getElementById('timer');
        const gameOverElement = document.getElementById('gameOver');
        const winnerTextElement = document.getElementById('winnerText');
        const winMethodElement = document.getElementById('winMethod');

        const GRAVITY = 0.8;
        const GROUND_LEVEL = canvas.height - 80;

        class Fighter {
            constructor(x, color, controls) {
                this.x = x;
                this.y = GROUND_LEVEL;
                this.width = 50;
                this.height = 80;
                this.color = color;
                this.velocityY = 0;
                this.velocityX = 0;
                this.health = 100;
                this.maxHealth = 100;
                this.isJumping = false;
                this.isCrouching = false;
                this.isAttacking = false;
                this.attackCooldown = 0;
                this.attackType = null;
                this.controls = controls;
                this.hitboxActive = false;
                this.speed = 5;
            }

            update() {
                // Apply gravity
                if (this.y < GROUND_LEVEL || this.velocityY < 0) {
                    this.velocityY += GRAVITY;
                    this.y += this.velocityY;
                }

                // Ground collision
                if (this.y >= GROUND_LEVEL) {
                    this.y = GROUND_LEVEL;
                    this.velocityY = 0;
                    this.isJumping = false;
                }

                // Horizontal movement
                this.x += this.velocityX;
                this.velocityX *= 0.85; // Friction

                // Boundary checks
                if (this.x < 0) this.x = 0;
                if (this.x > canvas.width - this.width) this.x = canvas.width - this.width;

                // Attack cooldown
                if (this.attackCooldown > 0) {
                    this.attackCooldown--;
                    if (this.attackCooldown === 0) {
                        this.isAttacking = false;
                        this.hitboxActive = false;
                    }
                }
            }

            draw() {
                const drawY = this.isCrouching ? this.y + 30 : this.y;
                const drawHeight = this.isCrouching ? this.height - 30 : this.height;

                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.ellipse(this.x + this.width / 2, GROUND_LEVEL + 75, this.width / 2, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                // Body
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, drawY, this.width, drawHeight);

                // Head
                ctx.fillStyle = '#ffdbac';
                ctx.beginPath();
                ctx.arc(this.x + this.width / 2, drawY + 15, 12, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                ctx.fillStyle = '#000';
                ctx.fillRect(this.x + this.width / 2 - 6, drawY + 12, 3, 3);
                ctx.fillRect(this.x + this.width / 2 + 3, drawY + 12, 3, 3);

                // Attack animation
                if (this.isAttacking && this.hitboxActive) {
                    ctx.fillStyle = 'rgba(255, 255, 0, 0.6)';
                    if (this.attackType === 'punch') {
                        // Punch hitbox
                        const direction = this.color === '#ff4444' ? 1 : -1;
                        ctx.fillRect(
                            this.x + (direction > 0 ? this.width : -40),
                            drawY + 20,
                            40,
                            20
                        );
                    } else if (this.attackType === 'kick') {
                        // Kick hitbox
                        const direction = this.color === '#ff4444' ? 1 : -1;
                        ctx.fillRect(
                            this.x + (direction > 0 ? this.width : -50),
                            drawY + drawHeight - 40,
                            50,
                            15
                        );
                    }
                }

                // Health bar above fighter
                ctx.fillStyle = '#333';
                ctx.fillRect(this.x - 5, this.y - 20, this.width + 10, 8);
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - 5, this.y - 20, (this.width + 10) * (this.health / this.maxHealth), 8);
            }

            jump() {
                if (!this.isJumping && !this.isCrouching && this.y >= GROUND_LEVEL) {
                    this.velocityY = -15;
                    this.isJumping = true;
                }
            }

            crouch() {
                if (!this.isJumping) {
                    this.isCrouching = true;
                }
            }

            stand() {
                this.isCrouching = false;
            }

            moveLeft() {
                if (!this.isAttacking) {
                    this.velocityX = -this.speed;
                }
            }

            moveRight() {
                if (!this.isAttacking) {
                    this.velocityX = this.speed;
                }
            }

            punch() {
                if (!this.isAttacking && this.attackCooldown === 0) {
                    this.isAttacking = true;
                    this.attackType = 'punch';
                    this.attackCooldown = 20;
                    this.hitboxActive = true;
                    setTimeout(() => {
                        this.hitboxActive = false;
                    }, 150);
                }
            }

            kick() {
                if (!this.isAttacking && this.attackCooldown === 0) {
                    this.isAttacking = true;
                    this.attackType = 'kick';
                    this.attackCooldown = 30;
                    this.hitboxActive = true;
                    setTimeout(() => {
                        this.hitboxActive = false;
                    }, 200);
                }
            }

            getHitbox() {
                if (!this.hitboxActive) return null;
                
                const direction = this.color === '#ff4444' ? 1 : -1;
                const drawY = this.isCrouching ? this.y + 30 : this.y;
                const drawHeight = this.isCrouching ? this.height - 30 : this.height;

                if (this.attackType === 'punch') {
                    return {
                        x: this.x + (direction > 0 ? this.width : -40),
                        y: drawY + 20,
                        width: 40,
                        height: 20,
                        damage: 8
                    };
                } else if (this.attackType === 'kick') {
                    return {
                        x: this.x + (direction > 0 ? this.width : -50),
                        y: drawY + drawHeight - 40,
                        width: 50,
                        height: 15,
                        damage: 12
                    };
                }
                return null;
            }

            getBodyBox() {
                const drawY = this.isCrouching ? this.y + 30 : this.y;
                const drawHeight = this.isCrouching ? this.height - 30 : this.height;
                return {
                    x: this.x,
                    y: drawY,
                    width: this.width,
                    height: drawHeight
                };
            }

            takeDamage(damage) {
                this.health -= damage;
                if (this.health < 0) this.health = 0;
            }
        }

        let player1 = new Fighter(100, '#ff4444', {
            up: 'w',
            down: 's',
            left: 'a',
            right: 'd',
            punch: 'f',
            kick: 'g'
        });

        let player2 = new Fighter(650, '#4444ff', {
            up: 'ArrowUp',
            down: 'ArrowDown',
            left: 'ArrowLeft',
            right: 'ArrowRight',
            punch: 'Numpad1',
            kick: 'Numpad2'
        });

        const keys = {};
        let gameTime = 99;
        let gameInterval;
        let timerInterval;
        let gameEnded = false;

        function checkCollision(hitbox, bodybox) {
            return hitbox.x < bodybox.x + bodybox.width &&
                   hitbox.x + hitbox.width > bodybox.x &&
                   hitbox.y < bodybox.y + bodybox.height &&
                   hitbox.y + hitbox.height > bodybox.y;
        }

        function updateGame() {
            if (gameEnded) return;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw background
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height / 2);

            // Draw ground line
            ctx.strokeStyle = '#8b7355';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_LEVEL + 70);
            ctx.lineTo(canvas.width, GROUND_LEVEL + 70);
            ctx.stroke();

            // Update players
            player1.update();
            player2.update();

            // Check for hits
            const p1Hitbox = player1.getHitbox();
            const p2Hitbox = player2.getHitbox();
            const p1Body = player1.getBodyBox();
            const p2Body = player2.getBodyBox();

            if (p1Hitbox && checkCollision(p1Hitbox, p2Body)) {
                player2.takeDamage(p1Hitbox.damage);
                player1.hitboxActive = false;
                updateHealthBars();
            }

            if (p2Hitbox && checkCollision(p2Hitbox, p1Body)) {
                player1.takeDamage(p2Hitbox.damage);
                player2.hitboxActive = false;
                updateHealthBars();
            }

            // Draw players
            player1.draw();
            player2.draw();

            // Check for game over
            if (player1.health <= 0 || player2.health <= 0) {
                endGame();
            }
        }

        function updateHealthBars() {
            health1Element.style.width = player1.health + '%';
            health2Element.style.width = player2.health + '%';
        }

        function updateTimer() {
            gameTime--;
            timerElement.textContent = gameTime;
            
            if (gameTime <= 0) {
                endGame();
            }
        }

        function endGame() {
            gameEnded = true;
            clearInterval(gameInterval);
            clearInterval(timerInterval);

            let winner, method;
            
            if (player1.health <= 0 && player2.health <= 0) {
                winnerTextElement.textContent = "DRAW!";
                winMethodElement.textContent = "Double Knockout!";
            } else if (player1.health <= 0) {
                winnerTextElement.textContent = "PLAYER 2 WINS!";
                winMethodElement.textContent = "By Knockout!";
            } else if (player2.health <= 0) {
                winnerTextElement.textContent = "PLAYER 1 WINS!";
                winMethodElement.textContent = "By Knockout!";
            } else if (gameTime <= 0) {
                if (player1.health > player2.health) {
                    winnerTextElement.textContent = "PLAYER 1 WINS!";
                } else if (player2.health > player1.health) {
                    winnerTextElement.textContent = "PLAYER 2 WINS!";
                } else {
                    winnerTextElement.textContent = "DRAW!";
                }
                winMethodElement.textContent = "Time's Up!";
            }

            gameOverElement.style.display = 'block';
        }

        function restartGame() {
            player1 = new Fighter(100, '#ff4444');
            player2 = new Fighter(650, '#4444ff');
            gameTime = 99;
            gameEnded = false;
            
            updateHealthBars();
            timerElement.textContent = gameTime;
            gameOverElement.style.display = 'none';
            
            gameInterval = setInterval(updateGame, 1000 / 60);
            timerInterval = setInterval(updateTimer, 1000);
        }

        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            keys[e.code] = true;

            // Player 1 controls
            if (e.key.toLowerCase() === player1.controls.up.toLowerCase()) {
                player1.jump();
            }
            if (e.key.toLowerCase() === player1.controls.down.toLowerCase()) {
                player1.crouch();
            }
            if (e.key.toLowerCase() === player1.controls.left.toLowerCase()) {
                player1.moveLeft();
            }
            if (e.key.toLowerCase() === player1.controls.right.toLowerCase()) {
                player1.moveRight();
            }
            if (e.key.toLowerCase() === player1.controls.punch.toLowerCase()) {
                player1.punch();
            }
            if (e.key.toLowerCase() === player1.controls.kick.toLowerCase()) {
                player1.kick();
            }

            // Player 2 controls
            if (e.key === player2.controls.up || e.code === 'ArrowUp') {
                e.preventDefault();
                player2.jump();
            }
            if (e.key === player2.controls.down || e.code === 'ArrowDown') {
                e.preventDefault();
                player2.crouch();
            }
            if (e.key === player2.controls.left || e.code === 'ArrowLeft') {
                e.preventDefault();
                player2.moveLeft();
            }
            if (e.key === player2.controls.right || e.code === 'ArrowRight') {
                e.preventDefault();
                player2.moveRight();
            }
            if (e.code === 'Numpad1') {
                player2.punch();
            }
            if (e.code === 'Numpad2') {
                player2.kick();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
            keys[e.code] = false;

            if (e.key.toLowerCase() === 's') {
                player1.stand();
            }
            if (e.key === 'ArrowDown' || e.code === 'ArrowDown') {
                player2.stand();
            }
        });

        // Start the game
        updateHealthBars();
        gameInterval = setInterval(updateGame, 1000 / 60);
        timerInterval = setInterval(updateTimer, 1000);
    </script>
</body>
</html>
