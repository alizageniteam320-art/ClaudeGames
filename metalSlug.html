<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metal Slug Style Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #2c3e50 0%, #34495e 100%);
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        .game-container {
            text-align: center;
            position: relative;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #ffd700;
            border-radius: 5px;
            color: #fff;
            font-size: 1.1em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .health-bar {
            width: 200px;
            height: 20px;
            background: #333;
            border: 2px solid #ffd700;
            position: relative;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(to right, #ff4444, #ff6b6b);
            transition: width 0.3s ease;
        }

        .ammo-bar {
            width: 150px;
            height: 15px;
            background: #333;
            border: 2px solid #4CAF50;
            position: relative;
        }

        .ammo-fill {
            height: 100%;
            background: linear-gradient(to right, #4CAF50, #8BC34A);
            transition: width 0.3s ease;
        }

        canvas {
            border: 4px solid #000;
            background: #87ceeb;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .game-over, .victory {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 50px;
            border-radius: 10px;
            text-align: center;
            z-index: 10;
            border: 4px solid #ffd700;
            color: white;
        }

        .game-over h2 {
            font-size: 3em;
            margin-bottom: 20px;
            color: #ff4444;
            text-shadow: 3px 3px 0 #000;
        }

        .victory h2 {
            font-size: 3em;
            margin-bottom: 20px;
            color: #4CAF50;
            text-shadow: 3px 3px 0 #000;
        }

        .game-over p, .victory p {
            font-size: 1.5em;
            margin-bottom: 30px;
        }

        button {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #333;
            border: 3px solid #000;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.1s;
            font-weight: bold;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
        }

        button:hover {
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .controls {
            margin-top: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #ffd700;
            border-radius: 5px;
            color: #ffd700;
            font-size: 0.9em;
            max-width: 900px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .control-item {
            background: rgba(255, 215, 0, 0.1);
            padding: 5px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="hud">
            <div class="hud-item">
                <span>SCORE:</span>
                <span id="score">0</span>
            </div>
            <div class="hud-item">
                <span>HEALTH:</span>
                <div class="health-bar">
                    <div class="health-fill" id="healthFill" style="width: 100%;"></div>
                </div>
            </div>
            <div class="hud-item">
                <span>AMMO:</span>
                <div class="ammo-bar">
                    <div class="ammo-fill" id="ammoFill" style="width: 100%;"></div>
                </div>
                <span id="ammoCount">30/30</span>
            </div>
            <div class="hud-item">
                <span>GRENADES:</span>
                <span id="grenadeCount">5</span>
            </div>
        </div>
        <canvas id="gameCanvas" width="900" height="500"></canvas>
        <div class="controls">
            <strong>🎮 CONTROLS</strong>
            <div class="controls-grid">
                <div class="control-item">← → : MOVE</div>
                <div class="control-item">SPACE : JUMP</div>
                <div class="control-item">↓ : CROUCH</div>
                <div class="control-item">Z : SHOOT</div>
                <div class="control-item">X : GRENADE</div>
                <div class="control-item">C : KNIFE</div>
            </div>
        </div>
    </div>

    <div class="game-over" id="gameOver">
        <h2>MISSION FAILED</h2>
        <p>Score: <span id="finalScore">0</span></p>
        <button onclick="restartGame()">TRY AGAIN</button>
    </div>

    <div class="victory" id="victory">
        <h2>MISSION COMPLETE!</h2>
        <p>Total Score: <span id="victoryScore">0</span></p>
        <button onclick="restartGame()">PLAY AGAIN</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game constants
        const GRAVITY = 0.7;
        const JUMP_POWER = -13;
        const MOVE_SPEED = 5;
        const TILE_SIZE = 40;

        // Game state
        let score = 0;
        let gameRunning = true;
        let keys = {};
        let cameraX = 0;
        let particles = [];
        let explosions = [];

        // Player class
        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 32;
                this.height = 40;
                this.velocityX = 0;
                this.velocityY = 0;
                this.onGround = false;
                this.facing = 1;
                this.health = 100;
                this.maxHealth = 100;
                this.ammo = 30;
                this.maxAmmo = 30;
                this.grenades = 5;
                this.shootCooldown = 0;
                this.grenadeCooldown = 0;
                this.knifeCooldown = 0;
                this.isCrouching = false;
                this.invincible = false;
                this.invincibleTimer = 0;
            }

            update() {
                // Horizontal movement
                if (keys['ArrowLeft']) {
                    this.velocityX = -MOVE_SPEED;
                    this.facing = -1;
                } else if (keys['ArrowRight']) {
                    this.velocityX = MOVE_SPEED;
                    this.facing = 1;
                } else {
                    this.velocityX *= 0.8;
                }

                // Crouch
                this.isCrouching = keys['ArrowDown'] && this.onGround;

                // Jump
                if (keys[' '] && this.onGround && !this.isCrouching) {
                    this.velocityY = JUMP_POWER;
                    this.onGround = false;
                }

                // Shoot
                if (keys['z'] && this.shootCooldown === 0 && this.ammo > 0) {
                    this.shoot();
                    this.shootCooldown = 10;
                    this.ammo--;
                    updateHUD();
                }

                // Grenade
                if (keys['x'] && this.grenadeCooldown === 0 && this.grenades > 0) {
                    this.throwGrenade();
                    this.grenadeCooldown = 40;
                    this.grenades--;
                    updateHUD();
                }

                // Knife
                if (keys['c'] && this.knifeCooldown === 0) {
                    this.knife();
                    this.knifeCooldown = 20;
                }

                // Cooldowns
                if (this.shootCooldown > 0) this.shootCooldown--;
                if (this.grenadeCooldown > 0) this.grenadeCooldown--;
                if (this.knifeCooldown > 0) this.knifeCooldown--;

                // Apply gravity
                this.velocityY += GRAVITY;

                // Apply velocity
                this.x += this.velocityX;
                this.y += this.velocityY;

                // Ground collision
                if (this.y >= canvas.height - 100 - this.height) {
                    this.y = canvas.height - 100 - this.height;
                    this.velocityY = 0;
                    this.onGround = true;
                } else {
                    this.onGround = false;
                }

                // Platform collision
                platforms.forEach(platform => {
                    if (this.intersects(platform) && this.velocityY > 0) {
                        if (this.y + this.height - this.velocityY <= platform.y) {
                            this.y = platform.y - this.height;
                            this.velocityY = 0;
                            this.onGround = true;
                        }
                    }
                });

                // Boundary
                if (this.x < 0) this.x = 0;
                if (this.x > levelWidth - this.width) this.x = levelWidth - this.width;

                // Camera follow
                cameraX = this.x - canvas.width / 3;
                if (cameraX < 0) cameraX = 0;
                if (cameraX > levelWidth - canvas.width) cameraX = levelWidth - canvas.width;

                // Invincibility
                if (this.invincible) {
                    this.invincibleTimer--;
                    if (this.invincibleTimer <= 0) {
                        this.invincible = false;
                    }
                }

                // Ammo reload
                if (this.onGround && this.ammo < this.maxAmmo) {
                    if (Math.random() < 0.01) {
                        this.ammo++;
                        updateHUD();
                    }
                }
            }

            shoot() {
                const offsetY = this.isCrouching ? 15 : 10;
                bullets.push(new Bullet(
                    this.x + (this.facing > 0 ? this.width : 0),
                    this.y + offsetY,
                    this.facing
                ));
            }

            throwGrenade() {
                grenades.push(new Grenade(
                    this.x + this.width / 2,
                    this.y + 10,
                    this.facing
                ));
            }

            knife() {
                const knifeRange = 40;
                const knifeX = this.x + (this.facing > 0 ? this.width : -knifeRange);
                const knifeY = this.y;
                
                enemies.forEach(enemy => {
                    if (!enemy.dead && 
                        enemy.x < knifeX + knifeRange && 
                        enemy.x + enemy.width > knifeX &&
                        enemy.y < knifeY + this.height &&
                        enemy.y + enemy.height > knifeY) {
                        enemy.takeDamage(50);
                    }
                });

                // Knife visual effect
                for (let i = 0; i < 3; i++) {
                    particles.push(new Particle(
                        knifeX + knifeRange / 2,
                        knifeY + this.height / 2,
                        (Math.random() - 0.5) * 4 + this.facing * 3,
                        (Math.random() - 0.5) * 4,
                        '#ffffff',
                        10
                    ));
                }
            }

            takeDamage(amount) {
                if (this.invincible) return;
                
                this.health -= amount;
                this.invincible = true;
                this.invincibleTimer = 60;
                
                if (this.health <= 0) {
                    this.health = 0;
                    gameOver();
                }
                updateHUD();
            }

            intersects(rect) {
                return this.x < rect.x + rect.width &&
                       this.x + this.width > rect.x &&
                       this.y < rect.y + rect.height &&
                       this.y + this.height > rect.y;
            }

            draw() {
                ctx.save();
                ctx.translate(-cameraX, 0);

                if (!this.invincible || Math.floor(this.invincibleTimer / 5) % 2 === 0) {
                    const drawHeight = this.isCrouching ? this.height - 15 : this.height;
                    const drawY = this.isCrouching ? this.y + 15 : this.y;

                    // Body (military green)
                    ctx.fillStyle = '#4a5f3a';
                    ctx.fillRect(this.x + 8, drawY + 12, 16, drawHeight - 12);

                    // Head
                    ctx.fillStyle = '#ffdbac';
                    ctx.fillRect(this.x + 10, drawY + 4, 12, 10);

                    // Helmet
                    ctx.fillStyle = '#3d4f2f';
                    ctx.fillRect(this.x + 8, drawY, 16, 6);

                    // Eyes
                    ctx.fillStyle = '#000';
                    ctx.fillRect(this.x + 12, drawY + 7, 2, 2);
                    ctx.fillRect(this.x + 18, drawY + 7, 2, 2);

                    // Gun
                    ctx.fillStyle = '#2c3e50';
                    if (this.facing > 0) {
                        ctx.fillRect(this.x + 24, drawY + 16, 12, 4);
                    } else {
                        ctx.fillRect(this.x - 4, drawY + 16, 12, 4);
                    }

                    // Legs
                    if (!this.isCrouching) {
                        ctx.fillStyle = '#4a5f3a';
                        ctx.fillRect(this.x + 10, this.y + drawHeight - 12, 5, 12);
                        ctx.fillRect(this.x + 17, this.y + drawHeight - 12, 5, 12);
                    }

                    // Boots
                    ctx.fillStyle = '#2c2c2c';
                    ctx.fillRect(this.x + 8, this.y + drawHeight - 4, 7, 4);
                    ctx.fillRect(this.x + 17, this.y + drawHeight - 4, 7, 4);
                }

                ctx.restore();
            }
        }

        // Bullet class
        class Bullet {
            constructor(x, y, direction) {
                this.x = x;
                this.y = y;
                this.width = 8;
                this.height = 3;
                this.speed = 12 * direction;
                this.direction = direction;
                this.active = true;
            }

            update() {
                this.x += this.speed;

                // Check enemy collision
                enemies.forEach(enemy => {
                    if (this.active && !enemy.dead && this.intersects(enemy)) {
                        enemy.takeDamage(25);
                        this.active = false;
                        
                        // Hit particles
                        for (let i = 0; i < 5; i++) {
                            particles.push(new Particle(
                                this.x, this.y,
                                (Math.random() - 0.5) * 6,
                                (Math.random() - 0.5) * 6,
                                '#ffff00',
                                15
                            ));
                        }
                    }
                });

                // Remove if off screen
                if (this.x < cameraX - 50 || this.x > cameraX + canvas.width + 50) {
                    this.active = false;
                }
            }

            intersects(rect) {
                return this.x < rect.x + rect.width &&
                       this.x + this.width > rect.x &&
                       this.y < rect.y + rect.height &&
                       this.y + this.height > rect.y;
            }

            draw() {
                if (!this.active) return;
                
                ctx.save();
                ctx.translate(-cameraX, 0);
                
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // Muzzle flash effect
                ctx.fillStyle = 'rgba(255, 200, 0, 0.5)';
                ctx.fillRect(this.x - 3 * this.direction, this.y - 2, 6, 7);
                
                ctx.restore();
            }
        }

        // Grenade class
        class Grenade {
            constructor(x, y, direction) {
                this.x = x;
                this.y = y;
                this.width = 8;
                this.height = 8;
                this.velocityX = 8 * direction;
                this.velocityY = -10;
                this.timer = 90;
                this.active = true;
            }

            update() {
                this.velocityY += GRAVITY;
                this.x += this.velocityX;
                this.y += this.velocityY;

                // Ground bounce
                if (this.y >= canvas.height - 100 - this.height) {
                    this.y = canvas.height - 100 - this.height;
                    this.velocityY = -this.velocityY * 0.5;
                    this.velocityX *= 0.8;
                }

                this.timer--;
                if (this.timer <= 0) {
                    this.explode();
                    this.active = false;
                }
            }

            explode() {
                explosions.push(new Explosion(this.x, this.y, 80));
                
                // Check enemies in blast radius
                enemies.forEach(enemy => {
                    const dist = Math.hypot(enemy.x + enemy.width/2 - this.x, enemy.y + enemy.height/2 - this.y);
                    if (dist < 80 && !enemy.dead) {
                        enemy.takeDamage(75);
                    }
                });
            }

            draw() {
                if (!this.active) return;
                
                ctx.save();
                ctx.translate(-cameraX, 0);
                
                // Blinking effect when about to explode
                if (this.timer < 30 && Math.floor(this.timer / 3) % 2 === 0) {
                    ctx.fillStyle = '#ff0000';
                } else {
                    ctx.fillStyle = '#2c3e50';
                }
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }

        // Enemy class
        class Enemy {
            constructor(x, y, type = 'soldier') {
                this.x = x;
                this.y = y;
                this.width = 32;
                this.height = 40;
                this.type = type;
                this.health = type === 'soldier' ? 50 : 100;
                this.maxHealth = this.health;
                this.velocityX = type === 'soldier' ? -2 : -1;
                this.velocityY = 0;
                this.facing = -1;
                this.dead = false;
                this.shootCooldown = 0;
                this.detectionRange = 400;
            }

            update() {
                if (this.dead) return;

                // AI behavior
                const distToPlayer = player.x - this.x;
                
                if (Math.abs(distToPlayer) < this.detectionRange) {
                    // Face player
                    this.facing = distToPlayer > 0 ? 1 : -1;
                    
                    // Shoot at player
                    if (Math.abs(distToPlayer) > 50 && this.shootCooldown === 0) {
                        this.shoot();
                        this.shootCooldown = 60;
                    }
                    
                    // Move toward player
                    if (Math.abs(distToPlayer) > 100) {
                        this.velocityX = this.facing * (this.type === 'soldier' ? 1.5 : 1);
                    } else {
                        this.velocityX = 0;
                    }
                } else {
                    // Patrol
                    this.velocityX = this.facing * (this.type === 'soldier' ? 1 : 0.5);
                }

                this.x += this.velocityX;

                // Apply gravity
                this.velocityY += GRAVITY;
                this.y += this.velocityY;

                // Ground collision
                if (this.y >= canvas.height - 100 - this.height) {
                    this.y = canvas.height - 100 - this.height;
                    this.velocityY = 0;
                }

                if (this.shootCooldown > 0) this.shootCooldown--;

                // Turn around at edges
                if (this.x < 0 || this.x > levelWidth - this.width) {
                    this.facing *= -1;
                }
            }

            shoot() {
                enemyBullets.push(new EnemyBullet(
                    this.x + (this.facing > 0 ? this.width : 0),
                    this.y + 15,
                    this.facing
                ));
            }

            takeDamage(amount) {
                if (this.dead) return;
                
                this.health -= amount;
                
                // Hit effect
                for (let i = 0; i < 3; i++) {
                    particles.push(new Particle(
                        this.x + this.width / 2,
                        this.y + this.height / 2,
                        (Math.random() - 0.5) * 4,
                        (Math.random() - 0.5) * 4,
                        '#ff0000',
                        20
                    ));
                }
                
                if (this.health <= 0) {
                    this.dead = true;
                    score += this.type === 'soldier' ? 100 : 250;
                    updateHUD();
                    
                    // Death explosion
                    for (let i = 0; i < 10; i++) {
                        particles.push(new Particle(
                            this.x + this.width / 2,
                            this.y + this.height / 2,
                            (Math.random() - 0.5) * 8,
                            (Math.random() - 0.5) * 8,
                            Math.random() > 0.5 ? '#ff4444' : '#ffaa00',
                            30
                        ));
                    }
                }
            }

            draw() {
                if (this.dead) return;
                
                ctx.save();
                ctx.translate(-cameraX, 0);

                const color = this.type === 'soldier' ? '#8b4513' : '#4a0e0e';

                // Body
                ctx.fillStyle = color;
                ctx.fillRect(this.x + 8, this.y + 12, 16, 28);

                // Head
                ctx.fillStyle = '#ffdbac';
                ctx.fillRect(this.x + 10, this.y + 4, 12, 10);

                // Helmet
                ctx.fillStyle = '#2c2c2c';
                ctx.fillRect(this.x + 8, this.y, 16, 6);

                // Eyes
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(this.x + 12, this.y + 7, 2, 2);
                ctx.fillRect(this.x + 18, this.y + 7, 2, 2);

                // Gun
                ctx.fillStyle = '#2c3e50';
                if (this.facing > 0) {
                    ctx.fillRect(this.x + 24, this.y + 20, 10, 4);
                } else {
                    ctx.fillRect(this.x - 2, this.y + 20, 10, 4);
                }

                // Health bar
                ctx.fillStyle = '#333';
                ctx.fillRect(this.x, this.y - 8, this.width, 4);
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(this.x, this.y - 8, this.width * (this.health / this.maxHealth), 4);

                ctx.restore();
            }
        }

        // Enemy bullet class
        class EnemyBullet {
            constructor(x, y, direction) {
                this.x = x;
                this.y = y;
                this.width = 6;
                this.height = 3;
                this.speed = 8 * direction;
                this.active = true;
            }

            update() {
                this.x += this.speed;

                // Check player collision
                if (this.active && player.intersects(this)) {
                    player.takeDamage(10);
                    this.active = false;
                }

                // Remove if off screen
                if (this.x < cameraX - 50 || this.x > cameraX + canvas.width + 50) {
                    this.active = false;
                }
            }

            draw() {
                if (!this.active) return;
                
                ctx.save();
                ctx.translate(-cameraX, 0);
                
                ctx.fillStyle = '#ff6600';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                ctx.restore();
            }
        }

        // Particle class
        class Particle {
            constructor(x, y, vx, vy, color, life) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.life = life;
                this.maxLife = life;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.3;
                this.life--;
            }

            draw() {
                ctx.save();
                ctx.translate(-cameraX, 0);
                
                ctx.globalAlpha = this.life / this.maxLife;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, 3, 3);
                ctx.globalAlpha = 1;
                
                ctx.restore();
            }
        }

        // Explosion class
        class Explosion {
            constructor(x, y, radius) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.currentRadius = 0;
                this.maxRadius = radius;
                this.life = 20;
            }

            update() {
                this.currentRadius += this.maxRadius / 10;
                this.life--;
                
                if (this.currentRadius >= this.maxRadius) {
                    this.currentRadius = this.maxRadius;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(-cameraX, 0);
                
                ctx.globalAlpha = this.life / 20;
                
                // Outer circle
                ctx.fillStyle = '#ff6600';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.currentRadius, 0, Math.PI * 2);
                ctx.fill();
                
                // Inner circle
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.currentRadius * 0.6, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.globalAlpha = 1;
                ctx.restore();
            }
        }

        // Platform class
        class Platform {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
            }

            draw() {
                ctx.save();
                ctx.translate(-cameraX, 0);
                
                ctx.fillStyle = '#654321';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                ctx.strokeStyle = '#8b7355';
                ctx.strokeRect(this.x, this.y, this.width, this.height);
                
                ctx.restore();
            }
        }

        // Initialize game objects
        const levelWidth = 3000;
        let player = new Player(100, 100);
        let bullets = [];
        let grenades = [];
        let enemyBullets = [];
        let enemies = [];
        let platforms = [];

        // Create level
        function createLevel() {
            // Platforms
            platforms = [
                new Platform(300, 350, 150, 20),
                new Platform(550, 300, 120, 20),
                new Platform(800, 250, 150, 20),
                new Platform(1100, 320, 180, 20),
                new Platform(1400, 280, 140, 20),
                new Platform(1700, 340, 160, 20),
                new Platform(2000, 300, 150, 20),
                new Platform(2300, 250, 200, 20),
            ];

            // Enemies
            enemies = [
                new Enemy(400, 100, 'soldier'),
                new Enemy(650, 100, 'soldier'),
                new Enemy(900, 100, 'soldier'),
                new Enemy(1200, 100, 'elite'),
                new Enemy(1500, 100, 'soldier'),
                new Enemy(1800, 100, 'soldier'),
                new Enemy(2100, 100, 'elite'),
                new Enemy(2400, 100, 'soldier'),
                new Enemy(2700, 100, 'elite'),
            ];
        }

        createLevel();

        function updateHUD() {
            document.getElementById('score').textContent = score;
            document.getElementById('healthFill').style.width = (player.health / player.maxHealth * 100) + '%';
            document.getElementById('ammoFill').style.width = (player.ammo / player.maxAmmo * 100) + '%';
            document.getElementById('ammoCount').textContent = player.ammo + '/' + player.maxAmmo;
            document.getElementById('grenadeCount').textContent = player.grenades;
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }

        function checkVictory() {
            if (enemies.every(e => e.dead)) {
                gameRunning = false;
                score += 1000; // Victory bonus
                document.getElementById('victoryScore').textContent = score;
                document.getElementById('victory').style.display = 'block';
            }
        }

        function restartGame() {
            score = 0;
            gameRunning = true;
            cameraX = 0;
            bullets = [];
            grenades = [];
            enemyBullets = [];
            particles = [];
            explosions = [];
            
            player = new Player(100, 100);
            createLevel();
            
            updateHUD();
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('victory').style.display = 'none';
        }

        function drawBackground() {
            // Sky
            ctx.fillStyle = '#87ceeb';
            ctx.fillRect(0, 0, canvas.width, canvas.height - 100);

            // Distant mountains
            ctx.fillStyle = '#5a7d9a';
            ctx.beginPath();
            ctx.moveTo(-100, canvas.height - 100);
            for (let i = 0; i < canvas.width + 200; i += 50) {
                ctx.lineTo(i - (cameraX * 0.1) % 100, canvas.height - 150 - Math.sin(i * 0.01) * 30);
            }
            ctx.lineTo(canvas.width + 100, canvas.height - 100);
            ctx.fill();

            // Ground
            ctx.fillStyle = '#8b7355';
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
            
            // Ground texture
            ctx.fillStyle = '#654321';
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.fillRect(i, canvas.height - 100, 10, 5);
                ctx.fillRect(i + 5, canvas.height - 95, 10, 5);
            }

            // Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            for (let i = 0; i < 5; i++) {
                const cloudX = (i * 300 - cameraX * 0.3) % (canvas.width + 200);
                ctx.beginPath();
                ctx.arc(cloudX, 50 + i * 30, 25, 0, Math.PI * 2);
                ctx.arc(cloudX + 30, 50 + i * 30, 30, 0, Math.PI * 2);
                ctx.arc(cloudX + 60, 50 + i * 30, 25, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function gameLoop() {
            if (!gameRunning) return;

            // Clear and draw background
            drawBackground();

            // Update and draw platforms
            platforms.forEach(platform => platform.draw());

            // Update and draw all entities
            player.update();
            
            bullets.forEach(b => b.update());
            bullets = bullets.filter(b => b.active);
            
            grenades.forEach(g => g.update());
            grenades = grenades.filter(g => g.active);
            
            enemyBullets.forEach(b => b.update());
            enemyBullets = enemyBullets.filter(b => b.active);
            
            enemies.forEach(e => e.update());
            
            particles.forEach(p => p.update());
            particles = particles.filter(p => p.life > 0);
            
            explosions.forEach(e => e.update());
            explosions = explosions.filter(e => e.life > 0);

            // Draw everything
            bullets.forEach(b => b.draw());
            grenades.forEach(g => g.draw());
            enemyBullets.forEach(b => b.draw());
            enemies.forEach(e => e.draw());
            explosions.forEach(e => e.draw());
            particles.forEach(p => p.draw());
            player.draw();

            // Check victory condition
            checkVictory();

            requestAnimationFrame(gameLoop);
        }

        // Controls
        document.addEventListener('keydown', (e) => {
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) {
                e.preventDefault();
            }
            keys[e.key.toLowerCase()] = true;
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // Start game
        updateHUD();
        gameLoop();
    </script>
</body>
</html>
